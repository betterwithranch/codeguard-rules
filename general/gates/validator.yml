id: validator
language: python
rule:
  any:
  - kind: decorated_definition
    has:
      kind: decorator
      regex: (field_|model_|root_)?validator\b
  - kind: function_definition
    inside:
      kind: block
      inside:
        kind: class_definition
    has:
      field: name
      regex: ^(__post_init__|__attrs_post_init__|model_post_init|clean|clean_\w+)$
  - kind: keyword_argument
    has:
      field: name
      regex: ^validators?$
  - kind: call
    has:
      field: function
      regex: ^(\w+\.)?(After|Before|Wrap|Plain)Validator$
  - kind: function_definition
    all:
    - has:
        field: name
        pattern: $FUNC
    - inside:
        kind: module
        has:
          stopBy: end
          any:
          - kind: keyword_argument
            all:
            - has:
                field: name
                regex: ^validators?$
            - has:
                field: value
                stopBy: end
                pattern: $FUNC
          - kind: call
            all:
            - has:
                field: function
                regex: ^(\w+\.)?(After|Before|Wrap|Plain)Validator$
            - has:
                field: arguments
                stopBy: end
                pattern: $FUNC
