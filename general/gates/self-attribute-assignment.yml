id: self-attribute-assignment
language: python
rule:
  any:
    - kind: assignment
    - kind: augmented_assignment
  has:
    field: left
    any:
      - kind: attribute
        regex: ^self\.
      - any:
          - kind: pattern_list
          - kind: tuple_pattern
          - kind: list_pattern
        has:
          kind: attribute
          regex: ^self\.
  inside:
    kind: function_definition
    stopBy: end
    inside:
      kind: class_definition
      stopBy: end
