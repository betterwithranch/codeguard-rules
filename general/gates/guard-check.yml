id: guard-check
language: python
rule:
  any:
  - kind: assert_statement
  - kind: if_statement
    has:
      field: consequence
      has:
        kind: raise_statement
  - kind: if_statement
    has:
      field: consequence
      all:
      - has:
          nthChild: 1
          any:
          - kind: return_statement
          - kind: continue_statement
          - kind: break_statement
      - not:
          has:
            nthChild: 2
  - kind: elif_clause
    has:
      field: consequence
      has:
        any:
        - kind: raise_statement
        - kind: return_statement
        - kind: continue_statement
        - kind: break_statement
  - kind: else_clause
    has:
      field: body
      has:
        any:
        - kind: raise_statement
        - kind: return_statement
        - kind: continue_statement
        - kind: break_statement
  - kind: case_clause
    has:
      field: consequence
      has:
        any:
        - kind: raise_statement
        - kind: return_statement
        - kind: continue_statement
        - kind: break_statement
