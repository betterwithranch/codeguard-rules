- name: an edit changes how a greeting trims its name and leaves the parameters as they were
  inputs:
    file: src/greetings/greeting.ts
    before: |
      export interface RequestContext {
        requestId: string;
        userId: string;
        tenantId: string;
        locale: string;
        ip: string;
        receivedAt: Date;
      }

      export function greeting(ctx: RequestContext, name: string): string {
        const shown = name.trim();
        return `${ctx.locale.startsWith("fr") ? "Bonjour" : "Hello"}, ${shown}`;
      }
    after: |
      export interface RequestContext {
        requestId: string;
        userId: string;
        tenantId: string;
        locale: string;
        ip: string;
        receivedAt: Date;
      }

      export function greeting(ctx: RequestContext, name: string): string {
        const shown = name.trim().slice(0, 40);
        return `${ctx.locale.startsWith("fr") ? "Bonjour" : "Hello"}, ${shown}`;
      }
  expected_output:
    outcome: valid
