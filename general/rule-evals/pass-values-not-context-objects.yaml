- name: a Django view reads one query parameter from the request the framework passes it
  inputs:
    file: library/views.py
    after: |
      from django.http import HttpRequest, JsonResponse

      TITLES = ("Dune", "Emma", "Middlemarch", "Ulysses")


      def find_titles(query: str) -> list[str]:
          return [title for title in TITLES if query.lower() in title.lower()]


      def search(request: HttpRequest) -> JsonResponse:
          query = request.GET.get("q")
          if query is None:
              return JsonResponse({"error": "q is required"}, status=400)
          return JsonResponse({"results": find_titles(query)})
  expected_output:
    outcome: valid
- name: a renewal check reads one field of the subscription it decides about
  inputs:
    file: billing/renewals.py
    after: |
      from dataclasses import dataclass
      from datetime import date
      from uuid import UUID


      @dataclass(frozen=True)
      class Subscription:
          id: UUID
          customer_id: UUID
          plan: str
          seats: int
          started_on: date
          renews_on: date


      def renews_within(subscription: Subscription, today: date, days: int) -> bool:
          return 0 <= (subscription.renews_on - today).days <= days
  expected_output:
    outcome: valid
