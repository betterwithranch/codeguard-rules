- name: a cancellation check reads one field of the booking it decides about
  inputs:
    file: src/bookings/cancellation.ts
    after: |
      export interface Booking {
        id: string;
        guestId: string;
        roomId: string;
        startsAt: Date;
        nights: number;
        totalCents: number;
      }

      const FREE_CANCELLATION_MS = 48 * 60 * 60 * 1000;

      export function canCancelForFree(booking: Booking, now: Date): boolean {
        return booking.startsAt.getTime() - now.getTime() >= FREE_CANCELLATION_MS;
      }
  expected_output:
    outcome: valid
