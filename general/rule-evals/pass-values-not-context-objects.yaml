cases:
- name: an output-path helper takes the whole command context to read only its working directory
  inputs:
    file: cli/paths.py
    after: |
      from collections.abc import Mapping
      from dataclasses import dataclass
      from datetime import datetime
      from pathlib import Path
      from typing import TextIO


      @dataclass(frozen=True)
      class CommandContext:
          cwd: Path
          env: Mapping[str, str]
          stdout: TextIO
          stderr: TextIO
          verbose: bool
          started_at: datetime


      def output_path(ctx: CommandContext, file_name: str) -> Path:
          return ctx.cwd / file_name
  expected_output:
    outcome: invalid
- name: a sign-in line reads exactly half of the request context's fields, three of six
  inputs:
    file: accounts/sign_in_line.py
    after: |
      import logging
      from dataclasses import dataclass
      from datetime import datetime
      from uuid import UUID
      from zoneinfo import ZoneInfo

      from sqlalchemy.orm import Session


      @dataclass(frozen=True)
      class RequestContext:
          user_id: UUID
          locale: str
          timezone: ZoneInfo
          feature_flags: frozenset[str]
          db: Session
          logger: logging.Logger


      def sign_in_line(ctx: RequestContext, signed_in_at: datetime) -> str:
          local_time = signed_in_at.astimezone(ctx.timezone)
          return f"{ctx.user_id} ({ctx.locale}) signed in at {local_time:%H:%M}"
  expected_output:
    outcome: invalid
- name: a sign-in line reads more than half of the request context's fields, four of six
  inputs:
    file: accounts/sign_in_banner.py
    after: |
      import logging
      from dataclasses import dataclass
      from datetime import datetime
      from uuid import UUID
      from zoneinfo import ZoneInfo

      from sqlalchemy.orm import Session


      @dataclass(frozen=True)
      class RequestContext:
          user_id: UUID
          locale: str
          timezone: ZoneInfo
          feature_flags: frozenset[str]
          db: Session
          logger: logging.Logger


      def sign_in_banner(ctx: RequestContext, signed_in_at: datetime) -> str:
          local_time = signed_in_at.astimezone(ctx.timezone)
          channel = "beta" if "beta" in ctx.feature_flags else "stable"
          return f"{ctx.user_id} ({ctx.locale}, {channel}) signed in at {local_time:%H:%M}"
  expected_output:
    outcome: valid
