- name: an Express route handler reads only the body of the request the framework passes it
  inputs:
    file: src/routes/ratings.ts
    after: |
      import express, { type Request, type Response } from "express";
      import { z } from "zod";

      const Rating = z.object({
        stars: z.number().int().min(1).max(5),
        comment: z.string().max(500),
      });

      export const ratings = express.Router();

      ratings.post("/ratings", (req: Request, res: Response) => {
        const parsed = Rating.safeParse(req.body);
        if (!parsed.success) {
          res.status(400).json(parsed.error.flatten());
          return;
        }
        res.status(201).json({ stars: parsed.data.stars });
      });
  expected_output:
    outcome: valid
