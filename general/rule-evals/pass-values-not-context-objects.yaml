- name: a batch runner passes the worker context on to the job runner it calls
  inputs:
    file: jobs/batch.py
    unchanged:
      jobs/context.py: |
        import logging
        from dataclasses import dataclass
        from datetime import datetime

        from sqlalchemy.orm import Session


        @dataclass(frozen=True)
        class WorkerContext:
            worker_id: str
            queue_name: str
            dry_run: bool
            started_at: datetime
            db: Session
            logger: logging.Logger
      jobs/runner.py: |
        from uuid import UUID

        from sqlalchemy import text

        from jobs.context import WorkerContext


        def run_job(ctx: WorkerContext, job_id: UUID) -> None:
            ctx.logger.info("worker %s running %s from %s", ctx.worker_id, job_id, ctx.queue_name)
            if ctx.dry_run:
                return
            ctx.db.execute(text("UPDATE jobs SET started_at = now() WHERE id = :id"), {"id": job_id})
    after: |
      from collections.abc import Sequence
      from uuid import UUID

      from jobs.context import WorkerContext
      from jobs.runner import run_job


      def run_batch(ctx: WorkerContext, job_ids: Sequence[UUID]) -> None:
          ctx.logger.info("running a batch of %d jobs", len(job_ids))
          for job_id in job_ids:
              run_job(ctx, job_id)
  expected_output:
    outcome: valid
- name: a footer reaches through the invoice into its merchant's settings, which is law-of-demeter's
  inputs:
    file: billing/footer.py
    after: |
      from dataclasses import dataclass
      from decimal import Decimal


      @dataclass(frozen=True)
      class MerchantSettings:
          payment_terms_days: int
          currency: str
          logo_url: str
          support_email: str
          timezone: str
          send_reminders: bool


      @dataclass(frozen=True)
      class Merchant:
          name: str
          settings: MerchantSettings


      @dataclass(frozen=True)
      class Invoice:
          number: str
          merchant: Merchant
          total: Decimal


      def invoice_footer(invoice: Invoice) -> str:
          return f"Invoice {invoice.number}: pay within {invoice.merchant.settings.payment_terms_days} days"
  expected_output:
    outcome: valid
