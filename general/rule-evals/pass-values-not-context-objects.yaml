          locale: str
          generated_at: datetime
          db: Session
          logger: logging.Logger


      def report_title(ctx: ReportContext, name: str) -> str:
          heading = name.strip().title()
          return f"{heading} ({ctx.timezone.key})"
    after: |
      import logging
      from dataclasses import dataclass
      from datetime import datetime
      from uuid import UUID
      from zoneinfo import ZoneInfo

      from sqlalchemy.orm import Session


      @dataclass(frozen=True)
      class ReportContext:
          tenant_id: UUID
          timezone: ZoneInfo
          locale: str
          generated_at: datetime
          db: Session
