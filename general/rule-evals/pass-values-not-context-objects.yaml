- name: a locale switch returns the request context it was given when the locale already matches
  inputs:
    file: src/context/locale.ts
    after: |
      export interface RequestContext {
        requestId: string;
        userId: string;
        tenantId: string;
        locale: string;
        ip: string;
        receivedAt: Date;
      }

      export function withLocale(ctx: RequestContext, locale: string): RequestContext {
        if (ctx.locale === locale) {
          return ctx;
        }
        return { ...ctx, locale };
      }
  expected_output:
    outcome: valid
- name: an audit trail stores the request context its constructor is given
  inputs:
    file: src/audit/trail.ts
    after: |
      export interface RequestContext {
        requestId: string;
        userId: string;
        tenantId: string;
        locale: string;
        ip: string;
        receivedAt: Date;
      }

      export class AuditTrail {
        constructor(private readonly ctx: RequestContext) {}

        entry(action: string): string {
          return `${this.ctx.requestId} ${this.ctx.tenantId}/${this.ctx.userId} from ${this.ctx.ip}: ${action}`;
        }
      }
  expected_output:
    outcome: valid
