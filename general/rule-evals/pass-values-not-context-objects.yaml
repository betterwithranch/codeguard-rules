- name: a price formatter takes the whole request context to read only its locale
  inputs:
    file: src/format/price.ts
    after: |
      import type { Pool } from "pg";
      import type { Logger } from "pino";

      export interface RequestContext {
        db: Pool;
        logger: Logger;
        userId: string;
        locale: string;
        featureFlags: ReadonlySet<string>;
        receivedAt: Date;
      }

      export function formatPrice(ctx: RequestContext, cents: number, currency: string): string {
        return new Intl.NumberFormat(ctx.locale, { style: "currency", currency }).format(cents / 100);
      }
  expected_output:
    outcome: invalid
