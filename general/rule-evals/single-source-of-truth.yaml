- name: a parcel response copies both the weight and the weight class out of the parcel for the client, so the parcel stays their one source
  inputs:
    file: postage/responses.py
    unchanged:
      postage/weight_class.py: |
        from enum import Enum


        class WeightClass(Enum):
            LETTER = "letter"
            SMALL = "small"
            LARGE = "large"

            @classmethod
            def for_grams(cls, grams: int) -> "WeightClass":
                if grams <= 100:
                    return cls.LETTER
                if grams <= 2000:
                    return cls.SMALL
                return cls.LARGE
      postage/parcel.py: |
        from dataclasses import dataclass
        from functools import cached_property

        from postage.weight_class import WeightClass


        @dataclass(frozen=True)
        class Parcel:
            label: str
            weight_grams: int

            @cached_property
            def weight_class(self) -> WeightClass:
                return WeightClass.for_grams(self.weight_grams)
    after: |
      from pydantic import BaseModel

      from postage.parcel import Parcel
      from postage.weight_class import WeightClass


      class ParcelResponse(BaseModel):
          label: str
          weight_grams: int
          weight_class: WeightClass

          @classmethod
          def from_parcel(cls, parcel: Parcel) -> "ParcelResponse":
              return cls(
                  label=parcel.label,
                  weight_grams=parcel.weight_grams,
                  weight_class=parcel.weight_class,
              )
  expected_output:
    outcome: valid
