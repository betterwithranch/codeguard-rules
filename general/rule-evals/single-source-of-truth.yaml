- name: a TypeORM stock item keeps its warehouseId column beside its warehouse relation joined on it, which the ORM keeps on one row
  inputs:
    file: inventory/stockItem.ts
    unchanged:
      inventory/warehouse.ts: |
        import { Column, Entity, PrimaryGeneratedColumn } from "typeorm";

        @Entity()
        export class Warehouse {
          @PrimaryGeneratedColumn()
          id!: number;

          @Column()
          city!: string;
        }
    after: |
      import { Column, Entity, JoinColumn, ManyToOne, PrimaryGeneratedColumn } from "typeorm";

      import { Warehouse } from "./warehouse";

      @Entity()
      export class StockItem {
        @PrimaryGeneratedColumn()
        id!: number;

        @Column()
        sku!: string;

        @Column()
        quantity!: number;

        @Column()
        warehouseId!: number;

        @ManyToOne(() => Warehouse)
        @JoinColumn({ name: "warehouseId" })
        warehouse!: Warehouse;
      }
  expected_output:
    outcome: valid
