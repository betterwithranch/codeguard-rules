- name: a parcel response copies both the weight and the weight class out of the parcel for the client, so the parcel stays their one source (typescript)
  inputs:
    file: postage/parcelResponse.ts
    unchanged:
      postage/parcel.ts: |
        export type WeightClass = "letter" | "small" | "large";

        export class Parcel {
          constructor(
            readonly label: string,
            readonly weightGrams: number,
          ) {}

          get weightClass(): WeightClass {
            if (this.weightGrams <= 100) return "letter";
            if (this.weightGrams <= 2000) return "small";
            return "large";
          }
        }
    after: |
      import type { Parcel, WeightClass } from "./parcel";

      export interface ParcelResponse {
        label: string;
        weightGrams: number;
        weightClass: WeightClass;
      }

      export function toParcelResponse(parcel: Parcel): ParcelResponse {
        return {
          label: parcel.label,
          weightGrams: parcel.weightGrams,
          weightClass: parcel.weightClass,
        };
      }
  expected_output:
    outcome: valid
