cases:
- name: a parcel stores its weight class beside its weight and re-weighing must update both, so a change that sets one leaves them disagreeing
  inputs:
    file: postage/parcel.py
    unchanged:
      postage/weight_class.py: |
        from enum import Enum


        class WeightClass(Enum):
            LETTER = "letter"
            SMALL = "small"
            LARGE = "large"

            @classmethod
            def for_grams(cls, grams: int) -> "WeightClass":
                if grams <= 100:
                    return cls.LETTER
                if grams <= 2000:
                    return cls.SMALL
                return cls.LARGE
    after: |
      from dataclasses import dataclass

      from postage.weight_class import WeightClass


      @dataclass
      class Parcel:
          label: str
          weight_grams: int
          weight_class: WeightClass

          def reweigh(self, grams: int) -> None:
              self.weight_grams = grams
              self.weight_class = WeightClass.for_grams(grams)
  expected_output:
    outcome: invalid
- name: a parcel that never changes caches its weight class from its weight, so there is no second field to keep in step
  inputs:
    file: postage/parcel.py
    unchanged:
      postage/weight_class.py: |
        from enum import Enum


        class WeightClass(Enum):
            LETTER = "letter"
            SMALL = "small"
            LARGE = "large"

            @classmethod
            def for_grams(cls, grams: int) -> "WeightClass":
                if grams <= 100:
                    return cls.LETTER
                if grams <= 2000:
                    return cls.SMALL
                return cls.LARGE
    after: |
      from dataclasses import dataclass
      from functools import cached_property

      from postage.weight_class import WeightClass


      @dataclass(frozen=True)
      class Parcel:
          label: str
          weight_grams: int

          @cached_property
          def weight_class(self) -> WeightClass:
              return WeightClass.for_grams(self.weight_grams)
  expected_output:
    outcome: valid
- name: a timer's constructor sets its length in minutes beside its length in seconds and extend adds to both, so one missed update makes them disagree
  inputs:
    file: kitchen/timer.py
    before: |
      class KitchenTimer:
          def __init__(self, seconds: int) -> None:
              self.duration_seconds = seconds

          def extend(self, extra_seconds: int) -> None:
              self.duration_seconds += extra_seconds
    after: |
      class KitchenTimer:
          def __init__(self, seconds: int) -> None:
              self.duration_seconds = seconds
              self.duration_minutes = seconds / 60

          def extend(self, extra_seconds: int) -> None:
              self.duration_seconds += extra_seconds
              self.duration_minutes += extra_seconds / 60
  expected_output:
    outcome: invalid
- name: a timer computes its length in minutes from its length in seconds each time it is read
  inputs:
    file: kitchen/timer.py
    before: |
      class KitchenTimer:
          def __init__(self, seconds: int) -> None:
              self.duration_seconds = seconds

          def extend(self, extra_seconds: int) -> None:
              self.duration_seconds += extra_seconds
    after: |
      class KitchenTimer:
          def __init__(self, seconds: int) -> None:
              self.duration_seconds = seconds

          @property
          def duration_minutes(self) -> float:
              return self.duration_seconds / 60

          def extend(self, extra_seconds: int) -> None:
              self.duration_seconds += extra_seconds
  expected_output:
    outcome: valid
- name: a ticket keeps a live copy of its assignee's team in step with the assignee, so a reassignment that forgets one leaves them disagreeing
  inputs:
    file: helpdesk/ticket.py
    unchanged:
      helpdesk/agent.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Agent:
            id: str
            name: str
            team: str
    after: |
      from dataclasses import dataclass, field

      from helpdesk.agent import Agent


      @dataclass
      class Ticket:
          subject: str
          assignee: Agent
          assignee_team: str = field(init=False)

          def __post_init__(self) -> None:
              self.assignee_team = self.assignee.team

          def reassign(self, agent: Agent) -> None:
              self.assignee = agent
              self.assignee_team = agent.team
  expected_output:
    outcome: invalid
