- name: a playlist editor keeps its total length in state beside its tracks and adjusts it by hand, so one missed update shows the wrong length
  inputs:
    file: music/PlaylistEditor.tsx
    unchanged:
      music/track.ts: |
        export interface Track {
          id: string;
          title: string;
          durationSeconds: number;
        }
    after: |
      import { useState } from "react";

      import type { Track } from "./track";

      export function PlaylistEditor({ library }: { library: Track[] }) {
        const [tracks, setTracks] = useState<Track[]>([]);
        const [totalSeconds, setTotalSeconds] = useState(0);

        function add(track: Track) {
          setTracks([...tracks, track]);
          setTotalSeconds(totalSeconds + track.durationSeconds);
        }

        function remove(track: Track) {
          setTracks(tracks.filter((t) => t.id !== track.id));
          setTotalSeconds(totalSeconds - track.durationSeconds);
        }

        return (
          <section>
            <p>{Math.round(totalSeconds / 60)} minutes</p>
            <ol>
              {tracks.map((t) => (
                <li key={t.id} onClick={() => remove(t)}>
                  {t.title}
                </li>
              ))}
            </ol>
            <ul>
              {library.map((t) => (
                <li key={t.id} onClick={() => add(t)}>
                  {t.title}
                </li>
              ))}
            </ul>
          </section>
        );
      }
  expected_output:
    outcome: invalid
- name: a playlist editor sums its total length from its tracks while rendering
  inputs:
    file: music/PlaylistEditor.tsx
    unchanged:
      music/track.ts: |
        export interface Track {
          id: string;
          title: string;
          durationSeconds: number;
        }
    after: |
      import { useState } from "react";

      import type { Track } from "./track";

      export function PlaylistEditor({ library }: { library: Track[] }) {
        const [tracks, setTracks] = useState<Track[]>([]);
        const totalSeconds = tracks.reduce((sum, t) => sum + t.durationSeconds, 0);

        function add(track: Track) {
          setTracks([...tracks, track]);
        }

        function remove(track: Track) {
          setTracks(tracks.filter((t) => t.id !== track.id));
        }

        return (
          <section>
            <p>{Math.round(totalSeconds / 60)} minutes</p>
            <ol>
              {tracks.map((t) => (
                <li key={t.id} onClick={() => remove(t)}>
                  {t.title}
                </li>
              ))}
            </ol>
            <ul>
              {library.map((t) => (
                <li key={t.id} onClick={() => add(t)}>
                  {t.title}
                </li>
              ))}
            </ul>
          </section>
        );
      }
  expected_output:
    outcome: valid
