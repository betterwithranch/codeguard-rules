- name: a delivery stores the date it is expected from its dispatch time and the carrier's transit days, which the delivery doesn't hold
  inputs:
    file: shipping/delivery.py
    after: |
      from datetime import date, datetime, timedelta


      class Delivery:
          def __init__(self, tracking_number: str) -> None:
              self.tracking_number = tracking_number
              self.dispatched_at: datetime | None = None
              self.expected_on: date | None = None

          def dispatch(self, now: datetime, carrier_transit_days: int) -> None:
              self.dispatched_at = now
              self.expected_on = (now + timedelta(days=carrier_transit_days)).date()
  expected_output:
    outcome: valid
- name: a SQLAlchemy stock item keeps its warehouse_id column beside its warehouse relationship, which the ORM keeps on one row
  inputs:
    file: inventory/stock_item.py
    unchanged:
      inventory/base.py: |
        from sqlalchemy.orm import DeclarativeBase


        class Base(DeclarativeBase):
            pass
      inventory/warehouse.py: |
        from sqlalchemy.orm import Mapped, mapped_column

        from inventory.base import Base


        class Warehouse(Base):
            __tablename__ = "warehouses"

            id: Mapped[int] = mapped_column(primary_key=True)
            city: Mapped[str]
    after: |
      from sqlalchemy import ForeignKey
      from sqlalchemy.orm import Mapped, mapped_column, relationship

      from inventory.base import Base
      from inventory.warehouse import Warehouse


      class StockItem(Base):
          __tablename__ = "stock_items"

          id: Mapped[int] = mapped_column(primary_key=True)
          sku: Mapped[str]
          quantity: Mapped[int]
          warehouse_id: Mapped[int] = mapped_column(ForeignKey("warehouses.id"))
          warehouse: Mapped[Warehouse] = relationship()
  expected_output:
    outcome: valid
