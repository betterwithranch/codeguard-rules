- name: a paint swatch's constructor parses its colour channels from its hex code and stores both, so recolouring must update both
  inputs:
    file: paint/swatch.ts
    unchanged:
      paint/colour.ts: |
        export interface Rgb {
          readonly red: number;
          readonly green: number;
          readonly blue: number;
        }

        export function parseHex(hex: string): Rgb {
          return {
            red: parseInt(hex.slice(1, 3), 16),
            green: parseInt(hex.slice(3, 5), 16),
            blue: parseInt(hex.slice(5, 7), 16),
          };
        }
    after: |
      import { parseHex, type Rgb } from "./colour";

      export class Swatch {
        hex: string;
        rgb: Rgb;

        constructor(readonly name: string, hex: string) {
          this.hex = hex;
          this.rgb = parseHex(hex);
        }

        recolour(hex: string): void {
          this.hex = hex;
          this.rgb = parseHex(hex);
        }
      }
  expected_output:
    outcome: invalid
- name: a paint swatch's getter parses its colour channels from its hex code each time they are read
  inputs:
    file: paint/swatch.ts
    unchanged:
      paint/colour.ts: |
        export interface Rgb {
          readonly red: number;
          readonly green: number;
          readonly blue: number;
        }

        export function parseHex(hex: string): Rgb {
          return {
            red: parseInt(hex.slice(1, 3), 16),
            green: parseInt(hex.slice(3, 5), 16),
            blue: parseInt(hex.slice(5, 7), 16),
          };
        }
    after: |
      import { parseHex, type Rgb } from "./colour";

      export class Swatch {
        hex: string;

        constructor(readonly name: string, hex: string) {
          this.hex = hex;
        }

        get rgb(): Rgb {
          return parseHex(this.hex);
        }

        recolour(hex: string): void {
          this.hex = hex;
        }
