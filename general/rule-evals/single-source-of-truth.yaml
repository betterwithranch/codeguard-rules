- name: a component keeps a selected count in state beside the selected ids
  inputs:
    file: inbox/MessageList.tsx
    after: |
      import { useState } from "react";

      export function MessageList({ messages }: { messages: Message[] }) {
        const [selectedIds, setSelectedIds] = useState<string[]>([]);
        const [selectedCount, setSelectedCount] = useState(0);

        function toggle(id: string) {
          if (selectedIds.includes(id)) {
            setSelectedIds(selectedIds.filter((s) => s !== id));
            setSelectedCount(selectedCount - 1);
          } else {
            setSelectedIds([...selectedIds, id]);
            setSelectedCount(selectedCount + 1);
          }
        }

        return (
          <ul>
            <li>{selectedCount} selected</li>
            {messages.map((m) => (
              <li key={m.id} onClick={() => toggle(m.id)}>
                {m.subject}
              </li>
            ))}
          </ul>
        );
      }
  expected_output:
    outcome: invalid
- name: a component computes the selected count from the selected ids
  inputs:
    file: inbox/MessageList.tsx
    after: |
      import { useState } from "react";

      export function MessageList({ messages }: { messages: Message[] }) {
        const [selectedIds, setSelectedIds] = useState<string[]>([]);
        const selectedCount = selectedIds.length;

        function toggle(id: string) {
          setSelectedIds(
            selectedIds.includes(id)
              ? selectedIds.filter((s) => s !== id)
              : [...selectedIds, id],
          );
        }

        return (
          <ul>
            <li>{selectedCount} selected</li>
            {messages.map((m) => (
              <li key={m.id} onClick={() => toggle(m.id)}>
                {m.subject}
              </li>
            ))}
          </ul>
        );
      }
  expected_output:
    outcome: valid
- name: a subscription class stores whether it is active beside its cancellation time
  inputs:
    file: billing/subscription.ts
    after: |
      export class Subscription {
        cancelledAt?: Date;
        isActive = true;

        constructor(readonly customerId: string, readonly plan: string) {}

        cancel(now: Date): void {
          this.cancelledAt = now;
          this.isActive = false;
        }
      }
  expected_output:
    outcome: invalid
