- name: a zod schema built from a room directory handed in checks the room is big enough
  inputs:
    file: bookings/schema.ts
    after: |
      import { z } from "zod";
      import type { RoomDirectory } from "./rooms";

      export function bookingSchema(rooms: RoomDirectory) {
        return z
          .object({
            roomId: z.string().uuid(),
            seats: z.number().int().positive(),
          })
          .refine((booking) => rooms.capacityOf(booking.roomId) >= booking.seats, {
            message: "the room is too small for this booking",
          });
      }
    unchanged:
      bookings/rooms.ts: |
        export interface RoomDirectory {
          capacityOf(roomId: string): number;
        }
  expected_output:
    outcome: invalid
- name: an edit makes a zod schema read its team size limit from an environment variable on every parse instead of a constant
  inputs:
    file: teams/schema.ts
    before: |
      import { z } from "zod";

      const MAX_TEAM_SIZE = 12;

      export const teamSchema = z.object({
        name: z.string().min(1),
        memberIds: z.array(z.string().uuid()).min(1).max(MAX_TEAM_SIZE),
      });
    after: |
      import { z } from "zod";

      export const teamSchema = z.object({
        name: z.string().min(1),
        memberIds: z
          .array(z.string().uuid())
          .min(1)
          .superRefine((memberIds, ctx) => {
            const limit = z.coerce.number().int().positive().parse(process.env.MAX_TEAM_SIZE);
            if (memberIds.length > limit) {
              ctx.addIssue({
                code: z.ZodIssueCode.custom,
                message: `a team has at most ${limit} members`,
              });
            }
          }),
      });
  expected_output:
    outcome: invalid
- name: a zod superRefine checks an abstract's word count against a constant bound
  inputs:
    file: submissions/schema.ts
    after: |
      import { z } from "zod";

      const MAX_ABSTRACT_WORDS = 250;

      export const submissionSchema = z.object({
        title: z.string().min(1),
        abstract: z.string().superRefine((abstract, ctx) => {
          const words = abstract.trim().split(/\s+/).length;
          if (words > MAX_ABSTRACT_WORDS) {
            ctx.addIssue({
              code: z.ZodIssueCode.custom,
              message: `an abstract has at most ${MAX_ABSTRACT_WORDS} words`,
            });
          }
        }),
      });
  expected_output:
    outcome: valid
