- name: a request handler checks the chosen plan exists after parsing the body, as request validation outside a data model
  inputs:
    file: subscriptions/handlers.ts
    after: |
      import type { Request, Response } from "express";
      import { z } from "zod";
      import { prisma } from "../db";

      const subscribeBody = z.object({
        accountId: z.string().uuid(),
        planId: z.string().uuid(),
      });

      export async function subscribe(req: Request, res: Response): Promise<void> {
        const parsed = subscribeBody.safeParse(req.body);
        if (!parsed.success) {
          res.status(400).json({ issues: parsed.error.issues });
          return;
        }
        const plan = await prisma.plan.findUnique({ where: { id: parsed.data.planId } });
        if (plan === null) {
          res.status(404).json({ error: "no such plan" });
          return;
        }
        const subscription = await prisma.subscription.create({ data: parsed.data });
        res.status(201).json({ id: subscription.id });
      }
    unchanged:
      db.ts: |
        import { PrismaClient } from "@prisma/client";

        export const prisma = new PrismaClient();
  expected_output:
    outcome: valid
