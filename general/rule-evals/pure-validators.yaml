- name: a Django form checks the transfer's recipient account is open, as request validation outside a data model
  inputs:
    file: banking/forms.py
    after: |
      from django import forms

      from banking.models import Account


      class TransferForm(forms.Form):
          recipient_number = forms.CharField(max_length=8)
          amount_pence = forms.IntegerField(min_value=1)

          def clean_recipient_number(self) -> str:
              number: str = self.cleaned_data["recipient_number"]
              if not Account.objects.filter(number=number, closed=False).exists():
                  raise forms.ValidationError("no open account has this number")
              return number
    unchanged:
      banking/models.py: |
        from django.db import models


        class Account(models.Model):
            number = models.CharField(max_length=8, unique=True)
            closed = models.BooleanField()
  expected_output:
    outcome: valid
