- name: a zod superRefine loads the warehouse row to accept a pickup
  inputs:
    file: pickups/schema.ts
    after: |
      import { z } from "zod";
      import { prisma } from "../db";

      export const pickupSchema = z
        .object({
          warehouseId: z.string().uuid(),
          pickupOn: z.coerce.date(),
        })
        .superRefine(async (pickup, ctx) => {
          const warehouse = await prisma.warehouse.findUniqueOrThrow({
            where: { id: pickup.warehouseId },
          });
          if (!warehouse.acceptsPickups) {
            ctx.addIssue({
              code: z.ZodIssueCode.custom,
              path: ["warehouseId"],
              message: "this warehouse takes no pickups",
            });
          }
        });
    unchanged:
      db.ts: |
        import { PrismaClient } from "@prisma/client";

        export const prisma = new PrismaClient();
  expected_output:
    outcome: invalid
- name: a TypeORM entity's class-validator constraint queries the other creators to keep a handle unique
  inputs:
    file: creators/creator.entity.ts
    after: |
      import {
        Matches,
        Validate,
        ValidatorConstraint,
        type ValidatorConstraintInterface,
      } from "class-validator";
      import { BaseEntity, Column, Entity, PrimaryGeneratedColumn } from "typeorm";

      @ValidatorConstraint({ name: "handleNotTaken", async: true })
      export class HandleNotTaken implements ValidatorConstraintInterface {
        async validate(handle: string): Promise<boolean> {
          return !(await Creator.existsBy({ handle }));
        }
      }

      @Entity()
      export class Creator extends BaseEntity {
        @PrimaryGeneratedColumn("uuid")
        id!: string;

        @Column()
        @Matches(/^[a-z0-9_]{3,30}$/)
        @Validate(HandleNotTaken, { message: "another creator already has this handle" })
        handle!: string;
      }
  expected_output:
    outcome: invalid
- name: a zod refine asks an outside VAT service whether the number exists, so parsing fails while the service is down
  inputs:
    file: companies/schema.ts
    after: |
      import { z } from "zod";

      export const vatRegistrationSchema = z.object({
        companyName: z.string().min(1),
        vatNumber: z
          .string()
          .regex(/^GB\d{9}$/)
          .refine(
            async (vatNumber) => {
              const response = await fetch(`https://vat-check.example.com/numbers/${vatNumber}`);
              return response.ok;
            },
            { message: "the VAT service doesn't know this number" },
          ),
      });
  expected_output:
    outcome: invalid
- name: a zod transform rejects urgent tickets unless an environment variable switches them on
  inputs:
    file: support/schema.ts
    after: |
      import { z } from "zod";

      export const ticketSchema = z.object({
        subject: z.string().min(1),
        priority: z.enum(["low", "normal", "urgent"]).transform((priority, ctx) => {
          if (priority === "urgent" && process.env.URGENT_TICKETS !== "on") {
            ctx.addIssue({ code: z.ZodIssueCode.custom, message: "urgent tickets are switched off" });
            return z.NEVER;
          }
          return priority;
        }),
      });
  expected_output:
    outcome: invalid
- name: a valibot check accepts only export formats registered while the program runs
  inputs:
    file: exports/schema.ts
    after: |
      import * as v from "valibot";
      import { isRegisteredExporter } from "./registry";

      export const exportJobSchema = v.object({
        reportId: v.pipe(v.string(), v.uuid()),
        format: v.pipe(
