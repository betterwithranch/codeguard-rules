cases:
- name: a dataclass needs a staff directory handed in to accept an employee, so it can't be built without one
  inputs:
    file: timesheets/entries.py
    after: |
      from dataclasses import InitVar, dataclass

      from timesheets.directory import StaffDirectory


      @dataclass(frozen=True)
      class TimesheetEntry:
          employee_id: str
          hours: int
          directory: InitVar[StaffDirectory]

          def __post_init__(self, directory: StaffDirectory) -> None:
              if not directory.has_employee(self.employee_id):
                  raise ValueError(f"no employee {self.employee_id}")
    unchanged:
      timesheets/directory.py: |
        class StaffDirectory:
            def __init__(self, employee_ids: frozenset[str]) -> None:
                self._employee_ids = employee_ids

            def has_employee(self, employee_id: str) -> bool:
                return employee_id in self._employee_ids
  expected_output:
    outcome: invalid
- name: a settings model calls the payment gateway over HTTP to accept its URL, so settings fail to load while the gateway is down
  inputs:
    file: payments/settings.py
    after: |
      import httpx
      from pydantic import HttpUrl, SecretStr, field_validator
      from pydantic_settings import BaseSettings


      class GatewaySettings(BaseSettings):
          gateway_url: HttpUrl
          gateway_api_key: SecretStr

          @field_validator("gateway_url")
          @classmethod
          def gateway_answers(cls, value: HttpUrl) -> HttpUrl:
              response = httpx.get(f"{value}health", timeout=5.0)
              if response.status_code != 200:
                  raise ValueError(f"the payment gateway at {value} is not answering")
              return value
  expected_output:
    outcome: invalid
- name: an attrs validator accepts an overseas address only when an environment variable allows it
  inputs:
    file: delivery/addresses.py
    after: |
      import os

      import attrs


      def shippable_country(_instance: object, _attribute: "attrs.Attribute[str]", value: str) -> None:
          if value != "GB" and os.environ["SHIP_OVERSEAS"] != "yes":
              raise ValueError(f"cannot ship to {value}")


      @attrs.frozen
      class DeliveryAddress:
          street: str
          postcode: str
          country: str = attrs.field(validator=shippable_country)
  expected_output:
    outcome: invalid
- name: an AfterValidator accepts only carriers registered while the program runs, so a request parses differently before and after registration
  inputs:
    file: shipping/requests.py
    after: |
      from typing import Annotated

      from pydantic import AfterValidator, BaseModel

      from shipping.carriers import CARRIER_NAMES


      def registered_carrier(name: str) -> str:
          if name not in CARRIER_NAMES:
              raise ValueError(f"no carrier is registered as {name}")
          return name


      class ShipmentRequest(BaseModel):
          tracking_number: str
          carrier: Annotated[str, AfterValidator(registered_carrier)]
    unchanged:
      shipping/carriers.py: |
        CARRIER_NAMES: set[str] = set()


        def register_carrier(name: str) -> None:
            CARRIER_NAMES.add(name)
  expected_output:
    outcome: invalid
- name: a Django model's clean queries the other coupons to keep its code unique
  inputs:
    file: promotions/models.py
    after: |
      from django.core.exceptions import ValidationError
      from django.db import models


      class Coupon(models.Model):
          code = models.CharField(max_length=20)
          percent_off = models.PositiveSmallIntegerField()

          def clean(self) -> None:
              if Coupon.objects.filter(code=self.code).exclude(pk=self.pk).exists():
                  raise ValidationError({"code": "another coupon already uses this code"})
  expected_output:
    outcome: invalid
- name: a Django model's clean reads the holiday table, so a delivery valid today can fail once a holiday is added
  inputs:
    file: deliveries/models.py
    after: |
      from django.core.exceptions import ValidationError
      from django.db import models


      class Holiday(models.Model):
          day = models.DateField(unique=True)


      class Delivery(models.Model):
          address = models.TextField()
          deliver_on = models.DateField()

          def clean(self) -> None:
              if Holiday.objects.filter(day=self.deliver_on).exists():
                  raise ValidationError({"deliver_on": "there are no deliveries on a holiday"})
  expected_output:
    outcome: invalid
- name: an edit makes a pydantic validator read its ticket limit from Django settings instead of a constant
  inputs:
    file: events/orders.py
    before: |
      from pydantic import BaseModel, Field, field_validator

      MAX_TICKETS_PER_ORDER = 8


      class TicketOrderIn(BaseModel):
          event_id: int
          tickets: int = Field(gt=0)

          @field_validator("tickets")
          @classmethod
          def within_limit(cls, value: int) -> int:
              if value > MAX_TICKETS_PER_ORDER:
                  raise ValueError(f"an order takes at most {MAX_TICKETS_PER_ORDER} tickets")
              return value
    after: |
      from django.conf import settings
      from pydantic import BaseModel, Field, field_validator


      class TicketOrderIn(BaseModel):
          event_id: int
          tickets: int = Field(gt=0)

          @field_validator("tickets")
          @classmethod
          def within_limit(cls, value: int) -> int:
              if value > settings.MAX_TICKETS_PER_ORDER:
                  raise ValueError(f"an order takes at most {settings.MAX_TICKETS_PER_ORDER} tickets")
              return value
  expected_output:
    outcome: invalid
- name: a msgspec struct checks its star rating against a constant bound
  inputs:
    file: reviews/structs.py
    after: |
      import msgspec

      MAX_STARS = 5


      class Review(msgspec.Struct, frozen=True):
          product_id: int
          stars: int
          comment: str

          def __post_init__(self) -> None:
              if not 1 <= self.stars <= MAX_STARS:
                  raise ValueError(f"a review gives 1 to {MAX_STARS} stars")
  expected_output:
    outcome: valid
- name: a pydantic model validator checks a refund against the amount paid on the same model
  inputs:
    file: refunds/schemas.py
    after: |
      from decimal import Decimal
      from typing import Self

      from pydantic import BaseModel, Field, model_validator


      class RefundIn(BaseModel):
          paid: Decimal = Field(gt=0)
          refunded: Decimal = Field(gt=0)

          @model_validator(mode="after")
          def refund_within_payment(self) -> Self:
              if self.refunded > self.paid:
                  raise ValueError("a refund cannot exceed the amount paid")
              return self
  expected_output:
    outcome: valid
- name: an attrs validator checks a unit against a set of metric units the module declares
  inputs:
    file: recipes/ingredients.py
    after: |
      import attrs

      METRIC_UNITS = frozenset({"g", "kg", "ml", "l"})


      @attrs.frozen
      class Ingredient:
          name: str
          quantity: float
          unit: str = attrs.field()

          @unit.validator
          def _metric_unit(self, _attribute: "attrs.Attribute[str]", value: str) -> None:
              if value not in METRIC_UNITS:
                  raise ValueError(f"{value} is not a metric unit")
  expected_output:
    outcome: valid
- name: a Django model keeps gift card codes unique with a unique column, not a query
