- name: a shipment tracker extends a circuit breaker to guard its carrier calls
  inputs:
    file: shipping/tracker.ts
    unchanged:
      resilience/circuit-breaker.ts: |
        export class CircuitBreaker {
          private failures = 0;

          constructor(private readonly threshold: number) {}

          async execute<T>(work: () => Promise<T>): Promise<T> {
            if (this.failures >= this.threshold) {
              throw new Error("circuit open");
            }
            try {
              const result = await work();
              this.failures = 0;
              return result;
            } catch (error) {
              this.failures += 1;
              throw error;
            }
          }
        }
      carriers/carrier.ts: |
        export type TrackingStatus = {
          trackingNumber: string;
          state: "in_transit" | "delivered" | "returned";
        };

        export interface CarrierApi {
          trackingStatus(trackingNumber: string): Promise<TrackingStatus>;
        }
    after: |
      import { CarrierApi, TrackingStatus } from "../carriers/carrier";
      import { CircuitBreaker } from "../resilience/circuit-breaker";

      export class ShipmentTracker extends CircuitBreaker {
        constructor(private readonly carrier: CarrierApi) {
          super(5);
        }

        async status(trackingNumber: string): Promise<TrackingStatus> {
          return this.execute(() => this.carrier.trackingStatus(trackingNumber));
        }
      }
  expected_output:
    outcome: invalid
