- name: an invoice archiver inherits a library's HTTP session to upload with it
  inputs:
    file: billing/archive.py
    unchanged:
      billing/invoice.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            number: str
            pdf: bytes
    after: |
      import requests

      from billing.invoice import Invoice


      class InvoiceArchiver(requests.Session):
          def __init__(self, archive_url: str) -> None:
              super().__init__()
              self.archive_url = archive_url

          def archive(self, invoice: Invoice) -> None:
              response = self.put(f"{self.archive_url}/{invoice.number}.pdf", data=invoice.pdf)
              response.raise_for_status()
  expected_output:
    outcome: invalid
- name: a JSON log formatter is a standard library formatter that formats records its own way
  inputs:
    file: observability/formatting.py
    after: |
      import json
      import logging


      class JsonLineFormatter(logging.Formatter):
          def format(self, record: logging.LogRecord) -> str:
              return json.dumps(
                  {
                      "time": self.formatTime(record),
                      "level": record.levelname,
                      "logger": record.name,
                      "message": record.getMessage(),
                  }
              )
  expected_output:
