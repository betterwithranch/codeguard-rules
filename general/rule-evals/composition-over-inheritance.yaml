- name: a tiered tariff is a tariff that prices usage by tier
  inputs:
    file: energy/tiered-tariff.ts
    unchanged:
      energy/tariff.ts: |
        import { MeterReading } from "./meter";

        export class Tariff {
          constructor(
            readonly name: string,
            protected readonly centsPerKwh: number,
          ) {}

          costCents(reading: MeterReading): number {
            return Math.round(reading.kwh * this.centsPerKwh);
          }
        }
      energy/meter.ts: |
        export type MeterReading = {
          meterId: string;
          kwh: number;
        };
    after: |
      import { MeterReading } from "./meter";
      import { Tariff } from "./tariff";

      export class TieredTariff extends Tariff {
        constructor(
          name: string,
          centsPerKwh: number,
          private readonly firstTierKwh: number,
          private readonly firstTierCentsPerKwh: number,
        ) {
          super(name, centsPerKwh);
        }

        costCents(reading: MeterReading): number {
          const firstTier = Math.min(reading.kwh, this.firstTierKwh);
          const rest = reading.kwh - firstTier;
          return Math.round(firstTier * this.firstTierCentsPerKwh + rest * this.centsPerKwh);
        }
      }
  expected_output:
    outcome: valid
- name: a percent-off rule implements the price rule interface whose job it does
  inputs:
    file: pricing/percent-off.ts
    unchanged:
      pricing/rule.ts: |
        export interface PriceRule {
          readonly description: string;
          apply(priceCents: number): number;
        }
    after: |
      import { PriceRule } from "./rule";

      export class PercentOff implements PriceRule {
        readonly description: string;

        constructor(private readonly percent: number) {
          this.description = `${percent}% off`;
        }

        apply(priceCents: number): number {
          return Math.round((priceCents * (100 - this.percent)) / 100);
        }
      }
  expected_output:
    outcome: valid
