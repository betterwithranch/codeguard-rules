- name: an edit makes a payslip publisher inherit the SFTP uploader it used to hold
  inputs:
    file: payroll/publishing.py
    unchanged:
      transfer/sftp.py: |
        import paramiko


        class SftpUploader:
            def __init__(self, host: str, username: str, key_path: str) -> None:
                self.host = host
                self.username = username
                self.key_path = key_path

            def upload(self, remote_path: str, data: bytes) -> None:
                with paramiko.SSHClient() as ssh:
                    ssh.load_system_host_keys()
                    ssh.connect(self.host, username=self.username, key_filename=self.key_path)
                    with ssh.open_sftp() as sftp, sftp.open(remote_path, "wb") as remote:
                        remote.write(data)
      payroll/payslips.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Payslip:
            employee_id: str
            period: str
            pdf: bytes
    before: |
      from payroll.payslips import Payslip
      from transfer.sftp import SftpUploader


      class PayslipPublisher:
          def __init__(self, uploader: SftpUploader) -> None:
              self._uploader = uploader

          def publish(self, payslip: Payslip) -> None:
              self._uploader.upload(
                  f"payslips/{payslip.period}/{payslip.employee_id}.pdf", payslip.pdf
              )
    after: |
      from payroll.payslips import Payslip
      from transfer.sftp import SftpUploader


      class PayslipPublisher(SftpUploader):
          def publish(self, payslip: Payslip) -> None:
              self.upload(f"payslips/{payslip.period}/{payslip.employee_id}.pdf", payslip.pdf)
  expected_output:
    outcome: invalid
