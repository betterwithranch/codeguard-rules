cases:
- name: a low-stock alerter inherits the SMS gateway to text buyers with it
  inputs:
    file: inventory/alerts.py
    unchanged:
      notifications/sms.py: |
        import httpx


        class SmsGateway:
            def __init__(self, api_url: str, sender_id: str) -> None:
                self.api_url = api_url
                self.sender_id = sender_id

            def send_text(self, phone: str, message: str) -> None:
                response = httpx.post(
                    self.api_url,
                    json={"from": self.sender_id, "to": phone, "text": message},
                )
                response.raise_for_status()

            def delivery_status(self, message_id: str) -> str:
                response = httpx.get(f"{self.api_url}/{message_id}")
                response.raise_for_status()
                return response.text
      inventory/stock.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class StockLevel:
            sku: str
            on_hand: int
            buyer_phone: str
    after: |
      from inventory.stock import StockLevel
      from notifications.sms import SmsGateway


      class LowStockAlerter(SmsGateway):
          def alert_low(self, level: StockLevel) -> None:
              self.send_text(level.buyer_phone, f"{level.sku} is down to {level.on_hand} units")

          def alert_sold_out(self, level: StockLevel) -> None:
              self.send_text(level.buyer_phone, f"{level.sku} is sold out")
  expected_output:
    outcome: invalid
