cases:
- name: a delivery's tracking number and delivery time are optional beside a status that decides which one exists
  inputs:
    file: shipping/delivery.py
    after: |
      from dataclasses import dataclass
      from datetime import datetime
      from typing import Literal


      @dataclass(frozen=True)
      class Delivery:
          """A pending parcel has no tracking number yet; one in transit has a tracking
          number; a delivered one has a tracking number and the time it was delivered."""

          parcel_id: str
          status: Literal["pending", "in_transit", "delivered"]
          tracking_number: str | None = None
          delivered_at: datetime | None = None
  expected_output:
    outcome: invalid
- name: a delivery is one of three states, each with its own fields
  inputs:
    file: shipping/delivery.py
    after: |
      from dataclasses import dataclass
      from datetime import datetime


      @dataclass(frozen=True)
      class Pending:
          parcel_id: str


      @dataclass(frozen=True)
      class InTransit:
          parcel_id: str
          tracking_number: str


      @dataclass(frozen=True)
      class Delivered:
          parcel_id: str
          tracking_number: str
          delivered_at: datetime
          signed_by: str | None = None


      Delivery = Pending | InTransit | Delivered
  expected_output:
    outcome: valid
- name: a recipe's source link and serving count are each optional on their own
  inputs:
    file: kitchen/recipes.py
    after: |
