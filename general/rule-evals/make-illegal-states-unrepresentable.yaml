  expected_output:
    outcome: invalid
- name: an export job TypedDict lets a queued job carry a file path only a finished job has
  inputs:
    file: exports/jobs.py
    after: |
      from datetime import datetime
      from typing import Literal, NotRequired, TypedDict


      class ExportJob(TypedDict):
          """The export worker's record of one job. A queued job has neither key below.
          A running job has started_at; a finished job has started_at and the path of
          the file it wrote."""

          job_id: str
          status: Literal["queued", "running", "finished"]
          started_at: NotRequired[datetime]
          file_path: NotRequired[str]
  expected_output:
    outcome: invalid
