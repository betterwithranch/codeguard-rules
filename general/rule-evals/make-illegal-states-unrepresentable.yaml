- name: an edit adds a pickup deadline that only a ready hold has, beside the hold's status
  inputs:
    file: library/holds.py
    before: |
      from dataclasses import dataclass
      from typing import Literal


      @dataclass(frozen=True)
      class Hold:
          """A hold waits until a copy comes in, is then ready to pick up, and is then
          collected."""

          book_id: int
          member_id: int
          status: Literal["waiting", "ready", "collected"]
    after: |
      from dataclasses import dataclass
      from datetime import date
      from typing import Literal


      @dataclass(frozen=True)
      class Hold:
          """A hold waits until a copy comes in, is then ready to pick up, and is then
          collected. Only a ready hold has the date it's kept until; a waiting or a
          collected hold has none."""

          book_id: int
          member_id: int
          status: Literal["waiting", "ready", "collected"]
          kept_until: date | None = None
  expected_output:
    outcome: invalid
- name: an edit adds a status that decides which of a booking's existing optional fields are set
  inputs:
