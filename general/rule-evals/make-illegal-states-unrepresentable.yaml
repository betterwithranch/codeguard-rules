- name: a TypedDict mirrors a courier webhook's body as it arrives and is parsed into one type per event
  inputs:
    file: courier/webhook.py
    unchanged:
      courier/__init__.py: ""
      courier/events.py: |
        from dataclasses import dataclass
        from datetime import datetime


        @dataclass(frozen=True)
        class OutForDelivery:
            parcel_ref: str
            driver_name: str


        @dataclass(frozen=True)
        class Delivered:
            parcel_ref: str
            delivered_at: datetime


        TrackingEvent = OutForDelivery | Delivered
    after: |
      from datetime import datetime
      from typing import Literal, NotRequired, TypedDict

      from courier.events import Delivered, OutForDelivery, TrackingEvent


      class CourierWebhookBody(TypedDict):
          """The JSON body the courier posts, key for key as its API documents it. The
          courier sends driver_name only with out_for_delivery, and delivered_at only with
          delivered."""

          parcel_ref: str
          event: Literal["out_for_delivery", "delivered"]
          driver_name: NotRequired[str]
          delivered_at: NotRequired[str]


      def to_event(body: CourierWebhookBody) -> TrackingEvent:
          if body["event"] == "out_for_delivery" and "driver_name" in body:
              return OutForDelivery(body["parcel_ref"], body["driver_name"])
          if body["event"] == "delivered" and "delivered_at" in body:
              return Delivered(body["parcel_ref"], datetime.fromisoformat(body["delivered_at"]))
          raise ValueError(f"Webhook for {body['parcel_ref']} lacks the key its event needs")
  expected_output:
    outcome: valid
