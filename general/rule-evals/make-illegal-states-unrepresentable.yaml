    before: |
      /** A quote is drafted, then sent to the customer, then accepted. */
      export interface Quote {
        customerId: string;
        totalCents: number;
        status: "draft" | "sent" | "accepted";
      }
    after: |
      /**
       * A quote is drafted, then sent to the customer, then accepted. Only an accepted
