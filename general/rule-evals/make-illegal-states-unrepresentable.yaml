- name: an interface mirrors a payment provider's webhook body as it arrives and is parsed into one type per event
  inputs:
    file: payments/webhook.ts
    unchanged:
      payments/events.ts: |
        export interface PaymentSucceeded {
          kind: "succeeded";
          paymentRef: string;
          receiptUrl: string;
        }

        export interface PaymentFailed {
          kind: "failed";
          paymentRef: string;
          declineCode: string;
        }

        export type PaymentEvent = PaymentSucceeded | PaymentFailed;
    after: |
      import { PaymentEvent } from "./events";

      /**
       * The JSON body the payment provider posts, key for key as its API documents it.
       * The provider sends receipt_url only on success, and decline_code only on failure.
       */
      export interface ProviderWebhookBody {
        payment_ref: string;
        outcome: "succeeded" | "failed";
        receipt_url?: string;
        decline_code?: string;
      }

      export function toPaymentEvent(body: ProviderWebhookBody): PaymentEvent {
        if (body.outcome === "succeeded" && body.receipt_url !== undefined) {
          return { kind: "succeeded", paymentRef: body.payment_ref, receiptUrl: body.receipt_url };
        }
        if (body.outcome === "failed" && body.decline_code !== undefined) {
          return { kind: "failed", paymentRef: body.payment_ref, declineCode: body.decline_code };
        }
        throw new Error(`Webhook for ${body.payment_ref} lacks the field its outcome needs`);
      }
  expected_output:
    outcome: valid
- name: a TypeORM entity mapped to the returns table keeps a status column beside nullable columns
  inputs:
    file: returns/return-request.entity.ts
    after: |
      import { Column, Entity, PrimaryGeneratedColumn } from "typeorm";

      /** A row of the return_requests table. A refunded request has refunded_at. */
      @Entity("return_requests")
      export class ReturnRequestRow {
        @PrimaryGeneratedColumn()
        id!: number;

        @Column({ type: "varchar", length: 16 })
        status!: string;

        @Column({ name: "refunded_at", type: "timestamptz", nullable: true })
        refundedAt!: Date | null;
      }
  expected_output:
    outcome: valid
