- name: a print job's finish time and jammed tray can be set in any state, though each belongs to one
  inputs:
    file: printing/job.ts
    after: |
      /**
       * A queued job has neither field below. A done job has the time it finished; a
       * jammed job has the tray that jammed.
       */
      export type PrintJob = {
        documentName: string;
        state: "queued" | "done" | "jammed";
        finishedAt: Date | undefined;
        jammedTray: string | undefined;
      };
  expected_output:
    outcome: invalid
- name: a print job is one of three interfaces, each with the fields its state has
  inputs:
    file: printing/job.ts
    after: |
      export interface QueuedJob {
        state: "queued";
        documentName: string;
      }

      export interface DoneJob {
        state: "done";
        documentName: string;
        finishedAt: Date;
      }

      export interface JammedJob {
        state: "jammed";
        documentName: string;
        jammedTray: string;
      }

      export type PrintJob = QueuedJob | DoneJob | JammedJob;
  expected_output:
    outcome: valid
