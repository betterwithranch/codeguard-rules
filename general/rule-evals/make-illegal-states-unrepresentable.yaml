- name: a refund can hold a payout reference while rejected, though only an approved refund is paid out
  inputs:
    file: refunds/models.py
    after: |
      from enum import Enum

      from pydantic import BaseModel


      class Decision(Enum):
          REQUESTED = "requested"
          APPROVED = "approved"
          REJECTED = "rejected"


      class Refund(BaseModel):
          """A requested refund has neither field below. An approved refund has the
          payout reference of the money sent back; a rejected one has the reason it was
          rejected and no payout."""

          order_id: str
          amount_cents: int
          decision: Decision
          payout_reference: str | None = None
          rejection_reason: str | None = None
  expected_output:
    outcome: invalid
- name: a SQLAlchemy model mapped to the pick tasks table keeps a status column beside nullable columns
  inputs:
    file: warehouse/tables.py
    after: |
      from datetime import datetime

      from sqlalchemy import String
      from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column


      class Base(DeclarativeBase):
          pass


      class PickTaskRow(Base):
          """A row of the pick_tasks table, column for column. A picked task has
          picker_id and picked_at; an open one has neither."""

          __tablename__ = "pick_tasks"

          id: Mapped[int] = mapped_column(primary_key=True)
          sku: Mapped[str] = mapped_column(String(32))
          status: Mapped[str] = mapped_column(String(16))
          picker_id: Mapped[int | None] = mapped_column(nullable=True)
          picked_at: Mapped[datetime | None] = mapped_column(nullable=True)
  expected_output:
    outcome: valid
