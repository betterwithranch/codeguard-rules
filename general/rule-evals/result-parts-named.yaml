- name: a CSV parser returns its rows and warnings as a tuple
  inputs:
    file: imports/csv.ts
    after: |
      export interface Row {
        sku: string;
        quantity: number;
      }

      export function parseCsv(text: string): [Row[], string[]] {
        const rows: Row[] = [];
        const warnings: string[] = [];
        for (const [index, line] of text.trim().split("\n").entries()) {
          const [sku, quantity] = line.split(",");
          const parsed = Number(quantity);
          if (!sku || Number.isNaN(parsed)) {
            warnings.push(`line ${index + 1} skipped`);
            continue;
          }
          rows.push({ sku, quantity: parsed });
        }
        return [rows, warnings];
      }
  expected_output:
    outcome: invalid
- name: a React hook returns its value and setter
  inputs:
    file: ui/useToggle.ts
    after: |
      import { useCallback, useState } from "react";

      export function useToggle(initial: boolean): [boolean, () => void] {
        const [on, setOn] = useState(initial);
        const toggle = useCallback(() => setOn((value) => !value), []);
        return [on, toggle];
      }
  expected_output:
    outcome: valid
- name: a CSV parser returns an object naming its rows and warnings
  inputs:
    file: imports/csv.ts
    after: |
      export interface Row {
        sku: string;
        quantity: number;
      }

      export function parseCsv(text: string): { rows: Row[]; warnings: string[] } {
        const rows: Row[] = [];
        const warnings: string[] = [];
        for (const [index, line] of text.trim().split("\n").entries()) {
          const [sku, quantity] = line.split(",");
          const parsed = Number(quantity);
          if (!sku || Number.isNaN(parsed)) {
            warnings.push(`line ${index + 1} skipped`);
            continue;
          }
          rows.push({ sku, quantity: parsed });
        }
        return { rows, warnings };
      }
  expected_output:
    outcome: valid
