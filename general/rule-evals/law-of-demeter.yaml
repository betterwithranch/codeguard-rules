- name: an edit makes ending a membership reach through the member to release their locker
  inputs:
    file: gym/memberships.py
    unchanged: &gym_models
      gym/models.py: |
        class Locker:
            def __init__(self, number: int) -> None:
                self.number = number
                self.occupied = True

            def release(self) -> None:
                self.occupied = False


        class Member:
            def __init__(self, name: str, locker: Locker) -> None:
                self.name = name
                self.locker = locker


        class Membership:
            def __init__(self, member: Member, months_left: int) -> None:
                self.member = member
                self.months_left = months_left
                self.active = True

            def cancel(self) -> None:
                self.active = False
    before: |
      from gym.models import Membership


      def end_membership(membership: Membership) -> None:
          membership.cancel()
    after: |
      from gym.models import Membership


      def end_membership(membership: Membership) -> None:
          membership.cancel()
          membership.member.locker.release()
  expected_output:
    outcome: invalid
- name: an edit adds a membership check and leaves an older chain in another function untouched
  inputs:
    file: gym/lockers.py
    unchanged: *gym_models
    before: |
      from gym.models import Membership


      def locker_number(membership: Membership) -> int:
          return membership.member.locker.number
    after: |
      from gym.models import Membership


      def locker_number(membership: Membership) -> int:
          return membership.member.locker.number


      def is_last_month(membership: Membership) -> bool:
          return membership.months_left == 1
  expected_output:
    outcome: valid
- name: announcing an enrollment reaches through the course to notify its instructor
  inputs:
    file: school/announce.ts
    unchanged:
      school/models.ts: |
        export class Instructor {
          readonly inbox: string[] = [];

          constructor(readonly name: string) {}

          notify(message: string): void {
            this.inbox.push(message);
          }
        }

        export class Course {
          constructor(readonly title: string, readonly instructor: Instructor) {}
        }

        export class Enrollment {
          constructor(readonly studentName: string, readonly course: Course) {}
        }
    after: |
      import type { Enrollment } from "./models";

      export function announceEnrollment(enrollment: Enrollment): void {
        enrollment.course.instructor.notify(`${enrollment.studentName} joined ${enrollment.course.title}`);
      }
  expected_output:
    outcome: invalid
