- name: a leaderboard sorts, slices and maps players to their names
  inputs:
    file: league/leaderboard.ts
    after: |
      export interface Player {
        readonly name: string;
        readonly goals: number;
      }

      export function topScorers(players: readonly Player[], count: number): string[] {
        return [...players]
          .sort((a, b) => b.goals - a.goals)
          .slice(0, count)
          .map((player) => player.name);
      }
  expected_output:
    outcome: valid
- name: quiet hours read an optional-chained start time from parsed preferences
  inputs:
