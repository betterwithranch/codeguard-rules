- name: closing an account calls a method on the account the store loads
  inputs:
    file: banking/close.ts
    unchanged:
      banking/accounts.ts: |
        export class Account {
          open = true;

          constructor(readonly id: string) {}

          close(): void {
            this.open = false;
          }
        }

        export class AccountStore {
          private readonly byId = new Map<string, Account>();

          load(id: string): Account {
            const account = this.byId.get(id);
            if (account === undefined) throw new Error(`no account ${id}`);
            return account;
          }
        }
    after: |
      import type { AccountStore } from "./accounts";

      export function closeAccount(accounts: AccountStore, id: string): void {
        accounts.load(id).close();
      }
  expected_output:
    outcome: valid
