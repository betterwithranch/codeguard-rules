- name: a query chains a SQLAlchemy select through where, order_by and limit
  inputs:
    file: library/queries.py
    unchanged:
      library/models.py: |
        from datetime import date

        from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column


        class Base(DeclarativeBase):
            pass


        class Book(Base):
            __tablename__ = "books"

            id: Mapped[int] = mapped_column(primary_key=True)
            author_id: Mapped[int]
            title: Mapped[str]
            published_on: Mapped[date]
    after: |
      from sqlalchemy import Select, select

      from library.models import Book


      def latest_books(author_id: int, count: int) -> Select[tuple[Book]]:
          return (
              select(Book)
              .where(Book.author_id == author_id)
              .order_by(Book.published_on.desc())
              .limit(count)
          )
  expected_output:
    outcome: valid
