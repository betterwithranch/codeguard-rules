- name: reserving stock assigns the reserved count of the bin held by the pick's shelf
  inputs:
    file: warehouse/reserve.ts
    unchanged:
      warehouse/models.ts: |
        export class Bin {
          reservedUnits = 0;

          constructor(readonly stockUnits: number) {}

          availableUnits(): number {
            return this.stockUnits - this.reservedUnits;
          }
        }

        export class Shelf {
          constructor(readonly label: string, readonly bin: Bin) {}
        }

        export class Pick {
          constructor(readonly quantity: number, readonly shelf: Shelf) {}
        }
    after: |
      import type { Pick } from "./models";

      export function reserveStock(pick: Pick): void {
        pick.shelf.bin.reservedUnits += pick.quantity;
      }
  expected_output:
    outcome: invalid
