- name: a dispatch service calls a method on the shipment its repository returns
  inputs:
    file: shipping/dispatch.py
    unchanged:
      shipping/shipments.py: |
        class Shipment:
            def __init__(self, shipment_id: int) -> None:
                self.shipment_id = shipment_id
                self.dispatched = False

            def dispatch(self) -> None:
                self.dispatched = True


        class ShipmentRepository:
            def __init__(self) -> None:
                self._by_id: dict[int, Shipment] = {}

            def get(self, shipment_id: int) -> Shipment:
                return self._by_id[shipment_id]
    after: |
      from shipping.shipments import ShipmentRepository


      class DispatchService:
          def __init__(self, shipments: ShipmentRepository) -> None:
              self._shipments = shipments

          def dispatch(self, shipment_id: int) -> None:
              self._shipments.get(shipment_id).dispatch()
  expected_output:
    outcome: valid
- name: a usage report reads the hour of each meter reading's timestamp
  inputs:
    file: energy/usage.py
