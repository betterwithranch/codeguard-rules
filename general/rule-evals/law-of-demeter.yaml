cases:
- name: a venue label reads the name of the venue held by the booking's event
  inputs:
    file: events/labels.py
    unchanged:
      events/models.py: |
        class Venue:
            def __init__(self, name: str, capacity: int) -> None:
                self.name = name
                self.capacity = capacity

            def fits(self, party_size: int) -> bool:
                return party_size <= self.capacity


        class Event:
            def __init__(self, title: str, venue: Venue) -> None:
                self.title = title
                self.venue = venue


        class Booking:
            def __init__(self, event: Event, seats: int) -> None:
                self.event = event
                self.seats = seats
    after: |
      from events.models import Booking


      def venue_label(booking: Booking) -> str:
          return f"{booking.event.title} at {booking.event.venue.name}"
  expected_output:
    outcome: invalid
- name: a discount reaches through the cart's owner to their loyalty tier's rate
  inputs:
    file: pricing/discounts.py
    unchanged:
      pricing/models.py: |
        from decimal import Decimal


        class LoyaltyTier:
            def __init__(self, name: str, rate: Decimal) -> None:
                self.name = name
                self.rate = rate

            def discount_for(self, subtotal_cents: int) -> int:
                return int(subtotal_cents * self.rate)


        class Member:
            def __init__(self, email: str, tier: LoyaltyTier) -> None:
                self.email = email
                self.tier = tier


        class Cart:
            def __init__(self, owner: Member, subtotal_cents: int) -> None:
                self.owner = owner
                self.subtotal_cents = subtotal_cents
    after: |
      from pricing.models import Cart


      def discounted_total(cart: Cart) -> int:
          discount = cart.owner.tier.discount_for(cart.subtotal_cents)
          return cart.subtotal_cents - discount
  expected_output:
    outcome: invalid
- name: recording attendance assigns a field of the stadium held by the fixture's home club
  inputs:
    file: league/attendance.py
    unchanged:
      league/models.py: |
        class Stadium:
            def __init__(self, name: str, seats: int) -> None:
                self.name = name
                self.seats = seats
                self.last_attendance = 0

            def was_full(self) -> bool:
                return self.last_attendance >= self.seats


        class Club:
            def __init__(self, name: str, stadium: Stadium) -> None:
                self.name = name
                self.stadium = stadium


        class Fixture:
            def __init__(self, home_club: Club, away_club: Club) -> None:
                self.home_club = home_club
                self.away_club = away_club
    after: |
      from league.models import Fixture


      def record_attendance(fixture: Fixture, spectators: int) -> None:
          fixture.home_club.stadium.last_attendance = spectators
  expected_output:
    outcome: invalid
- name: a rota reaches from its own ward through the supervisor to send on their pager
  inputs:
    file: hospital/rota.py
    unchanged:
      hospital/models.py: |
        class Pager:
            def __init__(self, number: str) -> None:
                self.number = number
                self.messages: list[str] = []

            def send(self, message: str) -> None:
                self.messages.append(message)


        class Nurse:
            def __init__(self, name: str, pager: Pager) -> None:
                self.name = name
                self.pager = pager


        class Ward:
            def __init__(self, name: str, supervisor: Nurse) -> None:
                self.name = name
                self.supervisor = supervisor
    after: |
      from hospital.models import Ward


      class Rota:
          def __init__(self, ward: Ward) -> None:
              self._ward = ward

          def page_supervisor(self, message: str) -> None:
              self._ward.supervisor.pager.send(message)
  expected_output:
    outcome: invalid
- name: billing follows Django foreign keys from the appointment through the patient to the insurer's method
  inputs:
    file: clinic/billing.py
    unchanged: &clinic_models
      clinic/models.py: |
        from django.db import models


        class Insurer(models.Model):
            name = models.CharField(max_length=100)

            def submit_claim(self, amount_cents: int) -> None:
                Claim.objects.create(insurer=self, amount_cents=amount_cents)


        class Claim(models.Model):
            insurer = models.ForeignKey(Insurer, on_delete=models.CASCADE)
            amount_cents = models.IntegerField()


        class Patient(models.Model):
            name = models.CharField(max_length=100)
            phone_number = models.CharField(max_length=20)
            insurer = models.ForeignKey(Insurer, on_delete=models.PROTECT)


        class Appointment(models.Model):
            patient = models.ForeignKey(Patient, on_delete=models.CASCADE)
            starts_at = models.DateTimeField()
            fee_cents = models.IntegerField()
    after: |
      from clinic.models import Appointment


      def bill_insurer(appointment: Appointment) -> None:
          appointment.patient.insurer.submit_claim(appointment.fee_cents)
  expected_output:
    outcome: invalid
