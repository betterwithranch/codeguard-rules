- name: a doc comment narrates the filter and map its body does
  inputs:
    file: recipes/allergens.ts
    after: |
      import type { Ingredient } from "./ingredient";

      /**
       * Filters the ingredients down to the ones marked as allergens, then maps each one
       * to its name.
       */
      export function allergenNames(ingredients: Ingredient[]): string[] {
        return ingredients
          .filter((ingredient) => ingredient.isAllergen)
          .map((ingredient) => ingredient.name);
      }
  expected_output:
    outcome: invalid
- name: a doc comment only lists the parameters by name
  inputs:
    file: rentals/bikes.ts
    after: |
      import type { BikeFleet } from "./fleet";
      import type { Rental } from "./rental";

      export class BikeRentals {
        constructor(private readonly fleet: BikeFleet) {}

        /**
         * @param bikeId the bike id
         * @param riderId the rider id
         * @param hours the hours
         */
        rent(bikeId: string, riderId: string, hours: number): Promise<Rental> {
          return this.fleet.checkOut(bikeId, riderId, hours);
        }
      }
  expected_output:
    outcome: invalid
- name: a comment rewords the rounding and gives the ordinance behind it
  inputs:
    file: parking/billing.ts
    after: |
      export function billableMinutes(parkedMs: number): number {
        // Round down to whole minutes: the city's parking ordinance doesn't charge
        // for a partly used minute.
        return Math.floor(parkedMs / 60_000);
      }
  expected_output:
    outcome: valid
