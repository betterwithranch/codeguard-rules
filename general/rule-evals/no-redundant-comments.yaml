- name: a docstring rewords the function's name
  inputs:
    file: calendar_tools/years.py
    after: |
      def is_leap_year(year: int) -> bool:
          """Check whether the year is a leap year."""
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
  expected_output:
