- name: an edit replaces the rounding reason with a restatement of the rounding
  inputs:
    file: hotel/rates.py
    before: |
      from decimal import ROUND_HALF_UP, Decimal


      def channel_rate(nightly_rate: Decimal) -> Decimal:
          # The channel manager rejects rates finer than whole cents.
          return nightly_rate.quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)
    after: |
      from decimal import ROUND_HALF_UP, Decimal


      def channel_rate(nightly_rate: Decimal) -> Decimal:
          # round the rate to two decimal places, half up
          return nightly_rate.quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)
  expected_output:
    outcome: invalid
- name: heading comments narrate each step of listing free seats
  inputs:
    file: venue/seats.ts
    after: |
      import type { Seat } from "./seat";

      export function freeSeatLabels(seats: Seat[]): string[] {
        // take the seats nobody holds
        const free = seats.filter((seat) => seat.holder === null);
        // turn each seat into its row and number
        const labels = free.map((seat) => `${seat.row}${seat.number}`);
        // return the labels
        return labels;
      }
  expected_output:
    outcome: invalid
