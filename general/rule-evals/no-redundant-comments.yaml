- name: a docstring narrates the conversion its body does
  inputs:
    file: weather/readings.py
    after: |
      from weather.models import Reading


      def celsius_values(readings: list[Reading]) -> list[float]:
          """Go through the readings, subtract 32 from each fahrenheit value, multiply it
          by 5/9 and collect the results in a list.
          """
          return [(reading.fahrenheit - 32) * 5 / 9 for reading in readings]
  expected_output:
    outcome: invalid
- name: a docstring only lists the parameters by name
  inputs:
    file: clinic/visits.py
    after: |
      from datetime import datetime

      from clinic.calendar import VetCalendar
      from clinic.models import Visit


      class VisitBooker:
          def __init__(self, calendar: VetCalendar) -> None:
              self._calendar = calendar

          def book(self, pet_id: str, vet_id: str, starts_at: datetime) -> Visit:
              """
              Args:
                  pet_id: the pet id.
                  vet_id: the vet id.
                  starts_at: the start.
              """
              return self._calendar.reserve(vet_id, pet_id, starts_at)
  expected_output:
    outcome: invalid
- name: a comment rewords the command and gives the turnstile's quirk
  inputs:
    file: gates/turnstile.py
    after: |
      from gates.link import TurnstileLink


      def unlock(link: TurnstileLink) -> None:
          # Send the unlock command twice: the turnstile controller drops the first
          # command it receives after waking from standby.
          link.send("UNLOCK")
          link.send("UNLOCK")
  expected_output:
    outcome: valid
- name: a comment gives the legal reason receipts are kept seven years
  inputs:
    file: bookkeeping/retention.py
    after: |
      # The tax office can audit receipts for seven years after the tax year.
      RECEIPT_RETENTION_YEARS = 7


      def may_discard(receipt_tax_year: int, current_year: int) -> bool:
          return current_year - receipt_tax_year > RECEIPT_RETENTION_YEARS
  expected_output:
    outcome: valid
- name: a docstring gives the unit, range, side effect and code format the signature can't
  inputs:
    file: courts/booking.py
    after: |
      from courts.locks import DoorLocks


      class CourtBooking:
          def __init__(self, locks: DoorLocks) -> None:
              self._locks = locks

          def reserve(self, court: int, start_minute: int) -> str:
              """Reserve a court for one hour.

              start_minute counts minutes after midnight in the club's time zone, from 0
              to 1380. Programs the court's door lock to open for that hour, and returns
              its entry code as six zero-padded digits, such as "004211".
              """
              return self._locks.program(court, start_minute)
  expected_output:
    outcome: valid
