cases:
- name: heading comments narrate each step of scoring a quiz
  inputs:
    file: quiz/scoring.py
    after: |
      from quiz.models import Answer


      def quiz_score(answers: list[Answer]) -> int:
          # keep only the correct answers
          correct = [answer for answer in answers if answer.is_correct]
          # take the points of each correct answer
          points = [answer.points for answer in correct]
          # add up the points and return them
          return sum(points)
  expected_output:
    outcome: invalid
