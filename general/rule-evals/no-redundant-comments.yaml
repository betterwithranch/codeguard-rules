- name: a doc comment gives the unit, range, side effect and slot format the signature can't
  inputs:
    file: heating/thermostat.ts
    after: |
      import type { ThermostatLink } from "./link";

      /**
       * Sets the target in tenths of a degree Celsius, from 50 (5.0 °C) to 300 (30.0 °C).
       * Starts the boiler at once when the room is below the new target. Resolves to the
       * schedule slot the target applies to, as "HH:MM-HH:MM" in the home's local time.
       */
      export function setTarget(link: ThermostatLink, tenthsCelsius: number): Promise<string> {
        return link.writeTarget(tenthsCelsius);
      }
  expected_output:
    outcome: valid
