cases:
- name: an assertion re-tests that the customer was found after a check already raised
  inputs:
    file: billing/invoices.py
    after: |
      from billing.errors import NotFound
      from billing.repository import customers, invoices


      def open_invoice(customer_id: str, total_cents: int) -> str:
          customer = customers.get(customer_id)
          if customer is None:
              raise NotFound(f"no customer {customer_id}")
          assert customer is not None
          return invoices.create(customer.id, total_cents)
  expected_output:
    outcome: invalid
- name: a service re-checks a positive amount the model's field constraint already guarantees
  inputs:
    file: payments/refunds.py
    after: |
      from decimal import Decimal

      from pydantic import BaseModel, Field

      from payments.gateway import gateway


      class RefundRequest(BaseModel):
          payment_id: str
          amount: Decimal = Field(gt=0)


      def refund(request: RefundRequest) -> str:
          if request.amount <= 0:
              raise ValueError("refund amount must be positive")
          return gateway.refund(request.payment_id, request.amount)
  expected_output:
    outcome: invalid
- name: a branch re-tests the status its enclosing branch already decided
  inputs:
    file: shipping/dispatch.py
    after: |
      from shipping.models import Order
      from shipping.carriers import book_pickup


      def dispatch(order: Order) -> None:
          if order.status == "paid":
              if order.status != "paid":
                  return
              book_pickup(order.id, order.address)
              order.status = "dispatched"
  expected_output:
    outcome: invalid
- name: a function raises when a lookup misses
  inputs:
    file: accounts/service.py
    after: |
      from accounts.errors import NotFound
      from accounts.repository import users


      def deactivate(user_id: str) -> None:
          user = users.get(user_id)
          if user is None:
              raise NotFound(f"no user {user_id}")
          user.active = False
          users.save(user)
  expected_output:
    outcome: valid
- name: a function checks an optional field before using it
  inputs:
    file: shipping/labels.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Address:
          line1: str
          city: str
          postcode: str | None = None


      def label(address: Address) -> str:
          if address.postcode is None:
              raise ValueError("a label needs a postcode")
          return f"{address.line1}\n{address.city} {address.postcode}"
  expected_output:
    outcome: valid
- name: a function checks a parameter's type that only its annotation states
  inputs:
    file: reports/paging.py
    after: |
      def page_count(total: int, per_page: int) -> int:
          if not isinstance(per_page, int):
              raise TypeError("per_page must be an int")
          return -(-total // per_page)
  expected_output:
    outcome: valid
- name: a service checks the amount against a limit the field constraint doesn't cover
  inputs:
    file: payments/refunds.py
    after: |
      from decimal import Decimal

      from pydantic import BaseModel, Field

      from payments.gateway import gateway

      MAX_REFUND = Decimal("500")


      class RefundRequest(BaseModel):
          payment_id: str
          amount: Decimal = Field(gt=0)


      def refund(request: RefundRequest) -> str:
          if request.amount > MAX_REFUND:
              raise ValueError("refunds over the limit need approval")
          return gateway.refund(request.payment_id, request.amount)
  expected_output:
    outcome: valid
- name: a function totals line prices
  inputs:
    file: billing/totals.py
    after: |
      from decimal import Decimal


      def total(prices: list[Decimal]) -> Decimal:
          return sum(prices, Decimal(0))
  expected_output:
    outcome: skipped
- name: a handler re-checks a positive amount the zod schema already guarantees
  inputs:
    file: payments/refund.ts
    after: |
      import { z } from "zod";
      import { gateway } from "./gateway";

      const refundSchema = z.object({
        paymentId: z.string(),
        amount: z.number().positive(),
      });

      export async function refund(body: unknown): Promise<string> {
        const request = refundSchema.parse(body);
        if (request.amount <= 0) {
          throw new Error("refund amount must be positive");
        }
        return gateway.refund(request.paymentId, request.amount);
      }
  expected_output:
    outcome: invalid
- name: a handler throws when a map lookup misses
  inputs:
    file: accounts/deactivate.ts
    after: |
      import { users } from "./repository";

      export function deactivate(userId: string): void {
        const user = users.get(userId);
        if (!user) {
          throw new Error(`no user ${userId}`);
        }
        users.save({ ...user, active: false });
      }
  expected_output:
    outcome: valid
