- name: a wallet service sets a missing currency to euros before building the wallet, so other code building a wallet picks its own currency
  inputs:
    file: wallets/service.py
    unchanged:
      wallets/__init__.py: ""
      wallets/models.py: |
        from dataclasses import dataclass
        from enum import Enum


        class Currency(Enum):
            EUR = "EUR"
            GBP = "GBP"
            USD = "USD"


        @dataclass(frozen=True)
        class Wallet:
            owner_id: int
            currency: Currency
      wallets/ports.py: |
        from typing import Protocol

        from wallets.models import Wallet


        class WalletStore(Protocol):
            def add(self, wallet: Wallet) -> None: ...
    after: |
      from wallets.models import Currency, Wallet
      from wallets.ports import WalletStore


      class WalletService:
          def __init__(self, wallets: WalletStore) -> None:
              self.wallets = wallets

          def open_wallet(self, owner_id: int, currency: Currency | None) -> Wallet:
              if currency is None:
                  currency = Currency.EUR
              wallet = Wallet(owner_id=owner_id, currency=currency)
              self.wallets.add(wallet)
              return wallet
  expected_output:
    outcome: invalid
