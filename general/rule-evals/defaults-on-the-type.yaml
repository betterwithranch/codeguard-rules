      helpdesk/models.py: |
        from dataclasses import dataclass
        from enum import Enum


        class Visibility(Enum):
            PRIVATE = "private"
            TEAM = "team"
            CUSTOMER = "customer"


        @dataclass(frozen=True)
        class Note:
            ticket_id: int
            text: str
            visibility: Visibility
      helpdesk/ports.py: |
        from typing import Protocol

        from helpdesk.models import Note


        class NoteStore(Protocol):
            def add(self, note: Note) -> None: ...
    after: |
      from helpdesk.models import Note, Visibility
      from helpdesk.ports import NoteStore


      def add_note(store: NoteStore, ticket_id: int, text: str, visibility: Visibility | None) -> Note:
          note = Note(ticket_id=ticket_id, text=text, visibility=visibility or Visibility.TEAM)
