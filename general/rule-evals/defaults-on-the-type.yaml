- name: a dispatch service builds the delivery from the order and courier with no default, leaving the delivery's defaults to the delivery
  inputs:
    file: dispatch/service.py
    unchanged:
      dispatch/__init__.py: ""
      dispatch/models.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            id: int
            zone: str
            address: str


        @dataclass(frozen=True)
        class Courier:
            id: int
            name: str


        @dataclass(frozen=True)
        class Delivery:
            order_id: int
            courier_id: int
            address: str


        class NoCourierFree(Exception):
            pass
      dispatch/ports.py: |
        from typing import Protocol

        from dispatch.models import Courier, Delivery


        class CourierPool(Protocol):
            def free_courier(self, zone: str) -> Courier | None: ...


        class DeliveryStore(Protocol):
            def add(self, delivery: Delivery) -> None: ...
    after: |
      from dispatch.models import Delivery, NoCourierFree, Order
      from dispatch.ports import CourierPool, DeliveryStore


      class DispatchService:
          def __init__(self, couriers: CourierPool, deliveries: DeliveryStore) -> None:
              self.couriers = couriers
              self.deliveries = deliveries

          def dispatch(self, order: Order) -> Delivery:
              courier = self.couriers.free_courier(order.zone)
              if courier is None:
                  raise NoCourierFree(order.zone)
              delivery = Delivery(order_id=order.id, courier_id=courier.id, address=order.address)
              self.deliveries.add(delivery)
              return delivery
  expected_output:
    outcome: valid
