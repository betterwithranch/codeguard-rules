- name: a dispatch service constructs the delivery from the order and courier it found with no default, leaving the delivery's defaults to the delivery
  inputs:
    file: dispatch/service.ts
    unchanged:
      dispatch/models.ts: |
        export interface Order {
          id: string;
          zone: string;
          address: string;
        }

        export interface Courier {
          id: string;
        }

        export class Delivery {
          constructor(
            readonly orderId: string,
            readonly courierId: string,
            readonly address: string,
          ) {}
        }

        export class NoCourierFree extends Error {}
      dispatch/ports.ts: |
        import type { Courier, Delivery } from "./models";

        export interface CourierPool {
          freeCourier(zone: string): Promise<Courier | undefined>;
        }

        export interface DeliveryStore {
          add(delivery: Delivery): Promise<void>;
        }
    after: |
      import { Delivery, NoCourierFree, type Order } from "./models";
      import type { CourierPool, DeliveryStore } from "./ports";

      export class DispatchService {
        constructor(private readonly couriers: CourierPool, private readonly deliveries: DeliveryStore) {}

        async dispatch(order: Order): Promise<Delivery> {
          const courier = await this.couriers.freeCourier(order.zone);
          if (courier === undefined) {
            throw new NoCourierFree(order.zone);
          }
          const delivery = new Delivery(order.id, courier.id, order.address);
          await this.deliveries.add(delivery);
          return delivery;
        }
      }
  expected_output:
    outcome: valid
