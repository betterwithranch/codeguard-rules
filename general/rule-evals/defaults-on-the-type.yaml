cases:
- name: a backup scheduler gives retention a parameter default and passes it to the job, so other code building a job picks its own retention
  inputs:
    file: backups/scheduler.py
    unchanged:
      backups/__init__.py: ""
      backups/models.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class BackupJob:
            volume_id: str
            retention_days: int
      backups/ports.py: |
        from typing import Protocol

        from backups.models import BackupJob


        class JobQueue(Protocol):
            def push(self, job: BackupJob) -> None: ...
    after: |
      from backups.models import BackupJob
      from backups.ports import JobQueue


      class BackupScheduler:
          def __init__(self, queue: JobQueue) -> None:
              self.queue = queue

          def schedule(self, volume_id: str, retention_days: int = 30) -> BackupJob:
              job = BackupJob(volume_id=volume_id, retention_days=retention_days)
              self.queue.push(job)
              return job
  expected_output:
    outcome: invalid
- name: the reminder class gives its repeat field a default in its own constructor, so every reminder built without one repeats the same way
  inputs:
    file: reminders/reminder.py
    unchanged:
      reminders/__init__.py: ""
    before: |
      from datetime import datetime
      from enum import Enum


      class Repeat(Enum):
          NEVER = "never"
          DAILY = "daily"
          WEEKLY = "weekly"


      class Reminder:
          def __init__(self, text: str, due_at: datetime, repeat: Repeat) -> None:
              self.text = text
              self.due_at = due_at
              self.repeat = repeat
    after: |
      from datetime import datetime
      from enum import Enum


      class Repeat(Enum):
          NEVER = "never"
          DAILY = "daily"
          WEEKLY = "weekly"


      class Reminder:
          def __init__(self, text: str, due_at: datetime, repeat: Repeat = Repeat.NEVER) -> None:
              self.text = text
              self.due_at = due_at
              self.repeat = repeat
  expected_output:
    outcome: valid
- name: a note function falls back to team visibility in the argument, so other code building a note picks its own visibility
