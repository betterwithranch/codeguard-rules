- name: a session factory fills the token and start time from its injected collaborators, which are not defaults
  inputs:
    file: auth/session_factory.py
    unchanged:
      auth/__init__.py: ""
      auth/models.py: |
        from dataclasses import dataclass
        from datetime import datetime


        @dataclass(frozen=True)
        class Session:
            user_id: int
            token: str
            started_at: datetime
      auth/ports.py: |
        from datetime import datetime
        from typing import Protocol


        class Clock(Protocol):
            def now(self) -> datetime: ...


        class TokenSource(Protocol):
            def new_token(self) -> str: ...
    after: |
      from auth.models import Session
      from auth.ports import Clock, TokenSource


      class SessionFactory:
          def __init__(self, clock: Clock, tokens: TokenSource) -> None:
              self.clock = clock
              self.tokens = tokens

          def start(self, user_id: int) -> Session:
              return Session(user_id=user_id, token=self.tokens.new_token(), started_at=self.clock.now())
  expected_output:
    outcome: valid
