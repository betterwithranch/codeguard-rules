- name: renaming expire stale sessions to do stuff hides what the function does
  inputs:
    file: auth/sessions.ts
    unchanged:
      auth/session-store.ts: |
        export interface SessionStore {
          deleteIdleSince(cutoff: Date): Promise<void>;
        }
    before: |
      import type { SessionStore } from "./session-store";

      const IDLE_LIMIT_MS = 30 * 60 * 1000;

      export async function expireStaleSessions(sessions: SessionStore, now: Date): Promise<void> {
        await sessions.deleteIdleSince(new Date(now.getTime() - IDLE_LIMIT_MS));
      }
    after: |
      import type { SessionStore } from "./session-store";

      const IDLE_LIMIT_MS = 30 * 60 * 1000;

      export async function doStuff(sessions: SessionStore, now: Date): Promise<void> {
        await sessions.deleteIdleSince(new Date(now.getTime() - IDLE_LIMIT_MS));
      }
  expected_output:
    outcome: invalid
