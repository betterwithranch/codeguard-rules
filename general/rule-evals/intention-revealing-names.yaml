- name: renaming close inactive accounts to process info hides what the function does
  inputs:
    file: accounts/inactive.py
    unchanged:
      accounts/models.py: |
        from dataclasses import dataclass
        from datetime import date


        @dataclass
        class Account:
            account_id: str
            last_login: date
            closed: bool

            def close(self) -> None:
                self.closed = True
    before: |
      from collections.abc import Sequence
      from datetime import date, timedelta

      from accounts.models import Account


      def close_inactive_accounts(accounts: Sequence[Account], today: date) -> None:
          for account in accounts:
              if today - account.last_login > timedelta(days=730):
                  account.close()
    after: |
      from collections.abc import Sequence
      from datetime import date, timedelta

      from accounts.models import Account


      def process_info(accounts: Sequence[Account], today: date) -> None:
          for account in accounts:
              if today - account.last_login > timedelta(days=730):
                  account.close()
  expected_output:
    outcome: invalid
