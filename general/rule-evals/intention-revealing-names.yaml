cases:
- name: a function named only process items sends overdue reminders, so callers can't tell what it does
  inputs:
    file: library/reminders.py
    unchanged:
      library/loans.py: |
        from dataclasses import dataclass
        from datetime import date


        @dataclass(frozen=True)
        class Loan:
            member_email: str
            book_title: str
            due: date

            def is_overdue(self, today: date) -> bool:
                return today > self.due
      library/mailer.py: |
        from typing import Protocol


        class ReminderMailer(Protocol):
            def send_overdue_reminder(self, member_email: str, book_title: str) -> None: ...
    after: |
      from collections.abc import Sequence
      from datetime import date

      from library.loans import Loan
      from library.mailer import ReminderMailer


      def process_items(mailer: ReminderMailer, loans: Sequence[Loan], today: date) -> None:
          for loan in loans:
              if loan.is_overdue(today):
                  mailer.send_overdue_reminder(loan.member_email, loan.book_title)
  expected_output:
    outcome: invalid
