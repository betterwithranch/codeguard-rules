- name: a one-word method name shuffle names the main action of reordering a playlist
  inputs:
    file: music/playlist.ts
    after: |
      export class Playlist {
        constructor(private readonly tracks: string[]) {}

        shuffle(random: () => number): void {
          for (let i = this.tracks.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [this.tracks[i], this.tracks[j]] = [this.tracks[j], this.tracks[i]];
          }
        }
      }
  expected_output:
    outcome: valid
- name: a class named only helper formats durations and distances, so readers must open it
  inputs:
    file: workouts/format.ts
    after: |
      export class Helper {
        formatDuration(totalSeconds: number): string {
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          return `${minutes}:${String(seconds).padStart(2, "0")}`;
        }

        formatDistance(meters: number): string {
          return `${(meters / 1000).toFixed(2)} km`;
        }
      }
  expected_output:
    outcome: invalid
- name: NestJS CQRS chooses execute on a command handler
  inputs:
    file: projects/archive-project.handler.ts
    unchanged:
      projects/archive-project.command.ts: |
        export class ArchiveProjectCommand {
          constructor(readonly projectId: string) {}
        }
      projects/project.repository.ts: |
        export abstract class ProjectRepository {
          abstract markArchived(projectId: string): Promise<void>;
        }
    after: |
      import { CommandHandler, ICommandHandler } from "@nestjs/cqrs";

      import { ArchiveProjectCommand } from "./archive-project.command";
      import { ProjectRepository } from "./project.repository";

      @CommandHandler(ArchiveProjectCommand)
      export class ArchiveProjectHandler implements ICommandHandler<ArchiveProjectCommand> {
        constructor(private readonly projects: ProjectRepository) {}

        async execute(command: ArchiveProjectCommand): Promise<void> {
          await this.projects.markArchived(command.projectId);
        }
      }
  expected_output:
    outcome: valid
