- name: a function named only process items emails unaccepted invites, so callers can't tell what it does
  inputs:
    file: events/invites.ts
    unchanged:
      events/invite.ts: |
        export interface Invite {
          readonly email: string;
          readonly accepted: boolean;
        }
      events/mailer.ts: |
        export interface InviteMailer {
          sendReminder(email: string): Promise<void>;
        }
    after: |
      import type { Invite } from "./invite";
      import type { InviteMailer } from "./mailer";

      export async function processItems(mailer: InviteMailer, invites: readonly Invite[]): Promise<void> {
        for (const invite of invites) {
          if (!invite.accepted) {
            await mailer.sendReminder(invite.email);
          }
        }
      }
  expected_output:
    outcome: invalid
