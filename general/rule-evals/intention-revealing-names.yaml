- name: a one-word method name renew names the main action of extending a membership
  inputs:
    file: gym/membership.py
    after: |
      from dataclasses import dataclass
      from datetime import date, timedelta


      @dataclass
      class Membership:
          member_id: str
          expires: date
          renewals: int

          def renew(self, today: date) -> None:
              self.expires = today + timedelta(days=365)
              self.renewals += 1
  expected_output:
    outcome: valid
- name: a class named only item manager holds and releases flight seats, so readers must open it
  inputs:
    file: flights/seats.py
    after: |
      class SeatsFullError(Exception):
          pass


      class ItemManager:
          def __init__(self, capacity: int) -> None:
              self._capacity = capacity
              self._held: set[str] = set()

          def hold(self, seat: str) -> None:
              if len(self._held) >= self._capacity:
                  raise SeatsFullError(seat)
              self._held.add(seat)

          def release(self, seat: str) -> None:
              self._held.remove(seat)
  expected_output:
    outcome: invalid
- name: the standard library chooses handle on a socket server's request handler
  inputs:
