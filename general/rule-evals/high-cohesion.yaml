- name: editing a line inside a postcode format class that sits beside the label printer
  inputs:
    file: shipping/labels.py
    before: |
      import re


      class PostcodeFormat:
          def __init__(self) -> None:
              self._pattern = re.compile(r"[A-Z]{1,2}\d[A-Z\d]? \d[A-Z]{2}")

          def matches(self, postcode: str) -> bool:
              return self._pattern.fullmatch(postcode) is not None


      class LabelPrinter:
          def __init__(self, postcode_format: PostcodeFormat) -> None:
              self._postcode_format = postcode_format

          def label(self, name: str, street: str, postcode: str) -> str:
              if not self._postcode_format.matches(postcode):
                  raise ValueError(f"not a postcode: {postcode}")
              return f"{name}\n{street}\n{postcode}"
    after: |
      import re


      class PostcodeFormat:
          def __init__(self) -> None:
              self._pattern = re.compile(r"[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}")

          def matches(self, postcode: str) -> bool:
              return self._pattern.fullmatch(postcode) is not None


      class LabelPrinter:
          def __init__(self, postcode_format: PostcodeFormat) -> None:
              self._postcode_format = postcode_format

          def label(self, name: str, street: str, postcode: str) -> str:
              if not self._postcode_format.matches(postcode):
                  raise ValueError(f"not a postcode: {postcode}")
              return f"{name}\n{street}\n{postcode}"
  expected_output:
    outcome: invalid
