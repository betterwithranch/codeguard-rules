- name: editing a line inside a hashtag extractor exported beside the post composer
  inputs:
    file: social/post-composer.ts
    before: |
      export class HashtagExtractor {
        extract(post: string): string[] {
          return [...post.matchAll(/#\w+/g)].map((match) => match[0]);
        }
      }

      export class PostComposer {
        constructor(private readonly hashtags: HashtagExtractor) {}

        topics(post: string): string[] {
          return this.hashtags.extract(post).map((tag) => tag.slice(1).toLowerCase());
        }
      }
    after: |
      export class HashtagExtractor {
        extract(post: string): string[] {
          return [...post.matchAll(/#[\p{L}\d_]+/gu)].map((match) => match[0]);
        }
      }

      export class PostComposer {
        constructor(private readonly hashtags: HashtagExtractor) {}

        topics(post: string): string[] {
          return this.hashtags.extract(post).map((tag) => tag.slice(1).toLowerCase());
        }
      }
  expected_output:
    outcome: invalid
