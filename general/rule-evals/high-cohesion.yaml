- name: a rooms module holds an abstract room and the rooms that subclass it
  inputs:
    file: floorplan/rooms.py
    after: |
      import math
      from abc import ABC, abstractmethod


      class Room(ABC):
          @abstractmethod
          def floor_area(self) -> float: ...


      class RectangularRoom(Room):
          def __init__(self, width: float, length: float) -> None:
              self._width = width
              self._length = length

          def floor_area(self) -> float:
              return self._width * self._length


      class RoundRoom(Room):
          def __init__(self, radius: float) -> None:
              self._radius = radius

          def floor_area(self) -> float:
              return math.pi * self._radius**2
  expected_output:
    outcome: valid
- name: a summarizer module holds the summarizer and the weekly hours it returns
  inputs:
    file: timesheets/summarizer.py
    after: |
      from dataclasses import dataclass
      from datetime import timedelta


      @dataclass(frozen=True)
      class WeeklyHours:
          regular: timedelta
          overtime: timedelta


      class TimesheetSummarizer:
          def __init__(self, regular_limit: timedelta) -> None:
              self._regular_limit = regular_limit

          def summarize(self, shifts: list[timedelta]) -> WeeklyHours:
              worked = sum(shifts, timedelta())
              regular = min(worked, self._regular_limit)
              return WeeklyHours(regular=regular, overtime=worked - regular)
  expected_output:
    outcome: valid
- name: adding the grade book's own score range to a module that already holds an unrelated booking
  inputs:
    file: school/grade_book.py
    before: |
      from dataclasses import dataclass
      from statistics import mean


      class GradeBook:
          def __init__(self, scores: dict[str, list[int]]) -> None:
              self._scores = scores

          def average(self, student: str) -> float:
              return mean(self._scores[student])


      @dataclass(frozen=True)
      class RoomBooking:
          room: str
          period: int
    after: |
      from dataclasses import dataclass
      from statistics import mean


      @dataclass(frozen=True)
      class ScoreRange:
          lowest: int
          highest: int


      class GradeBook:
          def __init__(self, scores: dict[str, list[int]]) -> None:
              self._scores = scores

          def average(self, student: str) -> float:
              return mean(self._scores[student])

          def range_of(self, student: str) -> ScoreRange:
              scores = self._scores[student]
              return ScoreRange(lowest=min(scores), highest=max(scores))


      @dataclass(frozen=True)
      class RoomBooking:
          room: str
          period: int
  expected_output:
    outcome: valid
