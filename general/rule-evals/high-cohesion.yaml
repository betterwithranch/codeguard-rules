- name: a module holds one public class and the private class it uses
  inputs:
    file: caching/router.py
    after: |
      import hashlib


      class _Shard:
          def __init__(self, count: int) -> None:
              self._count = count

          def of(self, key: str) -> int:
              digest = hashlib.sha256(key.encode()).digest()
              return int.from_bytes(digest[:4], "big") % self._count


      class CacheRouter:
          def __init__(self, hosts: tuple[str, ...]) -> None:
              if not hosts:
                  raise ValueError("a cache router needs at least one host")
              self._hosts = hosts
              self._shard = _Shard(len(hosts))

          def host_for(self, key: str) -> str:
              return self._hosts[self._shard.of(key)]
  expected_output:
    outcome: skipped
# TypeScript
- name: a sentence splitter with behavior of its own is exported beside the excerpt builder, its only caller
  inputs:
    file: articles/excerpt.ts
    after: |
      export class SentenceSplitter {
        split(text: string): string[] {
          return text.trim().split(/(?<=[.!?])\s+/);
        }
      }

      export class ExcerptBuilder {
        constructor(
          private readonly splitter: SentenceSplitter,
          private readonly sentenceCount: number,
        ) {}

        excerpt(article: string): string {
          return this.splitter.split(article).slice(0, this.sentenceCount).join(" ");
        }
      }
  expected_output:
    outcome: invalid
- name: an Elo rating with behavior of its own is exported beside the match rater that builds it
  inputs:
    file: chess/match-rater.ts
    after: |
      export class EloRating {
        constructor(private readonly kFactor: number) {}

        adjusted(rating: number, opponent: number, score: number): number {
          const expected = 1 / (1 + 10 ** ((opponent - rating) / 400));
          return rating + this.kFactor * (score - expected);
        }
      }

      export class MatchRater {
        private readonly elo = new EloRating(32);

        ratingAfter(rating: number, opponent: number, won: boolean): number {
          return this.elo.adjusted(rating, opponent, won ? 1 : 0);
        }
      }
  expected_output:
    outcome: invalid
