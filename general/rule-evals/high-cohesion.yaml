- name: a planter module exports an abstract planter and the planters that extend it
  inputs:
    file: garden/planter.ts
    after: |
      export abstract class Planter {
        abstract soilLitres(): number;
      }

      export class BoxPlanter extends Planter {
        constructor(
          private readonly widthCm: number,
          private readonly depthCm: number,
          private readonly heightCm: number,
        ) {
          super();
        }

        soilLitres(): number {
          return (this.widthCm * this.depthCm * this.heightCm) / 1000;
        }
      }

      export class PotPlanter extends Planter {
        constructor(
          private readonly radiusCm: number,
          private readonly heightCm: number,
        ) {
          super();
        }

        soilLitres(): number {
          return (Math.PI * this.radiusCm ** 2 * this.heightCm) / 1000;
        }
      }
  expected_output:
    outcome: valid
