cases:
# Python
- name: a tokenizer with behavior of its own sits beside the indexer, its only caller
  inputs:
    file: search/indexer.py
    after: |
      import re
      from collections.abc import Mapping


      class WordTokenizer:
          def __init__(self, stop_words: frozenset[str]) -> None:
              self._stop_words = stop_words

          def tokens(self, text: str) -> list[str]:
              words = re.findall(r"\w+", text.lower())
              return [word for word in words if word not in self._stop_words]


      class DocumentIndexer:
          def __init__(self, tokenizer: WordTokenizer) -> None:
              self._tokenizer = tokenizer

          def index(self, documents: Mapping[str, str]) -> dict[str, frozenset[str]]:
              postings: dict[str, set[str]] = {}
              for document_id, text in documents.items():
                  for token in self._tokenizer.tokens(text):
                      postings.setdefault(token, set()).add(document_id)
              return {token: frozenset(ids) for token, ids in postings.items()}
  expected_output:
    outcome: invalid
- name: a discount with behavior of its own sits beside the quoter that builds it
  inputs:
    file: pricing/quoter.py
    after: |
      from decimal import Decimal


      class VolumeDiscount:
          def __init__(self, threshold: int, percent: Decimal) -> None:
              self._threshold = threshold
              self._percent = percent

          def applied_to(self, quantity: int, subtotal: Decimal) -> Decimal:
              if quantity < self._threshold:
                  return subtotal
              return subtotal * (100 - self._percent) / 100


      class PriceQuoter:
          def __init__(self, unit_price: Decimal) -> None:
              self._unit_price = unit_price
              self._discount = VolumeDiscount(threshold=100, percent=Decimal(5))

          def quote(self, quantity: int) -> Decimal:
              return self._discount.applied_to(quantity, self._unit_price * quantity)
  expected_output:
    outcome: invalid
