- name: adding the thermostat's own setpoint to a module that already exports an unrelated parking space
  inputs:
    file: heating/thermostat-schedule.ts
    before: |
      export class ThermostatSchedule {
        constructor(
          private readonly comfortCelsius: number,
          private readonly ecoCelsius: number,
        ) {}

        targetAt(hour: number): number {
          return hour >= 7 && hour < 22 ? this.comfortCelsius : this.ecoCelsius;
        }
      }

      export interface ParkingSpace {
        readonly level: number;
        readonly bay: string;
      }
    after: |
      export interface Setpoint {
        readonly hour: number;
        readonly celsius: number;
      }

      export class ThermostatSchedule {
        constructor(
          private readonly comfortCelsius: number,
          private readonly ecoCelsius: number,
        ) {}

        targetAt(hour: number): number {
          return hour >= 7 && hour < 22 ? this.comfortCelsius : this.ecoCelsius;
        }

        day(): Setpoint[] {
          return Array.from({ length: 24 }, (_, hour) => ({ hour, celsius: this.targetAt(hour) }));
        }
      }

      export interface ParkingSpace {
        readonly level: number;
        readonly bay: string;
      }
  expected_output:
    outcome: valid
