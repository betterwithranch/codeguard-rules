- name: an invoice total takes a rate computed from the customer it also takes
  inputs:
    file: billing/invoice.py
    after: |
      def tax_rate(customer):
          return 0 if customer.tax_exempt else customer.region_rate


      def invoice_total(subtotal, rate, customer):
          total = subtotal * (1 + rate)
          if customer.is_member:
              total *= 0.95
          return total


      def bill(customer, subtotal):
          rate = tax_rate(customer)
          return invoice_total(subtotal, rate, customer)
  expected_output:
    outcome: invalid
- name: a summary dataclass is built with a total and the lines it was summed from
  inputs:
    file: reports/summary.py
    after: |
      from dataclasses import dataclass


      def total_of(lines):
          return sum(line.amount for line in lines)


      @dataclass(frozen=True)
      class Summary:
          total: int
          lines: list


      def summarize(lines):
          return Summary(total=total_of(lines), lines=lines)
  expected_output:
    outcome: invalid
- name: a dict lookup takes a default computed from the key
  inputs:
    file: config/timeouts.py
    after: |
      DEFAULTS = {"connect": 5, "read": 30}


      def default_for(name):
          return DEFAULTS.get(name, 10)


      def timeout(settings, name):
          return settings.get(name, default_for(name))
  expected_output:
    outcome: valid
- name: a regex substitution takes a replacement built from the pattern
  inputs:
    file: text/redact.py
    after: |
      import re


      def mask_for(pattern):
          return "*" * len(pattern)


      def redact(text, pattern):
          return re.sub(pattern, mask_for(pattern), text)
  expected_output:
    outcome: valid
- name: a service is built with a repository made from the session it also takes
  inputs:
    file: orders/wiring.py
    after: |
      class OrderRepository:
          def __init__(self, session):
              self._session = session

          def get(self, order_id):
              return self._session.get("orders", order_id)


      class OrderService:
          def __init__(self, repo, session):
              self._repo = repo
              self._session = session

          def cancel(self, order_id):
              order = self._repo.get(order_id)
              order.status = "cancelled"
              self._session.commit()


      def build_service(session):
          return OrderService(repo=OrderRepository(session), session=session)
  expected_output:
    outcome: valid
