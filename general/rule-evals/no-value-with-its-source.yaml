- name: a typescript notify call passes an order's email with the order
  inputs:
    file: orders/ship.ts
    after: |
      export interface Order {
        id: string;
        email: string;
        totalCents: number;
      }

      export function notify(email: string, order: Order): { to: string; body: string } {
        return { to: email, body: `Order ${order.id} shipped` };
      }

      export function ship(order: Order) {
        return notify(order.email, order);
      }
  expected_output:
    outcome: invalid
- name: a typescript map lookup falls back to a default computed from the key
  inputs:
    file: config/limits.ts
    after: |
      const DEFAULTS: Record<string, number> = { upload: 10, download: 50 };

      export function defaultFor(name: string): number {
        return DEFAULTS[name] ?? 5;
      }

      export function limit(limits: Map<string, number>, name: string): number {
        return limits.get(name) ?? defaultFor(name);
      }
  expected_output:
    outcome: valid
