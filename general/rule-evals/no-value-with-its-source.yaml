cases:
- name: a quote call passes the selected lines with the region they were selected by
  inputs:
    file: checkout/quote.py
    after: |
      from decimal import Decimal

      RATES = {"EU": Decimal("0.21"), "US": Decimal("0.07")}


      def select_lines(cart, region):
          return [line for line in cart.lines if region in line.ships_to]


      def quote(lines, region):
          subtotal = sum(line.price for line in lines)
          return subtotal * (1 + RATES[region])


      def checkout_total(cart, region):
          return quote(lines=select_lines(cart, region), region=region)
  expected_output:
    outcome: invalid
