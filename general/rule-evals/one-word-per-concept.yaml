cases:
- name: a JSON order reader interprets text where the CSV reader beside it parses
  inputs:
    file: orders/readers.py
    before: |
      import csv
      import io

      from orders.models import Order


      class CsvOrderReader:
          def parse(self, text: str) -> list[Order]:
              rows = csv.DictReader(io.StringIO(text))
              return [Order(id=row["id"], total_cents=int(row["total"])) for row in rows]
    after: |
      import csv
      import io
      import json

      from orders.models import Order


      class CsvOrderReader:
          def parse(self, text: str) -> list[Order]:
              rows = csv.DictReader(io.StringIO(text))
              return [Order(id=row["id"], total_cents=int(row["total"])) for row in rows]


      class JsonOrderReader:
          def interpret(self, text: str) -> list[Order]:
              items = json.loads(text)
              return [Order(id=item["id"], total_cents=item["total"]) for item in items]
  expected_output:
    outcome: invalid
- name: a receipt composer assembles a document where the imported invoice builder builds one
  inputs:
    file: documents/receipts.py
    unchanged:
      documents/invoices.py: |
        from documents.pdf import Document
        from orders.models import Order


        class InvoiceBuilder:
            def build(self, order: Order) -> Document:
                document = Document(title=f"Invoice {order.id}")
                for line in order.lines:
                    document.add_row(line.description, line.total_cents)
                return document
    after: |
      from documents.invoices import InvoiceBuilder
      from documents.pdf import Document
      from orders.models import Order


      class ReceiptComposer:
          def assemble(self, order: Order) -> Document:
              document = Document(title=f"Receipt {order.id}")
              document.add_row("Paid", order.total_cents)
              return document


      def documents_for(order: Order) -> list[Document]:
          return [InvoiceBuilder().build(order), ReceiptComposer().assemble(order)]
  expected_output:
    outcome: invalid
- name: a JSON order reader parses text like the CSV reader beside it
  inputs:
    file: orders/readers.py
    before: |
      import csv
      import io

      from orders.models import Order


      class CsvOrderReader:
          def parse(self, text: str) -> list[Order]:
              rows = csv.DictReader(io.StringIO(text))
              return [Order(id=row["id"], total_cents=int(row["total"])) for row in rows]
    after: |
      import csv
      import io
      import json

      from orders.models import Order


      class CsvOrderReader:
          def parse(self, text: str) -> list[Order]:
              rows = csv.DictReader(io.StringIO(text))
              return [Order(id=row["id"], total_cents=int(row["total"])) for row in rows]


      class JsonOrderReader:
          def parse(self, text: str) -> list[Order]:
              items = json.loads(text)
              return [Order(id=item["id"], total_cents=item["total"]) for item in items]
  expected_output:
    outcome: valid
- name: an order module adds a render function beside its parse function
  inputs:
    file: orders/text.py
    before: |
      import json

      from orders.models import Order


      def parse_orders(text: str) -> list[Order]:
          return [Order(id=item["id"], total_cents=item["total"]) for item in json.loads(text)]
    after: |
      import json

      from orders.models import Order


      def parse_orders(text: str) -> list[Order]:
          return [Order(id=item["id"], total_cents=item["total"]) for item in json.loads(text)]


      def render_orders(orders: list[Order]) -> str:
          return json.dumps([{"id": order.id, "total": order.total_cents} for order in orders])
  expected_output:
    outcome: valid
- name: a module adds a constant
  inputs:
    file: orders/limits.py
    after: |
      MAX_LINES = 200
  expected_output:
    outcome: skipped
- name: a JSON order reader decodes text where the CSV reader beside it parses
  inputs:
    file: orders/readers.ts
    before: |
      import type { Order } from "./order";

      export class CsvOrderReader {
        parse(text: string): Order[] {
          return text
            .trim()
            .split("\n")
            .slice(1)
            .map((line) => {
              const [id, total] = line.split(",");
              return { id, totalCents: Number(total) };
            });
        }
      }
    after: |
      import type { Order } from "./order";

      export class CsvOrderReader {
        parse(text: string): Order[] {
          return text
            .trim()
            .split("\n")
            .slice(1)
            .map((line) => {
              const [id, total] = line.split(",");
              return { id, totalCents: Number(total) };
            });
        }
      }

      export class JsonOrderReader {
        decode(text: string): Order[] {
          return (JSON.parse(text) as { id: string; total: number }[]).map((item) => ({
            id: item.id,
            totalCents: item.total,
          }));
        }
      }
  expected_output:
    outcome: invalid
- name: an order module adds a renderOrders function beside parseOrders
  inputs:
    file: orders/text.ts
    before: |
      import type { Order } from "./order";

      export function parseOrders(text: string): Order[] {
        return JSON.parse(text) as Order[];
      }
    after: |
      import type { Order } from "./order";

      export function parseOrders(text: string): Order[] {
        return JSON.parse(text) as Order[];
      }

      export function renderOrders(orders: Order[]): string {
        return JSON.stringify(orders);
      }
  expected_output:
    outcome: valid
