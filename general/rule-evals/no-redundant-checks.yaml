- name: a signup checks a minimum age stricter than the model's non-negative constraint
  inputs:
    file: members/signup.py
    after: |
      from pydantic import BaseModel, Field

      from members.errors import TooYoung
      from members.roster import add_member


      class Signup(BaseModel):
