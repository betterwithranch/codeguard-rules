- name: a scheduler rejects a negative delay, which its callers may pass
  inputs:
    file: jobs/retries.py
    after: |
      from datetime import timedelta

      from jobs.queue import enqueue_later


      def schedule_retry(job_id: str, delay: timedelta) -> None:
