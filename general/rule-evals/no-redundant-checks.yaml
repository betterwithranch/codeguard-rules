- name: an earlier check already threw on non-text input, and an assert call re-tests that it is a string
  inputs:
    file: feed/status.ts
    after: |
      import assert from "node:assert";

      import { publish } from "./feed";

      export function postStatus(input: unknown): void {
        if (typeof input !== "string") {
          throw new TypeError("a status is text");
        }
        assert(typeof input === "string");
        publish(input.trim());
      }
  expected_output:
    outcome: invalid
- name: inside the HTTP-error branch, an early return re-tests that the error is an HttpError
  inputs:
    file: http/retry.ts
    after: |
      import { HttpError } from "./errors";

      export function retryable(error: Error): boolean {
        if (error instanceof HttpError) {
          if (!(error instanceof HttpError)) {
            return false;
          }
          return error.status >= 500;
        }
        return false;
      }
  expected_output:
    outcome: invalid
- name: a runner only the kind-keyed table calls re-tests that the job is a resize
  inputs:
    file: images/jobs.ts
    after: |
      import { makeThumbnail, resizeImage } from "./images";

      interface Job {
        kind: "resize" | "thumbnail";
        imageId: string;
      }

      async function runResize(job: Job): Promise<void> {
        if (job.kind !== "resize") {
          throw new Error(`resize got a ${job.kind} job`);
        }
        await resizeImage(job.imageId);
      }

      async function runThumbnail(job: Job): Promise<void> {
        await makeThumbnail(job.imageId);
      }

      const runners: Record<Job["kind"], (job: Job) => Promise<void>> = {
        resize: runResize,
        thumbnail: runThumbnail,
      };

      export async function run(job: Job): Promise<void> {
        await runners[job.kind](job);
      }
  expected_output:
    outcome: invalid
- name: a booking re-checks a guest count the zod schema's min refinement just validated
  inputs:
    file: restaurant/booking.ts
    after: |
      import { z } from "zod";

      import { holdTable } from "./tables";

      const bookingSchema = z.object({
        tableId: z.string(),
        guests: z.number().int().min(1),
      });

      export async function book(body: unknown): Promise<void> {
        const booking = bookingSchema.parse(body);
        if (booking.guests < 1) {
          throw new Error("a booking needs at least one guest");
        }
        await holdTable(booking.tableId, booking.guests);
      }
  expected_output:
    outcome: invalid
- name: a room request re-checks a capacity its class-validator decorators just validated
  inputs:
    file: rooms/create.ts
    after: |
      import { plainToInstance } from "class-transformer";
      import { IsInt, IsString, Min, validateOrReject } from "class-validator";

      import { createRoom } from "./rooms";

      class CreateRoomRequest {
        @IsString()
        name!: string;

        @IsInt()
        @Min(2)
        capacity!: number;
      }

      export async function addRoom(body: object): Promise<void> {
        const request = plainToInstance(CreateRoomRequest, body);
        await validateOrReject(request);
        if (request.capacity < 2) {
          throw new Error("a room seats at least two");
        }
        await createRoom(request.name, request.capacity);
      }
  expected_output:
    outcome: invalid
- name: an invoice re-checks a prefix the function that built its number always adds
  inputs:
    file: billing/invoices.ts
    after: |
      import { saveInvoice } from "./store";

      function invoiceNumber(sequence: number): string {
        return `INV-${String(sequence).padStart(6, "0")}`;
      }

      export async function issueInvoice(sequence: number, totalCents: number): Promise<string> {
        const number = invoiceNumber(sequence);
        if (!number.startsWith("INV-")) {
          throw new Error(`bad invoice number ${number}`);
        }
        await saveInvoice(number, totalCents);
        return number;
      }
  expected_output:
    outcome: invalid
- name: an invariant re-tests a positive quantity the imported zod schema already guarantees
  inputs:
    file: orders/picking.ts
    after: |
      import invariant from "tiny-invariant";

      import { reserveBin } from "./bins";
      import { pickListSchema } from "./schema";

      export async function pick(body: unknown): Promise<void> {
        for (const line of pickListSchema.parse(body)) {
          invariant(line.quantity > 0, `quantity for ${line.sku} must be positive`);
          await reserveBin(line.sku, line.quantity);
        }
      }
    unchanged:
      orders/schema.ts: |
        import { z } from "zod";

        export const pickListSchema = z.array(
          z.object({
            sku: z.string().min(1),
            quantity: z.number().int().positive(),
          }),
        );
  expected_output:
    outcome: invalid
- name: a session lookup throws when the token is unknown, since the lookup may miss
  inputs:
    file: auth/session.ts
    after: |
      import { Unauthorized } from "./errors";
      import { sessions } from "./sessions";

      export function currentUserId(token: string): string {
        const session = sessions.get(token);
        if (session === undefined) {
          throw new Unauthorized();
        }
        return session.userId;
      }
  expected_output:
    outcome: valid
- name: a loop skips contacts without a phone, which the contact type makes optional
  inputs:
    file: alerts/sms.ts
    after: |
      interface Contact {
        name: string;
        phone?: string;
      }

      export function smsNumbers(contacts: Contact[]): string[] {
        const numbers: string[] = [];
        for (const contact of contacts) {
          if (contact.phone === undefined) {
            continue;
          }
          numbers.push(contact.phone);
        }
        return numbers;
      }
  expected_output:
    outcome: valid
- name: a raw query-string limit is checked before it is parsed into a number
  inputs:
    file: api/limit.ts
    after: |
      import { BadRequest } from "./errors";

      export function parseLimit(url: URL): number {
        const raw = url.searchParams.get("limit");
        if (raw === null || !/^[1-9]\d*$/.test(raw)) {
          throw new BadRequest("limit must be a positive whole number");
        }
        return Number(raw);
      }
  expected_output:
    outcome: valid
- name: a backoff rejects an attempt number below one, which its callers may pass
  inputs:
    file: http/backoff.ts
    after: |
      export function retryDelayMs(attempt: number): number {
        if (!Number.isInteger(attempt) || attempt < 1) {
          throw new RangeError("attempt counts from 1");
        }
        return 2 ** attempt * 100;
      }
  expected_output:
    outcome: valid
- name: a typeof check tests a parameter's type that only its annotation states
  inputs:
    file: money/cents.ts
    after: |
      export function toCents(amount: number): number {
        if (typeof amount !== "number") {
          throw new TypeError("amount must be a number");
        }
        return Math.round(amount * 100);
      }
  expected_output:
    outcome: valid
- name: an application checks a minimum experience stricter than the schema's non-negative refinement
  inputs:
    file: hiring/apply.ts
    after: |
      import { z } from "zod";

      import { NotEligible } from "./errors";
      import { saveApplication } from "./store";

      const applicationSchema = z.object({
        email: z.string().email(),
        yearsExperience: z.number().int().min(0),
      });

      export async function apply(body: unknown): Promise<void> {
        const application = applicationSchema.parse(body);
        if (application.yearsExperience < 3) {
          throw new NotEligible(application.email);
        }
        await saveApplication(application.email, application.yearsExperience);
      }
  expected_output:
    outcome: valid
