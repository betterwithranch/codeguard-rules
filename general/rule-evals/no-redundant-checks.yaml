cases:
- name: an earlier check already raised on a booth, and an assertion re-tests that the place is a seat
  inputs:
    file: theatre/booking.py
    after: |
      from theatre.errors import NotBookable
      from theatre.seating import Booth, Seat
      from theatre.tickets import Ticket, issue_ticket


      def book(place: Seat | Booth, patron_id: str) -> Ticket:
          if not isinstance(place, Seat):
              raise NotBookable("booths are sold by the box office")
          hold = place.hold(patron_id)
          assert isinstance(place, Seat)
          return issue_ticket(hold)
  expected_output:
    outcome: invalid
- name: inside the overdue branch, a skip re-tests that the loan is overdue
  inputs:
    file: library/reminders.py
    after: |
      from datetime import date

      from library.loans import Loan
      from library.mail import send_reminder


      def remind_overdue(loans: list[Loan], today: date) -> None:
          for loan in loans:
              if loan.due_on < today:
                  if loan.due_on >= today:
                      continue
                  send_reminder(loan.member_email, loan.title)
  expected_output:
    outcome: invalid
- name: a handler only the fuel-keyed table calls re-tests that the vehicle is electric
  inputs:
    file: fleet/servicing.py
    after: |
      from collections.abc import Callable
      from dataclasses import dataclass
      from enum import Enum

      from fleet.errors import WrongVehicle
      from fleet.garage import book_charging, book_inspection


      class Fuel(Enum):
          DIESEL = "diesel"
          ELECTRIC = "electric"


      @dataclass(frozen=True)
      class Vehicle:
          plate: str
          fuel: Fuel


      def _service_diesel(vehicle: Vehicle) -> None:
          book_inspection(vehicle.plate)


      def _service_electric(vehicle: Vehicle) -> None:
          if vehicle.fuel is not Fuel.ELECTRIC:
              raise WrongVehicle(vehicle.plate)
          book_charging(vehicle.plate)


      _SERVICES: dict[Fuel, Callable[[Vehicle], None]] = {
          Fuel.DIESEL: _service_diesel,
          Fuel.ELECTRIC: _service_electric,
      }


      def service(vehicle: Vehicle) -> None:
          _SERVICES[vehicle.fuel](vehicle)
  expected_output:
    outcome: invalid
- name: a restock re-checks a quantity the pydantic field constraint just validated
  inputs:
    file: warehouse/restock.py
    after: |
      from pydantic import BaseModel, Field

      from warehouse.errors import InvalidRestock
      from warehouse.stock import add_stock


      class Restock(BaseModel):
          sku: str = Field(min_length=1)
          quantity: int = Field(ge=1)


      def restock(body: bytes) -> None:
          order = Restock.model_validate_json(body)
          if order.quantity < 1:
              raise InvalidRestock(f"quantity for {order.sku} must be at least 1")
          add_stock(order.sku, order.quantity)
  expected_output:
    outcome: invalid
- name: a reservation re-checks the date order the stay's __post_init__ already enforced
  inputs:
    file: rentals/reservations.py
    after: |
      from dataclasses import dataclass
      from datetime import date

      from rentals.calendar import block_dates
      from rentals.errors import InvalidStay


      @dataclass(frozen=True)
      class Stay:
          check_in: date
          check_out: date

          def __post_init__(self) -> None:
              if self.check_out <= self.check_in:
                  raise InvalidStay("check-out must come after check-in")


      def reserve(cabin_id: str, check_in: date, check_out: date) -> Stay:
          stay = Stay(check_in=check_in, check_out=check_out)
          if stay.check_out <= stay.check_in:
              raise InvalidStay("check-out must come after check-in")
          block_dates(cabin_id, stay.check_in, stay.check_out)
          return stay
  expected_output:
    outcome: invalid
- name: a coupon factory re-checks the discount range its attrs validators already enforced
  inputs:
    file: promotions/coupons.py
    after: |
      from attrs import define, field, validators

      from promotions.errors import InvalidCoupon
      from promotions.store import save_coupon


      @define(frozen=True)
      class Coupon:
          code: str
          percent_off: int = field(validator=[validators.ge(1), validators.le(90)])


      def create_coupon(code: str, percent_off: int) -> Coupon:
          coupon = Coupon(code=code, percent_off=percent_off)
          if not 1 <= coupon.percent_off <= 90:
              raise InvalidCoupon(f"{code} must take 1 to 90 percent off")
          save_coupon(coupon)
          return coupon
  expected_output:
    outcome: invalid
- name: a loan loaded from the database is re-checked for the due date its non-null column guarantees
  inputs:
    file: lending/loans.py
    after: |
      from datetime import date

      from django.db import models

      from lending.errors import MissingDueDate


      class Loan(models.Model):
          member_email = models.EmailField()
          due_on = models.DateField(null=False)


      def due_date(loan_id: int) -> date:
          loan = Loan.objects.get(pk=loan_id)
          if loan.due_on is None:
              raise MissingDueDate(loan_id)
          return loan.due_on
  expected_output:
    outcome: invalid
- name: a closed-ticket match case re-tests a state the ticket's only producer always sets to open
  inputs:
    file: helpdesk/tickets.py
    after: |
      from dataclasses import dataclass
      from enum import Enum
      from uuid import uuid4

      from helpdesk.errors import TicketClosed
      from helpdesk.queue import push


      class TicketState(Enum):
          OPEN = "open"
          CLOSED = "closed"


      @dataclass(frozen=True)
      class Ticket:
          id: str
          title: str
          state: TicketState


      def _open_ticket(title: str) -> Ticket:
          return Ticket(id=uuid4().hex, title=title, state=TicketState.OPEN)


      def file_ticket(title: str) -> Ticket:
          ticket = _open_ticket(title)
          match ticket.state:
              case TicketState.OPEN:
                  push(ticket)
              case TicketState.CLOSED:
                  raise TicketClosed(ticket.id)
          return ticket
  expected_output:
    outcome: invalid
- name: a loop breaks on a negative count the imported parser's model already rejects
  inputs:
    file: inventory/report.py
    after: |
      from inventory.parsing import parse_stock


      def total_units(text: str) -> int:
          total = 0
          for line in parse_stock(text):
              if line.count < 0:
                  break
              total += line.count
          return total
    unchanged:
      inventory/parsing.py: |
        from pydantic import BaseModel, Field, TypeAdapter


        class StockLine(BaseModel):
            sku: str = Field(min_length=1)
            count: int = Field(ge=0)


        _STOCK_LINES = TypeAdapter(list[StockLine])


        def parse_stock(text: str) -> list[StockLine]:
            return _STOCK_LINES.validate_json(text)
  expected_output:
    outcome: invalid
- name: an edit adds an assertion that re-tests what the screening's earlier check already raised on
  inputs:
    file: cinema/screenings.py
    before: |
      from cinema.errors import SoldOut
      from cinema.models import Screening
      from cinema.sales import sell_ticket


      def buy(screening: Screening, viewer_id: str) -> str:
          if screening.seats_left == 0:
              raise SoldOut(screening.id)
          return sell_ticket(screening.id, viewer_id)
    after: |
      from cinema.errors import SoldOut
      from cinema.models import Screening
      from cinema.sales import notify_viewer, sell_ticket


      def buy(screening: Screening, viewer_id: str) -> str:
          if screening.seats_left == 0:
              raise SoldOut(screening.id)
          assert screening.seats_left != 0
          ticket_id = sell_ticket(screening.id, viewer_id)
          notify_viewer(viewer_id, ticket_id)
          return ticket_id
  expected_output:
    outcome: invalid
- name: a conversion raises when the currency has no rate, since the lookup may miss
  inputs:
    file: pricing/convert.py
    after: |
      from decimal import Decimal

      from pricing.errors import UnknownCurrency
      from pricing.rates import euro_rates


      def to_euros(amount: Decimal, currency: str) -> Decimal:
          rate = euro_rates.get(currency)
          if rate is None:
              raise UnknownCurrency(currency)
          return amount * rate
  expected_output:
    outcome: valid
- name: a loop skips contacts without an apartment unit, which many addresses legitimately lack
  inputs:
    file: delivery/buzzers.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Address:
          street: str
          city: str
          unit: str | None


      def buzzer_labels(addresses: list[Address]) -> list[str]:
          labels: list[str] = []
          for address in addresses:
              if address.unit is None:
                  continue
              labels.append(f"{address.street} #{address.unit}")
          return labels
  expected_output:
    outcome: valid
- name: a raw query-string value is checked before it is parsed into a number
