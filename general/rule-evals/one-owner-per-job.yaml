- name: a gate display keeps a private helper for a flight's delay, a step the departures board also keeps private
  inputs:
    file: departures/gates.py
    unchanged:
      departures/__init__.py: ""
      departures/models.py: |
        from dataclasses import dataclass
        from datetime import datetime


        @dataclass(frozen=True)
        class Flight:
            number: str
            gate: str
            scheduled_at: datetime


        @dataclass(frozen=True)
        class CrewPolicy:
            page_after_minutes: int
      departures/board.py: |
        from datetime import datetime

        from departures.models import Flight


        class DeparturesBoard:
            def row(self, flight: Flight, now: datetime) -> str:
                return f"{flight.number}  gate {flight.gate}  {self._minutes_late(flight, now)} min late"

            def _minutes_late(self, flight: Flight, now: datetime) -> int:
                return int((now - flight.scheduled_at).total_seconds() // 60)
    after: |
      import math
      from datetime import datetime

      from departures.models import CrewPolicy, Flight


      class GateDisplay:
          def should_page_crew(self, flight: Flight, now: datetime, policy: CrewPolicy) -> bool:
              return self._delay_minutes(flight, now) >= policy.page_after_minutes

          def _delay_minutes(self, flight: Flight, now: datetime) -> int:
              return math.ceil((now - flight.scheduled_at).total_seconds() / 60)
  expected_output:
    outcome: valid
