- name: a checkout timer works out a seat hold's expiry that the hold clock already works out, so extended holds expire early at checkout
  inputs:
    file: checkout/timer.ts
    unchanged:
      booking/models.ts: &booking_models |
        export type Zone = "stalls" | "circle" | "balcony";

        export interface Seat {
          code: string;
          zone: Zone;
        }

        export interface Hold {
          id: string;
          placedAt: Date;
          extended: boolean;
          seats: readonly Seat[];
        }

        export interface HoldPolicy {
          minutes: number;
          extensionMinutes: number;
        }

        export interface PriceList {
          byZone: Record<Zone, number>;
        }
      booking/holds.ts: &booking_holds |
        import type { Hold, HoldPolicy } from "./models";

        export class HoldClock {
          expiresAt(hold: Hold, policy: HoldPolicy): Date {
            const minutes = hold.extended ? policy.minutes + policy.extensionMinutes : policy.minutes;
            return new Date(hold.placedAt.getTime() + minutes * 60_000);
          }
        }
    after: |
      import type { Hold, HoldPolicy } from "../booking/models";

      export class CheckoutTimer {
        holdDeadline(hold: Hold, policy: HoldPolicy): Date {
          return new Date(hold.placedAt.getTime() + policy.minutes * 60_000);
        }
      }
  expected_output:
    outcome: invalid
- name: a checkout timer counts the seconds left until the expiry the hold clock works out
  inputs:
    file: checkout/timer.ts
    unchanged:
      booking/models.ts: *booking_models
      booking/holds.ts: *booking_holds
    after: |
      import { HoldClock } from "../booking/holds";
      import type { Hold, HoldPolicy } from "../booking/models";

      export class CheckoutTimer {
        constructor(private readonly clock: HoldClock) {}

        secondsLeft(hold: Hold, policy: HoldPolicy, now: Date): number {
          const expiresAt = this.clock.expiresAt(hold, policy);
          return Math.floor((expiresAt.getTime() - now.getTime()) / 1000);
        }
      }
  expected_output:
    outcome: valid
