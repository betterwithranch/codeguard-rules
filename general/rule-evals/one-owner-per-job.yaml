- name: a kiosk quote prices a trip that the fare table in the same file already prices, so kiosks charge a different fare
  inputs:
    file: transit/fares.ts
    before: |
      export type Zone = 1 | 2 | 3 | 4;

      export interface Trip {
        from: Zone;
        to: Zone;
        peak: boolean;
      }

      export interface FareChart {
        baseFare: number;
        perZone: number;
        peakSurcharge: number;
      }

      export class FareTable {
        fare(trip: Trip, chart: FareChart): number {
          const zones = Math.abs(trip.to - trip.from) + 1;
          const fare = chart.baseFare + chart.perZone * (zones - 1);
          return trip.peak ? fare + chart.peakSurcharge : fare;
        }
      }
    after: |
      export type Zone = 1 | 2 | 3 | 4;

      export interface Trip {
        from: Zone;
        to: Zone;
        peak: boolean;
      }

      export interface FareChart {
        baseFare: number;
        perZone: number;
        peakSurcharge: number;
      }

      export class FareTable {
        fare(trip: Trip, chart: FareChart): number {
          const zones = Math.abs(trip.to - trip.from) + 1;
          const fare = chart.baseFare + chart.perZone * (zones - 1);
          return trip.peak ? fare + chart.peakSurcharge : fare;
        }
      }

      export class KioskQuote {
        price(trip: Trip, chart: FareChart): number {
          const outerZone = trip.from > trip.to ? trip.from : trip.to;
          return chart.baseFare + chart.perZone * (outerZone - 1);
        }
      }
  expected_output:
    outcome: invalid
- name: a receipt printer stops asking the loyalty ledger and works out a purchase's points itself, so excluded items earn points on receipts
  inputs:
    file: receipts/printer.ts
    unchanged:
      loyalty/models.ts: |
        export interface PurchaseLine {
          sku: string;
          pricePence: number;
          quantity: number;
        }

        export interface Purchase {
          lines: readonly PurchaseLine[];
          totalPence: number;
        }

        export interface Scheme {
          pointsPerPound: number;
          excludedSkus: readonly string[];
        }
      loyalty/ledger.ts: |
        import type { Purchase, Scheme } from "./models";

        export class LoyaltyLedger {
          points(purchase: Purchase, scheme: Scheme): number {
            const eligible = purchase.lines.filter((line) => !scheme.excludedSkus.includes(line.sku));
            const spend = eligible.reduce((sum, line) => sum + line.pricePence * line.quantity, 0);
            return Math.floor(spend / 100) * scheme.pointsPerPound;
          }
        }
    before: |
      import { LoyaltyLedger } from "../loyalty/ledger";
      import type { Purchase, Scheme } from "../loyalty/models";

      export class ReceiptPrinter {
        constructor(private readonly ledger: LoyaltyLedger) {}

        pointsEarned(purchase: Purchase, scheme: Scheme): number {
          return this.ledger.points(purchase, scheme);
        }

        footer(purchase: Purchase, scheme: Scheme): string {
          return `You earned ${this.pointsEarned(purchase, scheme)} points today.`;
        }
      }
    after: |
      import type { Purchase, Scheme } from "../loyalty/models";

      export class ReceiptPrinter {
        pointsEarned(purchase: Purchase, scheme: Scheme): number {
          return Math.floor(purchase.totalPence / 100) * scheme.pointsPerPound;
        }

        footer(purchase: Purchase, scheme: Scheme): string {
          return `You earned ${this.pointsEarned(purchase, scheme)} points today.`;
        }
      }
  expected_output:
    outcome: invalid
