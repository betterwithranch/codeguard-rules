cases:
- name: a return desk charges a late loan its own fee where the late fee policy already charges it, so a new grace period misses the desk
  inputs:
    file: desk/returns.py
    unchanged:
      lending/__init__.py: ""
      lending/models.py: &lending_models |
        from dataclasses import dataclass
        from datetime import date
        from decimal import Decimal


        @dataclass(frozen=True)
        class Loan:
            item_id: str
            due_on: date
            renewals: int


        @dataclass(frozen=True)
        class FeeSchedule:
            grace_days: int
            daily_rate: Decimal
            cap: Decimal


        @dataclass(frozen=True)
        class RenewalRules:
            max_renewals: int
            loan_days: int


        @dataclass(frozen=True)
        class MemberAccount:
            member_id: str
            unpaid_balance: Decimal
      lending/fees.py: &lending_fees |
        from datetime import date
        from decimal import Decimal

        from lending.models import FeeSchedule, Loan


        class LateFeePolicy:
            def fee(self, loan: Loan, returned_on: date, schedule: FeeSchedule) -> Decimal:
                days_late = (returned_on - loan.due_on).days - schedule.grace_days
                if days_late <= 0:
                    return Decimal("0")
                return min(schedule.daily_rate * days_late, schedule.cap)
    after: |
      from datetime import date
      from decimal import Decimal

      from lending.models import FeeSchedule, Loan


      class ReturnDesk:
          def overdue_charge(self, loan: Loan, returned_on: date, schedule: FeeSchedule) -> Decimal:
              days_late = (returned_on - loan.due_on).days
              if days_late <= 0:
                  return Decimal("0")
              return schedule.daily_rate * days_late
  expected_output:
    outcome: invalid
- name: a return desk asks the late fee policy for a loan's fee and adds the member's unpaid balance
  inputs:
    file: desk/returns.py
    unchanged:
      lending/__init__.py: ""
      lending/models.py: *lending_models
      lending/fees.py: *lending_fees
    after: |
      from datetime import date
      from decimal import Decimal

      from lending.fees import LateFeePolicy
      from lending.models import FeeSchedule, Loan, MemberAccount


      class ReturnDesk:
          def __init__(self, policy: LateFeePolicy) -> None:
              self.policy = policy

          def amount_due(
              self, loan: Loan, returned_on: date, account: MemberAccount, schedule: FeeSchedule
          ) -> Decimal:
              return self.policy.fee(loan, returned_on, schedule) + account.unpaid_balance
  expected_output:
    outcome: valid
- name: a renewal desk extends a loan's due date, a job the late fee policy doesn't do
  inputs:
    file: desk/renewals.py
    unchanged:
      lending/__init__.py: ""
      lending/models.py: *lending_models
      lending/fees.py: *lending_fees
    after: |
      from datetime import date, timedelta

      from lending.models import Loan, RenewalRules


      class RenewalRefused(Exception):
          pass


      class RenewalDesk:
          def renewed_due_date(self, loan: Loan, rules: RenewalRules) -> date:
              if loan.renewals >= rules.max_renewals:
                  raise RenewalRefused(loan.item_id)
              return loan.due_on + timedelta(days=rules.loan_days)
  expected_output:
    outcome: valid
- name: a library card check validates card numbers, a concept the ISBN check doesn't validate
  inputs:
    file: lending/cards.py
    unchanged:
      catalog/__init__.py: ""
      catalog/isbn.py: |
        class InvalidIsbn(ValueError):
            pass


        class IsbnCheck:
            def validate(self, code: str) -> None:
                if len(code) != 13 or not code.isdigit():
                    raise InvalidIsbn(code)
                weights = [1, 3] * 6 + [1]
                if sum(int(digit) * weight for digit, weight in zip(code, weights)) % 10 != 0:
                    raise InvalidIsbn(code)
    after: |
      class InvalidCardNumber(ValueError):
          pass


      class LibraryCardCheck:
          def validate(self, number: str) -> None:
              if not (number.startswith("LC") and len(number) == 10 and number[2:].isdigit()):
                  raise InvalidCardNumber(number)
  expected_output:
    outcome: valid
