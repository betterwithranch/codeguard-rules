        export class MeterDisplay {
          line(session: ParkingSession, now: Date): string {
            return `Bay ${session.bay}: ${this.minutesParked(session, now)} min`;
          }

          private minutesParked(session: ParkingSession, now: Date): number {
            return Math.floor((now.getTime() - session.startedAt.getTime()) / 60_000);
          }
        }
    after: |
      import type { ParkingSession, WardenRules } from "./models";

      export class WardenAlerts {
        shouldVisit(session: ParkingSession, now: Date, rules: WardenRules): boolean {
          return this.#minutesParked(session, now) > session.paidMinutes + rules.graceMinutes;
        }

        #minutesParked(session: ParkingSession, now: Date): number {
