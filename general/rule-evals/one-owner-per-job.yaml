- name: an active member list selects active memberships by its own filter where the membership queryset already selects them, so suspended members show in the list
  inputs:
    file: members/views.py
    unchanged:
      members/__init__.py: ""
      members/models.py: |
        from datetime import date

        from django.db import models


        class MembershipQuerySet(models.QuerySet["Membership"]):
            def active(self, today: date) -> "MembershipQuerySet":
                return self.filter(cancelled_at__isnull=True, paid_until__gte=today).exclude(
                    suspended=True
                )


        class Membership(models.Model):
            member_name = models.CharField(max_length=200)
            paid_until = models.DateField()
            cancelled_at = models.DateTimeField(null=True)
            suspended = models.BooleanField(default=False)

            objects = MembershipQuerySet.as_manager()
      members/serializers.py: |
        from rest_framework import serializers

        from members.models import Membership


        class MembershipSerializer(serializers.ModelSerializer[Membership]):
            class Meta:
                model = Membership
                fields = ["id", "member_name", "paid_until"]
    after: |
      from datetime import date

      from django.db.models import QuerySet
      from rest_framework.generics import ListAPIView

      from members.models import Membership
      from members.serializers import MembershipSerializer


      class ActiveMemberList(ListAPIView[Membership]):
          serializer_class = MembershipSerializer

          def get_queryset(self) -> QuerySet[Membership]:
              return Membership.objects.filter(cancelled_at__isnull=True, paid_until__gte=date.today())
