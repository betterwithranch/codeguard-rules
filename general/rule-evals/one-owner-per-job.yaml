- name: an invoice draft stops asking billable time and works out a timesheet's billable hours itself, so the two round differently
  inputs:
    file: invoices/drafts.py
    unchanged:
      billing/__init__.py: ""
      billing/models.py: |
        from dataclasses import dataclass
        from decimal import Decimal


        @dataclass(frozen=True)
        class TimeEntry:
            minutes: int
            billable: bool


        @dataclass(frozen=True)
        class Timesheet:
            entries: tuple[TimeEntry, ...]


        @dataclass(frozen=True)
        class Contract:
            increment_minutes: int
            hourly_rate: Decimal
      billing/time.py: |
        import math
        from decimal import Decimal

        from billing.models import Contract, Timesheet


        class BillableTime:
            def hours(self, sheet: Timesheet, contract: Contract) -> Decimal:
                minutes = sum(
                    math.ceil(entry.minutes / contract.increment_minutes) * contract.increment_minutes
                    for entry in sheet.entries
                    if entry.billable
                )
                return Decimal(minutes) / 60
    before: |
      from decimal import Decimal

      from billing.models import Contract, Timesheet
      from billing.time import BillableTime


      class InvoiceDraft:
          def __init__(self, billable: BillableTime) -> None:
              self.billable = billable

          def billable_hours(self, sheet: Timesheet, contract: Contract) -> Decimal:
              return self.billable.hours(sheet, contract)

          def amount(self, sheet: Timesheet, contract: Contract) -> Decimal:
              return self.billable_hours(sheet, contract) * contract.hourly_rate
    after: |
      import math
      from decimal import Decimal

      from billing.models import Contract, Timesheet


      class InvoiceDraft:
          def billable_hours(self, sheet: Timesheet, contract: Contract) -> Decimal:
              minutes = sum(entry.minutes for entry in sheet.entries if entry.billable)
              increments = math.ceil(minutes / contract.increment_minutes)
              return Decimal(increments * contract.increment_minutes) / 60

          def amount(self, sheet: Timesheet, contract: Contract) -> Decimal:
              return self.billable_hours(sheet, contract) * contract.hourly_rate
  expected_output:
    outcome: invalid
- name: two tariffs each charge a meter reading their own way for the tariff base they extend
  inputs:
    file: energy/tariffs.py
    unchanged:
      energy/__init__.py: ""
      energy/readings.py: |
        from dataclasses import dataclass
        from decimal import Decimal


        @dataclass(frozen=True)
        class MeterReading:
            kwh: Decimal
            off_peak_kwh: Decimal
    after: |
      from abc import ABC, abstractmethod
      from dataclasses import dataclass
      from decimal import Decimal

      from energy.readings import MeterReading


      class Tariff(ABC):
          @abstractmethod
          def charge(self, reading: MeterReading) -> Decimal: ...


      @dataclass(frozen=True)
      class FlatTariff(Tariff):
          unit_rate: Decimal

          def charge(self, reading: MeterReading) -> Decimal:
              return reading.kwh * self.unit_rate


      @dataclass(frozen=True)
      class OffPeakTariff(Tariff):
          peak_rate: Decimal
          off_peak_rate: Decimal

          def charge(self, reading: MeterReading) -> Decimal:
              off_peak = reading.off_peak_kwh * self.off_peak_rate
              return off_peak + (reading.kwh - reading.off_peak_kwh) * self.peak_rate
  expected_output:
    outcome: valid
