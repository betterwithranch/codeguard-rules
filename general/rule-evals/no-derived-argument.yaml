- name: a folio call passes a local cost computed from the stay with that stay
  inputs:
    file: hotel/folio.py
    after: |
      from dataclasses import dataclass
      from decimal import Decimal


      @dataclass(frozen=True)
      class Stay:
          guest_name: str
          nights: int
          nightly_rate: Decimal


      def stay_cost(stay: Stay) -> Decimal:
          return stay.nightly_rate * stay.nights


      def folio_line(cost: Decimal, stay: Stay) -> str:
          return f"{stay.guest_name}: {stay.nights} nights, {cost}"


      def checkout_line(stay: Stay) -> str:
          cost = stay_cost(stay)
          return folio_line(cost, stay)
  expected_output:
    outcome: invalid
- name: a method on self passes a runtime computed from the tracks with those tracks
  inputs:
    file: music/playlist.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Track:
          title: str
          seconds: int


      class PlaylistDescriber:
          def __init__(self, heading: str) -> None:
              self._heading = heading

          def _runtime(self, tracks: list[Track]) -> int:
              return sum(track.seconds for track in tracks)

          def _caption(self, runtime: int, tracks: list[Track]) -> str:
              titles = ", ".join(track.title for track in tracks)
              return f"{self._heading} ({runtime // 60} min): {titles}"

          def describe(self, tracks: list[Track]) -> str:
              return self._caption(self._runtime(tracks), tracks)
  expected_output:
    outcome: invalid
