- name: a typescript scheduler is built with a job store collaborator made from the database it also takes
  inputs:
    file: jobs/wiring.ts
    after: |
      export interface Database {
        insert(table: string, row: Record<string, string>): void;
        commit(): void;
      }

      export class JobStore {
        constructor(private readonly db: Database) {}

        save(jobId: string, runAt: string): void {
          this.db.insert("jobs", { jobId, runAt });
        }
      }

      export class Scheduler {
        constructor(
          private readonly store: JobStore,
          private readonly db: Database,
        ) {}

        schedule(jobId: string, runAt: string): void {
          this.store.save(jobId, runAt);
          this.db.commit();
        }
      }

      export function buildScheduler(db: Database): Scheduler {
        return new Scheduler(new JobStore(db), db);
      }
  expected_output:
    outcome: valid
- name: a typescript refund gets an amount derived from the payment, not from the reason it also gets
  inputs:
    file: payments/refunds.ts
    after: |
      export interface Payment {
        id: string;
        amountCents: number;
        feeCents: number;
      }

      export function refundableCents(payment: Payment): number {
        return payment.amountCents - payment.feeCents;
      }

      export function refundNote(amountCents: number, reason: string): string {
        return `Refund ${amountCents} cents: ${reason}`;
      }

      export function refund(payment: Payment, reason: string): string {
        return refundNote(refundableCents(payment), reason);
      }
  expected_output:
    outcome: valid
- name: a typescript formatter gets a converted distance without the run it came from
