- name: a typescript date-fns format takes a pattern computed from the date it formats
  inputs:
    file: calendar/display.ts
    after: |
      import { format } from "date-fns";

      export function patternFor(when: Date): string {
        return when.getHours() === 0 && when.getMinutes() === 0 ? "d MMM yyyy" : "d MMM yyyy HH:mm";
      }

      export function displayDate(when: Date): string {
        return format(when, patternFor(when));
      }
  expected_output:
    outcome: valid
- name: a typescript pino logger takes a size computed from the path it also logs
