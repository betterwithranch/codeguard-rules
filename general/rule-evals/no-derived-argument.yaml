- name: a typescript enrollment call passes the tuition computed from a course with that course
  inputs:
    file: registrar/enroll.ts
    after: |
      export interface Course {
        code: string;
        credits: number;
        level: number;
      }

      export function tuitionFor(course: Course): number {
        return course.credits * (course.level >= 300 ? 410 : 350);
      }

      export function enrollmentLine(tuition: number, course: Course): string {
        return `${course.code} (${course.credits} credits): $${tuition}`;
      }

      export function enroll(course: Course): string {
        return enrollmentLine(tuitionFor(course), course);
      }
  expected_output:
    outcome: invalid
