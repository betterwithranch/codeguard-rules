cases:
- name: a label call passes the postage computed from a parcel with that parcel
  inputs:
    file: shipping/labels.py
    after: |
      from dataclasses import dataclass
      from decimal import Decimal


      @dataclass(frozen=True)
      class Parcel:
          weight_grams: int
          destination_country: str
          insured_value: Decimal


      def postage_for(parcel: Parcel) -> Decimal:
          base = Decimal("3.20") if parcel.destination_country == "NL" else Decimal("9.80")
          return base + Decimal("0.01") * parcel.weight_grams


      def label_text(postage: Decimal, parcel: Parcel) -> str:
          return (
              f"{parcel.destination_country} | {parcel.weight_grams} g"
              f" | postage {postage} | insured {parcel.insured_value}"
          )


      def label_parcel(parcel: Parcel) -> str:
          return label_text(postage_for(parcel), parcel)
  expected_output:
    outcome: invalid
