- name: a typescript url parameter is set to a default computed from its key
  inputs:
    file: search/params.ts
    after: |
      export type Filter = "sort" | "pageSize";

      const DEFAULTS: Record<Filter, string> = { sort: "newest", pageSize: "20" };

      export function defaultFor(filter: Filter): string {
        return DEFAULTS[filter];
      }

      export function resetFilter(url: URL, filter: Filter): void {
