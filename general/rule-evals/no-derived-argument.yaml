- name: a standard-library copy takes a backup path computed from the file it copies
  inputs:
    file: storage/backups.py
    after: |
      import shutil
      from pathlib import Path


      def backup_path(source: Path) -> Path:
          return source.with_name(f"{source.stem}.bak{source.suffix}")


      def back_up(source: Path) -> None:
          shutil.copy(source, backup_path(source))
  expected_output:
    outcome: valid
- name: a logger call takes a row count computed from the path it also logs
  inputs:
    file: exports/report.py
    after: |
      import logging
      from pathlib import Path

      logger = logging.getLogger(__name__)


      def row_count(path: Path) -> int:
          with path.open() as handle:
              return sum(1 for _ in handle)


      def report_export(path: Path) -> None:
          logger.info("exported %d rows to %s", row_count(path), path)
  expected_output:
    outcome: valid
- name: a restocker is built with a ledger collaborator made from the connection it also takes
  inputs:
    file: inventory/wiring.py
    after: |
      import sqlite3


      class StockLedger:
          def __init__(self, connection: sqlite3.Connection) -> None:
              self._connection = connection

          def record(self, sku: str, change: int) -> None:
              self._connection.execute(
                  "INSERT INTO stock_moves (sku, change) VALUES (?, ?)", (sku, change)
              )


      class Restocker:
          def __init__(self, ledger: StockLedger, connection: sqlite3.Connection) -> None:
              self._ledger = ledger
              self._connection = connection

          def restock(self, sku: str, quantity: int) -> None:
              self._ledger.record(sku, quantity)
              self._connection.commit()


      def build_restocker(connection: sqlite3.Connection) -> Restocker:
          return Restocker(ledger=StockLedger(connection), connection=connection)
  expected_output:
    outcome: valid
