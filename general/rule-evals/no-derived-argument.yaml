    file: running/pace.ts
    after: |
      export interface Run {
        meters: number;
        startedAt: string;
      }

      export function toMiles(run: Run): number {
        return run.meters / 1609.344;
      }

      export function milesText(miles: number): string {
        return `${miles.toFixed(2)} mi`;
      }

      export function describeRun(run: Run): string {
        return milesText(toMiles(run));
      }
  expected_output:
    outcome: valid
