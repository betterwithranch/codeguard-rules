- name: a typescript dispatch call passes a local weight computed from a crate with that crate
  inputs:
    file: freight/dispatch.ts
    after: |
      export interface Crate {
        id: string;
        itemCount: number;
        kgPerItem: number;
      }

      export function crateWeight(crate: Crate): number {
        return crate.itemCount * crate.kgPerItem;
      }

      export function dispatchNote(weightKg: number, crate: Crate): string {
        return `Crate ${crate.id}: ${crate.itemCount} items, ${weightKg} kg`;
      }

      export function dispatch(crate: Crate): string {
        const weightKg = crateWeight(crate);
        return dispatchNote(weightKg, crate);
      }
  expected_output:
    outcome: invalid
- name: a typescript method on this passes a stroke total computed from the rounds with those rounds
  inputs:
    file: golf/scorecard.ts
    after: |
      export interface Round {
        course: string;
        strokes: number;
      }

      export class ScorecardWriter {
        constructor(private readonly player: string) {}

        private totalStrokes(rounds: readonly Round[]): number {
          return rounds.reduce((sum, round) => sum + round.strokes, 0);
        }

        private summary(totalStrokes: number, rounds: readonly Round[]): string {
          const courses = rounds.map((round) => round.course).join(", ");
          return `${this.player}: ${totalStrokes} strokes over ${courses}`;
        }

        write(rounds: readonly Round[]): string {
          return this.summary(this.totalStrokes(rounds), rounds);
        }
      }
  expected_output:
    outcome: invalid
- name: a typescript receipt is built with the vat computed from a basket and that basket
  inputs:
    file: till/checkout.ts
    unchanged:
      till/receipt.ts: |
        export interface Basket {
          id: string;
          netCents: number;
          vatRate: number;
        }

        export function vatCents(basket: Basket): number {
          return Math.round(basket.netCents * basket.vatRate);
        }

        export class Receipt {
          constructor(
            readonly vatCents: number,
            readonly basket: Basket,
          ) {}
        }
    after: |
      import { Basket, Receipt, vatCents } from "./receipt";

      export function checkout(basket: Basket): Receipt {
        return new Receipt(vatCents(basket), basket);
      }
  expected_output:
    outcome: invalid
