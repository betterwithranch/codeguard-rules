- name: a typescript winner call passes a podium's first entry with the podium
  inputs:
    file: races/results.ts
    after: |
      export interface Runner {
        name: string;
        seconds: number;
      }

      export type Podium = readonly [Runner, Runner, Runner];

      export function winnerHeadline(winner: Runner, podium: Podium): string {
