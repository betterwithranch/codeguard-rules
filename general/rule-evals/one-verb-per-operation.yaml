cases:
- name: "sibling classes: a punctuation cleaner scrubs text where the whitespace cleaner beside it cleans, so callers look for a clean method that isn't there"
  inputs:
    file: text/cleaners.py
    before: |
      class WhitespaceCleaner:
          def clean(self, text: str) -> str:
              return " ".join(text.split())
    after: |
      import string


      class WhitespaceCleaner:
          def clean(self, text: str) -> str:
              return " ".join(text.split())


      class PunctuationCleaner:
          def scrub(self, text: str) -> str:
              return text.translate(str.maketrans("", "", string.punctuation))
  expected_output:
    outcome: invalid
- name: "sibling classes: a punctuation cleaner cleans text like the whitespace cleaner beside it, so one verb names the operation"
  inputs:
    file: text/cleaners.py
    before: |
      class WhitespaceCleaner:
          def clean(self, text: str) -> str:
              return " ".join(text.split())
    after: |
      import string


      class WhitespaceCleaner:
          def clean(self, text: str) -> str:
              return " ".join(text.split())


      class PunctuationCleaner:
          def clean(self, text: str) -> str:
              return text.translate(str.maketrans("", "", string.punctuation))
  expected_output:
    outcome: valid
- name: "imported collaborator: a weight rate calculates the fee the imported flat rate computes, and one function calls both under different verbs"
  inputs:
    file: shipping/rates.py
    unchanged:
      shipping/flat.py: |
        class FlatRate:
            def compute_fee(self, weight_grams: int) -> int:
                return 500 if weight_grams <= 1000 else 900
    after: |
      from shipping.flat import FlatRate


      class WeightRate:
          def calculate_fee(self, weight_grams: int) -> int:
              return weight_grams // 10


      def quote_fees(weight_grams: int, flat: FlatRate, weighted: WeightRate) -> list[int]:
          return [flat.compute_fee(weight_grams), weighted.calculate_fee(weight_grams)]
  expected_output:
    outcome: invalid
- name: "module functions in parallel: tally_digits beside count_vowels counts characters under a second verb"
  inputs:
    file: text/stats.py
    before: |
      def count_vowels(text: str) -> int:
          return sum(1 for char in text if char in "aeiou")
    after: |
      def count_vowels(text: str) -> int:
          return sum(1 for char in text if char in "aeiou")


      def tally_digits(text: str) -> int:
          return sum(1 for char in text if char.isdigit())
  expected_output:
    outcome: invalid
- name: "methods of one class: a roster deletes coaches but removes players, so one operation reads as two"
  inputs:
    file: league/roster.py
    before: |
      class Roster:
          def __init__(self) -> None:
              self._player_names: dict[str, str] = {}
              self._coach_names: dict[str, str] = {}

          def remove_player(self, player_id: str) -> None:
              del self._player_names[player_id]
    after: |
      class Roster:
          def __init__(self) -> None:
              self._player_names: dict[str, str] = {}
              self._coach_names: dict[str, str] = {}

          def remove_player(self, player_id: str) -> None:
              del self._player_names[player_id]

          def delete_coach(self, coach_id: str) -> None:
              del self._coach_names[coach_id]
  expected_output:
    outcome: invalid
- name: "rename: a length sorter's sort is renamed to arrange while the name sorter beside it still sorts"
  inputs:
    file: names/sorters.py
    before: |
      class AlphabeticalSorter:
          def sort(self, names: list[str]) -> list[str]:
              return sorted(names)


      class LengthSorter:
          def sort(self, names: list[str]) -> list[str]:
              return sorted(names, key=len)
    after: |
      class AlphabeticalSorter:
          def sort(self, names: list[str]) -> list[str]:
              return sorted(names)


      class LengthSorter:
          def arrange(self, names: list[str]) -> list[str]:
              return sorted(names, key=len)
  expected_output:
    outcome: invalid
- name: "no collaborator does it: a duration formatter is the only function in its module"
  inputs:
    file: media/durations.py
    after: |
      def format_duration(seconds: int) -> str:
          minutes, remainder = divmod(seconds, 60)
          return f"{minutes}:{remainder:02d}"
  expected_output:
    outcome: valid
- name: "different operations: decompress_bytes beside compress_bytes undoes it, so a second verb is right"
  inputs:
    file: archive/compression.py
    before: |
      import zlib


      def compress_bytes(data: bytes) -> bytes:
          return zlib.compress(data)
    after: |
      import zlib


      def compress_bytes(data: bytes) -> bytes:
          return zlib.compress(data)


      def decompress_bytes(data: bytes) -> bytes:
          return zlib.decompress(data)
  expected_output:
    outcome: valid
- name: "base-declared name: a memory sink writes blobs under the name its imported protocol declares, beside an archive that stores them"
  inputs:
    file: uploads/sinks.py
    unchanged:
      uploads/sink.py: |
        from typing import Protocol


        class BlobSink(Protocol):
            def write(self, key: str, data: bytes) -> None: ...
    before: |
      from pathlib import Path


      class LocalArchive:
          def __init__(self, root: Path) -> None:
              self._root = root

          def store(self, key: str, data: bytes) -> None:
              (self._root / key).write_bytes(data)
    after: |
      from pathlib import Path

      from uploads.sink import BlobSink


      class LocalArchive:
          def __init__(self, root: Path) -> None:
              self._root = root

          def store(self, key: str, data: bytes) -> None:
              (self._root / key).write_bytes(data)


      class MemorySink(BlobSink):
          def __init__(self) -> None:
              self._blobs: dict[str, bytes] = {}

          def write(self, key: str, data: bytes) -> None:
              self._blobs[key] = data
  expected_output:
    outcome: valid
- name: "unrelated code: compute_distance shares an operation only with a module the file neither imports nor calls"
  inputs:
    file: maps/distance.py
    unchanged:
      legacy/geometry.py: |
        import math


        def calculate_hypotenuse(side_a: float, side_b: float) -> float:
            return math.hypot(side_a, side_b)
    after: |
      import math


      def compute_distance(dx: float, dy: float) -> float:
          return math.hypot(dx, dy)
  expected_output:
    outcome: valid
- name: "body-only change: a lower-caser's convert body changes but no name is added or renamed"
  inputs:
    file: text/casing.py
    before: |
      class UpperCaser:
          def transform(self, text: str) -> str:
              return text.upper()


      class LowerCaser:
          def convert(self, text: str) -> str:
              return text.lower()
    after: |
      class UpperCaser:
          def transform(self, text: str) -> str:
              return text.upper()


      class LowerCaser:
          def convert(self, text: str) -> str:
              return text.casefold()
  expected_output:
    outcome: skipped
- name: "sibling classes: a punctuation cleaner scrubs text where the whitespace cleaner beside it cleans, so callers look for a clean method that isn't there (typescript)"
  inputs:
    file: text/cleaners.ts
    before: |
      export class WhitespaceCleaner {
        clean(text: string): string {
          return text.split(/\s+/).filter(Boolean).join(" ");
        }
      }
    after: |
      export class WhitespaceCleaner {
        clean(text: string): string {
          return text.split(/\s+/).filter(Boolean).join(" ");
        }
      }

      export class PunctuationCleaner {
        scrub(text: string): string {
          return text.replace(/[.,;:!?]/g, "");
        }
      }
  expected_output:
    outcome: invalid
- name: "sibling classes: a punctuation cleaner cleans text like the whitespace cleaner beside it, so one verb names the operation (typescript)"
  inputs:
    file: text/cleaners.ts
    before: |
      export class WhitespaceCleaner {
        clean(text: string): string {
          return text.split(/\s+/).filter(Boolean).join(" ");
        }
      }
    after: |
      export class WhitespaceCleaner {
        clean(text: string): string {
          return text.split(/\s+/).filter(Boolean).join(" ");
        }
      }

      export class PunctuationCleaner {
        clean(text: string): string {
          return text.replace(/[.,;:!?]/g, "");
        }
      }
  expected_output:
    outcome: valid
- name: "imported collaborator: a weight rate calculates the fee the imported flat rate computes, and one function calls both under different verbs (typescript)"
  inputs:
    file: shipping/rates.ts
    unchanged:
      shipping/flat.ts: |
        export class FlatRate {
          computeFee(weightGrams: number): number {
            return weightGrams <= 1000 ? 500 : 900;
          }
        }
    after: |
      import { FlatRate } from "./flat";

      export class WeightRate {
        calculateFee(weightGrams: number): number {
          return Math.floor(weightGrams / 10);
        }
      }

      export function quoteFees(weightGrams: number, flat: FlatRate, weighted: WeightRate): number[] {
        return [flat.computeFee(weightGrams), weighted.calculateFee(weightGrams)];
      }
  expected_output:
    outcome: invalid
- name: "module functions in parallel: tallyDigits beside countVowels counts characters under a second verb (typescript)"
  inputs:
    file: text/stats.ts
    before: |
      export function countVowels(text: string): number {
        return [...text].filter((char) => "aeiou".includes(char)).length;
      }
    after: |
      export function countVowels(text: string): number {
        return [...text].filter((char) => "aeiou".includes(char)).length;
      }

      export function tallyDigits(text: string): number {
        return [...text].filter((char) => char >= "0" && char <= "9").length;
      }
  expected_output:
    outcome: invalid
- name: "methods of one class: a library deletes magazines but removes books, so one operation reads as two (typescript)"
  inputs:
    file: library/shelf.ts
    before: |
      export class Shelf {
        private readonly bookTitles = new Map<string, string>();
        private readonly magazineTitles = new Map<string, string>();

        removeBook(isbn: string): void {
          this.bookTitles.delete(isbn);
        }
      }
    after: |
      export class Shelf {
        private readonly bookTitles = new Map<string, string>();
        private readonly magazineTitles = new Map<string, string>();

        removeBook(isbn: string): void {
          this.bookTitles.delete(isbn);
        }

        deleteMagazine(issn: string): void {
          this.magazineTitles.delete(issn);
        }
      }
  expected_output:
    outcome: invalid
- name: "rename: a length sorter's sort is renamed to arrange while the name sorter beside it still sorts (typescript)"
  inputs:
    file: names/sorters.ts
    before: |
      export class AlphabeticalSorter {
        sort(names: string[]): string[] {
          return [...names].sort();
        }
      }

      export class LengthSorter {
        sort(names: string[]): string[] {
          return [...names].sort((left, right) => left.length - right.length);
        }
      }
    after: |
      export class AlphabeticalSorter {
        sort(names: string[]): string[] {
          return [...names].sort();
        }
      }

      export class LengthSorter {
        arrange(names: string[]): string[] {
          return [...names].sort((left, right) => left.length - right.length);
        }
      }
  expected_output:
    outcome: invalid
- name: "no collaborator does it: a percent formatter is the only function in its module (typescript)"
  inputs:
    file: reports/percent.ts
    after: |
      export function formatPercent(ratio: number): string {
        return `${(ratio * 100).toFixed(1)}%`;
      }
  expected_output:
    outcome: valid
- name: "different operations: unlockAccount beside lockAccount undoes it, so a second verb is right (typescript)"
  inputs:
    file: accounts/locking.ts
    before: |
      export interface Account {
        readonly id: string;
        readonly locked: boolean;
      }

      export function lockAccount(account: Account): Account {
        return { ...account, locked: true };
      }
    after: |
      export interface Account {
        readonly id: string;
        readonly locked: boolean;
      }

      export function lockAccount(account: Account): Account {
        return { ...account, locked: true };
      }

      export function unlockAccount(account: Account): Account {
        return { ...account, locked: false };
      }
  expected_output:
    outcome: valid
- name: "base-declared name: a memory sink writes blobs under the name its imported interface declares, beside an archive that stores them (typescript)"
  inputs:
    file: uploads/sinks.ts
    unchanged:
      uploads/sink.ts: |
        export interface BlobSink {
          write(key: string, data: Uint8Array): void;
        }
    before: |
      export class ArchiveIndex {
        private readonly blobs = new Map<string, Uint8Array>();

        store(key: string, data: Uint8Array): void {
          this.blobs.set(key, data);
        }
      }
    after: |
      import type { BlobSink } from "./sink";

      export class ArchiveIndex {
        private readonly blobs = new Map<string, Uint8Array>();

        store(key: string, data: Uint8Array): void {
          this.blobs.set(key, data);
        }
      }

      export class MemorySink implements BlobSink {
        private readonly blobs = new Map<string, Uint8Array>();

        write(key: string, data: Uint8Array): void {
          this.blobs.set(key, data);
        }
      }
  expected_output:
    outcome: valid
- name: "unrelated code: computeDistance shares an operation only with a module the file neither imports nor calls (typescript)"
  inputs:
    file: maps/distance.ts
    unchanged:
      legacy/geometry.ts: |
        export function calculateHypotenuse(sideA: number, sideB: number): number {
          return Math.hypot(sideA, sideB);
        }
    after: |
      export function computeDistance(dx: number, dy: number): number {
        return Math.hypot(dx, dy);
      }
  expected_output:
    outcome: valid
- name: "body-only change: a lower-caser's convert body changes but no name is added or renamed (typescript)"
  inputs:
    file: text/casing.ts
    before: |
      export class UpperCaser {
        transform(text: string): string {
          return text.toUpperCase();
        }
      }

      export class LowerCaser {
        convert(text: string): string {
          return text.toLowerCase();
        }
      }
    after: |
      export class UpperCaser {
        transform(text: string): string {
          return text.toUpperCase();
        }
      }

      export class LowerCaser {
        convert(text: string): string {
          return text.toLocaleLowerCase("en-US");
        }
      }
  expected_output:
    outcome: valid
