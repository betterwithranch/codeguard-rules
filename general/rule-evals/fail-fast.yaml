- name: punch clock lines that fail to parse are flat-mapped away, so a worker is paid for fewer hours than they clocked
  inputs:
    file: timeclock/hours.ts
    unchanged:
      timeclock/punch.ts: |
        export interface Punch {
          badge: string;
          minutes: number;
        }

        /** The line's punch, or undefined when the line can't be parsed. */
        export function parsePunch(line: string): Punch | undefined {
          const match = /^(\w+) (\d+)$/.exec(line);
          if (match === null) {
            return undefined;
          }
          return { badge: match[1], minutes: Number(match[2]) };
        }
    after: |
      import { parsePunch } from "./punch";

      export function minutesWorked(lines: string[]): number {
        const punches = lines.flatMap((line) => {
          const punch = parsePunch(line);
          return punch === undefined ? [] : [punch];
        });
        return punches.reduce((sum, punch) => sum + punch.minutes, 0);
      }
  expected_output:
    outcome: invalid
- name: free parking spaces are clamped at zero although the garage refuses a car when it's full, so an overfilled garage shows as merely full
  inputs:
    file: parking/garage.ts
    before: |
      export class GarageFull extends Error {}

      export class Garage {
        private parked = 0;

        constructor(private readonly spaces: number) {}

        /** The only code that adds a car; it refuses one when every space is taken. */
        enter(): void {
          if (this.parked >= this.spaces) {
            throw new GarageFull();
          }
          this.parked += 1;
        }
      }
    after: |
      export class GarageFull extends Error {}

      export class Garage {
        private parked = 0;

        constructor(private readonly spaces: number) {}

        /** The only code that adds a car; it refuses one when every space is taken. */
        enter(): void {
          if (this.parked >= this.spaces) {
            throw new GarageFull();
          }
          this.parked += 1;
        }

        freeSpaces(): number {
          return Math.max(0, this.spaces - this.parked);
        }
      }
  expected_output:
    outcome: invalid
