cases:
- name: timesheet export swallows every payroll error, so a rejected sheet is reported as exported and the worker goes unpaid
  inputs:
    file: payroll/export.py
    after: |
      from payroll.client import PayrollClient
      from payroll.models import Timesheet


      def export_timesheets(client: PayrollClient, sheets: list[Timesheet]) -> int:
          for sheet in sheets:
              try:
                  client.submit(sheet)
              except Exception:
                  pass
          return len(sheets)
  expected_output:
    outcome: invalid
- name: timesheet export names the sheet the payroll system rejected and stops
  inputs:
    file: payroll/export.py
    after: |
      from payroll.client import PayrollClient, PayrollRejected
      from payroll.errors import TimesheetNotExported
      from payroll.models import Timesheet


      def export_timesheets(client: PayrollClient, sheets: list[Timesheet]) -> int:
          for sheet in sheets:
              try:
                  client.submit(sheet)
              except PayrollRejected as err:
                  raise TimesheetNotExported(sheet.id) from err
          return len(sheets)
  expected_output:
    outcome: valid
- name: a transfer whose ledger entry failed to post only logs the error and still returns a receipt, so the books miss money that moved
  inputs:
    file: transfers/send.py
    after: |
      import logging

      from transfers.ledger import Ledger, LedgerEntry, LedgerUnavailable
      from transfers.models import Transfer, TransferReceipt

      logger = logging.getLogger(__name__)


      def record_transfer(ledger: Ledger, transfer: Transfer) -> TransferReceipt:
          entry = LedgerEntry.for_transfer(transfer)
          try:
              ledger.post(entry)
          except LedgerUnavailable:
              logger.exception("ledger post failed for transfer %s", transfer.id)
          return TransferReceipt(transfer_id=transfer.id, entry_id=entry.id)
  expected_output:
    outcome: invalid
- name: a quote skips the lines whose product the catalog doesn't know, so the customer is quoted less than the order costs
  inputs:
    file: quotes/pricing.py
    after: |
      from decimal import Decimal

      from quotes.catalog import Catalog, UnknownProduct
      from quotes.models import QuoteLine


      def quote_total(lines: list[QuoteLine], catalog: Catalog) -> Decimal:
          total = Decimal(0)
          for line in lines:
              try:
                  unit_price = catalog.unit_price(line.product_code)
              except UnknownProduct:
                  continue
              total += unit_price * line.quantity
          return total
  expected_output:
    outcome: invalid
- name: the job worker's top-level loop logs a failed job, marks it failed and takes the next independent job
  inputs:
    file: worker/main.py
    after: |
      import logging

      from worker.handlers import JobHandlers
      from worker.queue import JobQueue

      logger = logging.getLogger(__name__)


      def run_forever(queue: JobQueue, handlers: JobHandlers) -> None:
          while True:
              job = queue.take()
              try:
                  handlers.run(job)
              except Exception:
                  logger.exception("job %s failed", job.id)
                  queue.mark_failed(job.id)
  expected_output:
    outcome: valid
- name: an account erasure suppresses every storage error and still reports the user's files erased
  inputs:
    file: privacy/erasure.py
    after: |
      import contextlib

      from privacy.models import ErasureReceipt, User
      from privacy.storage import FileStore


      def erase_files(store: FileStore, user: User) -> ErasureReceipt:
          with contextlib.suppress(Exception):
              store.delete_prefix(f"users/{user.id}/")
          return ErasureReceipt(user_id=user.id, files_erased=True)
  expected_output:
    outcome: invalid
- name: rate lookups that time out are retried a few times and the last timeout is raised
  inputs:
    file: fx/rates.py
    after: |
      import time

      from fx.client import RatesClient, RatesTimeout
      from fx.models import RateTable

      ATTEMPTS = 3
      BACKOFF_SECONDS = 2.0


      def latest_rates(client: RatesClient) -> RateTable:
          attempt = 1
          while True:
              try:
                  return client.latest()
              except RatesTimeout:
                  if attempt == ATTEMPTS:
                      raise
                  time.sleep(BACKOFF_SECONDS * attempt)
                  attempt += 1
  expected_output:
    outcome: valid
- name: a report that fails to write removes its half-written file and raises the same error
  inputs:
    file: reports/publish.py
    after: |
      from pathlib import Path

      from reports.models import Report


      def write_report(report: Report, target: Path) -> None:
          partial = target.with_suffix(".partial")
          try:
              partial.write_text(report.render())
          except OSError:
              partial.unlink(missing_ok=True)
              raise
          partial.replace(target)
  expected_output:
    outcome: valid
- name: stopping a child process that has already exited on its own is not an error
  inputs:
    file: supervisor/children.py
    after: |
      import os
      import signal


      def stop_child(pid: int) -> None:
          try:
              os.kill(pid, signal.SIGTERM)
          except ProcessLookupError:
              pass  # the child already exited, which is the state stopping it asks for
  expected_output:
    outcome: valid
- name: a courier webhook signing key missing from the config file falls back to an empty one, so anyone can forge a delivery update
  inputs:
    file: deliveries/webhooks.py
    after: |
      import hashlib
      import hmac
      from configparser import ConfigParser


      def signature_valid(parser: ConfigParser, body: bytes, signature: str) -> bool:
          key = parser.get("courier", "webhook_signing_key", fallback="")
          expected = hmac.new(key.encode(), body, hashlib.sha256).hexdigest()
          return hmac.compare_digest(expected, signature)
  expected_output:
    outcome: invalid
- name: a parcel whose required weight is missing is charged as weighing nothing, so it ships for free
