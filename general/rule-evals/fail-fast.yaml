- name: seats left are clamped at zero although booking refuses to overbook, so an overbooked flight shows as merely full
  inputs:
    file: flights/models.py
    before: |
      from dataclasses import dataclass


      class Overbooked(Exception):
          pass


      @dataclass
      class Flight:
          """booked never exceeds capacity: book() is the only code that changes it,
          and it refuses a booking that would overbook the flight."""

          number: str
          capacity: int
          booked: int = 0

          def book(self, seats: int) -> None:
              if self.booked + seats > self.capacity:
                  raise Overbooked(self.number)
              self.booked += seats
    after: |
      from dataclasses import dataclass


      class Overbooked(Exception):
          pass


      @dataclass
      class Flight:
          """booked never exceeds capacity: book() is the only code that changes it,
          and it refuses a booking that would overbook the flight."""

          number: str
          capacity: int
          booked: int = 0

          def book(self, seats: int) -> None:
              if self.booked + seats > self.capacity:
                  raise Overbooked(self.number)
              self.booked += seats

          def seats_left(self) -> int:
              return max(0, self.capacity - self.booked)
  expected_output:
    outcome: invalid
- name: a page size typed into the search form is kept between one and a hundred
