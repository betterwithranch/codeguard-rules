- name: a card capture that times out is retried a few times and the last error is thrown
  inputs:
    file: payments/capture.ts
    after: |
      import { gateway, GatewayTimeout, type Capture } from "./gateway";

      const ATTEMPTS = 3;

      export async function capture(paymentId: string): Promise<Capture> {
        for (let attempt = 1; ; attempt++) {
          try {
            return await gateway.capture(paymentId);
          } catch (err) {
            if (!(err instanceof GatewayTimeout) || attempt === ATTEMPTS) {
              throw err;
            }
            await new Promise((resolve) => setTimeout(resolve, attempt * 500));
          }
        }
      }
  expected_output:
    outcome: valid
- name: a failed stock move rolls back its transaction and throws the same error
  inputs:
    file: warehouse/moves.ts
    after: |
      import type { Database } from "./database";
      import type { StockMove } from "./stock";

      export async function applyMove(db: Database, move: StockMove): Promise<void> {
        const tx = await db.begin();
        try {
          await tx.decrement(move.fromBin, move.sku, move.quantity);
          await tx.increment(move.toBin, move.sku, move.quantity);
          await tx.commit();
        } catch (err) {
          await tx.rollback();
          throw err;
        }
      }
  expected_output:
    outcome: valid
