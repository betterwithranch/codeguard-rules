- name: a checkout whose session cart the program itself stored at login is missing gets an empty cart, so the customer pays for nothing
  inputs:
    file: shop/sessions.py
    before: |
      from shop.carts import Cart


      class CartSessions:
          """start() stores a cart for each session at login; checkout() is the only
          code that removes one."""

          def __init__(self) -> None:
              self._carts: dict[str, Cart] = {}

          def start(self, session_id: str) -> None:
              self._carts[session_id] = Cart()
    after: |
      from shop.carts import Cart


      class CartSessions:
          """start() stores a cart for each session at login; checkout() is the only
          code that removes one."""

          def __init__(self) -> None:
              self._carts: dict[str, Cart] = {}

          def start(self, session_id: str) -> None:
              self._carts[session_id] = Cart()

          def checkout(self, session_id: str) -> Cart:
              return self._carts.pop(session_id, Cart())
  expected_output:
    outcome: invalid
- name: a plan with no price in the program's price table is billed at zero, so its subscribers are charged nothing
  inputs:
    file: billing/renewals.py
    unchanged:
      billing/__init__.py: ""
      billing/plans.py: |
        from decimal import Decimal
        from enum import Enum


        class Plan(Enum):
            STARTER = "starter"
            TEAM = "team"
            ENTERPRISE = "enterprise"


        MONTHLY_PRICES: dict[Plan, Decimal] = {
            Plan.STARTER: Decimal("9.00"),
            Plan.TEAM: Decimal("49.00"),
            Plan.ENTERPRISE: Decimal("499.00"),
        }
        """Every plan has a monthly price; no plan is free."""
    after: |
      from decimal import Decimal

      from billing.models import Subscription
      from billing.plans import MONTHLY_PRICES


      def renewal_amount(subscription: Subscription) -> Decimal:
          price = MONTHLY_PRICES.get(subscription.plan)
          if price is None:
              price = Decimal(0)
          return price * subscription.seats
  expected_output:
    outcome: invalid
- name: a plan with no price in the program's price table raises, naming the plan, instead of billing the renewal
  inputs:
    file: billing/renewals.py
    unchanged:
      billing/__init__.py: ""
      billing/plans.py: |
        from decimal import Decimal
        from enum import Enum


        class Plan(Enum):
            STARTER = "starter"
            TEAM = "team"
            ENTERPRISE = "enterprise"


        MONTHLY_PRICES: dict[Plan, Decimal] = {
            Plan.STARTER: Decimal("9.00"),
            Plan.TEAM: Decimal("49.00"),
            Plan.ENTERPRISE: Decimal("499.00"),
        }
        """Every plan has a monthly price; no plan is free."""
    after: |
      from decimal import Decimal

      from billing.errors import UnpricedPlan
      from billing.models import Subscription
      from billing.plans import MONTHLY_PRICES


      def renewal_amount(subscription: Subscription) -> Decimal:
          price = MONTHLY_PRICES.get(subscription.plan)
          if price is None:
              raise UnpricedPlan(subscription.plan)
          return price * subscription.seats
  expected_output:
    outcome: valid
