- name: meter readings that fail to parse are skipped, so the average is taken over a partial day without saying so
  inputs:
    file: meters/daily.ts
    unchanged:
      meters/reading.ts: |
        export interface Reading {
          meterId: string;
          kwh: number;
        }

        /** The line's reading, or undefined when the line can't be parsed. */
        export function parseReading(line: string): Reading | undefined {
          const match = /^(\w+) (\d+(?:\.\d+)?)$/.exec(line);
          if (match === null) {
            return undefined;
          }
          return { meterId: match[1], kwh: Number(match[2]) };
        }
    after: |
      import { parseReading, type Reading } from "./reading";

      export function dailyAverage(lines: string[]): number {
        const readings: Reading[] = [];
        for (const line of lines) {
          const reading = parseReading(line);
          if (reading === undefined) {
            continue;
          }
          readings.push(reading);
        }
        return readings.reduce((sum, reading) => sum + reading.kwh, 0) / readings.length;
      }
  expected_output:
    outcome: invalid
