- name: a typescript temperature band is read by both steps of the sensor check but never updated
  inputs:
    file: sensors/check.ts
    after: |
      export interface TemperatureBand {
        readonly lowCelsius: number;
        readonly highCelsius: number;
      }

      export function dropOutOfBand(band: TemperatureBand, readings: readonly number[]): number[] {
        return readings.filter((reading) => band.lowCelsius <= reading && reading <= band.highCelsius);
      }

      export function nearBandEdges(band: TemperatureBand, readings: readonly number[]): number[] {
        return readings.filter(
          (reading) => reading - band.lowCelsius < 1 || band.highCelsius - reading < 1,
        );
      }

      export function readingsToWatch(band: TemperatureBand, readings: readonly number[]): number[] {
        return nearBandEdges(band, dropOutOfBand(band, readings));
      }
  expected_output:
    outcome: valid
