cases:
- name: a cleanup workflow module defines the state its steps return updated copies of
  inputs:
    file: cleanup/workflow.py
    after: |
      from dataclasses import dataclass, replace


      @dataclass(frozen=True)
      class CleanupState:
          source_name: str
          text: str


      def drop_blank_lines(state: CleanupState) -> CleanupState:
          kept = [line for line in state.text.splitlines() if line.strip()]
          return replace(state, text="\n".join(kept))


      def strip_trailing_spaces(state: CleanupState) -> CleanupState:
          stripped = [line.rstrip() for line in state.text.splitlines()]
          return replace(state, text="\n".join(stripped))


      def clean(source_name: str, text: str) -> CleanupState:
          state = CleanupState(source_name=source_name, text=text)
          return strip_trailing_spaces(drop_blank_lines(state))
  expected_output:
    outcome: invalid
- name: a survey pipeline module defines the state its steps change in place
  inputs:
    file: surveys/pipeline.py
    after: |
      from collections import Counter
      from dataclasses import dataclass, field


      @dataclass
      class TallyState:
          answers: list[str]
          counts: Counter[str] = field(default_factory=Counter)


      def drop_blank_answers(state: TallyState) -> None:
          state.answers = [answer for answer in state.answers if answer.strip()]


      def count_choices(state: TallyState) -> None:
          state.counts = Counter(state.answers)


      def tally(answers: list[str]) -> TallyState:
          state = TallyState(answers=answers)
          drop_blank_answers(state)
          count_choices(state)
          return state
  expected_output:
    outcome: invalid
- name: a langgraph triage graph module declares the state its nodes merge label updates into
  inputs:
    file: triage/graph.py
    after: |
      import operator
      from typing import Annotated, TypedDict

      from langgraph.graph import END, START, StateGraph


      class TriageState(TypedDict):
          ticket_text: str
          labels: Annotated[list[str], operator.add]


      def label_outage(state: TriageState) -> dict[str, list[str]]:
          return {"labels": ["outage"] if "is down" in state["ticket_text"].lower() else []}


      def label_long(state: TriageState) -> dict[str, list[str]]:
          return {"labels": ["long"] if len(state["ticket_text"].split()) > 300 else []}


      def build_triage_graph() -> StateGraph[TriageState]:
          graph = StateGraph(TriageState)
          graph.add_node("label_outage", label_outage)
          graph.add_node("label_long", label_long)
          graph.add_edge(START, "label_outage")
          graph.add_edge("label_outage", "label_long")
          graph.add_edge("label_long", END)
          return graph
  expected_output:
    outcome: invalid
- name: an index build runner module defines the state it checkpoints after each step
  inputs:
    file: indexing/runner.py
    unchanged:
      indexing/checkpoints.py: |
        from typing import Protocol


        class CheckpointStore(Protocol):
            def save(self, key: str, payload: str) -> None: ...
    after: |
      from pydantic import BaseModel

      from indexing.checkpoints import CheckpointStore

      STOPWORDS = frozenset({"a", "an", "the", "of"})


      class IndexBuildState(BaseModel):
          build_id: str
          terms: list[str]


      def lowercase_terms(state: IndexBuildState) -> IndexBuildState:
          return state.model_copy(update={"terms": [term.lower() for term in state.terms]})


      def drop_stopwords(state: IndexBuildState) -> IndexBuildState:
          return state.model_copy(update={"terms": [term for term in state.terms if term not in STOPWORDS]})


      def build_index(state: IndexBuildState, checkpoints: CheckpointStore) -> IndexBuildState:
          for step in (lowercase_terms, drop_stopwords):
              state = step(state)
              checkpoints.save(state.build_id, state.model_dump_json())
          return state
  expected_output:
    outcome: invalid
