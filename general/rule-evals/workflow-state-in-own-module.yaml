- name: a moderation state module also defines the reducer its severity field names
  inputs:
    file: moderation/state.py
    unchanged:
      moderation/graph.py: |
        from langgraph.graph import END, START, StateGraph

        from moderation.state import ModerationState


        def score_profanity(state: ModerationState) -> dict[str, int]:
            return {"severity": 3 if "damn" in state["comment"].lower() else 0}


        def score_links(state: ModerationState) -> dict[str, int]:
            return {"severity": 2 if "http" in state["comment"] else 0}


        def build_moderation_graph() -> StateGraph[ModerationState]:
            graph = StateGraph(ModerationState)
            graph.add_node("score_profanity", score_profanity)
            graph.add_node("score_links", score_links)
            graph.add_edge(START, "score_profanity")
            graph.add_edge("score_profanity", "score_links")
            graph.add_edge("score_links", END)
            return graph
    after: |
      from typing import Annotated, TypedDict


      def keep_highest(current: int, update: int) -> int:
          return max(current, update)


      class ModerationState(TypedDict):
          comment: str
          severity: Annotated[int, keep_highest]
  expected_output:
    outcome: valid
