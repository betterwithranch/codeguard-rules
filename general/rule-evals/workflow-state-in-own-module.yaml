- name: a price band is read by both steps of the price check but never updated
  inputs:
    file: pricing/price_check.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class PriceBand:
          floor_cents: int
          ceiling_cents: int


      def drop_outside_band(band: PriceBand, prices: list[int]) -> list[int]:
          return [price for price in prices if band.floor_cents <= price <= band.ceiling_cents]


      def near_band_edges(band: PriceBand, prices: list[int]) -> list[int]:
          return [
              price
              for price in prices
              if price - band.floor_cents < 100 or band.ceiling_cents - price < 100
          ]


      def prices_to_review(band: PriceBand, prices: list[int]) -> list[int]:
          return near_band_edges(band, drop_outside_band(band, prices))
  expected_output:
    outcome: valid
