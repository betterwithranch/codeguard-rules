- name: a typescript risk state module also exports the reducer its score field names
  inputs:
    file: scoring/state.ts
    unchanged:
      scoring/graph.ts: |
        import { END, START, StateGraph } from "@langchain/langgraph";

        import { RiskState } from "./state";

        type Risk = typeof RiskState.State;

        function scoreAmount(state: Risk): Partial<Risk> {
          return { riskScore: state.amountCents > 1_000_000 ? 7 : 1 };
        }

        function scoreNewAccount(state: Risk): Partial<Risk> {
          return { riskScore: state.accountAgeDays < 30 ? 5 : 1 };
        }

        export function buildRiskGraph() {
          return new StateGraph(RiskState)
            .addNode("scoreAmount", scoreAmount)
            .addNode("scoreNewAccount", scoreNewAccount)
            .addEdge(START, "scoreAmount")
            .addEdge("scoreAmount", "scoreNewAccount")
            .addEdge("scoreNewAccount", END)
            .compile();
        }
    after: |
      import { Annotation } from "@langchain/langgraph";

      export function keepHighest(current: number, update: number): number {
        return Math.max(current, update);
      }

      export const RiskState = Annotation.Root({
        amountCents: Annotation<number>,
        accountAgeDays: Annotation<number>,
        riskScore: Annotation<number>({ reducer: keepHighest, default: () => 1 }),
      });
  expected_output:
    outcome: valid
