- name: a typescript recount module declares the state its steps change in place
  inputs:
    file: inventory/recount.ts
    after: |
      export interface RecountState {
        scanned: string[];
        missing: string[];
      }

      export function addScans(state: RecountState, scannedSkus: readonly string[]): void {
        state.scanned.push(...scannedSkus);
      }

      export function findMissing(state: RecountState, expectedSkus: readonly string[]): void {
        state.missing = expectedSkus.filter((sku) => !state.scanned.includes(sku));
      }

      export function recount(expectedSkus: readonly string[], scannedSkus: readonly string[]): RecountState {
        const state: RecountState = { scanned: [], missing: [] };
        addScans(state, scannedSkus);
        findMissing(state, expectedSkus);
        return state;
      }
  expected_output:
    outcome: invalid
- name: a langgraph.js escalation graph module declares the state its nodes merge flag updates into
  inputs:
    file: support/graph.ts
    after: |
      import { Annotation, END, START, StateGraph } from "@langchain/langgraph";

      export const EscalationState = Annotation.Root({
        message: Annotation<string>,
        flags: Annotation<string[]>({
          reducer: (current, update) => current.concat(update),
          default: () => [],
        }),
      });

      type Escalation = typeof EscalationState.State;

      function flagRefund(state: Escalation): Partial<Escalation> {
        return { flags: state.message.toLowerCase().includes("refund") ? ["refund"] : [] };
      }

      function flagUrgent(state: Escalation): Partial<Escalation> {
        return { flags: /!{3,}/.test(state.message) ? ["urgent"] : [] };
      }

      export function buildEscalationGraph() {
        return new StateGraph(EscalationState)
          .addNode("flagRefund", flagRefund)
          .addNode("flagUrgent", flagUrgent)
          .addEdge(START, "flagRefund")
          .addEdge("flagRefund", "flagUrgent")
          .addEdge("flagUrgent", END)
          .compile();
      }
  expected_output:
    outcome: invalid
- name: a typescript export runner module declares the state it checkpoints after each step
  inputs:
    file: exports/runner.ts
    unchanged:
      exports/checkpoints.ts: |
        export interface CheckpointStore {
          save(key: string, payload: string): Promise<void>;
        }
    after: |
      import type { CheckpointStore } from "./checkpoints";

      export interface ExportState {
        readonly runId: string;
        readonly lines: readonly string[];
      }

      export function trimLines(state: ExportState): ExportState {
        return { ...state, lines: state.lines.map((line) => line.trim()) };
      }

      export function dropEmptyLines(state: ExportState): ExportState {
        return { ...state, lines: state.lines.filter((line) => line.length > 0) };
      }

      export async function runExport(state: ExportState, checkpoints: CheckpointStore): Promise<ExportState> {
        let current = state;
        for (const step of [trimLines, dropEmptyLines]) {
          current = step(current);
          await checkpoints.save(current.runId, JSON.stringify(current));
        }
        return current;
      }
  expected_output:
    outcome: invalid
