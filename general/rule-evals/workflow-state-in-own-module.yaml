- name: a delivery state module also defines a private attempt type the state uses
  inputs:
    file: webhooks/delivery_state.py
    unchanged:
      webhooks/delivery.py: |
        from datetime import datetime

        from webhooks.delivery_state import DeliveryState


        def record_response(state: DeliveryState, status_code: int, sent_at: datetime) -> DeliveryState:
            return state.with_attempt(status_code, sent_at)
    after: |
      from dataclasses import dataclass, replace
      from datetime import datetime


      @dataclass(frozen=True)
      class _Attempt:
          status_code: int
          sent_at: datetime


      @dataclass(frozen=True)
      class DeliveryState:
          webhook_id: str
          attempts: tuple[_Attempt, ...] = ()

          def with_attempt(self, status_code: int, sent_at: datetime) -> "DeliveryState":
              return replace(self, attempts=(*self.attempts, _Attempt(status_code, sent_at)))

          def succeeded(self) -> bool:
              return any(200 <= attempt.status_code < 300 for attempt in self.attempts)
  expected_output:
    outcome: valid
