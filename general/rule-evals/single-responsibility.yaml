cases:
- name: the timing system's XML and the age-group award rules share one function, so a new timing vendor means editing the awards
  inputs:
    file: races/podium.py
    after: |
      import xml.etree.ElementTree as ET
      from collections import defaultdict


      CHRONOTRACK = "{urn:chronotrack:results:2}"


      def age_group_podiums(chronotrack_xml: str) -> dict[str, list[str]]:
          finishers = []
          for element in ET.fromstring(chronotrack_xml).iter(f"{CHRONOTRACK}Finisher"):
              hours, minutes, seconds = (int(part) for part in element.get("ChipTime").split(":"))
              finishers.append((element.get("BibNo"), int(element.get("AgeOnRaceDay")), hours * 3600 + minutes * 60 + seconds))

          groups: dict[str, list[tuple[int, str]]] = defaultdict(list)
          for bib, age, chip_seconds in finishers:
              if age < 30:
                  group = "open"
              elif age < 50:
                  group = "masters"
              else:
                  group = "grand masters"
              groups[group].append((chip_seconds, bib))
          return {group: [bib for _, bib in sorted(times)[:3]] for group, times in groups.items()}
  expected_output:
    outcome: invalid
- name: podiums are found by reading the timing file and then applying the award rules, each in its own module
  inputs:
    file: races/podium.py
    unchanged:
      races/timing_xml.py: |
        import xml.etree.ElementTree as ET
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Finisher:
            bib: str
            age: int
            seconds: int


        CHRONOTRACK = "{urn:chronotrack:results:2}"


        def read_finishers(chronotrack_xml: str) -> list[Finisher]:
            finishers = []
            for element in ET.fromstring(chronotrack_xml).iter(f"{CHRONOTRACK}Finisher"):
                hours, minutes, seconds = (int(part) for part in element.get("ChipTime").split(":"))
                seconds_total = hours * 3600 + minutes * 60 + seconds
                finishers.append(Finisher(element.get("BibNo"), int(element.get("AgeOnRaceDay")), seconds_total))
            return finishers
      races/awards.py: |
        from collections import defaultdict

        from races.timing_xml import Finisher


        def age_group(age: int) -> str:
            if age < 30:
                return "open"
            if age < 50:
                return "masters"
            return "grand masters"


        def podiums(finishers: list[Finisher]) -> dict[str, list[str]]:
            groups: dict[str, list[Finisher]] = defaultdict(list)
            for finisher in finishers:
                groups[age_group(finisher.age)].append(finisher)
            return {group: [f.bib for f in sorted(members, key=lambda f: f.seconds)[:3]] for group, members in groups.items()}
    after: |
      from races.awards import podiums
      from races.timing_xml import read_finishers


      def age_group_podiums(chronotrack_xml: str) -> dict[str, list[str]]:
          return podiums(read_finishers(chronotrack_xml))
  expected_output:
    outcome: valid
- name: locker assignments gain the label printer's command language, so a new printer model means editing the locker class
  inputs:
    file: gym/lockers.py
    before: |
      class LockerAssignments:
          def __init__(self, locker_numbers: list[int]) -> None:
              self._holders: dict[int, str | None] = {number: None for number in locker_numbers}

          def assign(self, member_id: str) -> int:
              number = min(n for n, holder in self._holders.items() if holder is None)
              self._holders[number] = member_id
              return number

          def release(self, number: int) -> None:
              self._holders[number] = None
    after: |
      class LockerAssignments:
          def __init__(self, locker_numbers: list[int]) -> None:
              self._holders: dict[int, str | None] = {number: None for number in locker_numbers}

          def assign(self, member_id: str) -> int:
              number = min(n for n, holder in self._holders.items() if holder is None)
              self._holders[number] = member_id
              return number

          def release(self, number: int) -> None:
              self._holders[number] = None

          def zpl_tag(self, number: int, member_name: str) -> str:
              return (
                  "^XA"
                  f"^FO40,30^A0N,60,60^FDLocker {number}^FS"
                  f"^FO40,110^A0N,30,30^FD{member_name.upper()[:24]}^FS"
                  f"^FO40,160^BCN,80,Y,N,N^FD{number:05d}^FS"
                  "^XZ"
              )
  expected_output:
    outcome: invalid
- name: locker assignments gain a swap built from their own assign and release
  inputs:
    file: gym/lockers.py
    before: |
      class LockerAssignments:
          def __init__(self, locker_numbers: list[int]) -> None:
              self._holders: dict[int, str | None] = {number: None for number in locker_numbers}

          def assign(self, member_id: str) -> int:
              number = min(n for n, holder in self._holders.items() if holder is None)
              self._holders[number] = member_id
              return number

          def release(self, number: int) -> None:
              self._holders[number] = None
    after: |
      class LockerAssignments:
          def __init__(self, locker_numbers: list[int]) -> None:
              self._holders: dict[int, str | None] = {number: None for number in locker_numbers}

          def assign(self, member_id: str) -> int:
              number = min(n for n, holder in self._holders.items() if holder is None)
              self._holders[number] = member_id
              return number

          def release(self, number: int) -> None:
              self._holders[number] = None

          def move(self, number: int) -> int:
              member_id = self._holders[number]
              if member_id is None:
                  raise ValueError(f"locker {number} is free")
              new_number = self.assign(member_id)
              self.release(number)
              return new_number
  expected_output:
    outcome: valid
- name: a distance adds, compares and displays itself from its own metres
  inputs:
    file: routes/distance.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True, order=True)
      class Distance:
          metres: int

          def __add__(self, other: "Distance") -> "Distance":
              return Distance(self.metres + other.metres)

          def __str__(self) -> str:
              if self.metres < 1000:
                  return f"{self.metres} m"
              return f"{self.metres / 1000:.1f} km"
  expected_output:
    outcome: valid
- name: a parking route works out the fee rules in its own body, so a new tariff means editing the HTTP endpoint
  inputs:
    file: parking/api.py
    after: |
      from datetime import datetime

      from fastapi import APIRouter

      router = APIRouter()


      @router.get("/quote")
      def quote(entered_at: datetime, left_at: datetime) -> dict[str, int]:
          minutes = int((left_at - entered_at).total_seconds() // 60)
          if minutes <= 30:
              cents = 0
          else:
              hours = -(-(minutes - 30) // 60)
              cents = min(hours * 350, 2400)
          return {"fee_cents": cents}
  expected_output:
    outcome: invalid
- name: a parking route asks the tariff for the fee and returns it
  inputs:
    file: parking/api.py
    unchanged:
      parking/tariff.py: |
        from datetime import datetime


        def parking_fee_cents(entered_at: datetime, left_at: datetime) -> int:
            minutes = int((left_at - entered_at).total_seconds() // 60)
            if minutes <= 30:
                return 0
            hours = -(-(minutes - 30) // 60)
            return min(hours * 350, 2400)
    after: |
      from datetime import datetime

      from fastapi import APIRouter

      from parking.tariff import parking_fee_cents

      router = APIRouter()


      @router.get("/quote")
      def quote(entered_at: datetime, left_at: datetime) -> dict[str, int]:
          return {"fee_cents": parking_fee_cents(entered_at, left_at)}
  expected_output:
    outcome: valid
- name: a GPX reader parses, converts and builds track points, all of the one file format
  inputs:
    file: routes/gpx.py
    after: |
      import xml.etree.ElementTree as ET
      from dataclasses import dataclass
      from datetime import datetime

      GPX = "{http://www.topografix.com/GPX/1/1}"


      @dataclass(frozen=True)
      class TrackPoint:
          latitude: float
          longitude: float
          elevation_m: float | None
          recorded_at: datetime | None


      def read_track(gpx_text: str) -> list[TrackPoint]:
          points = []
          for element in ET.fromstring(gpx_text).iter(f"{GPX}trkpt"):
              elevation = element.find(f"{GPX}ele")
              time = element.find(f"{GPX}time")
              points.append(
                  TrackPoint(
                      latitude=float(element.get("lat")),
                      longitude=float(element.get("lon")),
                      elevation_m=float(elevation.text) if elevation is not None else None,
                      recorded_at=datetime.fromisoformat(time.text) if time is not None else None,
                  )
              )
          return points
  expected_output:
    outcome: valid
