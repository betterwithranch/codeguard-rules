- name: a class roster renders students and decides the honour roll inline, so a grading policy change means editing the view
  inputs:
    file: src/school/ClassRoster.tsx
    after: |
      export interface Student {
        id: string;
        name: string;
        grades: number[];
      }

      const HONOUR_ROLL_MIN_AVERAGE = 3.5;
      const HONOUR_ROLL_MIN_GRADE = 3.0;

      export function ClassRoster({ students }: { students: Student[] }) {
        return (
          <ul>
            {students.map((student) => {
              const average = student.grades.reduce((sum, grade) => sum + grade, 0) / student.grades.length;
              const honours =
                average >= HONOUR_ROLL_MIN_AVERAGE && student.grades.every((grade) => grade >= HONOUR_ROLL_MIN_GRADE);
              return (
                <li key={student.id}>
                  {student.name}
                  {honours && <span className="badge">Honour roll</span>}
                </li>
              );
            })}
          </ul>
        );
      }
  expected_output:
    outcome: invalid
- name: a class roster renders students and asks the grading policy who is on the honour roll
  inputs:
    file: src/school/ClassRoster.tsx
    unchanged:
      src/school/honourRoll.ts: |
        const HONOUR_ROLL_MIN_AVERAGE = 3.5;
        const HONOUR_ROLL_MIN_GRADE = 3.0;

        export function onHonourRoll(grades: number[]): boolean {
          const average = grades.reduce((sum, grade) => sum + grade, 0) / grades.length;
          return average >= HONOUR_ROLL_MIN_AVERAGE && grades.every((grade) => grade >= HONOUR_ROLL_MIN_GRADE);
        }
    after: |
      import { onHonourRoll } from "./honourRoll";

      export interface Student {
        id: string;
        name: string;
        grades: number[];
      }

      export function ClassRoster({ students }: { students: Student[] }) {
        return (
          <ul>
            {students.map((student) => (
              <li key={student.id}>
                {student.name}
                {onHonourRoll(student.grades) && <span className="badge">Honour roll</span>}
              </li>
            ))}
          </ul>
        );
      }
  expected_output:
    outcome: valid
- name: a shift schedule gains Slack's message block format, so a Slack API change means editing the schedule
  inputs:
    file: src/staffing/shiftSchedule.ts
    before: |
      export class ShiftSchedule {
        private readonly staffed = new Map<string, string[]>();

        assign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, [...(this.staffed.get(shiftId) ?? []), employeeId]);
        }

        unassign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, (this.staffed.get(shiftId) ?? []).filter((id) => id !== employeeId));
        }
      }
    after: |
      export class ShiftSchedule {
        private readonly staffed = new Map<string, string[]>();

        assign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, [...(this.staffed.get(shiftId) ?? []), employeeId]);
        }

        unassign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, (this.staffed.get(shiftId) ?? []).filter((id) => id !== employeeId));
        }

        slackBlocks(shiftId: string): object[] {
          return [
            { type: "header", text: { type: "plain_text", text: `Shift ${shiftId}` } },
            {
              type: "section",
              fields: (this.staffed.get(shiftId) ?? []).map((id) => ({ type: "mrkdwn", text: `<@${id}>` })),
            },
            { type: "divider" },
          ];
        }
      }
  expected_output:
    outcome: invalid
- name: a shift schedule gains a swap built from its own assign and unassign
  inputs:
    file: src/staffing/shiftSchedule.ts
    before: |
      export class ShiftSchedule {
        private readonly staffed = new Map<string, string[]>();

        assign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, [...(this.staffed.get(shiftId) ?? []), employeeId]);
        }

        unassign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, (this.staffed.get(shiftId) ?? []).filter((id) => id !== employeeId));
        }
      }
    after: |
      export class ShiftSchedule {
        private readonly staffed = new Map<string, string[]>();

        assign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, [...(this.staffed.get(shiftId) ?? []), employeeId]);
        }

        unassign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, (this.staffed.get(shiftId) ?? []).filter((id) => id !== employeeId));
        }

        swap(shiftId: string, leaving: string, joining: string): void {
          if (!(this.staffed.get(shiftId) ?? []).includes(leaving)) {
            throw new Error(`${leaving} is not on shift ${shiftId}`);
          }
          this.unassign(shiftId, leaving);
          this.assign(shiftId, joining);
        }
      }
  expected_output:
    outcome: valid
- name: a duration adds, compares and displays itself from its own seconds
  inputs:
    file: src/time/duration.ts
    after: |
      export class Duration {
        constructor(readonly seconds: number) {}

        plus(other: Duration): Duration {
          return new Duration(this.seconds + other.seconds);
        }

        isLongerThan(other: Duration): boolean {
          return this.seconds > other.seconds;
        }

        toString(): string {
          const minutes = Math.floor(this.seconds / 60);
          return `${minutes}:${String(this.seconds % 60).padStart(2, "0")}`;
        }
      }
  expected_output:
    outcome: valid
- name: the survey tool's export layout and the NPS scoring rules share one function, so a new survey tool means editing the scoring
  inputs:
    file: src/feedback/nps.ts
    after: |
      interface TypeformExport {
        form_response: {
          definition: { fields: { id: string; ref: string; type: string }[] };
          answers: { field: { id: string }; type: string; number?: number }[];
        }[];
      }

      const PROMOTER_MIN_SCORE = 9;
      const DETRACTOR_MAX_SCORE = 6;

      export function netPromoterScore(exportJson: string): number {
        const payload: TypeformExport = JSON.parse(exportJson);
        const scores: number[] = [];
        for (const response of payload.form_response) {
          const question = response.definition.fields.find((f) => f.ref === "recommend" && f.type === "opinion_scale");
          const answer = response.answers.find((a) => a.field.id === question?.id && a.type === "number");
          if (answer?.number !== undefined) scores.push(answer.number);
        }
        if (scores.length === 0) return 0;
        const promoters = scores.filter((score) => score >= PROMOTER_MIN_SCORE).length;
        const detractors = scores.filter((score) => score <= DETRACTOR_MAX_SCORE).length;
        return Math.round(((promoters - detractors) / scores.length) * 100);
      }
  expected_output:
    outcome: invalid
- name: an order handler parses the request, calls the service and sends its answer
  inputs:
    file: src/orders/handlers.ts
    after: |
      import type { Request, Response } from "express";
      import { z } from "zod";
      import { orders } from "./service";

      const cancelBody = z.object({ reason: z.string().min(1) });

      export async function cancelOrder(req: Request, res: Response): Promise<void> {
        const { reason } = cancelBody.parse(req.body);
        const order = await orders.cancel(req.params.orderId, reason);
        res.status(200).json(order);
      }
  expected_output:
    outcome: valid
- name: a subtitle reader parses cue timings and text, all of the one file format
  inputs:
    file: src/media/vtt.ts
    after: |
      export interface Cue {
        startMs: number;
        endMs: number;
        text: string;
      }

      function toMs(stamp: string): number {
        const [h, m, s] = stamp.split(":");
        return (Number(h) * 3600 + Number(m) * 60 + Number(s)) * 1000;
      }

      export function readCues(vtt: string): Cue[] {
        return vtt
          .split(/\n\n+/)
          .filter((block) => block.includes("-->"))
          .map((block) => {
            const [timing, ...lines] = block.split("\n");
            const [start, end] = timing.split(" --> ");
            return { startMs: toMs(start), endMs: toMs(end.split(" ")[0]), text: lines.join("\n") };
          });
      }
  expected_output:
    outcome: valid
