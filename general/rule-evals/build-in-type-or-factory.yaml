- name: a carrier mapping module translates the carrier's typed scan event into the program's tracking update
  inputs:
    file: tracking/carrier_mapping.py
    unchanged:
      tracking/__init__.py: ""
      tracking/carrier.py: |
        from datetime import datetime

        from pydantic import BaseModel


        class CarrierScan(BaseModel):
            tracking_no: str
            scanned_at: datetime
            facility_code: str
            event_code: str
      tracking/models.py: |
        from dataclasses import dataclass
        from datetime import datetime
        from enum import Enum


        class Stage(Enum):
            PICKED_UP = "picked_up"
            IN_TRANSIT = "in_transit"
            DELIVERED = "delivered"


        @dataclass(frozen=True)
        class TrackingUpdate:
            tracking_number: str
            at: datetime
            location: str
            stage: Stage
    after: |
      from tracking.carrier import CarrierScan
      from tracking.models import Stage, TrackingUpdate

      STAGES = {"PU": Stage.PICKED_UP, "IT": Stage.IN_TRANSIT, "DL": Stage.DELIVERED}


      def tracking_update_from_scan(scan: CarrierScan) -> TrackingUpdate:
          return TrackingUpdate(
              tracking_number=scan.tracking_no,
              at=scan.scanned_at,
              location=scan.facility_code,
              stage=STAGES[scan.event_code],
          )
  expected_output:
    outcome: valid
- name: a device registry builds a device from the serial and owner it is given and stores it, passing its parameters through unchanged
  inputs:
    file: devices/registry.py
    unchanged:
      devices/__init__.py: ""
      devices/models.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Device:
            serial: str
            owner_id: int
      devices/ports.py: |
        from typing import Protocol

        from devices.models import Device


        class DeviceStore(Protocol):
            def add(self, device: Device) -> None: ...
    after: |
      from devices.models import Device
      from devices.ports import DeviceStore


      class DeviceRegistry:
          def __init__(self, store: DeviceStore) -> None:
              self.store = store

          def register(self, serial: str, owner_id: int) -> Device:
              device = Device(serial=serial, owner_id=owner_id)
              self.store.add(device)
              return device
  expected_output:
    outcome: valid
- name: an export service starts each export job as queued, a value from no source, with the requester it is given
  inputs:
    file: exports/service.py
    unchanged:
      exports/__init__.py: ""
      exports/models.py: |
        from dataclasses import dataclass
        from enum import Enum


        class ExportStatus(Enum):
            QUEUED = "queued"
            RUNNING = "running"
            DONE = "done"


        @dataclass(frozen=True)
        class ExportJob:
            requested_by: int
            status: ExportStatus
      exports/ports.py: |
        from typing import Protocol

        from exports.models import ExportJob


        class ExportQueue(Protocol):
            def push(self, job: ExportJob) -> None: ...
    after: |
      from exports.models import ExportJob, ExportStatus
      from exports.ports import ExportQueue


      class ExportService:
          def __init__(self, queue: ExportQueue) -> None:
              self.queue = queue

          def request_export(self, requested_by: int) -> ExportJob:
              job = ExportJob(requested_by=requested_by, status=ExportStatus.QUEUED)
              self.queue.push(job)
              return job
  expected_output:
    outcome: valid
