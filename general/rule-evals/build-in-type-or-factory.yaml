- name: a storage service throws a quota error carrying the workspace's id and usage, which raises rather than builds
  inputs:
    file: storage/uploads.ts
    unchanged:
      storage/errors.ts: |
        export class QuotaExceeded extends Error {
          constructor(readonly workspaceId: string, readonly usedBytes: number) {
            super(`workspace ${workspaceId} has used ${usedBytes} bytes`);
          }
        }
      storage/ports.ts: |
        export interface Workspace {
          id: string;
          quotaBytes: number;
        }

        export interface UsageMeter {
          usedBytes(workspaceId: string): Promise<number>;
        }
    after: |
      import { QuotaExceeded } from "./errors";
      import type { UsageMeter, Workspace } from "./ports";

      export class UploadGuard {
        constructor(private readonly meter: UsageMeter) {}

        async checkRoom(workspace: Workspace, incomingBytes: number): Promise<void> {
          const used = await this.meter.usedBytes(workspace.id);
          if (used + incomingBytes > workspace.quotaBytes) {
            throw new QuotaExceeded(workspace.id, used);
          }
        }
      }
  expected_output:
    outcome: valid
- name: a cart totals function returns a literal of the totals it worked out, as its answer
  inputs:
    file: cart/totals.ts
    unchanged:
      cart/types.ts: |
        export interface CartLine {
          quantity: number;
          unitCents: number;
        }

        export interface CartTotals {
          itemCount: number;
          subtotalCents: number;
        }
    after: |
      import type { CartLine, CartTotals } from "./types";

      export function cartTotals(lines: CartLine[]): CartTotals {
        const itemCount = lines.reduce((sum, line) => sum + line.quantity, 0);
        const subtotalCents = lines.reduce((sum, line) => sum + line.quantity * line.unitCents, 0);
        return { itemCount, subtotalCents };
      }
  expected_output:
    outcome: valid
