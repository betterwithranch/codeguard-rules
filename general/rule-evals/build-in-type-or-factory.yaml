- name: a dispute handler builds the refund from the dispute's fields straight into the repository call, so a change to how refunds are made misses this place
  inputs:
    file: payments/disputes.py
    unchanged:
      payments/__init__.py: ""
      payments/models.py: |
        from dataclasses import dataclass
        from decimal import Decimal


        @dataclass(frozen=True)
        class Dispute:
            id: str
            order_id: int
            disputed_amount: Decimal
            reason: str


        @dataclass(frozen=True)
        class Refund:
            order_id: int
            amount: Decimal
            note: str
      payments/ports.py: |
        from typing import Protocol

        from payments.models import Refund


        class RefundRepository(Protocol):
            async def add(self, refund: Refund) -> None: ...


        class Ledger(Protocol):
            async def close_dispute(self, dispute_id: str) -> None: ...
    after: |
      from payments.models import Dispute, Refund
      from payments.ports import Ledger, RefundRepository


      class DisputeHandler:
          def __init__(self, refunds: RefundRepository, ledger: Ledger) -> None:
              self.refunds = refunds
              self.ledger = ledger

          async def accept(self, dispute: Dispute) -> None:
              await self.refunds.add(Refund(order_id=dispute.order_id, amount=dispute.disputed_amount, note=dispute.reason))
              await self.ledger.close_dispute(dispute.id)
