- name: a fine calculation returns the fine it worked out from the dates it was given, as its answer
  inputs:
    file: library/fines.py
    unchanged:
      library/__init__.py: ""
      library/models.py: |
        from dataclasses import dataclass
        from decimal import Decimal


        @dataclass(frozen=True)
        class Fine:
            days_late: int
            amount: Decimal
    after: |
      from datetime import date
      from decimal import Decimal

      from library.models import Fine


      def fine_for(due_on: date, returned_on: date) -> Fine:
          days_late = max((returned_on - due_on).days, 0)
          amount = min(Decimal("0.25") * days_late, Decimal("10.00"))
          return Fine(days_late=days_late, amount=amount)
  expected_output:
    outcome: valid
