- name: a comment handler adds a database record through the ORM session, which is the persistence library's to build
  inputs:
    file: blog/comments.py
    unchanged:
      blog/__init__.py: ""
      blog/tables.py: |
        from sqlalchemy import ForeignKey, String
        from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column


        class Base(DeclarativeBase):
            pass


        class Post(Base):
            __tablename__ = "posts"
            id: Mapped[int] = mapped_column(primary_key=True)
            title: Mapped[str] = mapped_column(String(200))


        class Reader(Base):
            __tablename__ = "readers"
            id: Mapped[int] = mapped_column(primary_key=True)
            name: Mapped[str] = mapped_column(String(100))


        class Comment(Base):
            __tablename__ = "comments"
            id: Mapped[int] = mapped_column(primary_key=True)
            post_id: Mapped[int] = mapped_column(ForeignKey("posts.id"))
            reader_id: Mapped[int] = mapped_column(ForeignKey("readers.id"))
            body: Mapped[str] = mapped_column(String(2000))
    after: |
      from sqlalchemy.orm import Session

      from blog.tables import Comment, Post, Reader


      def add_comment(session: Session, post: Post, reader: Reader, body: str) -> None:
          session.add(Comment(post_id=post.id, reader_id=reader.id, body=body))
          session.commit()
  expected_output:
    outcome: valid
- name: a backup job builds its archive path and size limit from library types, which are not the program's
  inputs:
    file: backups/job.py
    unchanged:
      backups/__init__.py: ""
      backups/settings.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class BackupSettings:
            root: str
            max_gigabytes: int
    after: |
      from decimal import Decimal
      from pathlib import Path

      from backups.settings import BackupSettings


      def archive_path(settings: BackupSettings, volume_name: str) -> Path:
          root = Path(settings.root)
          return root / f"{volume_name}.tar"


      def size_limit_bytes(settings: BackupSettings) -> Decimal:
          gigabytes = Decimal(settings.max_gigabytes)
          return gigabytes * 1024**3
  expected_output:
    outcome: valid
