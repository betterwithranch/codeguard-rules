cases:
- name: a lending service works out a loan's fields from the book and member among its other work, so a change to how loans are made misses this place
  inputs:
    file: library/lending.py
    unchanged:
      library/__init__.py: ""
      library/models.py: |
        from dataclasses import dataclass
        from datetime import date


        @dataclass(frozen=True)
        class Book:
            id: int
            title: str


        @dataclass(frozen=True)
        class Member:
            id: int
            email: str


        @dataclass(frozen=True)
        class Loan:
            book_id: int
            member_id: int
            due_on: date
      library/ports.py: |
        from datetime import date
        from typing import Protocol

        from library.models import Loan


        class LoanRepository(Protocol):
            def add(self, loan: Loan) -> None: ...


        class Mailer(Protocol):
            def send_due_date(self, email: str, due_on: date) -> None: ...
    after: |
      from datetime import date, timedelta

      from library.models import Book, Loan, Member
      from library.ports import LoanRepository, Mailer


      class LendingService:
          def __init__(self, loans: LoanRepository, mailer: Mailer) -> None:
              self.loans = loans
              self.mailer = mailer

          def lend(self, book: Book, member: Member, today: date) -> None:
              loan = Loan(book_id=book.id, member_id=member.id, due_on=today + timedelta(days=21))
              self.loans.add(loan)
              self.mailer.send_due_date(member.email, loan.due_on)
  expected_output:
    outcome: invalid
- name: a lending service has the loan's own constructor work out its fields, so how loans are made stays with the loan
  inputs:
    file: library/lending.py
    unchanged:
      library/__init__.py: ""
      library/models.py: |
        from dataclasses import dataclass
        from datetime import date, timedelta


        @dataclass(frozen=True)
        class Book:
            id: int
            title: str


        @dataclass(frozen=True)
        class Member:
            id: int
            email: str


        @dataclass(frozen=True)
        class Loan:
            book_id: int
            member_id: int
            due_on: date

            @classmethod
            def start(cls, book: Book, member: Member, today: date) -> "Loan":
                return cls(book_id=book.id, member_id=member.id, due_on=today + timedelta(days=21))
      library/ports.py: |
        from datetime import date
        from typing import Protocol

        from library.models import Loan


        class LoanRepository(Protocol):
            def add(self, loan: Loan) -> None: ...


        class Mailer(Protocol):
            def send_due_date(self, email: str, due_on: date) -> None: ...
    after: |
      from datetime import date

      from library.models import Book, Loan, Member
      from library.ports import LoanRepository, Mailer


      class LendingService:
          def __init__(self, loans: LoanRepository, mailer: Mailer) -> None:
              self.loans = loans
              self.mailer = mailer

          def lend(self, book: Book, member: Member, today: date) -> None:
              loan = Loan.start(book, member, today=today)
              self.loans.add(loan)
              self.mailer.send_due_date(member.email, loan.due_on)
  expected_output:
    outcome: valid
