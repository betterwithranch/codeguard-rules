- name: an invoice factory builds each invoice with the number and date its injected collaborators give, which the invoice can't hold itself
  inputs:
    file: billing/invoice_factory.py
    unchanged:
      billing/__init__.py: ""
      billing/models.py: |
        from dataclasses import dataclass
        from datetime import date
        from decimal import Decimal


        @dataclass(frozen=True)
        class Order:
            id: int
            total: Decimal


        @dataclass(frozen=True)
        class Invoice:
            number: str
            order_id: int
            total: Decimal
            issued_on: date
      billing/ports.py: |
        from datetime import date
        from typing import Protocol


        class Calendar(Protocol):
            def today(self) -> date: ...


        class InvoiceNumbers(Protocol):
            def next_number(self) -> str: ...
    after: |
      from billing.models import Invoice, Order
      from billing.ports import Calendar, InvoiceNumbers


      class InvoiceFactory:
          def __init__(self, calendar: Calendar, numbers: InvoiceNumbers) -> None:
              self.calendar = calendar
              self.numbers = numbers

          def issue(self, order: Order) -> Invoice:
              return Invoice(
                  number=self.numbers.next_number(),
                  order_id=order.id,
                  total=order.total,
                  issued_on=self.calendar.today(),
              )
  expected_output:
    outcome: valid
