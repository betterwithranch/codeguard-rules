id: creation-method
valid:
# Module function named create
- |
  def create_invoice(params):
      return params
# Method of an ordinary class with another name
- |
  class ExampleInvoiceService:
      def total(self):
          return 1
# Nested function named create inside a method
- |
  class ExampleInvoiceService:
      def total(self):
          def create_line():
              return 1
          return create_line()
invalid:
# create method on any class
- |
  class ExampleInvoiceService:
      def create_for_admin(self, params):
          return params
# classmethod constructor named for
- |
  class ExampleInvoice:
      @classmethod
      def for_checkout(cls, order):
          return cls()
# staticmethod constructor named create
- |
  class ExampleInvoice:
      @staticmethod
      def create_draft(order):
          return ExampleInvoice()
# Any method of a Factory class
- |
  class ExampleInvoiceFactory:
      def admin_invoice(self, params):
          return params
# Any method of a Creator class
- |
  class ExampleInvoiceCreator:
      def invoice(self, params):
          return params
