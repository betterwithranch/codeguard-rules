id: no-class-level-mutable-container
valid:
  # Each instance gets its own list in __init__
  - |
    class ExampleCart:
        items = []

        def __init__(self):
            self.items = []

        def add(self, item):
            self.items.append(item)

  # A container mutated through the class, not self
  - |
    class ExampleRegistry:
        handlers = {}

        def register(self, name, handler):
            type(self).handlers[name] = handler

  # A class-level container only read through self
  - |
    class ExampleRouter:
        routes = {"home": "/"}

        def path(self, name):
            return self.routes[name]

  # A class-level tuple, which can't be mutated in place
  - |
    class ExampleLimits:
        sizes = ("s", "m", "l")

        def first(self):
            return self.sizes[0]

  # A list built per call and mutated locally
  - |
    class ExampleReport:
        def lines(self, rows):
            lines = []
            lines.append(rows[0])
            return lines

  # A dataclass field with a default factory
  - |
    from dataclasses import dataclass, field

    @dataclass
    class ExampleBasket:
        items: list[str] = field(default_factory=list)

        def add(self, item):
            self.items.append(item)

  # An integer counter incremented through self
  - |
    class ExampleCounter:
        count = 0

        def bump(self):
            self.count += 1

invalid:
  # A list method call through self
  - |
    class ExampleCart:
        items = []

        def add(self, item):
            self.items.append(item)

  # A dict item assignment through self
  - |
    class ExampleCache:
        entries = {}

        def put(self, key, value):
            self.entries[key] = value

  # An augmented assignment through self
  - |
    class ExampleLog:
        lines = []

        def write(self, line):
            self.lines += [line]

  # A delete of an item through self
  - |
    class ExampleCache:
        entries = {}

        def evict(self, key):
            del self.entries[key]

  # A set built by a call, mutated through self
  - |
    class ExampleSeen:
        ids = set()

        def mark(self, example_id):
            self.ids.add(example_id)

  # A defaultdict mutated through self
  - |
    from collections import defaultdict

    class ExampleIndex:
        by_key = defaultdict(list)

        def index(self, key, value):
            self.by_key.setdefault(key, []).append(value)

  # A comprehension-built dict mutated through self
  - |
    class ExampleTable:
        rows = {name: 0 for name in ("a", "b")}

        def reset(self):
            self.rows.clear()
