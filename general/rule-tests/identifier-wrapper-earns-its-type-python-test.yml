id: identifier-wrapper-earns-its-type-python
valid:
  # A wrapper with a method of its own
  - |
    @dataclass(frozen=True)
    class ExampleId:
        value: str

        def short(self):
            return self.value[:8]

  # A wrapper with a validator
  - |
    class ExampleKey(BaseModel):
        value: str

        @field_validator("value")
        @classmethod
        def has_prefix(cls, value):
            return value
  # A field with a pattern constraint
  - |
    class ExampleCode(BaseModel):
        value: str = Field(pattern=r"^ex_")

  # A field with an Annotated constraint
  - |
    class ExampleId(BaseModel):
        value: Annotated[str, StringConstraints(min_length=8)]

  # A field with a constrained type call
  - |
    class ExampleId(BaseModel):
        value: constr(min_length=8)

  # Two fields
  - |
    @dataclass(frozen=True)
    class ExampleKey:
        tenant: str
        value: str

  # An enum
  - |
    class ExampleCode(Enum):
        value: str

  # An ORM model
  - |
    class ExampleCode(models.Model):
        value: str

  # A one-field class not named for an identifier
  - |
    @dataclass(frozen=True)
    class ExampleAmount:
        value: int

  # A str subclass with a method
  - |
    class ExampleId(str):
        def short(self):
            return self[:8]

  # A str and Enum subclass
  - |
    class ExampleCode(str, Enum):
        pass

  # A float subclass
  - |
    class ExampleRatio(float):
        pass

