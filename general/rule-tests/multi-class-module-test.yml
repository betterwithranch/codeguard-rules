id: multi-class-module
valid:
# One public class
- |
  class Order:
      pass
# One public class and a private class
- |
  class Order:
      pass


  class _Line:
      pass
# One public class and a function
- |
  class Order:
      pass


  def total():
      return 1
# A nested class
- |
  class Order:
      class Line:
          pass
# One public class and a call that is not a class factory
- |
  class Order:
      pass


  DEFAULT = Order()
invalid:
# Two public classes
- |
  class Order:
      pass


  class Invoice:
      pass
# A decorated public class and a plain one
- |
