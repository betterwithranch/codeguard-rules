  class Order:
      pass


  class Invoice:
      pass
# A plain public class and a decorated one after it
- |
  class Order:
      pass


  @dataclass
  class Invoice:
      pass
# A public class and a functional NamedTuple
- |
  class Order:
      pass


  Line = NamedTuple("Line", [("sku", str)])
# A public class and a functional Enum
- |
  Status = Enum("Status", "OPEN SHIPPED")


  class Order:
      pass
