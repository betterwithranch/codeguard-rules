id: return-collection
valid:
# Returns an attribute
- |
  def total():
      return order.total
# Returns a named type
- |
  def review(order) -> OrderReview:
      return OrderReview(reason, held)
# Returns a list comprehension
- |
  def totals(orders):
      return [order.total for order in orders]
# Returns a dict comprehension
- |
  def by_id(orders):
      return {order.id: order for order in orders}
# Tuple built but not returned
- |
  def ship(order):
      pair = (order.carrier, order.number)
      send(pair)
# Returns a list annotation
- |
  def totals(orders) -> list[int]:
      return result
# Function annotated to return a named type
- |
  def review(order) -> OrderReview:
      result = build(order)
      return result
invalid:
# Returns a bare tuple
- |
  def review():
      return reason, held
# Returns a parenthesized tuple
- |
  def review():
      return (reason, held)
# Returns a dict literal
- |
  def pack(a):
      return {'a': a}
# Returns a dict call
- |
  def pack(a):
      return dict(a=a)
# Function annotated to return a tuple
- |
  def review() -> tuple[str, bool]:
      return result
# Function annotated to return a dict
- |
  def payload() -> dict[str, str]:
      return result
# Function annotated to return a tuple, building it in a variable
- |
  def review() -> tuple[str, bool]:
      result = (reason, held)
      return result
# Function annotated to return a typing Tuple
- |
  def review() -> Tuple[str, bool]:
      return result
