cases:
  - name: sleeps while a worker thread runs
    inputs:
      file: tests/test_order_worker.py
      after: |
        import threading
        import time

        from orders.worker import OrderWorker


        def test_worker_processes_queued_orders(order_queue):
            order_queue.put("ord-1")
            worker = OrderWorker(order_queue)
            thread = threading.Thread(target=worker.run, daemon=True)
            thread.start()
            time.sleep(0.1)

            assert worker.processed == ["ord-1"]
    expected_output:
      outcome: invalid
  - name: joins the worker thread before asserting
    inputs:
      file: tests/test_order_worker.py
      after: |
        import threading

        from orders.worker import OrderWorker


        def test_worker_processes_queued_orders(order_queue):
            order_queue.put("ord-1")
            order_queue.put(None)
            worker = OrderWorker(order_queue)
            thread = threading.Thread(target=worker.run)
            thread.start()
            thread.join()

            assert worker.processed == ["ord-1"]
    expected_output:
      outcome: valid
  - name: compares a timestamp to the real clock
    inputs:
      file: tests/test_invoices.py
      after: |
        from datetime import datetime

        from billing.invoices import issue_invoice


        def test_issue_invoice_stamps_the_issue_time(draft_invoice):
            invoice = issue_invoice(draft_invoice)

            assert invoice.issued_at == datetime.now()
    expected_output:
      outcome: invalid
  - name: compares a timestamp to a fake clock
    inputs:
      file: tests/test_invoices.py
      after: |
        from datetime import datetime

        from billing.invoices import issue_invoice
        from tests.fakes import FakeClock


        def test_issue_invoice_stamps_the_issue_time(draft_invoice):
            clock = FakeClock(datetime(2026, 3, 1, 9, 0))

            invoice = issue_invoice(draft_invoice, clock=clock)

            assert invoice.issued_at == clock.now()
    expected_output:
      outcome: valid
  - name: asserts the order of lines built from a set
    inputs:
      file: tests/test_picklists.py
      unchanged:
        warehouse/picklists.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class PickLine:
              sku: str


          def build_lines(skus: set[str]) -> list[PickLine]:
              return [PickLine(sku=sku) for sku in skus]
      after: |
        from warehouse.picklists import build_lines


        def test_build_lines_makes_one_line_per_sku():
            skus = {"PEN-2", "BOOK-1", "MUG-3"}

            lines = build_lines(skus)

            assert [line.sku for line in lines] == ["PEN-2", "BOOK-1", "MUG-3"]
    expected_output:
      outcome: invalid
  - name: compares the skus of lines built from a set as a set
    inputs:
      file: tests/test_picklists.py
      unchanged:
        warehouse/picklists.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class PickLine:
              sku: str


          def build_lines(skus: set[str]) -> list[PickLine]:
              return [PickLine(sku=sku) for sku in skus]
      after: |
        from warehouse.picklists import build_lines


        def test_build_lines_makes_one_line_per_sku():
            skus = {"PEN-2", "BOOK-1", "MUG-3"}

            lines = build_lines(skus)

            assert {line.sku for line in lines} == {"PEN-2", "BOOK-1", "MUG-3"}
    expected_output:
      outcome: valid
  - name: asserts the order of a directory listing
    inputs:
      file: tests/test_exports.py
      after: |
        import os

        from reports.exports import export_month


        def test_export_month_writes_one_file_per_region(tmp_path):
            export_month("2026-03", regions=["eu", "us"], folder=tmp_path)

            assert os.listdir(tmp_path) == ["eu.csv", "us.csv"]
    expected_output:
      outcome: invalid
  - name: sorts the directory listing before asserting
    inputs:
      file: tests/test_exports.py
      after: |
        import os

        from reports.exports import export_month


        def test_export_month_writes_one_file_per_region(tmp_path):
            export_month("2026-03", regions=["eu", "us"], folder=tmp_path)

            assert sorted(os.listdir(tmp_path)) == ["eu.csv", "us.csv"]
    expected_output:
      outcome: valid
  - name: picks a random sku whose price the test asserts
    inputs:
      file: tests/test_pricing.py
      after: |
        import random
        from decimal import Decimal

        from shop.pricing import price_for


        def test_price_for_returns_the_book_price():
            sku = random.choice(["BOOK-1", "PEN-2"])

            assert price_for(sku) == Decimal("12.00")
    expected_output:
      outcome: invalid
  - name: generates a random id no assertion reads
    inputs:
      file: tests/test_carts.py
      after: |
        import uuid
        from decimal import Decimal

        from shop.carts import Cart


        def test_cart_total_sums_its_lines():
            cart = Cart(id=str(uuid.uuid4()))
            cart.add(sku="BOOK-1", price=Decimal("12.00"), quantity=2)

            assert cart.total() == Decimal("24.00")
    expected_output:
      outcome: valid
  - name: reads the region from the machine's environment
    inputs:
      file: tests/test_regional_prices.py
      after: |
        import os
        from decimal import Decimal

        from shop.pricing import regional_price


        def test_regional_price_applies_the_eu_markup():
            region = os.environ.get("REGION", "us")

            assert regional_price(Decimal("10.00"), region) == Decimal("12.00")
    expected_output:
      outcome: invalid
  - name: sets the region in the environment before reading it
    inputs:
      file: tests/test_regional_prices.py
      after: |
        import os
        from decimal import Decimal

        from shop.pricing import regional_price


        def test_regional_price_applies_the_eu_markup(monkeypatch):
            monkeypatch.setenv("REGION", "eu")
            region = os.environ["REGION"]

            assert regional_price(Decimal("10.00"), region) == Decimal("12.00")
    expected_output:
      outcome: valid
  - name: expects the export dir under the home directory
    inputs:
