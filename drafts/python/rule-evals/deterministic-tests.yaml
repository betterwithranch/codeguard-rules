  - name: adds a line to an invoice total
    inputs:
      file: tests/test_invoices.py
      before: |
        from decimal import Decimal

        from billing.invoices import Invoice


        def test_total_sums_lines():
            invoice = Invoice(lines=[Decimal("10.00")])

            assert invoice.total() == Decimal("10.00")
      after: |
        from decimal import Decimal

        from billing.invoices import Invoice


        def test_total_sums_lines():
            invoice = Invoice(lines=[Decimal("10.00"), Decimal("5.00")])

            assert invoice.total() == Decimal("15.00")
    expected_output:
      outcome: skipped
