  - name: lists the values of a StrEnum subclass
    inputs:
      file: documents/kinds.py
      after: |
        from enum import StrEnum


        class LowercaseCode(StrEnum):
            @staticmethod
            def _generate_next_value_(name, start, count, last_values):
                return name.lower()


        class DocumentKind(LowercaseCode):
            CONTRACT = "contract"
            RECEIPT = "receipt"


        def kind_choices() -> list[str]:
            return [kind.value for kind in DocumentKind]
    expected_output:
      outcome: invalid
  - name: sorts StrEnum members by an attrgetter of value
    inputs:
      file: documents/kinds.py
      after: |
        from enum import StrEnum
        from operator import attrgetter


        class DocumentKind(StrEnum):
            CONTRACT = "contract"
            RECEIPT = "receipt"


        def sorted_kinds(kinds: list[DocumentKind]) -> list[DocumentKind]:
            return sorted(kinds, key=attrgetter("value"))
    expected_output:
      outcome: invalid
  - name: compares a pydantic StrEnum field's value
    inputs:
      file: payments/refunds.py
      after: |
        from enum import StrEnum

        from pydantic import BaseModel


        class RefundReason(StrEnum):
            DAMAGED = "damaged"
            LATE = "late"


        class RefundRequest(BaseModel):
            order_id: str
            reason: RefundReason


        def needs_photo(request: RefundRequest) -> bool:
            return request.reason.value == "damaged"
    expected_output:
      outcome: invalid
  - name: reads a meter reading's value field
    inputs:
      file: metering/usage.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class MeterReading:
            meter_id: str
            value: float


        def total_usage(readings: list[MeterReading]) -> float:
            return sum(reading.value for reading in readings)
    expected_output:
      outcome: valid
  - name: reads a shared counter's value
    inputs:
      file: workers/progress.py
      after: |
        from multiprocessing import Value


        def make_counter():
            return Value("i", 0)


        def processed(counter) -> int:
            with counter.get_lock():
                return counter.value
    expected_output:
      outcome: valid
  - name: reads a Django setting row's value
    inputs:
      file: settings_store/lookup.py
      after: |
        from django.db import models


        class SiteSetting(models.Model):
            key = models.CharField(max_length=64, unique=True)
            value = models.TextField()


        def setting(key: str) -> str:
            return SiteSetting.objects.get(key=key).value
    expected_output:
      outcome: valid
  - name: adds a member to a StrEnum
    inputs:
      file: shipping/shipment_status.py
      before: |
        from enum import StrEnum


        class ShipmentStatus(StrEnum):
            PENDING = "pending"
      after: |
        from enum import StrEnum


        class ShipmentStatus(StrEnum):
            PENDING = "pending"
            SHIPPED = "shipped"
    expected_output:
      outcome: skipped
  - name: formats a StrEnum member's name
    inputs:
      file: shipping/shipment_label.py
      before: |
        from enum import StrEnum


        class ShipmentStatus(StrEnum):
            PENDING = "pending"


        def label(status: ShipmentStatus) -> str:
            return f"Shipment is {status}"
      after: |
        from enum import StrEnum


        class ShipmentStatus(StrEnum):
            PENDING = "pending"


        def label(status: ShipmentStatus) -> str:
            return f"Shipment is {status.name.title()}"
    expected_output:
      outcome: skipped
