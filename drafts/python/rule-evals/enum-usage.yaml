cases:
  - name: formats a StrEnum field's value
    inputs:
      file: shipping/shipment_label.py
      before: |
        from dataclasses import dataclass
        from enum import StrEnum


        class ShipmentStatus(StrEnum):
            PENDING = "pending"
            SHIPPED = "shipped"


        @dataclass(frozen=True)
        class Shipment:
            status: ShipmentStatus


        def label(shipment: Shipment) -> str:
            return f"Shipment is {shipment.status}"
      after: |
        from dataclasses import dataclass
        from enum import StrEnum


        class ShipmentStatus(StrEnum):
            PENDING = "pending"
            SHIPPED = "shipped"


        @dataclass(frozen=True)
        class Shipment:
            status: ShipmentStatus


        def label(shipment: Shipment) -> str:
            return f"Shipment is {shipment.status.value}"
    expected_output:
      outcome: invalid
  - name: formats a plain Enum field's value
    inputs:
      file: shipping/shipment_label.py
      after: |
        from dataclasses import dataclass
        from enum import Enum


        class ShipmentStatus(Enum):
            PENDING = "pending"
            SHIPPED = "shipped"


        @dataclass(frozen=True)
        class Shipment:
            status: ShipmentStatus


        def label(shipment: Shipment) -> str:
            return f"Shipment is {shipment.status.value}"
    expected_output:
      outcome: valid
  - name: formats a str-mixin Enum field's value
    inputs:
      file: shipping/shipment_label.py
      after: |
        from dataclasses import dataclass
        from enum import Enum


        class ShipmentStatus(str, Enum):
            PENDING = "pending"
            SHIPPED = "shipped"


        @dataclass(frozen=True)
        class Shipment:
            status: ShipmentStatus


        def label(shipment: Shipment) -> str:
            return f"Shipment is {shipment.status.value}"
    expected_output:
      outcome: valid
  - name: keys a threshold table by IntEnum values
    inputs:
      file: alerts/thresholds.py
      after: |
        from enum import IntEnum


        class Priority(IntEnum):
            LOW = 1
            HIGH = 2


        RESPONSE_MINUTES = {
            Priority.LOW.value: 240,
            Priority.HIGH.value: 15,
        }


        def response_minutes(priority: Priority) -> int:
            return RESPONSE_MINUTES[priority.value]
    expected_output:
      outcome: invalid
  - name: keys a threshold table by plain Enum values
    inputs:
      file: alerts/thresholds.py
      after: |
        from enum import Enum


        class Priority(Enum):
            LOW = 1
            HIGH = 2


        RESPONSE_MINUTES = {
            Priority.LOW.value: 240,
            Priority.HIGH.value: 15,
        }


        def response_minutes(priority: Priority) -> int:
            return RESPONSE_MINUTES[priority.value]
    expected_output:
      outcome: valid
  - name: filters orders by a TextChoices value
    inputs:
      file: orders/queries.py
      after: |
        from django.db import models


        class OrderStatus(models.TextChoices):
            OPEN = "open", "Open"
            SHIPPED = "shipped", "Shipped"


        class Order(models.Model):
            status = models.CharField(max_length=16, choices=OrderStatus.choices)


        def shipped_orders() -> models.QuerySet[Order]:
            return Order.objects.filter(status=OrderStatus.SHIPPED.value)
    expected_output:
      outcome: invalid
  - name: serializes an imported StrEnum's value
    inputs:
      file: billing/invoice_payload.py
      before: |
        import json

        from billing.invoice import Invoice


        def invoice_json(invoice: Invoice) -> str:
            return json.dumps({"number": invoice.number})
      after: |
        import json

        from billing.invoice import Invoice


        def invoice_json(invoice: Invoice) -> str:
            return json.dumps({"number": invoice.number, "state": invoice.state.value})
      unchanged:
        billing/invoice.py: |
          from dataclasses import dataclass

          from billing.invoice_state import InvoiceState


          @dataclass(frozen=True)
          class Invoice:
              number: str
              state: InvoiceState
        billing/invoice_state.py: |
          from enum import StrEnum


          class InvoiceState(StrEnum):
              DRAFT = "draft"
              PAID = "paid"
    expected_output:
      outcome: invalid
