- name: shares a base class and uses the union after the alias
  inputs:
    file: pricing/adjustments.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class AdjustmentBase:
          reason: str


      @dataclass(frozen=True)
      class PercentOff(AdjustmentBase):
          percent: int


      @dataclass(frozen=True)
      class FixedOff(AdjustmentBase):
          cents: int


      type Adjustment = PercentOff | FixedOff


      def apply(adjustment: Adjustment, total_cents: int) -> int:
          match adjustment:
              case PercentOff(percent=percent):
                  return total_cents * (100 - percent) // 100
              case FixedOff(cents=cents):
                  return max(total_cents - cents, 0)
  expected_output:
    outcome: valid
