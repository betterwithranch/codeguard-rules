cases:
- name: defines a backoff policy beside the dispatcher
  inputs:
    file: notifications/dispatcher.py
    after: |
      class RetryBackoffPolicy:
          def __init__(self, base_seconds: float) -> None:
              self._base_seconds = base_seconds

          def delay(self, attempt: int) -> float:
              return self._base_seconds * 2**attempt


      class NotificationDispatcher:
          def __init__(self, transport) -> None:
              self._transport = transport
              self._backoff = RetryBackoffPolicy(base_seconds=0.5)

          def send(self, message: str) -> None:
              self._transport.deliver(message)
  expected_output:
    outcome: invalid
