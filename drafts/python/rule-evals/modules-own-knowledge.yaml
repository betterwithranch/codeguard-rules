- name: groups pricing rules under their abstract base
  inputs:
    file: pricing/rules.py
    after: |
      from abc import ABC, abstractmethod


      class PricingRule(ABC):
          @abstractmethod
          def apply(self, cents: int, quantity: int) -> int: ...


      class PercentOffRule(PricingRule):
          def __init__(self, percent: int) -> None:
              self._percent = percent

          def apply(self, cents: int, quantity: int) -> int:
              return cents * (100 - self._percent) // 100


      class BulkRule(PricingRule):
          def __init__(self, minimum: int, cents_off: int) -> None:
              self._minimum = minimum
              self._cents_off = cents_off

          def apply(self, cents: int, quantity: int) -> int:
              return cents - self._cents_off if quantity >= self._minimum else cents
  expected_output:
    outcome: valid
