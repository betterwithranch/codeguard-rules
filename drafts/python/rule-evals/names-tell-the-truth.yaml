- name: takes an order create model as a FastAPI request body
  inputs:
    file: orders/routes.py
    after: |
      from fastapi import APIRouter
      from pydantic import BaseModel

      from .service import OrderService

      router = APIRouter()


      class OrderCreate(BaseModel):
          customer_id: int
          sku: str
          quantity: int


      @router.post("/orders")
      def create_order(body: OrderCreate, service: OrderService) -> dict[str, int]:
          order = service.place(body.customer_id, body.sku, body.quantity)
          return {"id": order.id}
  expected_output:
    outcome: valid
- name: passes an order create dataclass between services
  inputs:
    file: orders/service.py
    after: |
      from dataclasses import dataclass

      from .models import Order
      from .repository import OrderRepository


      @dataclass(frozen=True)
      class OrderCreate:
          customer_id: int
          sku: str
          quantity: int


      class OrderService:
          def __init__(self, orders: OrderRepository) -> None:
              self._orders = orders

          def place(self, data: OrderCreate) -> Order:
              order = Order(customer_id=data.customer_id, sku=data.sku, quantity=data.quantity)
              return self._orders.save(order)

          def reorder(self, previous: Order) -> Order:
              return self.place(
                  OrderCreate(previous.customer_id, previous.sku, previous.quantity)
              )
  expected_output:
    outcome: invalid
- name: sends a quote request payload to the carrier API
  inputs:
    file: carriers/quotes.py
    after: |
      import httpx
      from pydantic import BaseModel


      class ShipmentQuoteRequest(BaseModel):
          origin_postcode: str
          destination_postcode: str
          weight_grams: int


      class CarrierQuotes:
          def __init__(self, http: httpx.Client) -> None:
              self._http = http

          def quote_cents(self, request: ShipmentQuoteRequest) -> int:
              response = self._http.post("/v2/quotes", json=request.model_dump())
              response.raise_for_status()
              return int(response.json()["price_cents"])
