- name: names a quarterly report builder a preparer
  inputs:
    file: reports/quarterly.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class QuarterlyReport:
          quarter: int
          revenue_cents: int


      class ReportPreparer:
          def __init__(self, monthly_revenue_cents: list[int]) -> None:
              self.monthly_revenue_cents = monthly_revenue_cents

          def run(self, quarter: int) -> QuarterlyReport:
              months = self.monthly_revenue_cents[(quarter - 1) * 3 : quarter * 3]
              return QuarterlyReport(quarter=quarter, revenue_cents=sum(months))
  expected_output:
    outcome: invalid
