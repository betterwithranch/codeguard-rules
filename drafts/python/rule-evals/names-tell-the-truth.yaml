- name: renames a DHL quote method to retrieve beside a UPS one that fetches
  inputs:
    file: rates/quotes.py
    unchanged:
      rates/ups.py: |
        from typing import Protocol


        class UpsClient(Protocol):
            def rate(self, weight_grams: int) -> int: ...


        class UpsRates:
            def __init__(self, client: UpsClient) -> None:
                self.client = client

            def fetch_quote(self, weight_grams: int) -> int:
                return self.client.rate(weight_grams)
    before: |
      from typing import Protocol

      from rates.ups import UpsRates


      class DhlClient(Protocol):
          def price(self, weight_grams: int) -> int: ...


      class DhlRates:
          def __init__(self, client: DhlClient) -> None:
              self.client = client

          def fetch_quote(self, weight_grams: int) -> int:
              return self.client.price(weight_grams)


      def cheapest_quote(ups: UpsRates, dhl: DhlRates, weight_grams: int) -> int:
          return min(ups.fetch_quote(weight_grams), dhl.fetch_quote(weight_grams))
    after: |
      from typing import Protocol

      from rates.ups import UpsRates


      class DhlClient(Protocol):
          def price(self, weight_grams: int) -> int: ...


      class DhlRates:
          def __init__(self, client: DhlClient) -> None:
              self.client = client

          def retrieve_quote(self, weight_grams: int) -> int:
              return self.client.price(weight_grams)


      def cheapest_quote(ups: UpsRates, dhl: DhlRates, weight_grams: int) -> int:
          return min(ups.fetch_quote(weight_grams), dhl.retrieve_quote(weight_grams))
  expected_output:
    outcome: invalid
