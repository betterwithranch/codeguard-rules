- name: assembles receipts next to an imported invoice builder
  inputs:
    file: documents/service.py
    unchanged:
      documents/invoices.py: |
        from dataclasses import dataclass

        from orders.models import Order


        @dataclass(frozen=True)
        class Invoice:
            order_number: str
            total_cents: int


        class InvoiceBuilder:
            def build(self, order: Order) -> Invoice:
                return Invoice(order_number=order.number, total_cents=order.total_cents)
      orders/models.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            total_cents: int
            paid: bool
    after: |
      from dataclasses import dataclass

      from documents.invoices import Invoice, InvoiceBuilder
      from orders.models import Order


      @dataclass(frozen=True)
      class Receipt:
          order_number: str
          paid_cents: int


      class ReceiptComposer:
          def assemble(self, order: Order) -> Receipt:
              return Receipt(order_number=order.number, paid_cents=order.total_cents)


      class OrderDocuments:
          def __init__(self, invoices: InvoiceBuilder, receipts: ReceiptComposer) -> None:
              self.invoices = invoices
              self.receipts = receipts

          def for_order(self, order: Order) -> tuple[Invoice, Receipt | None]:
              receipt = self.receipts.assemble(order) if order.paid else None
              return self.invoices.build(order), receipt
  expected_output:
    outcome: invalid
