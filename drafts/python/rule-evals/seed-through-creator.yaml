  - name: saves a constructed planned shipment when the planner creates shipments
    inputs:
      file: shipping/tests/test_dispatch.py
      unchanged:
        shipping/planner.py: |
          from shipping.models import Shipment


          class ShipmentPlanner:
              def plan(self, order, carrier: str) -> Shipment:
                  shipment = Shipment(order=order, carrier=carrier, status=Shipment.Status.PLANNED)
                  shipment.weight_kg = sum(line.weight_kg for line in order.lines.all())
                  shipment.save()
                  return shipment
      after: |
        import pytest

        from shipping.dispatch import dispatch_due
        from shipping.models import Shipment
        from shipping.planner import ShipmentPlanner
        from shop.ordering import OrderService


        @pytest.mark.django_db
        def test_dispatch_due_marks_planned_shipments_sent(customer):
            order = OrderService().create(customer=customer, sku="BOOK-1", quantity=2)
            shipment = Shipment(order=order, carrier="ups", status=Shipment.Status.PLANNED, weight_kg=2)
            shipment.save()

            dispatch_due()

            shipment.refresh_from_db()
            assert shipment.status == Shipment.Status.SENT
    expected_output:
      outcome: invalid
  - name: plans the shipment through the planner before dispatching
    inputs:
