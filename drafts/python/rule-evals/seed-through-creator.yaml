cases:
  - name: adds an invoice to the session while importing its service
    inputs:
      file: tests/conftest.py
      unchanged:
        billing/invoices.py: |
          from decimal import Decimal

          from sqlalchemy.orm import Session

          from billing.models import Invoice
          from billing.numbering import InvoiceNumberAllocator


          class InvoiceService:
              def __init__(self, session: Session) -> None:
                  self._session = session

              def create(self, account_id: str, amount: Decimal) -> Invoice:
                  number = InvoiceNumberAllocator(self._session).next()
                  invoice = Invoice(number=number, account_id=account_id, amount=amount, status="open")
                  self._session.add(invoice)
                  self._session.flush()
                  return invoice
      after: |
        from decimal import Decimal

        import pytest

        from billing.invoices import InvoiceService
        from billing.models import Invoice


        @pytest.fixture
        def invoice_service(db_session):
            return InvoiceService(db_session)


        @pytest.fixture
        def invoice(db_session, account):
            invoice = Invoice(number="INV-0001", account_id=account.id, amount=Decimal("120.00"), status="open")
            db_session.add(invoice)
            db_session.flush()
            return invoice
    expected_output:
      outcome: invalid
