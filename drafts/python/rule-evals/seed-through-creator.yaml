  - name: creates a Django customer directly when sign-up creates customers
    inputs:
      file: accounts/tests/test_profile.py
      unchanged:
        accounts/signup.py: |
          from django.contrib.auth.hashers import make_password
          from django.db import transaction

          from accounts.models import Customer, Profile


          @transaction.atomic
          def sign_up(email: str, password: str) -> Customer:
              customer = Customer.objects.create(email=email.lower(), password=make_password(password))
              Profile.objects.create(customer=customer, display_name=email.split("@")[0])
              return customer
      after: |
        import pytest

        from accounts.models import Customer
        from accounts.profile import display_name
        from accounts.signup import sign_up


        @pytest.mark.django_db
        def test_display_name_defaults_to_email_name():
            customer = Customer.objects.create(email="ana@example.com", password="x")

            assert display_name(customer) == "ana"


        @pytest.mark.django_db
        def test_sign_up_lowercases_email():
            assert sign_up("Ana@Example.com", "s3cret-pass").email == "ana@example.com"
    expected_output:
      outcome: invalid
  - name: signs the Django customer up through the production creator
    inputs:
      file: accounts/tests/test_profile.py
      unchanged:
        accounts/signup.py: |
          from django.contrib.auth.hashers import make_password
          from django.db import transaction

          from accounts.models import Customer, Profile


          @transaction.atomic
          def sign_up(email: str, password: str) -> Customer:
              customer = Customer.objects.create(email=email.lower(), password=make_password(password))
              Profile.objects.create(customer=customer, display_name=email.split("@")[0])
              return customer
      after: |
        import pytest

        from accounts.profile import display_name
        from accounts.signup import sign_up


        @pytest.mark.django_db
        def test_display_name_uses_the_edited_profile_name():
            customer = sign_up("ana@example.com", "s3cret-pass")
            profile = customer.profile
            profile.display_name = "Ana B"
            profile.save()

            assert display_name(customer) == "Ana B"
    expected_output:
      outcome: valid
  - name: inserts order rows with raw SQL when the repository creates orders
    inputs:
      file: tests/test_order_report.py
      unchanged:
        shop/orders.py: |
          import sqlite3
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Order:
              number: str
              total_cents: int


          class OrderRepository:
              def __init__(self, connection: sqlite3.Connection) -> None:
                  self._connection = connection

              def create(self, order: Order) -> Order:
                  self._connection.execute(
                      "INSERT INTO orders (number, total_cents, created_at) VALUES (?, ?, datetime('now'))",
                      (order.number, order.total_cents),
                  )
                  return order
      after: |
        from shop.orders import Order, OrderRepository
        from shop.reports import monthly_total


        def seed_orders(connection, totals):
            connection.executemany(
                "INSERT INTO orders (number, total_cents) VALUES (?, ?)",
                [(f"A-{index}", total) for index, total in enumerate(totals)],
            )


        def test_monthly_total_sums_orders(connection):
            seed_orders(connection, [4999, 1001])

            assert monthly_total(connection) == 6000
    expected_output:
      outcome: invalid
  - name: seeds orders through the repository from a helper
    inputs:
      file: tests/test_order_report.py
      unchanged:
        shop/orders.py: |
          import sqlite3
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Order:
              number: str
              total_cents: int


          class OrderRepository:
              def __init__(self, connection: sqlite3.Connection) -> None:
                  self._connection = connection

              def create(self, order: Order) -> Order:
                  self._connection.execute(
                      "INSERT INTO orders (number, total_cents, created_at) VALUES (?, ?, datetime('now'))",
                      (order.number, order.total_cents),
                  )
                  return order
      after: |
        from shop.orders import Order, OrderRepository
        from shop.reports import monthly_total


        def seed_orders(connection, totals):
            repository = OrderRepository(connection)
            for index, total in enumerate(totals):
                repository.create(Order(number=f"A-{index}", total_cents=total))


        def test_monthly_total_sums_orders(connection):
            seed_orders(connection, [4999, 1001])

            assert monthly_total(connection) == 6000
    expected_output:
      outcome: valid
