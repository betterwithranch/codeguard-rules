  - name: raises a logger's level and leaves it raised
    inputs:
      file: tests/test_billing_logs.py
      after: |
        import logging

        from billing.invoices import issue_invoice


        def test_issue_invoice_logs_the_number(caplog, draft_invoice):
            logging.getLogger("billing").setLevel(logging.DEBUG)

            issue_invoice(draft_invoice)

            assert "issued invoice 42" in caplog.text
    expected_output:
      outcome: invalid
  - name: prepends a plugin folder to sys.path for good
    inputs:
      file: tests/test_plugins.py
      after: |
        import sys

        from reports.plugins import load_plugin


        def test_load_plugin_finds_a_module_on_the_path(tmp_path):
            (tmp_path / "pdf_export.py").write_text("NAME = 'pdf'\n")
            sys.path.insert(0, str(tmp_path))

            assert load_plugin("pdf_export").NAME == "pdf"
    expected_output:
      outcome: invalid
  - name: writes a file through a with block under tmp_path
    inputs:
      file: tests/test_imports.py
      after: |
        from orders.imports import import_orders


        def test_import_orders_reads_each_row(tmp_path):
            path = tmp_path / "orders.csv"
            with open(path, "w") as handle:
                handle.write("id,total\nord-1,120\n")

            assert [order.id for order in import_orders(path)] == ["ord-1"]
    expected_output:
      outcome: valid
  - name: changes a cart item quantity
    inputs:
      file: tests/test_carts.py
      before: |
        from shop.carts import Cart


        class TestCart:
            def test_add_records_the_sku(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=1)

                assert cart.skus() == ["BOOK-1"]
      after: |
        from shop.carts import Cart


        class TestCart:
            def test_add_records_the_sku(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=3)

                assert cart.skus() == ["BOOK-1"]
    expected_output:
      outcome: skipped
  - name: sets a field on a local order
    inputs:
      file: tests/test_orders.py
      before: |
        from shop.orders import Order, ship


        def test_ship_sets_shipped_status():
            order = Order(id="ord-1")

            assert ship(order).status == "shipped"
      after: |
        from shop.orders import Order, ship


        def test_ship_sets_shipped_status():
            order = Order(id="ord-1")
            order.status = "paid"

            assert ship(order).status == "shipped"
    expected_output:
      outcome: skipped
