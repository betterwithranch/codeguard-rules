# yaml-language-server: $schema=rule-eval-schema.json
cases:
  - name: shares a mutable class attribute across tests
    inputs:
      file: tests/test_carts.py
      after: |
        from shop.carts import Cart


        class TestCart:
            added_skus = []

            def test_add_records_the_sku(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=1)
                self.added_skus.append("BOOK-1")

                assert cart.skus() == self.added_skus

            def test_add_second_sku_keeps_both(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=1)
                cart.add(sku="PEN-2", quantity=1)
                self.added_skus.append("PEN-2")

                assert cart.skus() == self.added_skus
    expected_output:
      outcome: invalid
  - name: sets an env var without reverting it
    inputs:
      file: tests/test_payments.py
      before: |
        from decimal import Decimal

        from billing.payments import payment_gateway_for


        def test_live_mode_uses_the_live_gateway(monkeypatch):
            monkeypatch.setenv("PAYMENTS_MODE", "live")

            gateway = payment_gateway_for(amount=Decimal("10.00"))

            assert gateway.name == "live"
      after: |
        import os
        from decimal import Decimal

        from billing.payments import payment_gateway_for


        def test_live_mode_uses_the_live_gateway():
            os.environ["PAYMENTS_MODE"] = "live"

            gateway = payment_gateway_for(amount=Decimal("10.00"))

            assert gateway.name == "live"
    expected_output:
      outcome: invalid
  - name: sets env vars through monkeypatch
    inputs:
      file: tests/test_payments.py
      after: |
        from decimal import Decimal

        from billing.payments import payment_gateway_for


        def test_live_mode_uses_the_live_gateway(monkeypatch):
            monkeypatch.setenv("PAYMENTS_MODE", "live")

            gateway = payment_gateway_for(amount=Decimal("10.00"))

            assert gateway.name == "live"


        def test_sandbox_mode_uses_the_sandbox_gateway(monkeypatch):
            monkeypatch.setenv("PAYMENTS_MODE", "sandbox")

            gateway = payment_gateway_for(amount=Decimal("10.00"))

            assert gateway.name == "sandbox"
    expected_output:
      outcome: valid
  - name: changes a cart item quantity
    inputs:
      file: tests/test_carts.py
      before: |
        from shop.carts import Cart


        class TestCart:
            def test_add_records_the_sku(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=1)

                assert cart.skus() == ["BOOK-1"]
      after: |
        from shop.carts import Cart


        class TestCart:
            def test_add_records_the_sku(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=3)

                assert cart.skus() == ["BOOK-1"]
    expected_output:
      outcome: skipped
