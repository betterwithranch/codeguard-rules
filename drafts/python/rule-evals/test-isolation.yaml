cases:
  - name: sets an env var without reverting it
    inputs:
      file: tests/test_payments.py
      before: |
        from decimal import Decimal

        from billing.payments import payment_gateway_for


        def test_live_mode_uses_the_live_gateway(monkeypatch):
            monkeypatch.setenv("PAYMENTS_MODE", "live")

            gateway = payment_gateway_for(amount=Decimal("10.00"))

            assert gateway.name == "live"
      after: |
        import os
        from decimal import Decimal

        from billing.payments import payment_gateway_for


        def test_live_mode_uses_the_live_gateway():
            os.environ["PAYMENTS_MODE"] = "live"

            gateway = payment_gateway_for(amount=Decimal("10.00"))

            assert gateway.name == "live"
    expected_output:
      outcome: invalid
  - name: sets env vars through monkeypatch
    inputs:
      file: tests/test_payments.py
      after: |
        from decimal import Decimal

        from billing.payments import payment_gateway_for


        def test_live_mode_uses_the_live_gateway(monkeypatch):
            monkeypatch.setenv("PAYMENTS_MODE", "live")

            gateway = payment_gateway_for(amount=Decimal("10.00"))

            assert gateway.name == "live"


        def test_sandbox_mode_uses_the_sandbox_gateway(monkeypatch):
            monkeypatch.setenv("PAYMENTS_MODE", "sandbox")

            gateway = payment_gateway_for(amount=Decimal("10.00"))

            assert gateway.name == "sandbox"
    expected_output:
      outcome: valid
  - name: assigns a module tax rate in a test body
    inputs:
      file: tests/test_tax.py
      after: |
        from decimal import Decimal

        from billing import tax
        from billing.invoices import invoice_total


        def test_invoice_total_is_the_amount_when_tax_is_zero():
            tax.RATE = Decimal("0")

            assert invoice_total(Decimal("100.00")) == Decimal("100.00")
    expected_output:
      outcome: invalid
  - name: sets the module tax rate through monkeypatch
    inputs:
      file: tests/test_tax.py
      after: |
        from decimal import Decimal

        from billing import tax
        from billing.invoices import invoice_total


        def test_invoice_total_is_the_amount_when_tax_is_zero(monkeypatch):
            monkeypatch.setattr(tax, "RATE", Decimal("0"))

            assert invoice_total(Decimal("100.00")) == Decimal("100.00")
    expected_output:
      outcome: valid
  - name: registers an exporter in a fixture with no teardown
    inputs:
      file: tests/test_exporters.py
      after: |
        import pytest

        from reports import exporters
        from reports.exporters import CsvExporter, export


        @pytest.fixture
        def csv_exporter():
            exporters.register(CsvExporter)
            return CsvExporter


        def test_export_writes_csv(csv_exporter, monthly_report):
            assert export(monthly_report, fmt="csv").startswith("id,total")
    expected_output:
      outcome: invalid
  - name: unregisters the exporter after the fixture yields
    inputs:
      file: tests/test_exporters.py
      after: |
        import pytest

        from reports import exporters
        from reports.exporters import CsvExporter, export


        @pytest.fixture
        def csv_exporter():
            exporters.register(CsvExporter)
            yield CsvExporter
            exporters.unregister(CsvExporter)


        def test_export_writes_csv(csv_exporter, monthly_report):
            assert export(monthly_report, fmt="csv").startswith("id,total")
    expected_output:
      outcome: valid
  - name: opens a database connection it never closes
    inputs:
      file: tests/test_order_store.py
      after: |
        import sqlite3

        from orders.store import OrderStore


        def test_store_saves_an_order(tmp_path):
            connection = sqlite3.connect(tmp_path / "orders.db")
            store = OrderStore(connection)

            store.save(order_id="ord-1", total=120)

            assert store.get("ord-1").total == 120
    expected_output:
      outcome: invalid
  - name: closes the database connection in a yield fixture
    inputs:
      file: tests/test_order_store.py
      after: |
        import sqlite3

        import pytest

        from orders.store import OrderStore


        @pytest.fixture
        def store(tmp_path):
            connection = sqlite3.connect(tmp_path / "orders.db")
            yield OrderStore(connection)
            connection.close()


        def test_store_saves_an_order(store):
            store.save(order_id="ord-1", total=120)

            assert store.get("ord-1").total == 120
    expected_output:
      outcome: valid
  - name: starts a patcher it never stops
    inputs:
      file: tests/test_rates.py
      after: |
        import unittest
        from decimal import Decimal
        from unittest.mock import patch

        from billing.rates import fetch_rate


        class FetchRateTests(unittest.TestCase):
            def setUp(self):
                patcher = patch("billing.rates.requests.get")
                self.get = patcher.start()
                self.get.return_value.json.return_value = {"rates": {"EUR": "1.10"}}

            def test_fetch_rate_reads_the_eur_rate(self):
                self.assertEqual(fetch_rate("EUR"), Decimal("1.10"))
    expected_output:
      outcome: invalid
  - name: stops the patcher through addCleanup
    inputs:
      file: tests/test_rates.py
      after: |
        import unittest
        from decimal import Decimal
        from unittest.mock import patch

        from billing.rates import fetch_rate


        class FetchRateTests(unittest.TestCase):
            def setUp(self):
                patcher = patch("billing.rates.requests.get")
                self.get = patcher.start()
                self.addCleanup(patcher.stop)
                self.get.return_value.json.return_value = {"rates": {"EUR": "1.10"}}

            def test_fetch_rate_reads_the_eur_rate(self):
                self.assertEqual(fetch_rate("EUR"), Decimal("1.10"))
    expected_output:
      outcome: valid
