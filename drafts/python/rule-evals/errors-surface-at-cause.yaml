- name: falls back to a rate of one for the order's currency
  inputs:
    file: billing/conversion.py
    after: |
      from billing.models import Order

      RATES_TO_EUR = {"EUR": 1.0, "USD": 0.92, "GBP": 1.17}


      def total_in_eur(order: Order) -> float:
          rate = RATES_TO_EUR.get(order.currency) or 1.0
          return order.total / rate
  expected_output:
    outcome: invalid
- name: greets a customer without a nickname as guest
  inputs:
    file: accounts/greeting.py
    after: |
      from accounts.models import Customer


      def greeting(customer: Customer) -> str:
          name = customer.nickname or "Guest"
          return f"Welcome back, {name}"
  expected_output:
    outcome: valid
- name: clamps an account balance at zero after a withdrawal
  inputs:
    file: banking/accounts.py
    after: |
      from banking.models import Account


      def withdraw(account: Account, amount_cents: int) -> None:
          account.balance_cents = max(0, account.balance_cents - amount_cents)
          account.save()
  expected_output:
    outcome: invalid
- name: refuses a withdrawal larger than the balance
  inputs:
    file: banking/accounts.py
    after: |
      from banking.errors import InsufficientFunds
      from banking.models import Account


      def withdraw(account: Account, amount_cents: int) -> None:
          if amount_cents > account.balance_cents:
              raise InsufficientFunds(account.id, amount_cents)
          account.balance_cents = account.balance_cents - amount_cents
          account.save()
  expected_output:
    outcome: skipped
- name: clamps a requested page number from the query string
  inputs:
    file: catalog/pages.py
    after: |
      def page_offset(requested_page: int, page_size: int) -> int:
          page = max(1, requested_page)
          return (page - 1) * page_size
  expected_output:
    outcome: valid
- name: clamps a product's stock at zero after a sale
  inputs:
    file: inventory/sales.py
    after: |
      from inventory.models import Product


      def record_sale(product: Product, quantity: int) -> None:
          product.stock = max(product.stock - quantity, 0)
          product.save()
  expected_output:
    outcome: invalid
- name: caps a coupon at the cart subtotal
  inputs:
    file: checkout/coupons.py
    after: |
      from checkout.models import Cart, Coupon


      def discount_cents(cart: Cart, coupon: Coupon) -> int:
          return min(coupon.amount_cents, cart.subtotal_cents)
  expected_output:
    outcome: valid
- name: renames a local in a withdrawal
  inputs:
    file: banking/accounts.py
    before: |
      from banking.models import Account


      def withdraw(account: Account, amount_cents: int) -> None:
          new_balance = account.balance_cents - amount_cents
          account.balance_cents = new_balance
          account.save()
    after: |
      from banking.models import Account


      def withdraw(account: Account, amount_cents: int) -> None:
          remaining = account.balance_cents - amount_cents
          account.balance_cents = remaining
          account.save()
  expected_output:
    outcome: skipped
