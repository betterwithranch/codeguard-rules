  - name: declares a generic reader protocol with a method
    inputs:
      file: imports/readers.py
      after: |
        from typing import Iterator, Protocol, TypeVar

        T_co = TypeVar("T_co", covariant=True)


        class RowSource(Protocol[T_co]):
            source_name: str

            def rows(self) -> Iterator[T_co]: ...


        def count_rows(source: RowSource[object]) -> int:
            return sum(1 for _ in source.rows())
    expected_output:
      outcome: valid
  - name: mirrors two columns of a SQLAlchemy account model
    inputs:
      file: banking/overdraft.py
      unchanged:
        banking/models.py: |
          from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column


          class Base(DeclarativeBase):
              pass


          class Account(Base):
              __tablename__ = "accounts"

              id: Mapped[int] = mapped_column(primary_key=True)
              holder_name: Mapped[str]
              balance_cents: Mapped[int]
              overdraft_limit_cents: Mapped[int]
              opened_on: Mapped[str]
      after: |
        from typing import Protocol


        class OverdraftView(Protocol):
            balance_cents: int
            overdraft_limit_cents: int


        def is_overdrawn(account: OverdraftView) -> bool:
            return account.balance_cents < -account.overdraft_limit_cents
    expected_output:
      outcome: invalid
  - name: declares every field of a two-field point class
    inputs:
      file: maps/distance.py
      unchanged:
        maps/point.py: |
          from typing import NamedTuple


          class GeoPoint(NamedTuple):
              latitude: float
              longitude: float
      after: |
        from typing import Protocol


        class HasCoordinates(Protocol):
            latitude: float
            longitude: float


        def rough_distance(a: HasCoordinates, b: HasCoordinates) -> float:
            return abs(a.latitude - b.latitude) + abs(a.longitude - b.longitude)
    expected_output:
      outcome: valid
  - name: mirrors attributes of an attrs parcel class
    inputs:
      file: shipping/postage.py
      unchanged:
        shipping/parcel.py: |
          import attrs


          @attrs.frozen
          class Parcel:
              tracking_number: str
              weight_grams: int
              length_cm: int
              recipient_name: str
              insured: bool
      after: |
        from typing import Protocol


        class Weighable(Protocol):
            weight_grams: int
            insured: bool


        def postage_cents(parcel: Weighable) -> int:
            base = 300 + parcel.weight_grams // 100 * 15
            return base + 200 if parcel.insured else base
    expected_output:
      outcome: invalid
  - name: changes an ABC in the module
    inputs:
      file: imports/readers.py
      before: |
        from abc import ABC, abstractmethod


        class Reader(ABC):
            @abstractmethod
            def read(self) -> bytes: ...
      after: |
        from abc import ABC, abstractmethod


        class Reader(ABC):
            @abstractmethod
            def read(self, limit: int) -> bytes: ...
    expected_output:
      outcome: skipped
