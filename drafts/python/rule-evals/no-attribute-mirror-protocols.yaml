cases:
  - name: mirrors three settings fields in a protocol
    inputs:
      file: carriers/client.py
      unchanged:
        config/settings.py: |
          from pydantic_settings import BaseSettings


          class Settings(BaseSettings):
              database_url: str
              carrier_base_url: str
              carrier_timeout_seconds: int
              carrier_retries: int
              smtp_host: str
              debug: bool = False
      after: |
        from typing import Protocol

        import httpx


        class CarrierSettings(Protocol):
            carrier_base_url: str
            carrier_timeout_seconds: int
            carrier_retries: int


        def carrier_client(settings: CarrierSettings) -> httpx.Client:
            transport = httpx.HTTPTransport(retries=settings.carrier_retries)
            return httpx.Client(
                base_url=settings.carrier_base_url,
                timeout=settings.carrier_timeout_seconds,
                transport=transport,
            )
    expected_output:
      outcome: invalid
  - name: declares a protocol with a method the client needs
    inputs:
      file: carriers/client.py
      unchanged:
        config/settings.py: |
          from pydantic_settings import BaseSettings


          class Settings(BaseSettings):
              database_url: str
              carrier_base_url: str
              carrier_timeout_seconds: int
              carrier_retries: int
              smtp_host: str
              debug: bool = False
      after: |
        from typing import Protocol

        import httpx


        class TokenSource(Protocol):
            carrier_base_url: str

            def access_token(self) -> str: ...


        def carrier_client(tokens: TokenSource) -> httpx.Client:
            return httpx.Client(
                base_url=tokens.carrier_base_url,
                headers={"Authorization": f"Bearer {tokens.access_token()}"},
            )
    expected_output:
      outcome: valid
  - name: mirrors two order model columns as protocol properties
    inputs:
      file: shipping/labels.py
      unchanged:
        orders/models.py: |
          from django.db import models


          class Order(models.Model):
              number = models.CharField(max_length=20)
              customer_name = models.CharField(max_length=200)
              shipping_address = models.TextField()
              total_cents = models.IntegerField()
              status = models.CharField(max_length=20)
      after: |
        from typing import Protocol


        class LabelSource(Protocol):
            @property
            def customer_name(self) -> str: ...

            @property
            def shipping_address(self) -> str: ...


        def label_text(source: LabelSource) -> str:
            return f"{source.customer_name}\n{source.shipping_address}"
    expected_output:
      outcome: invalid
  - name: declares a data protocol that several models match
    inputs:
      file: audit/trail.py
      unchanged:
        orders/models.py: |
          from dataclasses import dataclass


          @dataclass
          class Order:
              id: int
              number: str
              total_cents: int
        invoices/models.py: |
          from dataclasses import dataclass


          @dataclass
          class Invoice:
              id: int
              order_id: int
              issued_on: str
        customers/models.py: |
          from dataclasses import dataclass


          @dataclass
          class Customer:
              id: int
              email: str
      after: |
        from typing import Protocol


        class HasId(Protocol):
            id: int


        def audit_key(record: HasId, action: str) -> str:
            return f"{type(record).__name__.lower()}:{record.id}:{action}"
    expected_output:
      outcome: valid
  - name: mirrors attributes of a dataclass with more fields
    inputs:
      file: reports/greeting.py
      unchanged:
        customers/customer.py: |
          from dataclasses import dataclass
          from datetime import date


          @dataclass(frozen=True)
          class Customer:
              first_name: str
              last_name: str
              email: str
              birthday: date
              loyalty_points: int
      after: |
        from typing import Protocol


        class Greetable(Protocol):
            first_name: str
            loyalty_points: int


        def greeting(person: Greetable) -> str:
            return f"Hi {person.first_name}, you have {person.loyalty_points} points"
    expected_output:
      outcome: invalid
  - name: declares data members no single class matches
    inputs:
      file: reports/greeting.py
      unchanged:
        customers/customer.py: |
          from dataclasses import dataclass
          from datetime import date


          @dataclass(frozen=True)
          class Customer:
              first_name: str
              last_name: str
              email: str
              birthday: date
        loyalty/account.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class LoyaltyAccount:
              customer_email: str
              points: int
      after: |
        from typing import Protocol


        class Greetable(Protocol):
            display_name: str
            points_balance: int


        def greeting(person: Greetable) -> str:
