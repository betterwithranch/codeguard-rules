- name: coins no reaction for the empty result
  inputs:
    file: tests/test_search.py
    unchanged:
      shop/search.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class EmptyResult:
            query: str


        @dataclass(frozen=True)
        class Matches:
            skus: list[str]


        def search(catalog: dict[str, str], query: str) -> EmptyResult | Matches:
