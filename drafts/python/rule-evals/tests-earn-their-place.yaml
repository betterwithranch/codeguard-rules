cases:
- name: asserts a copy of the model config
  inputs:
    file: tests/test_orders.py
    unchanged:
      shop/orders.py: |
        from decimal import Decimal

        from pydantic import BaseModel, ConfigDict


        class Order(BaseModel):
            model_config = ConfigDict(frozen=True, extra="forbid")

            id: str
            total: Decimal
    after: |
      from shop.orders import Order


      def test_order_model_config_is_frozen():
          assert Order.model_config == {"frozen": True, "extra": "forbid"}
  expected_output:
    outcome: invalid
- name: asserts the result is an order beside a whole-order comparison
  inputs:
    file: tests/test_orders.py
    before: |
      from decimal import Decimal

      from shop.orders import Order, OrderService


      def test_place_order_builds_the_order(customer):
          order = OrderService().place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

          assert order == Order(customer_id=customer.id, sku="BOOK-1", quantity=2, total=Decimal("25.00"))
    after: |
      from decimal import Decimal

      from shop.orders import Order, OrderService


      def test_place_order_builds_the_order(customer):
          order = OrderService().place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

          assert order == Order(customer_id=customer.id, sku="BOOK-1", quantity=2, total=Decimal("25.00"))


      def test_place_order_returns_an_order(customer):
          order = OrderService().place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

          assert isinstance(order, Order)
  expected_output:
    outcome: invalid
- name: checks the exporter factory picks the csv class
  inputs:
    file: tests/test_exporters.py
    unchanged:
      reports/exporters.py: |
        class CsvExporter:
            pass


        class JsonExporter:
            pass


        def exporter_for(fmt: str) -> CsvExporter | JsonExporter:
            if fmt == "csv":
                return CsvExporter()
            return JsonExporter()
    after: |
      from reports.exporters import CsvExporter, JsonExporter, exporter_for


      def test_exporter_for_csv_is_a_csv_exporter():
          assert isinstance(exporter_for("csv"), CsvExporter)


      def test_exporter_for_json_is_a_json_exporter():
          assert isinstance(exporter_for("json"), JsonExporter)
  expected_output:
    outcome: valid
