- name: checks an enum method the project wrote
  inputs:
    file: tests/test_order_status.py
    unchanged:
      shop/status.py: |
        from enum import StrEnum


        class OrderStatus(StrEnum):
            PENDING = "pending"
            SHIPPED = "shipped"
            CANCELLED = "cancelled"

            def is_final(self) -> bool:
                return self in {OrderStatus.SHIPPED, OrderStatus.CANCELLED}
    after: |
      from shop.status import OrderStatus


      def test_shipped_is_final():
          assert OrderStatus.SHIPPED.is_final()


      def test_pending_is_not_final():
          assert not OrderStatus.PENDING.is_final()
  expected_output:
    outcome: valid
