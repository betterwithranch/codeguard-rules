- name: returns a total and a late flag from a SQLAlchemy query
  inputs:
    file: billing/queries.py
    after: |
      from datetime import date

      from sqlalchemy import func, select
      from sqlalchemy.orm import Session

      from billing.models import Invoice


      def customer_balance(session: Session, customer_id: int, today: date):
          open_invoices = select(Invoice).where(Invoice.customer_id == customer_id, Invoice.paid.is_(False))
          invoices = session.scalars(open_invoices).all()
          total_cents = sum(invoice.amount_cents for invoice in invoices)
          any_late = any(invoice.due_on < today for invoice in invoices)
          return total_cents, any_late
