- name: returns a customer and whether it was created
  inputs:
    file: accounts/signup.py
    after: |
      from dataclasses import dataclass
      from typing import Protocol


      @dataclass(frozen=True)
      class Customer:
          email: str


      class CustomerStore(Protocol):
          def find(self, email: str) -> Customer | None: ...

          def add(self, customer: Customer) -> None: ...


      class Signup:
          def __init__(self, customers: CustomerStore) -> None:
              self.customers = customers

          def register(self, email: str):
              existing = self.customers.find(email)
              if existing is not None:
                  return existing, False
              customer = Customer(email=email)
              self.customers.add(customer)
              return customer, True
  expected_output:
    outcome: invalid
- name: returns parsed rows and warnings through an annotation
  inputs:
    file: imports/rows.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Row:
          sku: str
          quantity: int


      def parse_rows(lines: list[str]) -> tuple[list[Row], list[str]]:
          rows: list[Row] = []
          warnings: list[str] = []
          for number, line in enumerate(lines, start=1):
              sku, quantity = line.split(",")
              if not quantity.isdigit():
                  warnings.append(f"line {number}: bad quantity")
                  continue
              rows.append(Row(sku=sku, quantity=int(quantity)))
          result = (rows, warnings)
          return result
  expected_output:
    outcome: invalid
