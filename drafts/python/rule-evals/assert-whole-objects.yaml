  - name: checks a total is positive
    inputs:
      file: tests/test_quotes.py
      after: |
        from billing.quotes import quote


        def test_quote_charges_for_shipping():
            result = quote(skus=["A1"], ship=True)

            assert result.total_cents > 0
      unchanged:
        billing/quotes.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Quote:
              skus: tuple[str, ...]
              total_cents: int


          def quote(skus: list[str], ship: bool) -> Quote:
              return Quote(skus=tuple(skus), total_cents=1000 + (500 if ship else 0))
    expected_output:
      outcome: invalid
  - name: checks the status of a Django model instance
    inputs:
      file: tests/test_order_views.py
      after: |
        from django.test import TestCase

        from orders.models import Order


        class PayOrderViewTests(TestCase):
            def test_post_marks_order_paid(self):
                order = Order.objects.create(number="ord-9", total_cents=1200)

                self.client.post(f"/orders/{order.pk}/pay/")

                order.refresh_from_db()
                self.assertEqual(order.status, Order.Status.PAID)
      unchanged:
        orders/models.py: |
          from django.db import models


          class Order(models.Model):
              class Status(models.TextChoices):
                  OPEN = "open"
                  PAID = "paid"

              number = models.CharField(max_length=20)
              total_cents = models.IntegerField()
              status = models.CharField(max_length=10, choices=Status.choices, default=Status.OPEN)
    expected_output:
      outcome: valid
