  - name: checks the code of a raised error
    inputs:
      file: tests/test_charges.py
      after: |
        import pytest

        from billing.charges import CardDeclined, charge


        def test_charge_reports_declined_card(declined_card):
            with pytest.raises(CardDeclined) as exc:
                charge(declined_card, amount_cents=500)

            assert exc.value.code == "card_declined"
      unchanged:
        billing/charges.py: |
          class CardDeclined(Exception):
              def __init__(self, code: str) -> None:
                  super().__init__(code)
                  self.code = code


          def charge(card: object, amount_cents: int) -> None:
              raise CardDeclined("card_declined")
    expected_output:
      outcome: valid
