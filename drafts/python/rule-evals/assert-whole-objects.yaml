cases:
  - name: asserts invoice fields one by one
    inputs:
      file: tests/test_invoices.py
      after: |
        from billing.invoices import issue_invoice
        from orders.models import Order


        def test_issue_invoice_copies_order_total():
            invoice = issue_invoice(Order(id="ord-42", total=120))

            assert invoice.number == "42"
            assert invoice.total == 120
      unchanged:
        billing/invoices.py: |
          from dataclasses import dataclass

          from orders.models import Order


          @dataclass(frozen=True)
          class Invoice:
              number: str
              total: int


          def issue_invoice(order: Order) -> Invoice:
              return Invoice(number=order.id.removeprefix("ord-"), total=order.total)
    expected_output:
      outcome: invalid
  - name: asserts fields of a dataclass with equality off
    inputs:
      file: tests/test_invoices.py
      after: |
        from billing.invoices import issue_invoice
        from orders.models import Order


        def test_issue_invoice_copies_order_total():
            invoice = issue_invoice(Order(id="ord-42", total=120))

            assert invoice.number == "42"
            assert invoice.total == 120
      unchanged:
        billing/invoices.py: |
          from dataclasses import dataclass

          from orders.models import Order


          @dataclass(eq=False)
          class Invoice:
              number: str
              total: int


          def issue_invoice(order: Order) -> Invoice:
              return Invoice(number=order.id.removeprefix("ord-"), total=order.total)
    expected_output:
      outcome: valid
  - name: checks only the first parcel's sku
    inputs:
      file: tests/test_shipments.py
      before: |
        from shipping.shipments import Shipment, plan_shipment


        def test_plan_shipment_uses_ground_by_default():
            shipment = plan_shipment(order_id="ord-1", weight_kg=2)

            assert shipment == Shipment(order_id="ord-1", carrier="ground", weight_kg=2)
      after: |
        from shipping.shipments import Shipment, pack_items, plan_shipment


        def test_plan_shipment_uses_ground_by_default():
            shipment = plan_shipment(order_id="ord-1", weight_kg=2)

            assert shipment == Shipment(order_id="ord-1", carrier="ground", weight_kg=2)


        def test_pack_items_orders_parcels_by_sku():
            parcels = pack_items(["B2", "A1"])

            assert parcels[0].sku == "A1"
    expected_output:
      outcome: invalid
  - name: compares the full parcel list
    inputs:
      file: tests/test_shipments.py
      before: |
        from shipping.shipments import Shipment, plan_shipment


        def test_plan_shipment_uses_ground_by_default():
            shipment = plan_shipment(order_id="ord-1", weight_kg=2)

            assert shipment == Shipment(order_id="ord-1", carrier="ground", weight_kg=2)
      after: |
        from shipping.shipments import Parcel, Shipment, pack_items, plan_shipment


        def test_plan_shipment_uses_ground_by_default():
            shipment = plan_shipment(order_id="ord-1", weight_kg=2)

            assert shipment == Shipment(order_id="ord-1", carrier="ground", weight_kg=2)


        def test_pack_items_orders_parcels_by_sku():
            parcels = pack_items(["B2", "A1"])

            assert parcels == [Parcel(sku="A1"), Parcel(sku="B2")]
    expected_output:
      outcome: skipped
  - name: checks one field of a pydantic summary
    inputs:
      file: tests/test_order_summary.py
      after: |
        from orders.summary import summarize


        def test_summarize_adds_line_totals():
            summary = summarize(order_id="ord-3", line_totals=[500, 700])

            assert summary.total_cents == 1200
      unchanged:
        orders/summary.py: |
          from pydantic import BaseModel


          class OrderSummary(BaseModel):
              order_id: str
              line_count: int
              total_cents: int


          def summarize(order_id: str, line_totals: list[int]) -> OrderSummary:
              return OrderSummary(
                  order_id=order_id, line_count=len(line_totals), total_cents=sum(line_totals)
              )
    expected_output:
      outcome: invalid
  - name: checks one key of a serialized order
    inputs:
      file: tests/test_order_payloads.py
      after: |
        from orders.payloads import order_payload


        def test_order_payload_marks_paid_orders():
            payload = order_payload(order_id="ord-5", total_cents=900, paid=True)

            assert payload["status"] == "paid"
