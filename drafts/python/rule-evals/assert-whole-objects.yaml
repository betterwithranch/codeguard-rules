  - name: compares a returned tuple with the expected split's fields
    inputs:
      file: tests/test_splits.py
      after: |
        from decimal import Decimal

        from billing.splits import Split


        def split_total(total: Decimal, ways: int) -> tuple[Decimal, Decimal]:
            share = (total / ways).quantize(Decimal("0.01"))
            return share, total - share * ways


        def test_split_total_keeps_the_remainder():
            expected = Split(share=Decimal("33.33"), remainder=Decimal("0.01"))

            assert split_total(Decimal("100.00"), 3) == (expected.share, expected.remainder)
    expected_output:
      outcome: valid
  - name: blanks fields with dataclasses.replace before comparing
    inputs:
      file: tests/test_orders.py
      after: |
        import dataclasses
        from decimal import Decimal

        from shop.orders import Order, OrderStatus, place_order


        def test_place_order_creates_a_pending_order(customer):
            order = place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            actual = dataclasses.replace(order, id=None, created_at=None)
            assert actual == Order(
                id=None,
                customer_id=customer.id,
                sku="BOOK-1",
                quantity=2,
                total=Decimal("25.00"),
                status=OrderStatus.PENDING,
                created_at=None,
            )
    expected_output:
      outcome: invalid
  - name: compares a dump that excludes fields
    inputs:
      file: tests/test_invoices.py
      before: |
        from decimal import Decimal

        from billing.invoices import issue_invoice


        def test_issue_invoice_sets_amount_and_currency(account):
            invoice = issue_invoice(account_id=account.id, amount=Decimal("120.00"))

            assert invoice.amount == Decimal("120.00")
            assert invoice.currency == "USD"
      after: |
        from decimal import Decimal

        from billing.invoices import issue_invoice


        def test_issue_invoice_sets_amount_and_currency(account):
            invoice = issue_invoice(account_id=account.id, amount=Decimal("120.00"))

            actual = invoice.model_dump(exclude={"id", "issued_at"})
            assert actual == {
                "account_id": account.id,
                "amount": Decimal("120.00"),
                "currency": "USD",
            }
    expected_output:
      outcome: invalid
  - name: compares the expected order with a masked copy of the placed order
    inputs:
      file: tests/test_orders.py
      after: |
        from decimal import Decimal

        from shop.orders import Order, OrderStatus, place_order


        def test_place_order_creates_a_pending_order(customer):
            expected = Order(
                id=None,
                customer_id=customer.id,
                sku="BOOK-1",
                quantity=2,
                total=Decimal("25.00"),
                status=OrderStatus.PENDING,
                created_at=None,
            )

            order = place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert expected == order.model_copy(update={"id": None, "created_at": None})
    expected_output:
      outcome: invalid
  - name: clears the placed order's id on a copy
    inputs:
      file: tests/test_orders.py
      after: |
        import copy
        from decimal import Decimal

        from shop.orders import Order, OrderStatus, place_order


        def test_place_order_creates_a_pending_order(customer):
            order = place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            actual = copy.copy(order)
            actual.id = None
            assert actual == Order(
                id=None,
                customer_id=customer.id,
                sku="BOOK-1",
                quantity=2,
                total=Decimal("25.00"),
                status=OrderStatus.PENDING,
            )
    expected_output:
      outcome: invalid
  - name: builds the expected order from a baseline copy
    inputs:
      file: tests/test_orders.py
      after: |
        from datetime import datetime
        from decimal import Decimal

        from shop.orders import FixedClock, FixedIds, Order, OrderStatus, place_order


        def test_place_order_prices_each_unit(customer, pending_book_order):
            order = place_order(
                customer_id=customer.id,
                sku="BOOK-1",
                quantity=3,
                ids=FixedIds("ord-1"),
                clock=FixedClock(datetime(2026, 3, 1, 9, 30)),
            )

            assert order == pending_book_order.model_copy(
                update={"quantity": 3, "total": Decimal("37.50")}
            )
    expected_output:
      outcome: valid
