  - name: checks a boolean field of an attrs order
    inputs:
      file: tests/test_payments.py
      after: |
        from orders.payments import settle


        def test_settle_marks_order_paid(open_order):
            settled = settle(open_order, amount_cents=open_order.total_cents)

            assert settled.paid
      unchanged:
        orders/payments.py: |
          from attrs import define, evolve


          @define(frozen=True)
          class PayableOrder:
              order_id: str
              total_cents: int
              paid: bool


          def settle(order: PayableOrder, amount_cents: int) -> PayableOrder:
              return evolve(order, paid=amount_cents >= order.total_cents)
    expected_output:
      outcome: invalid
