  - name: compares what a plain fake mailer sent
    inputs:
      file: tests/test_receipts.py
      after: |
        from notifications.receipts import send_receipt
        from tests.fakes import FakeMailer, SentEmail


        def test_send_receipt_emails_customer():
            mailer = FakeMailer()

            send_receipt(mailer, order_number="ord-4", email="ada@example.com")

            assert mailer.sent == [SentEmail(to="ada@example.com", subject="Receipt for ord-4")]
      unchanged:
        tests/fakes.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class SentEmail:
              to: str
              subject: str


          class FakeMailer:
              def __init__(self) -> None:
                  self.sent: list[SentEmail] = []

              def send(self, to: str, subject: str) -> None:
                  self.sent.append(SentEmail(to=to, subject=subject))
    expected_output:
      outcome: valid
