      after: |
        TIMEOUT_SECONDS = 10
    expected_output:
      outcome: skipped
  - name: adds a function that passes its parameters straight through
    inputs:
      file: quoting/quotes.py
      before: |
        from quoting.pricing import Quote, build_quote
      after: |
        from quoting.carts import Cart, Region
        from quoting.pricing import Quote, build_quote


        def quote(cart: Cart, region: Region) -> Quote:
            return build_quote(cart, region)
    expected_output:
      outcome: skipped
