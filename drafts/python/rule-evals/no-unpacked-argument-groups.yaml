cases:
  - name: unpacks a dataclass it just built into positional arguments
    inputs:
      file: quoting/quotes.py
      after: |
        from dataclasses import dataclass

        from quoting.carts import Cart, Region
        from quoting.pricing import Quote, build_quote


        @dataclass(frozen=True)
        class QuoteArgs:
            cart: Cart
            region: Region


        def quote(cart: Cart, region: Region) -> Quote:
            args = QuoteArgs(cart=cart, region=region)
            return build_quote(args.cart, args.region)
    expected_output:
      outcome: invalid
  - name: hands a dataclass it just built to the factory whole
    inputs:
      file: quoting/quotes.py
      after: |
        import logging
        from dataclasses import dataclass

        from quoting.carts import Cart, Region
        from quoting.pricing import Quote

        logger = logging.getLogger(__name__)


        @dataclass(frozen=True)
        class QuoteParams:
            cart: Cart
            region: Region


        class QuoteFactory:
            def create(self, params: QuoteParams) -> Quote:
                return Quote(lines=params.cart.lines, region=params.region)


        def quote(cart: Cart, region: Region) -> Quote:
            params = QuoteParams(cart=cart, region=region)
            logger.info("quoting cart %s", params.cart.id)
            return QuoteFactory().create(params)
    expected_output:
      outcome: valid
  - name: unpacks a NamedTuple it just built into keyword arguments
    inputs:
      file: shipping/labels.py
      after: |
        from typing import NamedTuple

        from shipping.printing import print_label


        class LabelArgs(NamedTuple):
            name: str
            street: str
            postcode: str


        def label_for(name: str, street: str, postcode: str) -> bytes:
            args = LabelArgs(name, street, postcode)
            return print_label(name=args.name, street=args.street, postcode=args.postcode)
    expected_output:
      outcome: invalid
