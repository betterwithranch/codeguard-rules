- name: implements a handler interface that passes the event bus
  inputs:
    file: shipments/handlers.py
    after: |
      from abc import ABC, abstractmethod
      from dataclasses import dataclass

      from shipments.bus import EventBus


      @dataclass(frozen=True)
      class ShipmentShipped:
          shipment_id: str
          order_number: str


      @dataclass(frozen=True)
      class OrderFulfilled:
          order_number: str


      class ShipmentEventHandler(ABC):
          @abstractmethod
          def handle(self, event: ShipmentShipped, bus: EventBus) -> None: ...


      class FulfillOrderOnShipment(ShipmentEventHandler):
          def handle(self, event: ShipmentShipped, bus: EventBus) -> None:
              bus.publish(OrderFulfilled(order_number=event.order_number))
  expected_output:
    outcome: valid
