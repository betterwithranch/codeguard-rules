- name: takes the rate provider in init
  inputs:
    file: shipments/quoter.py
    after: |
      from dataclasses import dataclass

      from shipments.rates import RateProvider


      @dataclass(frozen=True)
      class Shipment:
          destination: str
          weight_kg: float


      class ShipmentQuoter:
          def __init__(self, rate_provider: RateProvider) -> None:
              self._rate_provider = rate_provider

          def quote_cents(self, shipment: Shipment) -> int:
              return self._rate_provider.rate_cents(shipment.destination, shipment.weight_kg)

          def total_quote_cents(self, shipments: list[Shipment]) -> int:
              return sum(self.quote_cents(shipment) for shipment in shipments)
