- name: passes a clock to a Django view helper method
  inputs:
    file: orders/views.py
    after: |
      from django.http import HttpRequest, JsonResponse
      from django.views import View

      from orders.clock import Clock
      from orders.models import Order


      class OpenOrdersView(View):
          clock: Clock

          def get(self, request: HttpRequest) -> JsonResponse:
              return JsonResponse({"open": self._open_numbers(request, self.clock)})

          def _open_numbers(self, request: HttpRequest, clock: Clock) -> list[str]:
              orders = Order.objects.filter(customer=request.user, due_at__gt=clock.now())
              return [order.number for order in orders]
  expected_output:
    outcome: invalid
