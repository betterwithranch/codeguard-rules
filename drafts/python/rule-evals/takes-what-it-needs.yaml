- name: passes an HTTP client to an async refresh method
  inputs:
    file: accounts/sync.py
    after: |
      import httpx
      from pydantic import BaseModel


      class Account(BaseModel):
          id: str
          balance_cents: int


      class AccountSync:
          def __init__(self, base_url: str) -> None:
              self._base_url = base_url

          async def refresh(self, account_id: str, client: httpx.AsyncClient) -> Account:
              response = await client.get(f"{self._base_url}/accounts/{account_id}")
              return Account.model_validate_json(response.content)
  expected_output:
    outcome: invalid
- name: builds the sync from settings and a client in a classmethod
  inputs:
    file: accounts/sync.py
    after: |
      from dataclasses import dataclass
      from typing import Self

      import httpx
      from pydantic import BaseModel


      class Account(BaseModel):
          id: str
          balance_cents: int


      @dataclass(frozen=True)
      class SyncSettings:
          base_url: str


      class AccountSync:
          def __init__(self, base_url: str, client: httpx.AsyncClient) -> None:
              self._base_url = base_url
              self._client = client

          @classmethod
          def from_settings(cls, settings: SyncSettings, client: httpx.AsyncClient) -> Self:
              return cls(base_url=settings.base_url, client=client)

          async def refresh(self, account_id: str) -> Account:
              response = await self._client.get(f"{self._base_url}/accounts/{account_id}")
              return Account.model_validate_json(response.content)
  expected_output:
    outcome: valid
