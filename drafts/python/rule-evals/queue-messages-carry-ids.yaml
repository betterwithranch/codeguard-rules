cases:
  - name: passes an order model to a celery task
    inputs:
      file: orders/views.py
      after: |
        from django.http import HttpRequest, JsonResponse

        from .models import Order
        from .tasks import send_confirmation


        def confirm(request: HttpRequest, order_id: int) -> JsonResponse:
            order = Order.objects.get(pk=order_id)
            send_confirmation.delay(order)
            return JsonResponse({"queued": True})
    expected_output:
      outcome: invalid
  - name: passes the order id to a celery task
    inputs:
      file: orders/views.py
      after: |
        from django.http import HttpRequest, JsonResponse

        from .models import Order
        from .tasks import send_confirmation


        def confirm(request: HttpRequest, order_id: int) -> JsonResponse:
            order = Order.objects.get(pk=order_id)
            send_confirmation.delay(order.pk)
            return JsonResponse({"queued": True})
    expected_output:
      outcome: valid
  - name: defines a task that takes an invoice model
    inputs:
      file: invoices/tasks.py
      after: |
        from celery import shared_task

        from .mailer import send_invoice_email
        from .models import Invoice


        @shared_task
        def email_invoice(invoice: Invoice) -> None:
            send_invoice_email(invoice.customer_email, invoice.render_pdf())
    expected_output:
      outcome: invalid
  - name: defines a task that loads the invoice by id
    inputs:
      file: invoices/tasks.py
      after: |
        from celery import shared_task

        from .mailer import send_invoice_email
        from .models import Invoice


        @shared_task
        def email_invoice(invoice_id: int) -> None:
            invoice = Invoice.objects.get(pk=invoice_id)
            send_invoice_email(invoice.customer_email, invoice.render_pdf())
    expected_output:
      outcome: valid
  - name: enqueues a model dict for an RQ job
    inputs:
      file: shipping/dispatch.py
      after: |
        from django.forms.models import model_to_dict
        from rq import Queue

        from .jobs import book_courier
        from .models import Shipment


        def dispatch(queue: Queue, shipment: Shipment) -> None:
            queue.enqueue(book_courier, model_to_dict(shipment))
    expected_output:
      outcome: invalid
  - name: publishes an event with chosen order fields
    inputs:
      file: orders/events.py
      after: |
        from .broker import Broker
        from .models import Order


        def announce_paid(broker: Broker, order: Order) -> None:
            broker.publish(
                "orders.paid",
                {"order_id": order.id, "total_cents": order.total_cents},
            )
    expected_output:
      outcome: valid
  - name: publishes a pydantic dump of a stored customer
    inputs:
      file: customers/sync.py
      unchanged:
        customers/repository.py: |
          from pydantic import BaseModel


          class Customer(BaseModel):
              id: int
              email: str
              name: str
              marketing_opt_in: bool


          class CustomerRepository:
              def get(self, customer_id: int) -> Customer:
                  raise NotImplementedError
      after: |
        from .broker import Broker
        from .repository import CustomerRepository


        def sync_customer(broker: Broker, customers: CustomerRepository, customer_id: int) -> None:
            customer = customers.get(customer_id)
            broker.publish("crm.customer", customer.model_dump())
    expected_output:
      outcome: invalid
  - name: starts a workflow with a SQLAlchemy order row
    inputs:
      file: fulfilment/start.py
      after: |
        from sqlalchemy.orm import Session
        from temporalio.client import Client

        from .models import Order
        from .workflows import FulfilOrder


        async def start_fulfilment(client: Client, session: Session, order_id: int) -> None:
            order = session.get(Order, order_id)
            await client.start_workflow(FulfilOrder.run, order, id=f"fulfil-{order_id}", task_queue="fulfil")
    expected_output:
      outcome: invalid
  - name: starts a workflow with the order id
    inputs:
      file: fulfilment/start.py
      after: |
        from temporalio.client import Client

        from .workflows import FulfilOrder


        async def start_fulfilment(client: Client, order_id: int) -> None:
            await client.start_workflow(FulfilOrder.run, order_id, id=f"fulfil-{order_id}", task_queue="fulfil")
    expected_output:
      outcome: valid
  - name: puts order rows on an asyncio queue for local workers
    inputs:
      file: reports/export.py
      after: |
        import asyncio

        from .models import Order


        async def feed(queue: asyncio.Queue[Order], orders: list[Order]) -> None:
            for order in orders:
                await queue.put(order)
    expected_output:
      outcome: valid
  - name: submits a stored product to a process pool
    inputs:
      file: catalog/thumbnails.py
      after: |
        from concurrent.futures import ProcessPoolExecutor

        from .images import render_thumbnail
        from .models import Product


        def render_all(products: list[Product]) -> None:
            with ProcessPoolExecutor() as pool:
                for product in products:
                    pool.submit(render_thumbnail, product)
    expected_output:
      outcome: invalid
  - name: sends a dramatiq message with a date and a count
    inputs:
      file: reports/schedule.py
      after: |
        from datetime import date

        from .actors import build_daily_report


        def schedule_report(day: date, expected_orders: int) -> None:
            build_daily_report.send(day.isoformat(), expected_orders)
    expected_output:
      outcome: valid
  - name: renames a local variable in a view
    inputs:
      file: orders/views.py
      before: |
        from django.http import HttpRequest, JsonResponse

        from .models import Order


        def summary(request: HttpRequest, order_id: int) -> JsonResponse:
            order = Order.objects.get(pk=order_id)
            return JsonResponse({"total": order.total_cents})
      after: |
        from django.http import HttpRequest, JsonResponse

        from .models import Order


        def summary(request: HttpRequest, order_id: int) -> JsonResponse:
            found = Order.objects.get(pk=order_id)
            return JsonResponse({"total": found.total_cents})
    expected_output:
      outcome: skipped
