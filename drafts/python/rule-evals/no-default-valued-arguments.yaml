  - name: passes the default active flag to a Django model create
    inputs:
      file: accounts/tests/test_login.py
      unchanged:
        accounts/models.py: |
          from django.db import models


          class Member(models.Model):
              email = models.EmailField(unique=True)
              active = models.BooleanField(default=True)
      after: |
        import pytest

        from accounts.login import can_log_in
        from accounts.models import Member


        @pytest.mark.django_db
        def test_active_member_can_log_in():
            member = Member.objects.create(email="ana@example.com", active=True)

            assert can_log_in(member)
    expected_output:
      outcome: invalid
  - name: passes a non-default active flag to a Django model create
    inputs:
      file: accounts/tests/test_login.py
      unchanged:
        accounts/models.py: |
          from django.db import models


          class Member(models.Model):
              email = models.EmailField(unique=True)
              active = models.BooleanField(default=True)
      after: |
        import pytest

        from accounts.login import can_log_in
        from accounts.models import Member


        @pytest.mark.django_db
        def test_inactive_member_cannot_log_in():
            member = Member.objects.create(email="ana@example.com", active=False)

            assert not can_log_in(member)
    expected_output:
      outcome: valid
  - name: passes the default retry count to a fixture factory
    inputs:
      file: tests/test_jobs.py
      after: |
        import pytest

        from jobs.runner import Job


        @pytest.fixture
        def make_job():
            def make(name: str, retries: int = 3) -> Job:
                return Job(name=name, retries=retries)

            return make


        def test_job_is_queued(make_job):
            job = make_job("export", retries=3)

            assert job.state == "queued"
    expected_output:
      outcome: invalid
  - name: passes a standard-library argument that equals its default
    inputs:
      file: tests/test_reports.py
      after: |
        import json

        from reports.summary import summary


        def test_summary_is_serializable():
            text = json.dumps(summary(month="2026-09"), sort_keys=False)

            assert json.loads(text)["month"] == "2026-09"
    expected_output:
      outcome: valid
  - name: changes a local passed as an argument
