id: no-duplicate-logic
invalid:
- file: invoices/totals.py
  after: |
    def invoice_total(subtotal: int, tax_rate: float, discount: int) -> int:
        taxed = round((subtotal - discount) * (1 + tax_rate))
        return max(taxed, 0)


    def credit_note_total(discount: int, subtotal: int, tax_rate: float) -> int:
        taxed = round((subtotal - discount) * (1 + tax_rate))
        return max(taxed, 0)
- file: shipments/fees.py
  before: |
    FREE_SHIPPING_THRESHOLD = 5000


    def domestic_fee(order_total: int, weight_grams: int) -> int:
        if order_total >= FREE_SHIPPING_THRESHOLD:
            return 0
        return 500 + weight_grams // 100
  after: |
    FREE_SHIPPING_THRESHOLD = 5000


    def domestic_fee(order_total: int, weight_grams: int) -> int:
        if order_total >= FREE_SHIPPING_THRESHOLD:
            return 0
        return 500 + weight_grams // 100


    def return_fee(weight_grams: int, order_total: int) -> int:
        if order_total >= FREE_SHIPPING_THRESHOLD:
            return 0
        return 500 + weight_grams // 100
valid:
- file: shipments/fees.py
  after: |
    FREE_SHIPPING_THRESHOLD = 5000
    INTERNATIONAL_SURCHARGE = 1500


    def domestic_fee(order_total: int, weight_grams: int) -> int:
        if order_total >= FREE_SHIPPING_THRESHOLD:
            return 0
        return 500 + weight_grams // 100


    def international_fee(order_total: int, weight_grams: int) -> int:
        return domestic_fee(order_total, weight_grams) + INTERNATIONAL_SURCHARGE
