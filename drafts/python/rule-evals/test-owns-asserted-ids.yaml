cases:
  - name: moves an asserted order id into a module constant
    inputs:
      file: tests/test_shipments.py
      before: |
        from shipping.shipments import Shipment, plan_shipment


        def test_plan_shipment_sets_order():
            shipment = plan_shipment(order_id="ord-42", weight_kg=2)

            assert shipment == Shipment(order_id="ord-42", carrier="ground", weight_kg=2)
      after: |
        from shipping.shipments import Shipment, plan_shipment

        ORDER_ID = "ord-42"


        def test_plan_shipment_sets_order():
            shipment = plan_shipment(order_id=ORDER_ID, weight_kg=2)

            assert shipment == Shipment(order_id=ORDER_ID, carrier="ground", weight_kg=2)
    expected_output:
      outcome: invalid
  - name: passes a constant order id but asserts only the carrier
    inputs:
      file: tests/test_shipments.py
      after: |
        from shipping.shipments import plan_shipment

        ORDER_ID = "ord-42"


        def test_plan_shipment_uses_ground_for_light_parcels():
            shipment = plan_shipment(order_id=ORDER_ID, weight_kg=2)

            assert shipment.carrier == "ground"
    expected_output:
      outcome: valid
  - name: assigns the order id to a local in the test
    inputs:
      file: tests/test_shipments.py
      after: |
        from shipping.shipments import Shipment, plan_shipment


        DEFAULT_WEIGHT_KG = 2


        def test_plan_shipment_sets_order():
            order_id = "ord-42"

            shipment = plan_shipment(order_id=order_id, weight_kg=DEFAULT_WEIGHT_KG)

            assert shipment == Shipment(order_id=order_id, carrier="ground", weight_kg=DEFAULT_WEIGHT_KG)
    expected_output:
      outcome: valid
  - name: asserts an account id from a UUID constant
    inputs:
      file: tests/test_invoices.py
      after: |
        from decimal import Decimal
        from uuid import UUID

        from billing.invoices import Invoice, draft_invoice

        ACCOUNT_ID = UUID("8f14e45f-ceea-4672-9c3d-1b2a5f7e6d10")


        def test_draft_invoice_belongs_to_account():
            invoice = draft_invoice(account_id=ACCOUNT_ID, amount=Decimal("120.00"))

            assert invoice == Invoice(account_id=ACCOUNT_ID, amount=Decimal("120.00"), status="draft")
    expected_output:
      outcome: invalid
  - name: asserts the account id of the account fixture
    inputs:
      file: tests/test_invoices.py
      after: |
        from decimal import Decimal

        from billing.invoices import Invoice, draft_invoice

        AMOUNT = Decimal("120.00")


        def test_draft_invoice_belongs_to_account(account):
            invoice = draft_invoice(account_id=account.id, amount=AMOUNT)

            assert invoice == Invoice(account_id=account.id, amount=AMOUNT, status="draft")
    expected_output:
      outcome: valid
  - name: asserts a customer email imported from a constants module
    inputs:
      file: tests/test_signup.py
      unchanged:
        tests/constants.py: |
          CUSTOMER_EMAIL = "ana@example.com"
      after: |
        from accounts.signup import sign_up
        from tests.constants import CUSTOMER_EMAIL


        def test_sign_up_creates_customer_with_email(db_session):
            customer = sign_up(db_session, email="ana@example.com", password="s3cret-pass")

            assert customer.email == CUSTOMER_EMAIL
    expected_output:
      outcome: invalid
  - name: asserts a retry count against an imported limit
    inputs:
      file: tests/test_retries.py
      unchanged:
        tests/constants.py: |
          MAX_RETRIES = 3
      after: |
        from jobs.runner import run_with_retries
        from tests.constants import MAX_RETRIES
        from tests.fakes import AlwaysFailingTask


        def test_run_stops_after_the_retry_limit():
            task = AlwaysFailingTask()

            run_with_retries(task, max_retries=MAX_RETRIES)

            assert task.attempts == MAX_RETRIES
    expected_output:
      outcome: valid
  - name: asserts an order number from a class constant in a unittest case
    inputs:
      file: tests/test_order_numbers.py
      after: |
        import unittest

        from shop.orders import OrderNumbering


        class OrderNumberingTest(unittest.TestCase):
            FIRST_NUMBER = "A-0001"

            def test_first_order_gets_first_number(self):
                numbering = OrderNumbering(prefix="A")

                self.assertEqual(numbering.next(), self.FIRST_NUMBER)
    expected_output:
      outcome: invalid
  - name: asserts an order number literal in a unittest case
    inputs:
      file: tests/test_order_numbers.py
      after: |
        import unittest

        from shop.orders import OrderNumbering

        PREFIX = "A"


        class OrderNumberingTest(unittest.TestCase):
            def test_first_order_gets_first_number(self):
                numbering = OrderNumbering(prefix=PREFIX)

                self.assertEqual(numbering.next(), "A-0001")
    expected_output:
      outcome: valid
  - name: asserts a slug from a constant in a Django test
    inputs:
      file: blog/tests/test_article_save.py
      after: |
        import pytest

        from blog.models import Article

        HELLO_SLUG = "hello-big-world"


        @pytest.mark.django_db
        def test_save_sets_slug_from_title():
            article = Article(title="Hello Big World")

            article.save()

            assert Article.objects.get(pk=article.pk).slug == HELLO_SLUG
    expected_output:
      outcome: invalid
  - name: asserts a SKU from a constant read in a parametrize list
    inputs:
      file: tests/test_catalog.py
      after: |
        import pytest

        from catalog.lookup import find_product

        BOOK_SKU = "BOOK-1"


        @pytest.mark.parametrize("query", ["book", "BOOK", " book "])
        def test_find_product_matches_case_insensitively(catalog, query):
            product = find_product(catalog, query)

            assert product.sku == BOOK_SKU
    expected_output:
      outcome: invalid
  - name: changes a weight in a test
    inputs:
      file: tests/test_shipments.py
      before: |
        from shipping.shipments import plan_shipment


        def test_plan_shipment_uses_ground():
            assert plan_shipment(order_id="ord-42", weight_kg=2).carrier == "ground"
      after: |
        from shipping.shipments import plan_shipment


        def test_plan_shipment_uses_ground():
            assert plan_shipment(order_id="ord-42", weight_kg=3).carrier == "ground"
    expected_output:
      outcome: skipped
  - name: renames a lowercase module value
    inputs:
      file: tests/test_shipments.py
      before: |
        default_weight = 2
      after: |
        default_weight_kg = 2
    expected_output:
      outcome: skipped
