- name: runs checkout steps through several collaborators
  inputs:
    file: checkout/checkout_service.py
    after: |
      from inventory import StockReservations
      from notifications import ReceiptMailer
      from payments import PaymentGateway

      from .cart import Cart, Receipt


      class CheckoutService:
          def __init__(
              self,
              stock: StockReservations,
              payments: PaymentGateway,
              mailer: ReceiptMailer,
          ) -> None:
              self._stock = stock
              self._payments = payments
              self._mailer = mailer

          def checkout(self, cart: Cart) -> Receipt:
              self._reserve(cart)
              receipt = self._charge(cart)
              self._mailer.send(cart.customer_email, receipt)
              return receipt

          def _reserve(self, cart: Cart) -> None:
              for line in cart.lines:
                  self._stock.reserve(line.sku, line.quantity)

          def _charge(self, cart: Cart) -> Receipt:
              charge_id = self._payments.charge(cart.payment_token, cart.total_cents)
              return Receipt(charge_id=charge_id, total_cents=cart.total_cents)
  expected_output:
    outcome: valid
