- name: splits a CSV line and queries the customer table in one function
  inputs:
    file: imports/customers.py
    after: |
      import sqlite3
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class ImportedOrder:
          number: str
          customer_name: str
          total_cents: int


      def import_line(connection: sqlite3.Connection, line: str) -> ImportedOrder:
          number, customer_id, total = line.strip().split(",")
          row = connection.execute(
              "SELECT name FROM customers WHERE id = ?", (int(customer_id),)
          ).fetchone()
          return ImportedOrder(number=number, customer_name=row[0], total_cents=int(total))
