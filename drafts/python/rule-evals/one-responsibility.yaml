- name: downloads rates, parses them, and writes the cache in one coroutine
  inputs:
    file: rates/refresh.py
    after: |
      import json
      from pathlib import Path

      import httpx

      RATES_URL = "https://rates.example.com/v1/rates"


      async def refresh_rates(client: httpx.AsyncClient, cache_path: Path) -> dict[str, float]:
          response = await client.get(RATES_URL)
          response.raise_for_status()
          rates = {item["currency"]: float(item["rate"]) for item in response.json()["rates"]}
          cache_path.write_text(json.dumps(rates, sort_keys=True))
          return rates
