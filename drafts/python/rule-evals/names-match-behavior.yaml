  - name: names an overdue count send_reminders
    inputs:
      file: billing/reminders.py
      after: |
        from dataclasses import dataclass
        from datetime import date
        from typing import Protocol


        @dataclass(frozen=True)
        class Invoice:
            number: str
            due_on: date
            paid: bool


        class InvoiceStore(Protocol):
            async def open_invoices(self) -> list[Invoice]: ...


        async def send_reminders(store: InvoiceStore, today: date) -> int:
            invoices = await store.open_invoices()
            return sum(1 for invoice in invoices if not invoice.paid and invoice.due_on < today)
    expected_output:
      outcome: invalid
  - name: names the overdue count count_overdue_invoices
    inputs:
      file: billing/reminders.py
      after: |
        from dataclasses import dataclass
        from datetime import date
        from typing import Protocol


        @dataclass(frozen=True)
        class Invoice:
            number: str
            due_on: date
            paid: bool


        class InvoiceStore(Protocol):
            async def open_invoices(self) -> list[Invoice]: ...


        async def count_overdue_invoices(store: InvoiceStore, today: date) -> int:
            invoices = await store.open_invoices()
            return sum(1 for invoice in invoices if not invoice.paid and invoice.due_on < today)
    expected_output:
      outcome: valid
  - name: names a nested tax function helper
    inputs:
      file: invoices/tax.py
      after: |
        from dataclasses import dataclass

        TAX_RATE = 0.2


        @dataclass(frozen=True)
        class InvoiceLine:
            amount_cents: int
            taxable: bool


        def invoice_tax_cents(lines: list[InvoiceLine]) -> int:
            def helper(line: InvoiceLine) -> int:
                return round(line.amount_cents * TAX_RATE) if line.taxable else 0

            return sum(helper(line) for line in lines)
    expected_output:
      outcome: invalid
  - name: names the nested tax function line_tax_cents
    inputs:
      file: invoices/tax.py
      after: |
        from dataclasses import dataclass

        TAX_RATE = 0.2


        @dataclass(frozen=True)
        class InvoiceLine:
            amount_cents: int
            taxable: bool


        def invoice_tax_cents(lines: list[InvoiceLine]) -> int:
            def line_tax_cents(line: InvoiceLine) -> int:
                return round(line.amount_cents * TAX_RATE) if line.taxable else 0

            return sum(line_tax_cents(line) for line in lines)
    expected_output:
      outcome: valid
  - name: renames a refund method retry_payment
    inputs:
      file: payments/service.py
      before: |
        from typing import Protocol


        class PaymentGateway(Protocol):
            def refund(self, payment_id: str, amount_cents: int) -> None: ...


        class PaymentService:
            def __init__(self, gateway: PaymentGateway) -> None:
                self.gateway = gateway

            def refund_payment(self, payment_id: str, amount_cents: int) -> None:
                self.gateway.refund(payment_id, amount_cents)
      after: |
        from typing import Protocol


        class PaymentGateway(Protocol):
            def refund(self, payment_id: str, amount_cents: int) -> None: ...


        class PaymentService:
            def __init__(self, gateway: PaymentGateway) -> None:
                self.gateway = gateway

            def retry_payment(self, payment_id: str, amount_cents: int) -> None:
                self.gateway.refund(payment_id, amount_cents)
    expected_output:
      outcome: invalid
  - name: overrides a Django model's save to stamp the edit time
    inputs:
      file: catalog/models.py
      after: |
        from django.db import models
        from django.utils import timezone


        class Product(models.Model):
            name = models.CharField(max_length=200)
            edited_at = models.DateTimeField(null=True)

            def save(self, *args, **kwargs):
                self.edited_at = timezone.now()
                super().save(*args, **kwargs)
    expected_output:
      outcome: valid
