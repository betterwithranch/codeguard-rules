# yaml-language-server: $schema=rule-eval-schema.json
cases:
  - name: totals an invoice in a loose function
    inputs:
      file: invoices/invoice.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class InvoiceLine:
            quantity: int
            unit_price_cents: int


        @dataclass(frozen=True)
        class Invoice:
            number: str
            lines: list[InvoiceLine]


        def invoice_total_cents(invoice: Invoice) -> int:
            return sum(line.quantity * line.unit_price_cents for line in invoice.lines)
    expected_output:
      outcome: invalid
  - name: builds a shipment in a loose function
    inputs:
      file: shipments/shipment.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            order_number: str
            destination: str
            weight_kg: float
      after: |
        from dataclasses import dataclass

        from orders.order import Order


        @dataclass(frozen=True)
        class Shipment:
            order_number: str
            destination: str
            weight_kg: float


        def make_shipment(order: Order) -> Shipment:
            return Shipment(
                order_number=order.number,
                destination=order.shipping_address,
                weight_kg=order.total_weight_kg,
            )
    expected_output:
      outcome: invalid
  - name: defines a generic chunking utility
    inputs:
      file: orders/batching.py
      after: |
        from collections.abc import Iterator, Sequence


        def chunked[T](items: Sequence[T], size: int) -> Iterator[Sequence[T]]:
            for start in range(0, len(items), size):
                yield items[start : start + size]
    expected_output:
      outcome: valid
  - name: changes the overdue reminder threshold
    inputs:
      file: invoices/invoice.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total_cents: int

            def is_overdue_reminder_due(self, days_open: int) -> bool:
                return self.total_cents > 0 and days_open > 30
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total_cents: int

            def is_overdue_reminder_due(self, days_open: int) -> bool:
                return self.total_cents > 0 and days_open > 45
    expected_output:
      outcome: skipped
