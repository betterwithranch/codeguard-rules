  - name: changes a method on a class with an ordinary base
    inputs:
      file: pricing/discounts.py
      before: |
        from .base import Discount


        class PercentDiscount(Discount):
            def apply(self, total_cents: int) -> int:
                return total_cents * 90 // 100
      after: |
        from .base import Discount


        class PercentDiscount(Discount):
            def apply(self, total_cents: int) -> int:
                return total_cents * 85 // 100
    expected_output:
      outcome: skipped
