  - name: adds a protocol whose only other class is a test fake
    inputs:
      file: billing/clock.py
      unchanged:
        billing/system_clock.py: |
          from datetime import datetime, timezone


          class SystemClock:
              def now(self) -> datetime:
                  return datetime.now(timezone.utc)
        tests/billing/fakes.py: |
          from datetime import datetime


          class FakeClock:
              def __init__(self, fixed: datetime) -> None:
                  self._fixed = fixed

              def now(self) -> datetime:
                  return self._fixed
        billing/due_dates.py: |
          from datetime import timedelta

          from billing.clock import Clock


          def is_overdue(clock: Clock, issued_days_ago: int) -> bool:
              return clock.now() - timedelta(days=issued_days_ago) > clock.now() - timedelta(days=30)
      after: |
        from datetime import datetime
        from typing import Protocol


        class Clock(Protocol):
            def now(self) -> datetime: ...
    expected_output:
      outcome: invalid
  - name: adds a lower-level protocol that its one implementer imports
    inputs:
      file: ledger/notifier.py
      unchanged:
        ledger/postings.py: |
          from ledger.notifier import PostingNotifier


          class Ledger:
              def __init__(self, notifier: PostingNotifier) -> None:
                  self._notifier = notifier
                  self._balance_cents = 0

              def post(self, account: str, amount_cents: int) -> None:
                  self._balance_cents += amount_cents
                  self._notifier.posted(account, amount_cents)
        accounts/alerts.py: |
          from accounts.mailer import Mailer
          from ledger.postings import Ledger


          class LedgerAlerts:
              def __init__(self, mailer: Mailer) -> None:
                  self._mailer = mailer

              def posted(self, account: str, amount_cents: int) -> None:
                  self._mailer.send(account, f"Posted {amount_cents / 100:.2f}")


          def build_ledger(mailer: Mailer) -> Ledger:
              return Ledger(LedgerAlerts(mailer))
      after: |
        from typing import Protocol


        class PostingNotifier(Protocol):
            def posted(self, account: str, amount_cents: int) -> None: ...
    expected_output:
      outcome: valid
  - name: adds a protocol that two classes elsewhere satisfy
    inputs:
      file: search/indexer.py
      unchanged:
        catalog/product_document.py: |
          from catalog.models import Product


          class ProductDocument:
              def __init__(self, product: Product) -> None:
                  self._product = product

              def search_text(self) -> str:
                  return f"{self._product.name} {self._product.description}"
        blog/post_document.py: |
          from blog.models import Post


          class PostDocument:
              def __init__(self, post: Post) -> None:
                  self._post = post

              def search_text(self) -> str:
                  return f"{self._post.title} {self._post.body}"
      after: |
        from typing import Protocol


        class Searchable(Protocol):
            def search_text(self) -> str: ...


        def index_words(documents: list[Searchable]) -> set[str]:
            return {word for document in documents for word in document.search_text().split()}
    expected_output:
      outcome: valid
  - name: adds a runtime-checkable protocol with no implementer
    inputs:
      file: plugins/hooks.py
      after: |
        from typing import Protocol, runtime_checkable


        @runtime_checkable
        class PreSaveHook(Protocol):
            def before_save(self, record_id: str) -> None: ...


        def run_hooks(hooks: list[object], record_id: str) -> None:
            for hook in hooks:
                if isinstance(hook, PreSaveHook):
                    hook.before_save(record_id)
    expected_output:
      outcome: invalid
  - name: adds an ABCMeta interface with two implementers in the file
    inputs:
      file: pricing/discounts.py
      after: |
        from abc import ABCMeta, abstractmethod


        class Discount(metaclass=ABCMeta):
            @abstractmethod
            def apply(self, total_cents: int) -> int: ...


        class PercentDiscount(Discount):
            def __init__(self, percent: int) -> None:
                self._percent = percent

            def apply(self, total_cents: int) -> int:
                return total_cents * (100 - self._percent) // 100


        class FixedDiscount(Discount):
            def __init__(self, cents: int) -> None:
                self._cents = cents

            def apply(self, total_cents: int) -> int:
                return max(total_cents - self._cents, 0)
    expected_output:
      outcome: valid
