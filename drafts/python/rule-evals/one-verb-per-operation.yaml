        from documents.invoices import Invoice, InvoiceBuilder
        from orders.models import Order


        @dataclass(frozen=True)
        class Receipt:
            order_number: str
            paid_cents: int


        class ReceiptBuilder:
            def build(self, order: Order) -> Receipt:
                return Receipt(order_number=order.number, paid_cents=order.total_cents)


