  - name: adds a warehouse lookup named interpret beside a carrier lookup named resolve
    inputs:
      file: logistics/codes.py
      before: |
        from enum import StrEnum


        class Carrier(StrEnum):
            DHL = "dhl"
            UPS = "ups"


        CARRIERS_BY_CODE = {"D": Carrier.DHL, "U": Carrier.UPS}


        def resolve_carrier(code: str) -> Carrier:
            return CARRIERS_BY_CODE[code]
      after: |
        from enum import StrEnum


        class Carrier(StrEnum):
            DHL = "dhl"
            UPS = "ups"


        class Warehouse(StrEnum):
            BERLIN = "berlin"
            LYON = "lyon"


        CARRIERS_BY_CODE = {"D": Carrier.DHL, "U": Carrier.UPS}
        WAREHOUSES_BY_CODE = {"B": Warehouse.BERLIN, "L": Warehouse.LYON}


        def resolve_carrier(code: str) -> Carrier:
            return CARRIERS_BY_CODE[code]


        def interpret_warehouse(code: str) -> Warehouse:
            return WAREHOUSES_BY_CODE[code]
    expected_output:
      outcome: invalid
