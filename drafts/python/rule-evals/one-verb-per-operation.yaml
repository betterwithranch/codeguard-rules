  - name: renames a DHL quote method to retrieve beside a UPS one that fetches
    inputs:
      file: rates/quotes.py
      unchanged:
        rates/ups.py: |
          from typing import Protocol


          class UpsClient(Protocol):
              def rate(self, weight_grams: int) -> int: ...


          class UpsRates:
              def __init__(self, client: UpsClient) -> None:
                  self.client = client

              def fetch_quote(self, weight_grams: int) -> int:
                  return self.client.rate(weight_grams)
      before: |
        from typing import Protocol

        from rates.ups import UpsRates


        class DhlClient(Protocol):
            def price(self, weight_grams: int) -> int: ...


        class DhlRates:
            def __init__(self, client: DhlClient) -> None:
                self.client = client

            def fetch_quote(self, weight_grams: int) -> int:
                return self.client.price(weight_grams)


        def cheapest_quote(ups: UpsRates, dhl: DhlRates, weight_grams: int) -> int:
            return min(ups.fetch_quote(weight_grams), dhl.fetch_quote(weight_grams))
      after: |
        from typing import Protocol

        from rates.ups import UpsRates


        class DhlClient(Protocol):
            def price(self, weight_grams: int) -> int: ...


        class DhlRates:
            def __init__(self, client: DhlClient) -> None:
                self.client = client

            def retrieve_quote(self, weight_grams: int) -> int:
                return self.client.price(weight_grams)


        def cheapest_quote(ups: UpsRates, dhl: DhlRates, weight_grams: int) -> int:
            return min(ups.fetch_quote(weight_grams), dhl.retrieve_quote(weight_grams))
    expected_output:
      outcome: invalid
  - name: adds a renderer beside a parser
    inputs:
      file: orders/formats.py
      before: |
        import json
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            total_cents: int


        def parse_orders(text: str) -> list[Order]:
            return [Order(number=item["number"], total_cents=item["total_cents"]) for item in json.loads(text)]
      after: |
        import json
        from dataclasses import asdict, dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            total_cents: int


        def parse_orders(text: str) -> list[Order]:
            return [Order(number=item["number"], total_cents=item["total_cents"]) for item in json.loads(text)]


        def render_orders(orders: list[Order]) -> str:
            return json.dumps([asdict(order) for order in orders])
    expected_output:
      outcome: valid
  - name: implements an imported notifier protocol under its declared name
    inputs:
      file: notifications/sms.py
      unchanged:
        notifications/ports.py: |
          from typing import Protocol


          class Notifier(Protocol):
              def notify(self, customer_id: str, text: str) -> None: ...
      after: |
        from typing import Protocol

        from notifications.ports import Notifier


        class SmsGateway(Protocol):
            def send_sms(self, phone_number: str, text: str) -> None: ...


        class SmsNotifier(Notifier):
            def __init__(self, gateway: SmsGateway, phone_numbers: dict[str, str]) -> None:
                self.gateway = gateway
                self.phone_numbers = phone_numbers

            def notify(self, customer_id: str, text: str) -> None:
                self.gateway.send_sms(self.phone_numbers[customer_id], text)
    expected_output:
      outcome: valid
