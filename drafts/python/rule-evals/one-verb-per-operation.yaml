cases:
  - name: adds a JSON reader that interprets beside a CSV reader that parses
    inputs:
      file: orders/readers.py
      before: |
        import csv
        import io
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            total_cents: int


        class CsvOrderReader:
            def parse(self, text: str) -> list[Order]:
                rows = csv.reader(io.StringIO(text))
                return [Order(number=number, total_cents=int(total)) for number, total in rows]
      after: |
        import csv
        import io
        import json
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            total_cents: int


        class CsvOrderReader:
            def parse(self, text: str) -> list[Order]:
                rows = csv.reader(io.StringIO(text))
                return [Order(number=number, total_cents=int(total)) for number, total in rows]


        class JsonOrderReader:
            def interpret(self, text: str) -> list[Order]:
                return [
                    Order(number=item["number"], total_cents=item["total_cents"])
                    for item in json.loads(text)
                ]
    expected_output:
      outcome: invalid
