  - name: links a Django category to its created parent in a data migration
    inputs:
      file: catalog/migrations/0007_seed_categories.py
      after: |
        from django.db import migrations


        def seed(apps, schema_editor):
            Category = apps.get_model("catalog", "Category")
            root = Category.objects.create(name="All")
            Category.objects.create(name="Shoes", parent_id=root.id)


        class Migration(migrations.Migration):
            dependencies = [("catalog", "0006_category")]
            operations = [migrations.RunPython(seed)]
    expected_output:
      outcome: valid
  - name: renames a repository method call
    inputs:
      file: scripts/seed_demo_orders.py
      before: |
        from orders import Order, OrderRepository


        def seed_orders(orders: OrderRepository, demo_orders: list[Order]) -> list[Order]:
            return [orders.create(order) for order in demo_orders]
      after: |
        from orders import Order, OrderRepository


        def seed_orders(orders: OrderRepository, demo_orders: list[Order]) -> list[Order]:
            return [orders.save(order) for order in demo_orders]
    expected_output:
      outcome: skipped
  - name: changes a seeded total
    inputs:
