  - name: refunds an order loaded by its number
    inputs:
      file: billing/refunds.py
      after: |
        from billing.models import Refund
        from billing.repository import RefundRepository
        from orders.repository import OrderRepository


        def refund_order(number: str, orders: OrderRepository, refunds: RefundRepository) -> Refund:
            order = orders.get_by_number(number)
            return refunds.create(Refund(order_id=order.id, amount_cents=order.total_cents))
    expected_output:
      outcome: valid
