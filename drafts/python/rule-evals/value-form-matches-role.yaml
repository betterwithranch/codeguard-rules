  - name: gives a job a generated kind that the runner matches on
    inputs:
      file: jobs/schedule.py
      unchanged:
        jobs/runner.py: |
          from jobs.models import Job
          from reports.exports import run_export
          from reports.imports import run_import


          def run(job: Job) -> None:
              match job.kind:
                  case "export":
                      run_export(job)
                  case "import":
                      run_import(job)
                  case _:
                      raise ValueError(f"unknown job kind {job.kind}")
      after: |
        from uuid import uuid4

        from jobs.models import Job
        from jobs.queue import JobQueue


        def schedule_nightly_export(queue: JobQueue) -> Job:
            return queue.push(Job(id=uuid4(), kind=uuid4().hex, cron="0 2 * * *"))
    expected_output:
      outcome: invalid
  - name: gives a job a literal kind that the runner matches on
    inputs:
      file: jobs/schedule.py
      unchanged:
        jobs/runner.py: |
          from jobs.models import Job
          from reports.exports import run_export
          from reports.imports import run_import


          def run(job: Job) -> None:
              match job.kind:
                  case "export":
                      run_export(job)
                  case "import":
                      run_import(job)
                  case _:
                      raise ValueError(f"unknown job kind {job.kind}")
      after: |
