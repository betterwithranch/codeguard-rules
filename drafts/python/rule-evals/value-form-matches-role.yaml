  - name: gives a new order a generated id
    inputs:
      file: orders/service.py
      after: |
        from uuid import uuid4

        from orders.models import Customer, Order, OrderStatus
        from orders.repository import OrderRepository


        class OrderService:
            def __init__(self, orders: OrderRepository) -> None:
                self._orders = orders

            def place(self, customer: Customer, total_cents: int) -> Order:
                order = Order(id=uuid4(), customer_id=customer.id, status=OrderStatus.PENDING, total_cents=total_cents)
                return self._orders.create(order)
    expected_output:
      outcome: valid
