cases:
  - name: links a shipment to a fresh uuid
    inputs:
      file: scripts/seed_demo_orders.py
      after: |
        from uuid import uuid4

        from orders import Order, OrderRepository
        from shipping import Shipment, ShipmentRepository


        def seed_demo_orders(orders: OrderRepository, shipments: ShipmentRepository) -> None:
            order = orders.create(Order(customer_email="demo@example.com", total_cents=4999))
            shipments.create(Shipment(order_id=uuid4(), carrier="ups"))
            print(f"Seeded order {order.id} with its shipment")
    expected_output:
      outcome: invalid
  - name: adds a shipment with a random order id
    inputs:
      file: scripts/seed_demo_orders.py
      before: |
        from orders import Order, OrderRepository
        from shipping import ShipmentRepository


        def seed_demo_orders(orders: OrderRepository, shipments: ShipmentRepository) -> None:
            order = orders.create(Order(customer_email="demo@example.com", total_cents=4999))
            print(f"Seeded order {order.id}")
      after: |
        from uuid import uuid4

        from orders import Order, OrderRepository
        from shipping import Shipment, ShipmentRepository


        def seed_demo_orders(orders: OrderRepository, shipments: ShipmentRepository) -> None:
            order = orders.create(Order(customer_email="demo@example.com", total_cents=4999))
            shipments.create(Shipment(order_id=uuid4(), carrier="ups"))
            print(f"Seeded order {order.id} with its shipment")
    expected_output:
      outcome: invalid
  - name: links a shipment to the created order
    inputs:
      file: scripts/seed_demo_orders.py
      after: |
        from orders import Order, OrderRepository
        from shipping import Shipment, ShipmentRepository


        def seed_demo_orders(orders: OrderRepository, shipments: ShipmentRepository) -> None:
            order = orders.create(Order(customer_email="demo@example.com", total_cents=4999))
            shipments.create(Shipment(order_id=order.id, carrier="ups"))
            print(f"Seeded order {order.id} with its shipment")
    expected_output:
      outcome: valid
  - name: renames a repository method call
    inputs:
      file: scripts/seed_demo_orders.py
      before: |
        from orders import Order, OrderRepository


        def seed_orders(orders: OrderRepository, demo_orders: list[Order]) -> list[Order]:
            return [orders.create(order) for order in demo_orders]
      after: |
        from orders import Order, OrderRepository


        def seed_orders(orders: OrderRepository, demo_orders: list[Order]) -> list[Order]:
            return [orders.save(order) for order in demo_orders]
    expected_output:
      outcome: skipped
