cases:
  - name: shares a module-level validator instance
    inputs:
      file: orders/validation.py
      after: |
        class OrderValidator:
            def __init__(self, region: str) -> None:
                self.region = region
                self.issues: list[str] = []

            def check(self, order_total: int, country: str) -> None:
                if order_total <= 0:
                    self.issues.append("order total must be positive")
                if country != self.region:
                    self.issues.append(f"order ships outside {self.region}")


        validator = OrderValidator(region="eu")
    expected_output:
      outcome: invalid
  - name: replaces the auditor factory with a global
    inputs:
      file: invoices/audit.py
      before: |
        class InvoiceAuditor:
            def __init__(self) -> None:
                self.findings: list[str] = []

            def audit(self, invoice_number: str, total: int) -> None:
                if total < 0:
                    self.findings.append(f"{invoice_number} has a negative total")


        def create_invoice_auditor() -> InvoiceAuditor:
            return InvoiceAuditor()
      after: |
        class InvoiceAuditor:
            def __init__(self) -> None:
                self.findings: list[str] = []

            def audit(self, invoice_number: str, total: int) -> None:
                if total < 0:
                    self.findings.append(f"{invoice_number} has a negative total")


        auditor = InvoiceAuditor()
    expected_output:
      outcome: invalid
  - name: shares a stateless price calculator at module level
    inputs:
      file: orders/pricing.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class PriceCalculator:
            tax_percent: int

            def total_cents(self, subtotal_cents: int) -> int:
                return subtotal_cents * (100 + self.tax_percent) // 100


        calculator = PriceCalculator(tax_percent=20)
    expected_output:
      outcome: valid
  - name: shares an imported totals accumulator at module level
    inputs:
      file: reports/daily_report.py
      unchanged:
        reports/totals.py: |
          class RunningTotals:
              def __init__(self) -> None:
                  self.revenue_cents = 0
                  self.order_count = 0

              def add(self, order_total_cents: int) -> None:
                  self.revenue_cents += order_total_cents
                  self.order_count += 1
      after: |
        from .totals import RunningTotals

        totals = RunningTotals()


        def summarize(order_totals: list[int]) -> str:
            for total in order_totals:
                totals.add(total)
            return f"{totals.order_count} orders, {totals.revenue_cents / 100:.2f}"
    expected_output:
      outcome: invalid
  - name: shares an imported stateless formatter at module level
    inputs:
      file: reports/daily_report.py
      unchanged:
        reports/formatting.py: |
          class MoneyFormatter:
              def __init__(self, currency: str) -> None:
                  self.currency = currency

              def format(self, cents: int) -> str:
                  return f"{cents / 100:.2f} {self.currency}"
      after: |
        from .formatting import MoneyFormatter

        formatter = MoneyFormatter(currency="EUR")


        def summarize(order_totals: list[int]) -> str:
            return ", ".join(formatter.format(total) for total in order_totals)
    expected_output:
      outcome: valid
  - name: defaults a parameter to a collecting validator
    inputs:
      file: orders/import_orders.py
      unchanged:
        orders/validation.py: |
          class OrderValidator:
              def __init__(self) -> None:
                  self.issues: list[str] = []

              def check(self, order_total: int) -> None:
                  if order_total <= 0:
                      self.issues.append("order total must be positive")
      after: |
        from .validation import OrderValidator


        def import_orders(
            totals: list[int], validator: OrderValidator = OrderValidator()
        ) -> list[str]:
            for total in totals:
                validator.check(total)
            return validator.issues
    expected_output:
      outcome: invalid
  - name: creates a collecting validator per call
    inputs:
      file: orders/import_orders.py
      unchanged:
        orders/validation.py: |
          class OrderValidator:
              def __init__(self) -> None:
                  self.issues: list[str] = []

              def check(self, order_total: int) -> None:
                  if order_total <= 0:
                      self.issues.append("order total must be positive")
      after: |
        from .validation import OrderValidator

        MAX_ORDERS = 500


        def import_orders(totals: list[int], validator: OrderValidator | None = None) -> list[str]:
            validator = validator or OrderValidator()
            for total in totals[:MAX_ORDERS]:
                validator.check(total)
            return validator.issues
    expected_output:
      outcome: skipped
  - name: holds a collecting parser as a class attribute
    inputs:
      file: imports/csv_import.py
      unchanged:
        imports/row_parser.py: |
          class RowParser:
              def __init__(self) -> None:
                  self.errors: list[str] = []
                  self.rows: list[dict[str, str]] = []

              def feed(self, line: str) -> None:
                  cells = line.split(",")
                  if len(cells) != 3:
                      self.errors.append(f"bad row: {line}")
                  else:
                      self.rows.append(dict(zip(["sku", "name", "price"], cells)))
      after: |
        from .row_parser import RowParser


        class ProductImport:
            parser = RowParser()

            def run(self, text: str) -> list[str]:
                for line in text.splitlines():
                    self.parser.feed(line)
                return self.parser.errors
    expected_output:
      outcome: invalid
  - name: caches a collecting auditor in a factory
    inputs:
      file: invoices/audit_factory.py
      unchanged:
        invoices/audit.py: |
          class InvoiceAuditor:
              def __init__(self) -> None:
                  self.findings: list[str] = []

              def audit(self, invoice_number: str, total: int) -> None:
                  if total < 0:
                      self.findings.append(f"{invoice_number} has a negative total")
      after: |
        from functools import cache

        from .audit import InvoiceAuditor


        @cache
        def get_invoice_auditor() -> InvoiceAuditor:
            return InvoiceAuditor()
    expected_output:
      outcome: invalid
  - name: registers routes on a module-level router
    inputs:
      file: orders/routes.py
      after: |
        from fastapi import APIRouter

        from .schemas import OrderOut
        from .service import find_order

        router = APIRouter(prefix="/orders")


        @router.get("/{order_id}")
        def get_order(order_id: int) -> OrderOut:
            return OrderOut.model_validate(find_order(order_id))
    expected_output:
      outcome: valid
  - name: shares a cache keyed by currency at module level
    inputs:
      file: billing/exchange.py
      after: |
        from .rates_client import RatesClient


        class RateCache:
            def __init__(self, client: RatesClient) -> None:
                self._client = client
                self._rates: dict[str, float] = {}

            def rate(self, currency: str) -> float:
                if currency not in self._rates:
                    self._rates[currency] = self._client.fetch_rate(currency)
                return self._rates[currency]


        rates = RateCache(RatesClient())
    expected_output:
      outcome: valid
  - name: shares a validator built by a factory function at module level
    inputs:
      file: orders/checkout.py
      unchanged:
        orders/validation.py: |
          class OrderValidator:
              def __init__(self, region: str) -> None:
                  self.region = region
                  self.issues: list[str] = []

              def check(self, country: str) -> None:
                  if country != self.region:
                      self.issues.append(f"order ships outside {self.region}")


          def create_order_validator() -> OrderValidator:
              return OrderValidator(region="eu")
      after: |
        from .validation import create_order_validator

        validator = create_order_validator()


        def checkout_issues(country: str) -> list[str]:
            validator.check(country)
            return validator.issues
    expected_output:
