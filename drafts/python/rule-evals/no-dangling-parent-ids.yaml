cases:
  - name: seeds an invoice with a fixed account id
    inputs:
      file: tests/conftest.py
      after: |
        from decimal import Decimal
        from uuid import UUID

        import pytest

        from billing.invoices import InvoiceService


        @pytest.fixture
        def invoice(db_session):
            return InvoiceService(db_session).create(
                account_id=UUID("8f14e45f-ceea-4672-9c3d-1b2a5f7e6d10"),
                amount=Decimal("120.00"),
            )
    expected_output:
      outcome: invalid
  - name: seeds an invoice for the account fixture
    inputs:
      file: tests/conftest.py
      after: |
        from decimal import Decimal

        import pytest

        from billing.invoices import InvoiceService


        @pytest.fixture
        def invoice(db_session, account):
            return InvoiceService(db_session).create(account_id=account.id, amount=Decimal("120.00"))
    expected_output:
      outcome: valid
  - name: ships an order that was never created
    inputs:
      file: tests/test_shipments.py
      before: |
        from shop.customers import CustomerService
        from shop.orders import OrderService
        from shop.shipments import ShipmentService


        def test_ship_order_sets_tracking_number(db_session):
            customer = CustomerService(db_session).register(email="ana@example.com")
            order = OrderService(db_session).place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            shipment = ShipmentService(db_session).ship(order_id=order.id, carrier="UPS")

            assert shipment.tracking_number.startswith("1Z")
      after: |
        from uuid import uuid4

        from shop.shipments import ShipmentService


        def test_ship_order_sets_tracking_number(db_session):
            shipment = ShipmentService(db_session).ship(order_id=uuid4(), carrier="UPS")

            assert shipment.tracking_number.startswith("1Z")
    expected_output:
      outcome: invalid
  - name: ships an order created through services
    inputs:
      file: tests/test_shipments.py
      after: |
        from shop.customers import CustomerService
        from shop.orders import OrderService
        from shop.shipments import ShipmentService


        def test_ship_order_links_the_shipment_to_the_order(db_session):
            customer = CustomerService(db_session).register(email="ana@example.com")
            order = OrderService(db_session).place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            shipment = ShipmentService(db_session).ship(order_id=order.id, carrier="UPS")

            assert shipment.order_id == order.id
    expected_output:
      outcome: valid
  - name: asserts shipping a missing order raises
    inputs:
      file: tests/test_shipments.py
      after: |
        from uuid import uuid4

        import pytest

        from shop.shipments import OrderNotFound, ShipmentService


        def test_ship_unknown_order_raises(db_session):
            with pytest.raises(OrderNotFound):
                ShipmentService(db_session).ship(order_id=uuid4(), carrier="UPS")
    expected_output:
      outcome: valid
  - name: posts a shipment for an order id no order has
    inputs:
      file: shop/tests/test_shipment_api.py
      after: |
        import pytest


        @pytest.mark.django_db
        def test_create_shipment_returns_tracking_number(api_client):
            response = api_client.post("/shipments/", {"order_id": 999, "carrier": "UPS"}, format="json")

            assert response.status_code == 201
            assert response.json()["tracking_number"].startswith("1Z")
    expected_output:
      outcome: invalid
  - name: posts a shipment for an order the test creates
    inputs:
      file: shop/tests/test_shipment_api.py
      after: |
        import pytest

        from shop.models import Order


        @pytest.mark.django_db
        def test_create_shipment_returns_tracking_number(api_client, customer):
            order = Order.objects.create(customer=customer, number="A-1")

            response = api_client.post("/shipments/", {"order_id": order.pk, "carrier": "UPS"}, format="json")

            assert response.status_code == 201
            assert response.json()["tracking_number"].startswith("1Z")
    expected_output:
      outcome: valid
  - name: matches a literal customer id to a customer built in the test
    inputs:
      file: tests/test_order_emails.py
      after: |
        from notifications.order_emails import order_email_subject
        from orders.models import Customer, Order


        def test_subject_names_customer():
            customer = Customer(id="cus-1", name="Ada")
            order = Order(id="ord-1", customer_id="cus-1", total=120)

            assert order_email_subject(order, customer) == "Ada, your order ord-1"
    expected_output:
      outcome: valid
  - name: points an order at a customer id no customer in the test has
    inputs:
      file: tests/test_order_emails.py
      after: |
        from notifications.order_emails import order_email_subject
        from orders.models import Customer, Order


        def test_subject_names_customer():
            customer = Customer(id="cus-1", name="Ada")
            order = Order(id="ord-1", customer_id="cus-9", total=120)

            assert order_email_subject(order, customer) == "Ada, your order ord-1"
    expected_output:
      outcome: invalid
  - name: assigns a made-up invoice id to a line in a helper
    inputs:
      file: tests/test_invoice_lines.py
      after: |
        from billing.lines import InvoiceLine, LineRepository


        def save_line(db_session, sku):
            line = InvoiceLine(sku=sku, amount=10)
            line.invoice_id = "inv-404"
            return LineRepository(db_session).add(line)


        def test_line_total_is_saved(db_session):
            line = save_line(db_session, "A1")

            assert LineRepository(db_session).get(line.id).amount == 10
    expected_output:
      outcome: invalid
  - name: gives a new category a generated own id
    inputs:
      file: tests/test_categories.py
      after: |
        from uuid import uuid4

        from catalog.categories import Category, CategoryRepository


        def test_saved_category_can_be_found(db_session):
            category = Category(id=uuid4(), name="Shoes")
            CategoryRepository(db_session).add(category)

            assert CategoryRepository(db_session).get(category.id) == category
    expected_output:
      outcome: valid
  - name: links a child category to a random parent id
    inputs:
      file: tests/test_categories.py
      after: |
        from uuid import uuid4

        from catalog.categories import Category, CategoryRepository


        def test_child_category_lists_under_parent(db_session):
            child = Category(id=uuid4(), name="Running shoes", parent_id=uuid4())
            CategoryRepository(db_session).add(child)

            assert CategoryRepository(db_session).children_of(child.parent_id) == [child]
    expected_output:
      outcome: invalid
  - name: switches the carrier to DHL
    inputs:
      file: tests/test_shipments.py
      before: |
        from shop.shipments import ShipmentService


        def test_ship_order_sets_tracking_number(db_session, order):
            shipment = ShipmentService(db_session).ship(order, carrier="UPS")

            assert shipment.tracking_number.startswith("1Z")
      after: |
        from shop.shipments import ShipmentService


        def test_ship_order_sets_tracking_number(db_session, order):
            shipment = ShipmentService(db_session).ship(order, carrier="DHL")

            assert shipment.tracking_number.startswith("JD")
    expected_output:
      outcome: skipped
