  - name: calls a cancelled order voided
    inputs:
      file: tests/test_orders.py
      unchanged:
        shop/orders.py: |
          from enum import StrEnum


          class OrderStatus(StrEnum):
              PENDING = "pending"
              CANCELLED = "cancelled"


          class Order:
              def __init__(self, status: OrderStatus = OrderStatus.PENDING) -> None:
                  self.status = status

              def refundable(self) -> bool:
                  return self.status is not OrderStatus.CANCELLED
      after: |
        from shop.orders import Order, OrderStatus


        def test_voided_order_is_not_refundable():
            assert not Order(status=OrderStatus.CANCELLED).refundable()
    expected_output:
      outcome: invalid
