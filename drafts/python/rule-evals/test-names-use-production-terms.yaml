cases:
  - name: calls dependency resolution injection
    inputs:
      file: tests/test_dependencies.py
      unchanged:
        plugins/dependencies.py: |
          def resolve_dependencies(plugins: list[str], requires: dict[str, list[str]]) -> list[str]:
              ordered: list[str] = []
              for plugin in plugins:
                  for required in requires.get(plugin, []):
                      if required not in ordered:
                          ordered.append(required)
                  if plugin not in ordered:
                      ordered.append(plugin)
              return ordered
      after: |
        from plugins.dependencies import resolve_dependencies


        def test_inject_dependencies_lists_fonts_before_pdf():
            assert resolve_dependencies(["pdf"], {"pdf": ["fonts"]}) == ["fonts", "pdf"]
    expected_output:
      outcome: invalid
