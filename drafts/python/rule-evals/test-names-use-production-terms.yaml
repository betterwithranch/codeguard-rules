  - name: calls evicting expired sessions purging them
    inputs:
      file: tests/test_sessions.py
      unchanged:
        accounts/sessions.py: |
          class SessionStore:
              def __init__(self) -> None:
                  self.expiry: dict[str, float] = {}

              def add(self, token: str, expires_at: float) -> None:
                  self.expiry[token] = expires_at

              def evict_expired(self, now: float) -> None:
                  self.expiry = {token: at for token, at in self.expiry.items() if at > now}

              def tokens(self) -> list[str]:
                  return list(self.expiry)
      after: |
        from accounts.sessions import SessionStore


        class TestSessionStore:
            def test_purge_stale_sessions_keeps_live_ones(self):
                store = SessionStore()
                store.add("old", expires_at=10.0)
                store.add("live", expires_at=99.0)

                store.evict_expired(now=50.0)

                assert store.tokens() == ["live"]
    expected_output:
      outcome: invalid
  - name: names evicting expired sessions by the method's terms
    inputs:
      file: tests/test_sessions.py
      unchanged:
        accounts/sessions.py: |
          class SessionStore:
              def __init__(self) -> None:
