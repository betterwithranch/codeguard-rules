  - name: calls building a report assembling it
    inputs:
      file: tests/test_reports.py
      unchanged:
        reports/monthly.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class MonthlyReport:
              month: str
              order_count: int


          def build_report(month: str, order_ids: list[str]) -> MonthlyReport:
              return MonthlyReport(month=month, order_count=len(order_ids))
