  - name: coins no reaction for the empty result
    inputs:
      file: tests/test_search.py
      unchanged:
        shop/search.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class EmptyResult:
              query: str


          @dataclass(frozen=True)
          class Matches:
              skus: list[str]


          def search(catalog: dict[str, str], query: str) -> EmptyResult | Matches:
              skus = [sku for sku, name in catalog.items() if query in name]
              return Matches(skus=skus) if skus else EmptyResult(query=query)
      after: |
        from shop.search import EmptyResult, search


        def test_search_gives_no_reaction_when_no_name_matches_the_query():
            assert search({"BOOK-1": "Atlas"}, "Globe") == EmptyResult(query="Globe")
    expected_output:
      outcome: invalid
