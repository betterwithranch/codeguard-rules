- name: inserts order rows with raw SQL when the repository creates orders
  inputs:
    file: tests/test_order_report.py
    unchanged:
      shop/orders.py: |
        import sqlite3
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            total_cents: int


        class OrderRepository:
            def __init__(self, connection: sqlite3.Connection) -> None:
                self._connection = connection

            def create(self, order: Order) -> Order:
                self._connection.execute(
                    "INSERT INTO orders (number, total_cents, created_at) VALUES (?, ?, datetime('now'))",
                    (order.number, order.total_cents),
                )
                return order
    after: |
      from shop.orders import Order, OrderRepository
      from shop.reports import monthly_total


      def seed_orders(connection, totals):
          connection.executemany(
              "INSERT INTO orders (number, total_cents) VALUES (?, ?)",
              [(f"A-{index}", total) for index, total in enumerate(totals)],
          )


      def test_monthly_total_sums_orders(connection):
          seed_orders(connection, [4999, 1001])

          assert monthly_total(connection) == 6000
  expected_output:
    outcome: invalid
