- name: assembles a report pipeline by hand in a test body
  inputs:
    file: tests/test_report_pipeline.py
    unchanged:
      reports/pipeline.py: |
        from pathlib import Path

        from reports.aggregate import Aggregator, Rules
        from reports.io import CsvReader, CsvWriter


        class ReportPipeline:
            def __init__(self, reader: CsvReader, aggregator: Aggregator, writer: CsvWriter) -> None:
                self._reader = reader
                self._aggregator = aggregator
                self._writer = writer

            @classmethod
            def from_paths(cls, source: Path, target: Path) -> "ReportPipeline":
                return cls(CsvReader(source), Aggregator(Rules.monthly()), CsvWriter(target))
    after: |
      from reports.aggregate import Aggregator, Rules
      from reports.io import CsvReader, CsvWriter
      from reports.pipeline import ReportPipeline


      def test_pipeline_writes_one_row_per_month(tmp_path):
          source = tmp_path / "in.csv"
          source.write_text("month,total\n2026-09,5\n2026-09,7\n")
          pipeline = ReportPipeline(CsvReader(source), Aggregator(Rules.monthly()), CsvWriter(tmp_path / "out.csv"))

          pipeline.run()

          assert (tmp_path / "out.csv").read_text() == "month,total\n2026-09,12\n"
  expected_output:
    outcome: invalid
- name: builds the report pipeline through its classmethod in a test body
  inputs:
    file: tests/test_report_pipeline.py
    unchanged:
      reports/pipeline.py: |
        from pathlib import Path

        from reports.aggregate import Aggregator, Rules
        from reports.io import CsvReader, CsvWriter


        class ReportPipeline:
            def __init__(self, reader: CsvReader, aggregator: Aggregator, writer: CsvWriter) -> None:
                self._reader = reader
                self._aggregator = aggregator
                self._writer = writer

            @classmethod
            def from_paths(cls, source: Path, target: Path) -> "ReportPipeline":
                return cls(CsvReader(source), Aggregator(Rules.monthly()), CsvWriter(target))
    after: |
      from pathlib import Path

      from reports.pipeline import ReportPipeline


      def test_pipeline_writes_one_row_per_month(tmp_path):
          source = Path(tmp_path, "in.csv")
          source.write_text("month,total\n2026-09,5\n2026-09,7\n")
          pipeline = ReportPipeline.from_paths(source, Path(tmp_path, "out.csv"))

          pipeline.run()

          assert (tmp_path / "out.csv").read_text() == "month,total\n2026-09,12\n"
  expected_output:
    outcome: valid
