- name: re-derives invoice lines from an order in a helper
  inputs:
    file: tests/test_invoice_mailer.py
    unchanged:
      billing/invoices.py: |
        from dataclasses import dataclass

        from orders.models import Order


        @dataclass(frozen=True)
        class InvoiceLine:
            sku: str
            amount: int


        @dataclass(frozen=True)
        class Invoice:
            order_id: str
            lines: list[InvoiceLine]
            total: int


        def invoice_from_order(order: Order) -> Invoice:
            lines = [InvoiceLine(sku=item.sku, amount=item.price * item.quantity) for item in order.items]
            return Invoice(order_id=order.id, lines=lines, total=sum(line.amount for line in lines))
    after: |
      from billing.invoices import Invoice, InvoiceLine
      from billing.mailer import InvoiceMailer
      from orders.models import Order, OrderItem
      from tests.fakes import FakeMailbox


      def make_invoice(order):
          lines = [InvoiceLine(sku=item.sku, amount=item.price * item.quantity) for item in order.items]
          return Invoice(order_id=order.id, lines=lines, total=sum(line.amount for line in lines))


      def test_send_mails_invoice_total():
          mailbox = FakeMailbox()
          order = Order(id="ord-2", items=[OrderItem(sku="B2", price=5, quantity=2)])

          InvoiceMailer(mailbox).send(make_invoice(order))

          assert mailbox.sent == [("ord-2", 10)]
  expected_output:
    outcome: invalid
