cases:
  - name: defines threaded state inside the workflow module
    inputs:
      file: checkout/workflow.py
      after: |
        from dataclasses import dataclass, replace


        @dataclass(frozen=True)
        class CheckoutState:
            completed_steps: tuple[str, ...] = ()
            errors: tuple[str, ...] = ()


        def record_step(state: CheckoutState, step: str) -> CheckoutState:
            return replace(state, completed_steps=(*state.completed_steps, step))


        def record_error(state: CheckoutState, error: str) -> CheckoutState:
            return replace(state, errors=(*state.errors, error))


        def run_checkout(steps) -> CheckoutState:
            state = CheckoutState()
            for step in steps:
                state = record_step(state, step.run())
            return state
    expected_output:
      outcome: invalid
