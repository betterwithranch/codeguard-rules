  - name: defines a request shape beside the client that sends it once
    inputs:
      file: carriers/label_client.py
      after: |
        from dataclasses import asdict, dataclass


        @dataclass(frozen=True)
        class LabelRequest:
            order_id: str
            weight_grams: int


        def request_label(http, order_id: str, weight_grams: int) -> str:
            request = LabelRequest(order_id=order_id, weight_grams=weight_grams)
            return http.post("/labels", json=asdict(request)).json()["label_id"]
    expected_output:
      outcome: valid
  - name: makes last_step handle no steps
    inputs:
      file: checkout/checkout_state.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class CheckoutState:
            completed_steps: tuple[str, ...] = ()

            def last_step(self) -> str:
                return self.completed_steps[-1]
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class CheckoutState:
            completed_steps: tuple[str, ...] = ()

            def last_step(self) -> str | None:
                return self.completed_steps[-1] if self.completed_steps else None
    expected_output:
      outcome: skipped
