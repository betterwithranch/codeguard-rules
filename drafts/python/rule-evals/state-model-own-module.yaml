  - name: defines a LangGraph state beside the graph's nodes
    inputs:
      file: review/graph.py
      after: |
        import operator
        from typing import Annotated, TypedDict

        from langgraph.graph import END, StateGraph


        class ReviewState(TypedDict):
            document: str
            findings: Annotated[list[str], operator.add]


        def lint(state: ReviewState) -> dict[str, list[str]]:
            return {"findings": [line for line in state["document"].splitlines() if "TODO" in line]}


        def summarize(state: ReviewState) -> dict[str, list[str]]:
            return {"findings": [f"{len(state['findings'])} findings"]}


        def build_graph():
            graph = StateGraph(ReviewState)
            graph.add_node("lint", lint)
            graph.add_node("summarize", summarize)
            graph.set_entry_point("lint")
            graph.add_edge("lint", "summarize")
            graph.add_edge("summarize", END)
            return graph.compile()
    expected_output:
      outcome: invalid
  - name: gives a LangGraph state and its reducer their own module
    inputs:
      file: review/review_state.py
      after: |
        from typing import Annotated, TypedDict


        def keep_unique(current: list[str], update: list[str]) -> list[str]:
            return current + [item for item in update if item not in current]


        class ReviewState(TypedDict):
            document: str
            findings: Annotated[list[str], keep_unique]
      unchanged:
        review/graph.py: |
          from langgraph.graph import END, StateGraph

          from review.review_state import ReviewState


          def lint(state: ReviewState) -> dict[str, list[str]]:
              return {"findings": [line for line in state["document"].splitlines() if "TODO" in line]}


          def build_graph():
              graph = StateGraph(ReviewState)
              graph.add_node("lint", lint)
              graph.set_entry_point("lint")
              graph.add_edge("lint", END)
              return graph.compile()
    expected_output:
      outcome: valid
  - name: adds a threaded state to a module of other models
    inputs:
      file: orders/models.py
      before: |
        from pydantic import BaseModel


        class Customer(BaseModel):
            customer_id: str
            email: str


        class Product(BaseModel):
            sku: str
            cents: int
      after: |
        from pydantic import BaseModel


        class Customer(BaseModel):
            customer_id: str
            email: str


        class Product(BaseModel):
            sku: str
            cents: int


        class FulfillmentState(BaseModel):
            picked_skus: list[str] = []
            packed: bool = False
            label_id: str | None = None
      unchanged:
        orders/fulfillment.py: |
          from orders.models import FulfillmentState


          def pick(state: FulfillmentState, sku: str) -> FulfillmentState:
              return state.model_copy(update={"picked_skus": [*state.picked_skus, sku]})


          def pack(state: FulfillmentState) -> FulfillmentState:
              return state.model_copy(update={"packed": True})


          def fulfill(skus: list[str]) -> FulfillmentState:
              state = FulfillmentState()
              for sku in skus:
                  state = pick(state, sku)
              return pack(state)
    expected_output:
      outcome: invalid
  - name: mutates an attrs state inside the pipeline runner's module
    inputs:
      file: imports/pipeline.py
      after: |
        import attrs


        @attrs.define
        class ImportState:
            rows_read: int = 0
            rows_rejected: int = 0


        class ImportPipeline:
            def __init__(self, stages) -> None:
                self._stages = stages

            def run(self, rows) -> ImportState:
                state = ImportState()
                for stage in self._stages:
                    stage.process(rows, state)
                return state
    expected_output:
      outcome: invalid
