- name: registers export formats in a class-level dict at import
  inputs:
    file: exports/formats.py
    after: |
      class ExportFormat:
          formats: dict[str, type["ExportFormat"]] = {}

          def __init_subclass__(cls, name: str, **kwargs: object) -> None:
              super().__init_subclass__(**kwargs)
              cls.formats[name] = cls

          def render(self, rows: list[dict[str, str]]) -> str:
              raise NotImplementedError


      class CsvFormat(ExportFormat, name="csv"):
          def render(self, rows: list[dict[str, str]]) -> str:
              return "\n".join(",".join(row.values()) for row in rows)
  expected_output:
    outcome: valid
- name: opens and closes sessions in a module-level dict from two functions
  inputs:
    file: accounts/sessions.py
    after: |
      import secrets

      from .models import Session, User

      _sessions: dict[str, Session] = {}


      def open_session(user: User) -> str:
          token = secrets.token_urlsafe(32)
          _sessions[token] = Session(user_id=user.id)
          return token


      def close_session(token: str) -> None:
          _sessions.pop(token, None)


      def current_session(token: str) -> Session | None:
          return _sessions.get(token)
  expected_output:
    outcome: invalid
- name: registers webhook handlers in a module-level dict by decorator
  inputs:
    file: webhooks/handlers.py
    after: |
      from collections.abc import Callable

      from .events import WebhookEvent

      Handler = Callable[[WebhookEvent], None]
      _handlers: dict[str, Handler] = {}


      def handles(kind: str) -> Callable[[Handler], Handler]:
          def register(handler: Handler) -> Handler:
              _handlers[kind] = handler
              return handler

          return register


      @handles("charge.succeeded")
      def record_charge(event: WebhookEvent) -> None:
          print(event.payload["id"])


      def dispatch(event: WebhookEvent) -> None:
          _handlers[event.kind](event)
  expected_output:
    outcome: valid
- name: rebinds the current user global in login and logout
  inputs:
    file: accounts/auth.py
    after: |
      from .models import User

      _current_user: User | None = None


      def login(user: User) -> None:
          global _current_user
          _current_user = user


      def logout() -> None:
          global _current_user
          _current_user = None


      def current_user() -> User | None:
          return _current_user
  expected_output:
    outcome: invalid
