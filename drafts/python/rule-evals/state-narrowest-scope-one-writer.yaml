- name: shares a cache keyed by currency at module level
  inputs:
    file: billing/exchange.py
    after: |
      from .rates_client import RatesClient


      class RateCache:
          def __init__(self, client: RatesClient) -> None:
              self._client = client
              self._rates: dict[str, float] = {}

          def rate(self, currency: str) -> float:
              if currency not in self._rates:
                  self._rates[currency] = self._client.fetch_rate(currency)
              return self._rates[currency]


      rates = RateCache(RatesClient())
  expected_output:
    outcome: valid
