- name: creates a collecting validator per call
  inputs:
    file: orders/import_orders.py
    unchanged:
      orders/validation.py: |
        class OrderValidator:
            def __init__(self) -> None:
                self.issues: list[str] = []

            def check(self, order_total: int) -> None:
                if order_total <= 0:
                    self.issues.append("order total must be positive")
    after: |
      from .validation import OrderValidator

      MAX_ORDERS = 500


      def import_orders(totals: list[int], validator: OrderValidator | None = None) -> list[str]:
          validator = validator or OrderValidator()
          for total in totals[:MAX_ORDERS]:
              validator.check(total)
          return validator.issues
  expected_output:
    outcome: skipped
- name: holds a collecting parser as a class attribute
  inputs:
    file: imports/csv_import.py
    unchanged:
      imports/row_parser.py: |
        class RowParser:
            def __init__(self) -> None:
                self.errors: list[str] = []
                self.rows: list[dict[str, str]] = []

            def feed(self, line: str) -> None:
                cells = line.split(",")
                if len(cells) != 3:
                    self.errors.append(f"bad row: {line}")
                else:
                    self.rows.append(dict(zip(["sku", "name", "price"], cells)))
    after: |
      from .row_parser import RowParser


      class ProductImport:
          parser = RowParser()

          def run(self, text: str) -> list[str]:
              for line in text.splitlines():
                  self.parser.feed(line)
              return self.parser.errors
  expected_output:
    outcome: invalid
