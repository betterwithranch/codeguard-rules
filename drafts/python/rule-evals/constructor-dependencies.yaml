# yaml-language-server: $schema=rule-eval-schema.json
cases:
  - name: passes a rate provider to each method
    inputs:
      file: shipments/quoter.py
      after: |
        from dataclasses import dataclass

        from shipments.rates import RateProvider


        @dataclass(frozen=True)
        class Shipment:
            destination: str
            weight_kg: float


        class ShipmentQuoter:
            def quote_cents(self, shipment: Shipment, rate_provider: RateProvider) -> int:
                return rate_provider.rate_cents(shipment.destination, shipment.weight_kg)

            def total_quote_cents(self, shipments: list[Shipment], rate_provider: RateProvider) -> int:
                return sum(self.quote_cents(shipment, rate_provider) for shipment in shipments)
    expected_output:
      outcome: invalid
  - name: adds a formatter parameter to methods
    inputs:
      file: invoices/renderer.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total_cents: int


        class InvoiceRenderer:
            def render(self, invoice: Invoice) -> str:
                return f"{invoice.number}: {invoice.total_cents}"

            def render_all(self, invoices: list[Invoice]) -> list[str]:
                return [self.render(invoice) for invoice in invoices]
      after: |
        from dataclasses import dataclass

        from invoices.currency import CurrencyFormatter


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total_cents: int


        class InvoiceRenderer:
            def render(self, invoice: Invoice, formatter: CurrencyFormatter) -> str:
                return f"{invoice.number}: {formatter.format_cents(invoice.total_cents)}"

            def render_all(self, invoices: list[Invoice], formatter: CurrencyFormatter) -> list[str]:
                return [self.render(invoice, formatter) for invoice in invoices]
    expected_output:
      outcome: invalid
  - name: takes the rate provider in init
    inputs:
      file: shipments/quoter.py
      after: |
        from dataclasses import dataclass

        from shipments.rates import RateProvider


        @dataclass(frozen=True)
        class Shipment:
            destination: str
            weight_kg: float


        class ShipmentQuoter:
            def __init__(self, rate_provider: RateProvider) -> None:
                self._rate_provider = rate_provider

            def quote_cents(self, shipment: Shipment) -> int:
                return self._rate_provider.rate_cents(shipment.destination, shipment.weight_kg)

            def total_quote_cents(self, shipments: list[Shipment]) -> int:
                return sum(self.quote_cents(shipment) for shipment in shipments)
    expected_output:
      outcome: valid
  - name: raises the free shipping threshold
    inputs:
      file: shipments/quoter.py
      before: |
        from dataclasses import dataclass

        FREE_SHIPPING_THRESHOLD_CENTS = 5000


        @dataclass(frozen=True)
        class Shipment:
            destination: str
            weight_kg: float
      after: |
        from dataclasses import dataclass

        FREE_SHIPPING_THRESHOLD_CENTS = 7500


        @dataclass(frozen=True)
        class Shipment:
            destination: str
            weight_kg: float
    expected_output:
      outcome: skipped
