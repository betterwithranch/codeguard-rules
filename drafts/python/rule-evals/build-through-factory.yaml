cases:
  - name: assembles the shipment service graph by hand in a helper
    inputs:
      file: tests/test_shipment_service.py
      unchanged:
        shipping/service.py: |
          from shipping.carriers import Carrier, UpsCarrier
          from shipping.labels import LabelPrinter
          from shipping.rates import RateTable


          class ShipmentService:
              def __init__(self, rates: RateTable, printer: LabelPrinter, carrier: Carrier) -> None:
                  self._rates = rates
                  self._printer = printer
                  self._carrier = carrier


          def build_shipment_service(carrier: Carrier | None = None) -> ShipmentService:
              carrier = carrier or UpsCarrier()
              return ShipmentService(RateTable.default(), LabelPrinter(carrier), carrier)
      after: |
        from shipping.labels import LabelPrinter
        from shipping.parcels import Parcel
        from shipping.rates import RateTable
        from shipping.service import ShipmentService
        from tests.fakes import FakeCarrier


        def make_shipment_service(carrier):
            return ShipmentService(RateTable.default(), LabelPrinter(carrier), carrier)


        def test_ship_prints_label():
            service = make_shipment_service(FakeCarrier(rate=12))
            order_id = "ord-1"

            label = service.ship(Parcel(order_id=order_id, weight_kg=2))

            assert label == "ord-1/2kg"
    expected_output:
      outcome: invalid
