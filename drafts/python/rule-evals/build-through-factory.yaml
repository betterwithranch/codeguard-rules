  - name: builds a money value from derived amounts when no factory exists
    inputs:
      file: tests/test_money.py
      unchanged:
        billing/money.py: |
          from dataclasses import dataclass
          from decimal import Decimal


          @dataclass(frozen=True)
          class Money:
              amount: Decimal
              currency: str

              def __add__(self, other: "Money") -> "Money":
                  return Money(self.amount + other.amount, self.currency)
      after: |
        from decimal import Decimal

        from billing.money import Money


        def test_adding_money_sums_amounts():
            price = Decimal("9.99")
            quantity = 3

            total = Money(price * quantity, "EUR") + Money(Decimal("0.03"), "EUR")

            assert total == Money(Decimal("30.00"), "EUR")
    expected_output:
      outcome: valid
