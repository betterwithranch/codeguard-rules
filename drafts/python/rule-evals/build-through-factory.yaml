  - name: assembles a report pipeline by hand in a test body
    inputs:
      file: tests/test_report_pipeline.py
      unchanged:
        reports/pipeline.py: |
          from pathlib import Path

          from reports.aggregate import Aggregator, Rules
          from reports.io import CsvReader, CsvWriter


          class ReportPipeline:
              def __init__(self, reader: CsvReader, aggregator: Aggregator, writer: CsvWriter) -> None:
                  self._reader = reader
                  self._aggregator = aggregator
                  self._writer = writer

              @classmethod
              def from_paths(cls, source: Path, target: Path) -> "ReportPipeline":
                  return cls(CsvReader(source), Aggregator(Rules.monthly()), CsvWriter(target))
      after: |
        from reports.aggregate import Aggregator, Rules
        from reports.io import CsvReader, CsvWriter
        from reports.pipeline import ReportPipeline


        def test_pipeline_writes_one_row_per_month(tmp_path):
            source = tmp_path / "in.csv"
            source.write_text("month,total\n2026-09,5\n2026-09,7\n")
            pipeline = ReportPipeline(CsvReader(source), Aggregator(Rules.monthly()), CsvWriter(tmp_path / "out.csv"))

            pipeline.run()

            assert (tmp_path / "out.csv").read_text() == "month,total\n2026-09,12\n"
    expected_output:
      outcome: invalid
  - name: builds the report pipeline through its classmethod in a test body
    inputs:
      file: tests/test_report_pipeline.py
      unchanged:
        reports/pipeline.py: |
          from pathlib import Path

          from reports.aggregate import Aggregator, Rules
          from reports.io import CsvReader, CsvWriter


          class ReportPipeline:
              def __init__(self, reader: CsvReader, aggregator: Aggregator, writer: CsvWriter) -> None:
                  self._reader = reader
                  self._aggregator = aggregator
                  self._writer = writer

              @classmethod
              def from_paths(cls, source: Path, target: Path) -> "ReportPipeline":
                  return cls(CsvReader(source), Aggregator(Rules.monthly()), CsvWriter(target))
      after: |
        from pathlib import Path

        from reports.pipeline import ReportPipeline


        def test_pipeline_writes_one_row_per_month(tmp_path):
            source = Path(tmp_path, "in.csv")
            source.write_text("month,total\n2026-09,5\n2026-09,7\n")
            pipeline = ReportPipeline.from_paths(source, Path(tmp_path, "out.csv"))

            pipeline.run()

            assert (tmp_path / "out.csv").read_text() == "month,total\n2026-09,12\n"
    expected_output:
      outcome: valid
  - name: creates a Django order and its lines one by one in a fixture
    inputs:
      file: shop/tests/conftest.py
      unchanged:
        shop/ordering.py: |
          from dataclasses import dataclass

          from django.db import transaction

          from shop.models import Customer, Order, OrderLine


          @dataclass(frozen=True)
          class LineItem:
              sku: str
              quantity: int


          @transaction.atomic
          def create_order(customer: Customer, items: list[LineItem]) -> Order:
              order = Order.objects.create(customer=customer, number=Order.next_number())
              for item in items:
                  OrderLine.objects.create(order=order, sku=item.sku, quantity=item.quantity)
              order.recalculate_total()
              return order
      after: |
        import pytest

        from shop.models import Order, OrderLine


        @pytest.fixture
        def order(db, customer, book):
            order = Order(customer=customer, number="A-0001")
            order.save()
            OrderLine(order=order, sku=book.sku, quantity=2).save()
            order.recalculate_total()
            return order
    expected_output:
      outcome: invalid
