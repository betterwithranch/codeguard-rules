cases:
  - name: adds an inline stub clock duplicating the shared fake
    inputs:
      file: tests/test_shipment_dispatch.py
      unchanged:
        tests/fakes.py: |
          from datetime import datetime


          class FakeClock:
              def __init__(self, current: datetime) -> None:
                  self.current = current

              def now(self) -> datetime:
                  return self.current
      before: |
        from datetime import date, datetime

        from shipping.dispatch import Dispatcher, Shipment
        from tests.fakes import FakeClock


        def test_dispatch_before_cutoff_ships_same_day():
            clock = FakeClock(datetime(2026, 3, 1, 9, 0))

            shipment = Dispatcher(clock).dispatch("shp-1")

            assert shipment == Shipment(id="shp-1", ships_on=date(2026, 3, 1))
      after: |
        from datetime import date, datetime

        from shipping.dispatch import Dispatcher, Shipment
        from tests.fakes import FakeClock


        class StubClock:
            def __init__(self, current):
                self.current = current

            def now(self):
                return self.current


        def test_dispatch_before_cutoff_ships_same_day():
            clock = FakeClock(datetime(2026, 3, 1, 9, 0))

            shipment = Dispatcher(clock).dispatch("shp-1")

            assert shipment == Shipment(id="shp-1", ships_on=date(2026, 3, 1))


        def test_dispatch_after_cutoff_moves_to_next_day():
            clock = StubClock(datetime(2026, 3, 1, 18, 0))

            shipment = Dispatcher(clock).dispatch("shp-2")

            assert shipment == Shipment(id="shp-2", ships_on=date(2026, 3, 2))
    expected_output:
      outcome: invalid
  - name: adds a helper that sets the shared fake clock to an hour
    inputs:
      file: tests/test_shipment_dispatch.py
      unchanged:
        tests/fakes.py: |
          from datetime import datetime


          class FakeClock:
              def __init__(self, current: datetime) -> None:
                  self.current = current

              def now(self) -> datetime:
                  return self.current
      after: |
        from datetime import date, datetime

        from shipping.dispatch import Dispatcher, Shipment
        from tests.fakes import FakeClock


        def dispatch_at(hour, shipment_id):
            return Dispatcher(FakeClock(datetime(2026, 3, 1, hour, 0))).dispatch(shipment_id)


        def test_dispatch_before_cutoff_ships_same_day():
            assert dispatch_at(9, "shp-1") == Shipment(id="shp-1", ships_on=date(2026, 3, 1))


        def test_dispatch_after_cutoff_moves_to_next_day():
            assert dispatch_at(18, "shp-2") == Shipment(id="shp-2", ships_on=date(2026, 3, 2))
    expected_output:
      outcome: valid
  - name: adds a clock that advances on each call beside the fixed shared one
    inputs:
      file: tests/test_session_expiry.py
      unchanged:
        tests/fakes.py: |
          from datetime import datetime


          class FakeClock:
              def __init__(self, current: datetime) -> None:
                  self.current = current

              def now(self) -> datetime:
                  return self.current
      after: |
        from datetime import datetime, timedelta

        from accounts.sessions import SessionKeeper


        class TickingClock:
            def __init__(self, start, step):
                self.current = start
                self.step = step

            def now(self):
                self.current += self.step
                return self.current


        def test_keeper_expires_a_session_after_two_checks():
            clock = TickingClock(datetime(2026, 3, 1, 9, 0), step=timedelta(minutes=20))
            keeper = SessionKeeper(clock, ttl=timedelta(minutes=30))
            keeper.open("tok-1")

            keeper.check()
            keeper.check()

            assert keeper.open_tokens() == []
    expected_output:
      outcome: valid
  - name: redefines the shared database session fixture
    inputs:
      file: tests/billing/test_invoice_repository.py
      unchanged:
        tests/conftest.py: |
          import pytest
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session

          from billing.db import Base


          @pytest.fixture
          def db_session():
              engine = create_engine("sqlite://")
              Base.metadata.create_all(engine)
              with Session(engine) as session:
                  yield session
      after: |
        from decimal import Decimal

        import pytest
        from sqlalchemy import create_engine
        from sqlalchemy.orm import Session

        from billing.db import Base
        from billing.repositories import InvoiceRepository


        @pytest.fixture
        def db_session():
            engine = create_engine("sqlite://")
            Base.metadata.create_all(engine)
            with Session(engine) as session:
                yield session


        def test_create_then_get_returns_the_invoice(db_session):
            repository = InvoiceRepository(db_session)
            invoice = repository.create(amount=Decimal("100.00"), region="CA")

            assert repository.get(invoice.id).amount == Decimal("100.00")
    expected_output:
      outcome: invalid
  - name: overrides the shared order fixture with a paid order
