  - name: builds on the shared database session in a new fixture
    inputs:
      file: tests/billing/test_invoice_reports.py
      unchanged:
        tests/conftest.py: |
          import pytest
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session

          from billing.db import Base


          @pytest.fixture
          def db_session():
              engine = create_engine("sqlite://")
              Base.metadata.create_all(engine)
              with Session(engine) as session:
                  yield session
      after: |
        from decimal import Decimal

        import pytest

        from billing.reports import unpaid_total
        from billing.repositories import InvoiceRepository


        @pytest.fixture
        def two_unpaid_invoices(db_session):
            repository = InvoiceRepository(db_session)
            repository.create(amount=Decimal("100.00"), region="CA")
            repository.create(amount=Decimal("50.00"), region="CA")
            return repository


        def test_unpaid_total_sums_unpaid_invoices(two_unpaid_invoices):
            assert unpaid_total(two_unpaid_invoices) == Decimal("150.00")
    expected_output:
      outcome: valid
  - name: adds a customer builder duplicating the shared factory
    inputs:
      file: tests/test_loyalty.py
      unchanged:
        tests/factories.py: |
          from shop.customers import Customer


          def build_customer(name: str = "Ada", email: str = "ada@example.com", points: int = 0) -> Customer:
              return Customer(name=name, email=email, points=points)
      after: |
        from shop.customers import Customer
        from shop.loyalty import tier_for


        def make_customer(name="Ada", email="ada@example.com", points=0):
            return Customer(name=name, email=email, points=points)


        def test_tier_for_five_hundred_points_is_gold():
            assert tier_for(make_customer(points=500)) == "gold"
    expected_output:
      outcome: invalid
  - name: adds a builder for a type no shared module builds
    inputs:
      file: tests/test_loyalty.py
      unchanged:
        tests/factories.py: |
          from shop.customers import Customer


          def build_customer(name: str = "Ada", email: str = "ada@example.com", points: int = 0) -> Customer:
              return Customer(name=name, email=email, points=points)
      after: |
        from shop.loyalty import Campaign, bonus_points
        from tests.factories import build_customer


        def make_campaign(multiplier=2):
            return Campaign(name="Spring", multiplier=multiplier)


        def test_bonus_points_double_during_the_campaign():
            assert bonus_points(build_customer(points=100), make_campaign()) == 200
    expected_output:
      outcome: valid
  - name: adds a fake mailer duplicating the shared one
    inputs:
      file: tests/test_invoice_notifier.py
      unchanged:
        tests/fakes.py: |
          class FakeMailer:
              def __init__(self) -> None:
                  self.outbox: list[tuple[str, str]] = []

              def send(self, to: str, subject: str) -> None:
                  self.outbox.append((to, subject))
      after: |
        from billing.notifier import InvoiceNotifier


        class InMemoryMailer:
            def __init__(self):
                self.sent = []

            def send(self, to, subject):
                self.sent.append((to, subject))


        def test_notify_mails_the_customer():
            mailer = InMemoryMailer()

            InvoiceNotifier(mailer).notify(invoice_id="inv-42", email="ada@example.com")

            assert mailer.sent == [("ada@example.com", "Invoice inv-42")]
    expected_output:
      outcome: invalid
