cases:
  - name: re-exports another package's names
    inputs:
      file: invoicing/__init__.py
      after: |
        from billing import Invoice, InvoiceLine, InvoiceTotal

        __all__ = ["Invoice", "InvoiceLine", "InvoiceTotal"]
    expected_output:
      outcome: invalid
  - name: switches to re-exporting another package
    inputs:
      file: invoicing/__init__.py
      before: |
        from .invoice import Invoice
        from .invoice_line import InvoiceLine
        from .invoice_total import InvoiceTotal

        __all__ = ["Invoice", "InvoiceLine", "InvoiceTotal"]
      after: |
        from billing import CreditNote, PaymentTerms

        from .invoice import Invoice
        from .invoice_line import InvoiceLine
        from .invoice_total import InvoiceTotal

        __all__ = ["CreditNote", "Invoice", "InvoiceLine", "InvoiceTotal", "PaymentTerms"]
    expected_output:
      outcome: invalid
  - name: exports the package's own modules
    inputs:
      file: billing/__init__.py
      after: |
        from .invoice import Invoice
        from .invoice_line import InvoiceLine
        from .invoice_total import InvoiceTotal

        __all__ = ["Invoice", "InvoiceLine", "InvoiceTotal"]
    expected_output:
      outcome: valid
  - name: exports its own modules by absolute path
    inputs:
      file: billing/__init__.py
      after: |
        from billing.invoice import Invoice
        from billing.invoice_total import InvoiceTotal

        __all__ = ["Invoice", "InvoiceTotal"]
    expected_output:
      outcome: valid
  - name: exports a subpackage's names
    inputs:
      file: billing/__init__.py
      after: |
        from billing.customer import Customer
        from billing.invoices import Invoice, InvoiceLine

        __all__ = ["Customer", "Invoice", "InvoiceLine"]
      unchanged:
        billing/invoices/__init__.py: |
          from .invoice import Invoice
          from .line import InvoiceLine

          __all__ = ["Invoice", "InvoiceLine"]
    expected_output:
      outcome: valid
  - name: re-exports another package's name without __all__
    inputs:
      file: invoicing/__init__.py
      after: |
        from billing import Invoice
        from .reminder import Reminder
    expected_output:
      outcome: invalid
  - name: re-exports another package's name with an explicit alias
    inputs:
      file: invoicing/__init__.py
      after: |
        from billing import Invoice as Invoice

        from .reminder import Reminder as Reminder
    expected_output:
      outcome: invalid
  - name: uses another package's name in its own code
    inputs:
      file: invoicing/__init__.py
      after: |
        from billing import Invoice

        from .reminder import Reminder

        __all__ = ["Reminder", "reminder_for"]


        def reminder_for(invoice: Invoice) -> Reminder:
            return Reminder(invoice_number=invoice.number)
    expected_output:
      outcome: valid
  - name: adds an imported name from another package to __all__
    inputs:
      file: invoicing/__init__.py
      before: |
        from billing import Invoice

        from .reminder import Reminder

        __all__ = ["Reminder", "reminder_for"]


        def reminder_for(invoice: Invoice) -> Reminder:
            return Reminder(invoice_number=invoice.number)
      after: |
        from billing import Invoice

        from .reminder import Reminder

        __all__ = ["Invoice", "Reminder", "reminder_for"]


        def reminder_for(invoice: Invoice) -> Reminder:
            return Reminder(invoice_number=invoice.number)
    expected_output:
      outcome: invalid
  - name: re-exports a sibling package's name relatively
    inputs:
      file: shop/invoicing/__init__.py
      after: |
        from ..billing import Invoice
        from .reminder import Reminder

        __all__ = ["Invoice", "Reminder"]
      unchanged:
        shop/__init__.py: ""
        shop/billing/__init__.py: |
          from .invoice import Invoice

          __all__ = ["Invoice"]
    expected_output:
      outcome: invalid
  - name: re-exports a standard library type
    inputs:
      file: money/__init__.py
      after: |
        from decimal import Decimal

        from .amount import Amount

        __all__ = ["Amount", "Decimal"]
    expected_output:
      outcome: invalid
  - name: changes a function body in the package root
    inputs:
      file: invoicing/__init__.py
      before: |
        from .reminder import Reminder

        __all__ = ["Reminder", "default_reminder"]


        def default_reminder() -> Reminder:
            return Reminder(invoice_number="draft")
      after: |
        from .reminder import Reminder

        __all__ = ["Reminder", "default_reminder"]


        def default_reminder() -> Reminder:
            return Reminder(invoice_number="pending")
    expected_output:
      outcome: skipped
  - name: adds a relative import of its own module
    inputs:
      file: invoicing/__init__.py
      before: |
        from .reminder import Reminder
      after: |
        from .reminder import Reminder
        from .schedule import ReminderSchedule
    expected_output:
      outcome: skipped
