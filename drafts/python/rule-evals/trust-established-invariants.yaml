  - name: rejects an unknown payment kind
    inputs:
      file: payments/refunds.py
      after: |
        from .payment import PaymentKind, PaymentRequest, PaymentResult, RefundPayload


        class UnknownPaymentKindError(Exception):
            pass


        class RefundHandler:
            def handle(self, request: PaymentRequest[RefundPayload]) -> PaymentResult:
                return PaymentResult(refunded_cents=request.payload.amount_cents)


        HANDLERS = {PaymentKind.REFUND: RefundHandler()}


        def dispatch(request: PaymentRequest) -> PaymentResult:
            handler = HANDLERS.get(request.kind)
            if handler is None:
                raise UnknownPaymentKindError(request.kind)
            return handler.handle(request)
    expected_output:
      outcome: valid
  - name: rechecks an amount its pydantic field already constrains
    inputs:
      file: payments/refund_service.py
      after: |
        from pydantic import BaseModel, Field


        class RefundRequest(BaseModel):
            order_number: str
            amount_cents: int = Field(gt=0)


        class InvalidRefundError(Exception):
            pass


        def refund_line(request: RefundRequest) -> str:
            if request.amount_cents <= 0:
                raise InvalidRefundError(request.order_number)
            return f"refund {request.amount_cents} on {request.order_number}"
    expected_output:
      outcome: invalid
