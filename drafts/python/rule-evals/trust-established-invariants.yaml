cases:
  - name: asserts a carrier already checked for None
    inputs:
      file: shipping/pickup.py
      after: |
        from dataclasses import dataclass

        from .carrier import Carrier, PickupWindow


        class MissingCarrierError(Exception):
            pass


        @dataclass(frozen=True)
        class Shipment:
            id: str
            carrier: Carrier | None


        def schedule_pickup(shipment: Shipment) -> PickupWindow:
            if shipment.carrier is None:
                raise MissingCarrierError(shipment.id)
            assert shipment.carrier is not None
            return shipment.carrier.next_pickup_window()
    expected_output:
      outcome: invalid
  - name: falls back to a placeholder for a carrier already checked for None
    inputs:
      file: shipping/pickup.py
      after: |
        from dataclasses import dataclass

        from .carrier import Carrier


        class MissingCarrierError(Exception):
            pass


        @dataclass(frozen=True)
        class Shipment:
            id: str
            carrier: Carrier | None


        def pickup_note(shipment: Shipment) -> str:
            if shipment.carrier is None:
                raise MissingCarrierError(shipment.id)
            name = shipment.carrier.name if shipment.carrier is not None else "unknown"
            return f"Pickup for {shipment.id} by {name}"
    expected_output:
      outcome: invalid
