  - name: returns early for empty lines an imported order never has
    inputs:
      file: orders/totals.py
      unchanged:
        orders/model.py: |
          from dataclasses import dataclass


          class EmptyOrderError(Exception):
              pass


          @dataclass(frozen=True)
          class OrderLine:
              sku: str
              amount_cents: int


          @dataclass(frozen=True)
          class Order:
              number: str
              lines: tuple[OrderLine, ...]

              def __post_init__(self) -> None:
                  if not self.lines:
                      raise EmptyOrderError(self.number)
      after: |
        from orders.model import Order


        def largest_line_cents(order: Order) -> int:
            if not order.lines:
                return 0
            return max(line.amount_cents for line in order.lines)
    expected_output:
      outcome: invalid
