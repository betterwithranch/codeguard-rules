  - name: checks the item type in a helper only the parcel branch calls
    inputs:
      file: warehouse/loading.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Parcel:
            weight_kg: float


        @dataclass(frozen=True)
        class Pallet:
            parcels: tuple[Parcel, ...]


        def load_weight_kg(items: list[Parcel | Pallet]) -> float:
            total = 0.0
            for item in items:
                match item:
                    case Parcel():
                        total += _parcel_weight_kg(item)
                    case Pallet():
                        total += sum(parcel.weight_kg for parcel in item.parcels) + 25
            return total


        def _parcel_weight_kg(item: Parcel | Pallet) -> float:
            if not isinstance(item, Parcel):
                raise TypeError("expected a parcel")
            return item.weight_kg
    expected_output:
      outcome: invalid
  - name: branches on the item type in a helper both branches call
    inputs:
      file: warehouse/loading.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Parcel:
            weight_kg: float


        @dataclass(frozen=True)
        class Pallet:
            parcels: tuple[Parcel, ...]


        def load_weight_kg(items: list[Parcel | Pallet]) -> float:
            return sum(_weight_kg(item) for item in items)


        def _weight_kg(item: Parcel | Pallet) -> float:
            if isinstance(item, Parcel):
                return item.weight_kg
            return sum(parcel.weight_kg for parcel in item.parcels) + 25
    expected_output:
      outcome: valid
  - name: rechecks for empty lines after rejecting empty lines
    inputs:
      file: invoices/issue.py
      after: |
        class EmptyInvoiceError(Exception):
            pass


        def invoice_total_cents(line_cents: list[int]) -> int:
            if len(line_cents) == 0:
                raise EmptyInvoiceError()
            subtotal = sum(line_cents)
            if not line_cents:
                return 0
            return subtotal + round(subtotal * 0.2)
    expected_output:
      outcome: invalid
  - name: checks for empty lines after rejecting a missing list
    inputs:
      file: invoices/issue.py
      after: |
        class MissingLinesError(Exception):
            pass


        def invoice_total_cents(line_cents: list[int] | None) -> int:
            if line_cents is None:
                raise MissingLinesError()
            if not line_cents:
                return 0
            subtotal = sum(line_cents)
            return subtotal + round(subtotal * 0.2)
    expected_output:
      outcome: valid
  - name: checks the shape of a parsed JSON body
    inputs:
      file: webhooks/carrier.py
      after: |
        import json


        class MalformedWebhookError(Exception):
            pass


        def tracking_numbers(body: str) -> list[str]:
            payload = json.loads(body)
            if not isinstance(payload, list):
                raise MalformedWebhookError("expected a list of tracking numbers")
            return [str(number) for number in payload]
    expected_output:
      outcome: valid
  - name: extracts the payload into a local
    inputs:
      file: payments/refunds.py
      before: |
        from .payment import PaymentRequest, PaymentResult, RefundPayload


        class RefundHandler:
            def handle(self, request: PaymentRequest[RefundPayload]) -> PaymentResult:
                return PaymentResult(refunded_cents=request.payload.amount_cents)
      after: |
        from .payment import PaymentRequest, PaymentResult, RefundPayload


        class RefundHandler:
            def handle(self, request: PaymentRequest[RefundPayload]) -> PaymentResult:
                payload = request.payload
                return PaymentResult(refunded_cents=payload.amount_cents)
    expected_output:
      outcome: skipped
