  - name: rechecks the payload type after dispatch
    inputs:
      file: payments/refunds.py
      before: |
        from .payment import PaymentKind, PaymentRequest, PaymentResult, RefundPayload


        class RefundHandler:
            def handle(self, request: PaymentRequest) -> PaymentResult:
                return PaymentResult(refunded_cents=request.payload.amount_cents)


        HANDLERS = {PaymentKind.REFUND: RefundHandler()}


        def dispatch(request: PaymentRequest) -> PaymentResult:
            if request.kind is PaymentKind.REFUND and not isinstance(request.payload, RefundPayload):
                raise TypeError("a refund request must carry a refund payload")
            return HANDLERS[request.kind].handle(request)
      after: |
        from .payment import PaymentKind, PaymentRequest, PaymentResult, RefundPayload


        class RefundHandler:
            def handle(self, request: PaymentRequest) -> PaymentResult:
                if not isinstance(request.payload, RefundPayload):
                    raise TypeError("RefundHandler requires a refund payload")
                return PaymentResult(refunded_cents=request.payload.amount_cents)


        HANDLERS = {PaymentKind.REFUND: RefundHandler()}


        def dispatch(request: PaymentRequest) -> PaymentResult:
            if request.kind is PaymentKind.REFUND and not isinstance(request.payload, RefundPayload):
                raise TypeError("a refund request must carry a refund payload")
            return HANDLERS[request.kind].handle(request)
    expected_output:
      outcome: invalid
  - name: checks the payload type in a handler with no visible dispatch
    inputs:
      file: payments/refunds.py
