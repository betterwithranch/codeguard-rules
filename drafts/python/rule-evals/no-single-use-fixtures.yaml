  - name: adds a fixture one method of a test class requests
    inputs:
      file: tests/test_orders.py
      after: |
        import pytest

        from shop.orders import Order, OrderLine


        @pytest.fixture
        def discounted_line():
            return OrderLine(sku="BOOK-1", price=60, quantity=2, discount=10)


        class TestOrderTotal:
            def test_total_applies_line_discount(self, discounted_line):
                assert Order(lines=[discounted_line]).total == 110

            def test_empty_order_totals_zero(self):
                assert Order(lines=[]).total == 0
    expected_output:
      outcome: invalid
  - name: drops the fixture from one of the two tests that requested it
    inputs:
      file: tests/test_orders.py
      before: |
        import pytest

        from shop.orders import Order, OrderLine


        @pytest.fixture
        def book_line():
            return OrderLine(sku="BOOK-1", price=60, quantity=2)


        def test_total_sums_lines(book_line):
            assert Order(lines=[book_line]).total == 120


        def test_line_count(book_line):
            assert Order(lines=[book_line, book_line]).line_count == 2
      after: |
        import pytest

        from shop.orders import Order, OrderLine


        @pytest.fixture
        def book_line():
            return OrderLine(sku="BOOK-1", price=60, quantity=2)


        def test_total_sums_lines(book_line):
            assert Order(lines=[book_line]).total == 120


        def test_line_count():
            line = OrderLine(sku="PEN-1", price=2, quantity=1)

            assert Order(lines=[line, line]).line_count == 2
    expected_output:
      outcome: invalid
