  - name: marks a single test with usefixtures for a frozen clock
    inputs:
      file: tests/test_tokens.py
      after: |
        import pytest

        from auth.tokens import issue_token, is_expired


        @pytest.fixture
        def frozen_clock(freezer):
            freezer.move_to("2026-03-01T09:00:00Z")


        @pytest.mark.usefixtures("frozen_clock")
        def test_new_token_is_not_expired():
            token = issue_token(user_id="usr-1", ttl_minutes=5)

            assert not is_expired(token)


        def test_token_with_zero_ttl_is_expired():
            token = issue_token(user_id="usr-1", ttl_minutes=0)

            assert is_expired(token)
    expected_output:
      outcome: invalid
  - name: marks a test class of two tests with usefixtures
    inputs:
      file: tests/test_tokens.py
      after: |
        import pytest

        from auth.tokens import issue_token, is_expired


        @pytest.fixture
        def frozen_clock(freezer):
            freezer.move_to("2026-03-01T09:00:00Z")


        @pytest.mark.usefixtures("frozen_clock")
        class TestTokenExpiry:
            def test_new_token_is_not_expired(self):
                token = issue_token(user_id="usr-1", ttl_minutes=5)

                assert not is_expired(token)

            def test_token_with_zero_ttl_is_expired(self):
                token = issue_token(user_id="usr-1", ttl_minutes=0)

                assert is_expired(token)
    expected_output:
      outcome: valid
  - name: adds a rules fixture only the mapper fixture requests
    inputs:
      file: tests/test_invoice_mapper.py
      after: |
        import pytest

        from billing.invoices import Invoice
        from billing.mapper import InvoiceMapper, MappingRules


        @pytest.fixture
        def rules():
            return MappingRules(currency="EUR")


        @pytest.fixture
        def mapper(rules):
            return InvoiceMapper(rules)


        def test_map_reads_number(mapper):
            assert mapper.map({"no": "42", "sum": "1"}).number == "42"


        def test_map_reads_total(mapper):
            assert mapper.map({"no": "42", "sum": "120.00"}).total == 120
    expected_output:
      outcome: invalid
  - name: adds a rules fixture a test and the mapper fixture request
    inputs:
      file: tests/test_invoice_mapper.py
      after: |
        import pytest

        from billing.invoices import Invoice
        from billing.mapper import InvoiceMapper, MappingRules


        @pytest.fixture
        def rules():
            return MappingRules(currency="EUR")


        @pytest.fixture
        def mapper(rules):
            return InvoiceMapper(rules)


        def test_map_reads_number(mapper):
            assert mapper.map({"no": "42", "sum": "1"}).number == "42"


        def test_map_reads_total(mapper):
            assert mapper.map({"no": "42", "sum": "120.00"}).total == 120


        def test_rules_currency_is_used(rules):
            assert InvoiceMapper(rules).map({"no": "42", "sum": "1"}).currency == "EUR"
    expected_output:
      outcome: valid
  - name: adds an autouse fixture for a module of tests
