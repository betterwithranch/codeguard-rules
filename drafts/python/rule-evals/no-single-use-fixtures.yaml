  - name: adds a parametrized fixture two tests request
    inputs:
      file: tests/test_parsers.py
      after: |
        import pytest

        from imports.parsers import CsvParser, JsonParser


        @pytest.fixture(params=[CsvParser, JsonParser])
        def parser_class(request):
            return request.param


        def test_parse_empty_text_returns_no_rows(parser_class):
            assert parser_class().parse("") == []


        def test_parser_names_its_format(parser_class):
            assert parser_class().format_name in {"csv", "json"}
    expected_output:
      outcome: valid
  - name: changes an expected total in a test body
    inputs:
      file: tests/test_orders.py
      before: |
        from shop.orders import Order, OrderLine


        def test_total_sums_lines():
            assert Order(lines=[OrderLine(sku="BOOK-1", price=60, quantity=2)]).total == 120
      after: |
        from shop.orders import Order, OrderLine


        def test_total_sums_lines():
            assert Order(lines=[OrderLine(sku="BOOK-1", price=60, quantity=3)]).total == 180
    expected_output:
      outcome: skipped
  - name: changes a helper's default price
    inputs:
