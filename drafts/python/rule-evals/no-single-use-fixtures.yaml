cases:
  - name: adds a fixture only one of two tests requests
    inputs:
      file: tests/test_reminders.py
      after: |
        import pytest

        from billing.reminders import ReminderSender
        from tests.fakes import FakeLedger, FakeMailbox


        @pytest.fixture
        def overdue_ledger():
            ledger = FakeLedger(currency="EUR")
            ledger.add_invoice("inv-42", amount=120, due="2026-01-15")
            return ledger


        def test_sends_reminder_for_overdue_invoice(overdue_ledger):
            mailbox = FakeMailbox()

            ReminderSender(overdue_ledger, mailbox).send_overdue(today="2026-02-01")

            assert mailbox.subjects == ["Invoice inv-42 is overdue"]


        def test_sends_nothing_for_empty_ledger():
            mailbox = FakeMailbox()

            ReminderSender(FakeLedger(currency="EUR"), mailbox).send_overdue(today="2026-02-01")

            assert mailbox.subjects == []
    expected_output:
      outcome: invalid
  - name: adds a fixture both tests request
    inputs:
      file: tests/test_reminders.py
