cases:
  - name: computes the expected cache key with the production key function
    inputs:
      file: tests/test_product_cache.py
      unchanged:
        catalog/cache.py: |
          from catalog.keys import cache_key
          from catalog.products import Product


          class ProductCache:
              def __init__(self) -> None:
                  self._entries: dict[str, Product] = {}

              def put(self, product: Product) -> None:
                  self._entries[cache_key(product.sku, product.region)] = product

              def keys(self) -> list[str]:
                  return list(self._entries)
      after: |
        from catalog.cache import ProductCache
        from catalog.keys import cache_key
        from catalog.products import Product


        def expected_key(product):
            return cache_key(product.sku, product.region)


        def test_put_stores_under_product_key():
            cache = ProductCache()
            product = Product(sku="A1", region="eu")

            cache.put(product)

            assert cache.keys() == [expected_key(product)]
    expected_output:
      outcome: invalid
  - name: writes out the expected cache key
    inputs:
      file: tests/test_product_cache.py
      unchanged:
        catalog/cache.py: |
          from catalog.keys import cache_key
          from catalog.products import Product


          class ProductCache:
              def __init__(self) -> None:
                  self._entries: dict[str, Product] = {}

              def put(self, product: Product) -> None:
                  self._entries[cache_key(product.sku, product.region)] = product

              def keys(self) -> list[str]:
                  return list(self._entries)
      after: |
        from catalog.cache import ProductCache
        from catalog.products import Product


        def make_product(sku, region):
            return Product(sku=sku, region=region)


        def test_put_stores_under_product_key():
            cache = ProductCache()

            cache.put(make_product("A1", "eu"))

            assert cache.keys() == ["eu:A1"]
    expected_output:
      outcome: valid
  - name: peeks the next invoice number with the production allocator in a fixture
    inputs:
      file: tests/test_invoice_numbers.py
      unchanged:
        billing/invoices.py: |
          from sqlalchemy.orm import Session

          from billing.numbering import InvoiceNumberAllocator


          class InvoiceService:
              def __init__(self, session: Session) -> None:
                  self._session = session

              def create(self, account_id: str, amount: int) -> "Invoice":
                  number = InvoiceNumberAllocator(self._session).next()
                  invoice = Invoice(number=number, account_id=account_id, amount=amount)
                  self._session.add(invoice)
                  return invoice
      after: |
        import pytest

        from billing.invoices import InvoiceService
        from billing.numbering import InvoiceNumberAllocator


        @pytest.fixture
        def next_number(db_session):
            return InvoiceNumberAllocator(db_session).peek_next()


        def test_create_numbers_the_invoice(db_session, account, next_number):
            invoice = InvoiceService(db_session).create(account_id=account.id, amount=120)

            assert invoice.number == next_number
    expected_output:
      outcome: invalid
  - name: seeds an earlier invoice through the service in a fixture
    inputs:
      file: tests/test_invoice_numbers.py
      unchanged:
        billing/invoices.py: |
          from sqlalchemy.orm import Session

          from billing.numbering import InvoiceNumberAllocator


          class InvoiceService:
              def __init__(self, session: Session) -> None:
                  self._session = session

              def create(self, account_id: str, amount: int) -> "Invoice":
                  number = InvoiceNumberAllocator(self._session).next()
                  invoice = Invoice(number=number, account_id=account_id, amount=amount)
                  self._session.add(invoice)
                  return invoice
      after: |
        import pytest

        from billing.invoices import InvoiceService


        @pytest.fixture
        def first_invoice(db_session, account):
            return InvoiceService(db_session).create(account_id=account.id, amount=50)


        def test_create_numbers_the_next_invoice(db_session, account, first_invoice):
            invoice = InvoiceService(db_session).create(account_id=account.id, amount=120)

            assert invoice.number == "INV-0002"
    expected_output:
      outcome: valid
  - name: sorts the expected tasks with the scheduler's priority key
    inputs:
      file: tests/test_scheduler.py
      unchanged:
        jobs/scheduler.py: |
          from jobs.priority import priority_key
          from jobs.tasks import Task


          class Scheduler:
              def __init__(self) -> None:
                  self._tasks: list[Task] = []

              def add(self, task: Task) -> None:
                  self._tasks.append(task)

              def queue(self) -> list[Task]:
                  return sorted(self._tasks, key=priority_key)
      after: |
        from jobs.priority import priority_key
        from jobs.scheduler import Scheduler
        from jobs.tasks import Task


        def expected_queue(tasks):
            return sorted(tasks, key=priority_key)


        def test_queue_orders_by_priority():
            tasks = [Task(name="report", urgent=False), Task(name="page", urgent=True)]
            scheduler = Scheduler()
            for task in tasks:
                scheduler.add(task)

            assert scheduler.queue() == expected_queue(tasks)
    expected_output:
      outcome: invalid
  - name: sorts the expected tasks with its own key
    inputs:
      file: tests/test_scheduler.py
      unchanged:
        jobs/scheduler.py: |
          from jobs.priority import priority_key
          from jobs.tasks import Task


          class Scheduler:
              def __init__(self) -> None:
                  self._tasks: list[Task] = []

              def add(self, task: Task) -> None:
                  self._tasks.append(task)

              def queue(self) -> list[Task]:
                  return sorted(self._tasks, key=priority_key)
      after: |
        from jobs.scheduler import Scheduler
        from jobs.tasks import Task


        def expected_queue(tasks):
            return sorted(tasks, key=lambda task: not task.urgent)


        def test_queue_orders_by_priority():
            tasks = [Task(name="report", urgent=False), Task(name="page", urgent=True)]
            scheduler = Scheduler()
            for task in tasks:
                scheduler.add(task)

            assert scheduler.queue() == expected_queue(tasks)
    expected_output:
      outcome: valid
  - name: builds the expected slug with the model's slug method
    inputs:
      file: blog/tests/test_article_save.py
      unchanged:
        blog/models.py: |
          from django.db import models


          class Article(models.Model):
              title = models.CharField(max_length=200)
              slug = models.SlugField(unique=True)

              @classmethod
              def slug_for(cls, title: str) -> str:
                  return "-".join(title.lower().split())

              def save(self, *args, **kwargs):
                  self.slug = Article.slug_for(self.title)
                  super().save(*args, **kwargs)
      after: |
        import pytest

        from blog.models import Article


        @pytest.fixture
        def expected_slug():
            return Article.slug_for("Hello Big World")


        @pytest.mark.django_db
        def test_save_sets_slug_from_title(expected_slug):
            article = Article(title="Hello Big World")

            article.save()

            assert article.slug == expected_slug
    expected_output:
      outcome: invalid
  - name: hashes the expected etag with hashlib
    inputs:
      file: tests/test_etags.py
      unchanged:
        web/etags.py: |
          import hashlib


          def etag_for(body: bytes) -> str:
              return hashlib.sha256(body).hexdigest()


          class Responder:
              def respond(self, body: bytes) -> dict[str, str]:
                  return {"ETag": etag_for(body)}
      after: |
        import hashlib

        from web.etags import Responder


        def sha256_of(body):
            return hashlib.sha256(body).hexdigest()


        def test_respond_sets_etag_from_body():
            headers = Responder().respond(b"hello")

            assert headers == {"ETag": sha256_of(b"hello")}
    expected_output:
      outcome: valid
  - name: gets the expected etag from the production etag function
    inputs:
      file: tests/test_etags.py
      unchanged:
        web/etags.py: |
          import hashlib


          def etag_for(body: bytes) -> str:
              return hashlib.sha256(body).hexdigest()


          class Responder:
              def respond(self, body: bytes) -> dict[str, str]:
                  return {"ETag": etag_for(body)}
      after: |
        from web.etags import Responder, etag_for


        def expected_etag(body):
            return etag_for(body)


        def test_respond_sets_etag_from_body():
            headers = Responder().respond(b"hello")

            assert headers == {"ETag": expected_etag(b"hello")}
    expected_output:
      outcome: invalid
  - name: computes the expected price with the pricing method of the class under test
    inputs:
      file: tests/test_quotes.py
      unchanged:
        shipping/quotes.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Quote:
              weight_kg: int
              price: int


          class QuoteService:
              def __init__(self, rate: int) -> None:
                  self._rate = rate

              def price_for(self, weight_kg: int) -> int:
                  return max(5, weight_kg * self._rate)

              def quote(self, weight_kg: int) -> Quote:
                  return Quote(weight_kg=weight_kg, price=self.price_for(weight_kg))
      after: |
        from shipping.quotes import Quote, QuoteService


        def expected_quote(service, weight_kg):
            return Quote(weight_kg=weight_kg, price=service.price_for(weight_kg))


        def test_quote_prices_by_weight():
            service = QuoteService(rate=12)

            assert service.quote(weight_kg=2) == expected_quote(service, 2)
    expected_output:
      outcome: invalid
  - name: writes out the expected quote
    inputs:
      file: tests/test_quotes.py
      unchanged:
        shipping/quotes.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Quote:
              weight_kg: int
              price: int


          class QuoteService:
              def __init__(self, rate: int) -> None:
                  self._rate = rate

              def price_for(self, weight_kg: int) -> int:
                  return max(5, weight_kg * self._rate)

              def quote(self, weight_kg: int) -> Quote:
                  return Quote(weight_kg=weight_kg, price=self.price_for(weight_kg))
      after: |
        from shipping.quotes import Quote, QuoteService


        def expected_quote(weight_kg, price):
            return Quote(weight_kg=weight_kg, price=price)


        def test_quote_prices_by_weight():
            service = QuoteService(rate=12)

            assert service.quote(weight_kg=2) == expected_quote(2, 24)
    expected_output:
      outcome: valid
