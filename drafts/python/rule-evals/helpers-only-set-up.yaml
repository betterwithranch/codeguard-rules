cases:
  - name: returns the mapped invoice from a helper
    inputs:
      file: tests/test_invoice_mapper.py
      after: |
        from billing.mapper import InvoiceMapper, MappingRules
        from billing.invoices import Invoice


        def map_invoice(raw):
            return InvoiceMapper(MappingRules(currency="EUR")).map(raw)


        def test_map_reads_number_and_total():
            invoice = map_invoice({"no": "42", "sum": "120.00"})

            assert invoice == Invoice(number="42", total=120, currency="EUR")
    expected_output:
      outcome: invalid
  - name: returns the mapper from a helper
    inputs:
      file: tests/test_invoice_mapper.py
      after: |
        from billing.mapper import InvoiceMapper, MappingRules
        from billing.invoices import Invoice


        def make_mapper():
            return InvoiceMapper(MappingRules(currency="EUR"))


        def test_map_reads_number_and_total():
            mapper = make_mapper()

            invoice = mapper.map({"no": "42", "sum": "120.00"})

            assert invoice == Invoice(number="42", total=120, currency="EUR")
    expected_output:
      outcome: valid
  - name: changes the order id
    inputs:
      file: tests/test_checkout_workflow.py
      before: |
        from orders.checkout import CheckoutResult, CheckoutWorkflow, Status
        from tests.fakes import FakePaymentGateway


        def test_submit_waits_for_payment():
            workflow = CheckoutWorkflow(FakePaymentGateway())

            result = workflow.submit(order_id="ord-1")

            assert result == CheckoutResult(order_id="ord-1", status=Status.WAITING)
      after: |
        from orders.checkout import CheckoutResult, CheckoutWorkflow, Status
        from tests.fakes import FakePaymentGateway


        def test_submit_waits_for_payment():
            workflow = CheckoutWorkflow(FakePaymentGateway())

            result = workflow.submit(order_id="ord-9")

            assert result == CheckoutResult(order_id="ord-9", status=Status.WAITING)
    expected_output:
      outcome: skipped
