valid:
- file: tests/test_order_emails.py
  after: |
    import pytest

    from notifications.order_emails import order_email_subject
    from orders.models import Customer, Order


    @pytest.fixture
    def customer():
        return Customer(id="cus-1", name="Ada")


    def test_subject_names_customer(customer):
        order = Order(id="ord-1", customer_id="cus-1", total=120)

        assert order_email_subject(order, customer) == "Ada, your order ord-1"


    def test_subject_for_second_order(customer):
        order = Order(id="ord-2", customer_id="cus-1", total=80)

        assert order_email_subject(order, customer, sequence=2) == "Ada, your order ord-2 (2)"
