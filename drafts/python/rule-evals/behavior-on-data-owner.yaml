cases:
  - name: computes a sort key in a staticmethod
    inputs:
      file: invoices/summary.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class InvoiceLine:
            sku: str
            position: int


        class InvoiceSummaryComposer:
            def __init__(self, lines: list[InvoiceLine]) -> None:
                self._lines = lines

            def ordered_skus(self) -> list[str]:
                return [line.sku for line in sorted(self._lines, key=self._sort_key)]

            @staticmethod
            def _sort_key(line: InvoiceLine) -> tuple[str, int]:
                return (line.sku.casefold(), line.position)
    expected_output:
      outcome: invalid
  - name: compares two lines in a staticmethod
    inputs:
      file: invoices/summary.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class InvoiceLine:
            sku: str
            amount_cents: int


        @dataclass(frozen=True)
        class LineChange:
            sku: str
            delta_cents: int


        class InvoiceDiffComposer:
            def __init__(self, before: list[InvoiceLine], after: list[InvoiceLine]) -> None:
                self._pairs = list(zip(before, after))

            def changes(self) -> list[LineChange]:
                return [self._change(old, new) for old, new in self._pairs]

            @staticmethod
            def _change(old: InvoiceLine, new: InvoiceLine) -> LineChange:
                return LineChange(sku=new.sku, delta_cents=new.amount_cents - old.amount_cents)
    expected_output:
      outcome: valid
  - name: adds a heaviness check that ignores self
    inputs:
      file: shipments/label_printer.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            tracking_number: str
            weight_kg: float


        class ShipmentLabelPrinter:
            def __init__(self, carrier_name: str) -> None:
                self._carrier_name = carrier_name

            def label(self, shipment: Shipment) -> str:
                return f"{self._carrier_name} {shipment.tracking_number}"
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            tracking_number: str
            weight_kg: float


        class ShipmentLabelPrinter:
            def __init__(self, carrier_name: str) -> None:
                self._carrier_name = carrier_name

            def label(self, shipment: Shipment) -> str:
                suffix = " HEAVY" if self._is_heavy(shipment) else ""
                return f"{self._carrier_name} {shipment.tracking_number}{suffix}"

            def _is_heavy(self, shipment: Shipment) -> bool:
                return shipment.weight_kg > 30
    expected_output:
      outcome: invalid
  - name: adds a heaviness check against a given limit
    inputs:
      file: shipments/label_printer.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            tracking_number: str
            weight_kg: float


        class ShipmentLabelPrinter:
            def __init__(self, carrier_name: str, heavy_limit_kg: float) -> None:
                self._carrier_name = carrier_name
                self._heavy_limit_kg = heavy_limit_kg

            def label(self, shipment: Shipment) -> str:
                return f"{self._carrier_name} {shipment.tracking_number}"
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            tracking_number: str
            weight_kg: float


        class ShipmentLabelPrinter:
            def __init__(self, carrier_name: str, heavy_limit_kg: float) -> None:
                self._carrier_name = carrier_name
                self._heavy_limit_kg = heavy_limit_kg

            def label(self, shipment: Shipment) -> str:
                suffix = " HEAVY" if self._is_heavy(shipment, self._heavy_limit_kg) else ""
                return f"{self._carrier_name} {shipment.tracking_number}{suffix}"

            def _is_heavy(self, shipment: Shipment, limit_kg: float) -> bool:
                return shipment.weight_kg > limit_kg
    expected_output:
      outcome: valid
  - name: formats a shipment line in a module function
    inputs:
      file: shipments/manifest.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            tracking_number: str
            destination: str
            weight_kg: float


        def manifest_line(shipment: Shipment) -> str:
            return f"{shipment.tracking_number} -> {shipment.destination} ({shipment.weight_kg:.1f} kg)"


        def manifest(shipments: list[Shipment]) -> str:
            return "\n".join(manifest_line(shipment) for shipment in shipments)
    expected_output:
      outcome: invalid
  - name: formats an ISO week label from a date
    inputs:
      file: shipments/manifest.py
      after: |
        from dataclasses import dataclass
        from datetime import date


        @dataclass(frozen=True)
        class Shipment:
            tracking_number: str
            shipped_on: date


        def week_label(day: date) -> str:
            year, week, _ = day.isocalendar()
            return f"{year}-W{week:02d}"


        def manifest_header(shipments: list[Shipment]) -> str:
            return f"Manifest {week_label(shipments[0].shipped_on)}: {len(shipments)} shipments"
    expected_output:
      outcome: valid
  - name: totals a pydantic order in a module function
    inputs:
      file: orders/totals.py
      after: |
        from pydantic import BaseModel


        class OrderLine(BaseModel):
            quantity: int
            unit_price_cents: int


        class Order(BaseModel):
            number: str
            lines: list[OrderLine]


        def order_total_cents(order: Order) -> int:
            return sum(line.quantity * line.unit_price_cents for line in order.lines)
    expected_output:
      outcome: invalid
  - name: converts a pydantic order total at a given rate
    inputs:
      file: orders/totals.py
      after: |
        from decimal import Decimal

        from pydantic import BaseModel


        class OrderLine(BaseModel):
            quantity: int
            unit_price_cents: int


        class Order(BaseModel):
            number: str
            lines: list[OrderLine]


        def order_total_in(order: Order, exchange_rate: Decimal) -> Decimal:
            cents = sum(line.quantity * line.unit_price_cents for line in order.lines)
            return Decimal(cents) * exchange_rate / 100
    expected_output:
      outcome: valid
  - name: checks VIP status of a Django customer in a nested function
    inputs:
      file: customers/campaigns.py
      after: |
        from django.db import models


        class Customer(models.Model):
            email = models.EmailField()
            lifetime_spend_cents = models.IntegerField()


        def vip_emails(customers: list[Customer]) -> list[str]:
            def is_vip(customer: Customer) -> bool:
                return customer.lifetime_spend_cents >= 100_000

            return [customer.email for customer in customers if is_vip(customer)]
    expected_output:
      outcome: invalid
  - name: checks a Django customer against the caller's threshold in a nested function
    inputs:
      file: customers/campaigns.py
      after: |
        from django.db import models


        class Customer(models.Model):
            email = models.EmailField()
            lifetime_spend_cents = models.IntegerField()


        def emails_above(customers: list[Customer], threshold_cents: int) -> list[str]:
            def is_above(customer: Customer) -> bool:
                return customer.lifetime_spend_cents >= threshold_cents

            return [customer.email for customer in customers if is_above(customer)]
    expected_output:
      outcome: valid
