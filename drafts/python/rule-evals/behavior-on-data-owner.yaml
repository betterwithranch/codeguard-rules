  - name: checks an imported invoice's age against today's date
    inputs:
      file: invoices/reminders.py
      unchanged:
        invoices/models.py: |
          from dataclasses import dataclass
          from datetime import date


          @dataclass(frozen=True)
          class Invoice:
              number: str
              issued_on: date
              balance_cents: int
      after: |
        from datetime import date

        from invoices.models import Invoice


        def needs_reminder(invoice: Invoice) -> bool:
            return invoice.balance_cents > 0 and (date.today() - invoice.issued_on).days > 30
    expected_output:
      outcome: valid
  - name: builds an attrs event row in a classmethod that ignores cls
    inputs:
      file: tracking/export.py
      after: |
        import attrs


        @attrs.frozen
        class ScanEvent:
            tracking_number: str
            location: str
            status: str


        class ScanExport:
            columns = ("tracking_number", "location", "status")

            @classmethod
            def row(cls, event: ScanEvent) -> dict[str, str]:
                return {
                    "tracking_number": event.tracking_number,
                    "location": event.location.title(),
                    "status": event.status.upper(),
                }
    expected_output:
      outcome: invalid
  - name: reads a status code from a requests response
    inputs:
      file: carriers/client.py
      after: |
        import requests


        def is_rate_limited(response: requests.Response) -> bool:
            return response.status_code == 429


        def fetch_rates(session: requests.Session, url: str) -> requests.Response:
            response = session.get(url, timeout=10)
            if is_rate_limited(response):
                response = session.get(url, timeout=30)
            return response
    expected_output:
      outcome: valid
  - name: implements the renderer interface's render method
    inputs:
      file: invoices/rendering.py
      after: |
        from abc import ABC, abstractmethod
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total_cents: int


        class InvoiceRenderer(ABC):
            @abstractmethod
            def render(self, invoice: Invoice) -> str: ...


        class PlainTextInvoiceRenderer(InvoiceRenderer):
            def render(self, invoice: Invoice) -> str:
                return f"Invoice {invoice.number}: {invoice.total_cents / 100:.2f}"
    expected_output:
      outcome: valid
  - name: builds a shipment from an order in a module function
    inputs:
      file: shipments/from_orders.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            shipping_address: str
            total_weight_kg: float


        @dataclass(frozen=True)
        class Shipment:
            order_number: str
            destination: str
            weight_kg: float


        class ShipmentPlanner:
            @staticmethod
            def shipment_for(order: Order) -> Shipment:
                return Shipment(
                    order_number=order.number,
                    destination=order.shipping_address,
                    weight_kg=order.total_weight_kg,
                )
    expected_output:
      outcome: valid
  - name: computes the volume of a SQLAlchemy parcel in a module function
    inputs:
      file: warehouse/parcels.py
      after: |
        from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column


        class Base(DeclarativeBase):
            pass


        class Parcel(Base):
            __tablename__ = "parcels"

            id: Mapped[int] = mapped_column(primary_key=True)
            length_cm: Mapped[int]
            width_cm: Mapped[int]
            height_cm: Mapped[int]


        def volume_litres(parcel: Parcel) -> float:
            return parcel.length_cm * parcel.width_cm * parcel.height_cm / 1000
    expected_output:
      outcome: invalid
