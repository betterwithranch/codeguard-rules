cases:
- name: asserts a carrier already checked for None
  inputs:
    file: shipping/pickup.py
    after: |
      from dataclasses import dataclass

      from .carrier import Carrier, PickupWindow


      class MissingCarrierError(Exception):
          pass


      @dataclass(frozen=True)
      class Shipment:
          id: str
          carrier: Carrier | None


      def schedule_pickup(shipment: Shipment) -> PickupWindow:
          if shipment.carrier is None:
              raise MissingCarrierError(shipment.id)
          assert shipment.carrier is not None
          return shipment.carrier.next_pickup_window()
  expected_output:
    outcome: invalid
