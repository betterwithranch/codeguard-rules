- name: rejects an unknown payment kind
  inputs:
    file: payments/refunds.py
    after: |
      from .payment import PaymentKind, PaymentRequest, PaymentResult, RefundPayload


      class UnknownPaymentKindError(Exception):
          pass


      class RefundHandler:
          def handle(self, request: PaymentRequest[RefundPayload]) -> PaymentResult:
              return PaymentResult(refunded_cents=request.payload.amount_cents)


      HANDLERS = {PaymentKind.REFUND: RefundHandler()}


      def dispatch(request: PaymentRequest) -> PaymentResult:
          handler = HANDLERS.get(request.kind)
          if handler is None:
              raise UnknownPaymentKindError(request.kind)
          return handler.handle(request)
  expected_output:
    outcome: valid
