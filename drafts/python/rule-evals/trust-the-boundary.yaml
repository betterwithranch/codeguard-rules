- name: checks the item type in a helper only the parcel branch calls
  inputs:
    file: warehouse/loading.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Parcel:
          weight_kg: float


      @dataclass(frozen=True)
      class Pallet:
          parcels: tuple[Parcel, ...]


      def load_weight_kg(items: list[Parcel | Pallet]) -> float:
          total = 0.0
          for item in items:
              match item:
                  case Parcel():
                      total += _parcel_weight_kg(item)
                  case Pallet():
                      total += sum(parcel.weight_kg for parcel in item.parcels) + 25
          return total


      def _parcel_weight_kg(item: Parcel | Pallet) -> float:
          if not isinstance(item, Parcel):
              raise TypeError("expected a parcel")
          return item.weight_kg
  expected_output:
    outcome: invalid
- name: branches on the item type in a helper both branches call
  inputs:
    file: warehouse/loading.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Parcel:
          weight_kg: float


      @dataclass(frozen=True)
      class Pallet:
          parcels: tuple[Parcel, ...]


      def load_weight_kg(items: list[Parcel | Pallet]) -> float:
          return sum(_weight_kg(item) for item in items)


      def _weight_kg(item: Parcel | Pallet) -> float:
          if isinstance(item, Parcel):
              return item.weight_kg
          return sum(parcel.weight_kg for parcel in item.parcels) + 25
  expected_output:
    outcome: valid
