# yaml-language-server: $schema=rule-eval-schema.json
cases:
  - name: adds one helper per issue type
    inputs:
      file: shipments/shipment_validator.py
      after: |
        from abc import ABC, abstractmethod
        from dataclasses import dataclass
        from enum import StrEnum

        from .shipment import Shipment


        class IssueType(StrEnum):
            MISSING = "missing"
            INVALID = "invalid"
            AMBIGUOUS = "ambiguous"


        @dataclass(frozen=True)
        class ValidationIssue:
            field: str
            issue_type: IssueType


        class ShipmentValidator(ABC):
            def __init__(self) -> None:
                self.issues: list[ValidationIssue] = []

            @abstractmethod
            def validate(self, shipment: Shipment) -> None: ...

            def _missing(self, field: str) -> None:
                self.issues.append(ValidationIssue(field, IssueType.MISSING))

            def _invalid(self, field: str) -> None:
                self.issues.append(ValidationIssue(field, IssueType.INVALID))

            def _ambiguous(self, field: str) -> None:
                self.issues.append(ValidationIssue(field, IssueType.AMBIGUOUS))
    expected_output:
      outcome: invalid
