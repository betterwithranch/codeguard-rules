  - name: takes the issue type as a parameter
    inputs:
      file: shipments/shipment_validator.py
      after: |
        from abc import ABC, abstractmethod
        from dataclasses import dataclass
        from enum import StrEnum

        from .shipment import Shipment


        class IssueType(StrEnum):
            MISSING = "missing"
            INVALID = "invalid"
            AMBIGUOUS = "ambiguous"


        @dataclass(frozen=True)
        class ValidationIssue:
            field: str
            issue_type: IssueType


        class ShipmentValidator(ABC):
            def __init__(self) -> None:
                self.issues: list[ValidationIssue] = []

            @abstractmethod
            def validate(self, shipment: Shipment) -> None: ...

            def _add_issue(self, field: str, issue_type: IssueType) -> None:
                self.issues.append(ValidationIssue(field, issue_type))
    expected_output:
      outcome: valid
  - name: raises the reported issue limit
    inputs:
      file: shipments/shipment_validator.py
      before: |
        from enum import StrEnum

        MAX_REPORTED_ISSUES = 50


        class IssueType(StrEnum):
            MISSING = "missing"
            INVALID = "invalid"
      after: |
        from enum import StrEnum

        MAX_REPORTED_ISSUES = 100


        class IssueType(StrEnum):
            MISSING = "missing"
            INVALID = "invalid"
    expected_output:
      outcome: skipped
