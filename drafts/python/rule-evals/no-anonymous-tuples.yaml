  - name: implements divmod for money
    inputs:
      file: billing/money.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Money:
            cents: int

            def __divmod__(self, parts: int) -> tuple["Money", "Money"]:
                share, left_over = divmod(self.cents, parts)
                return Money(share), Money(left_over)
    expected_output:
      outcome: valid
  - name: returns a Django template context
    inputs:
      file: shop/views.py
      after: |
        from django.views.generic import TemplateView

        from shop.models import Order


        class OrderListView(TemplateView):
            template_name = "shop/orders.html"

            def get_context_data(self, **kwargs):
                orders = Order.objects.filter(customer=self.request.user)
                return {**super().get_context_data(**kwargs), "orders": orders, "count": orders.count()}
    expected_output:
      outcome: valid
  - name: returns a total and a late flag from a SQLAlchemy query
    inputs:
      file: billing/queries.py
      after: |
        from datetime import date

        from sqlalchemy import func, select
        from sqlalchemy.orm import Session

        from billing.models import Invoice


        def customer_balance(session: Session, customer_id: int, today: date):
            open_invoices = select(Invoice).where(Invoice.customer_id == customer_id, Invoice.paid.is_(False))
            invoices = session.scalars(open_invoices).all()
            total_cents = sum(invoice.amount_cents for invoice in invoices)
            any_late = any(invoice.due_on < today for invoice in invoices)
            return total_cents, any_late
    expected_output:
      outcome: invalid
