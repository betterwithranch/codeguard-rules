  - name: returns the order's hold reasons as a tuple
    inputs:
      file: orders/review.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            order_id: str
            holds: tuple[str, ...]
            balance_due: int


        def hold_reasons(order: Order) -> tuple[str, ...]:
            reasons = tuple(order.holds)
            if order.balance_due > 0:
                reasons += ("unpaid balance",)
            return reasons
    expected_output:
      outcome: valid
  - name: returns a fee and a delivery date in a dict
    inputs:
      file: shipments/quotes.py
      after: |
        from dataclasses import dataclass
        from datetime import date, timedelta


        @dataclass(frozen=True)
        class Parcel:
            weight_grams: int
            express: bool


        def quote(parcel: Parcel, today: date) -> dict[str, object]:
            fee_cents = 500 + parcel.weight_grams // 100
            delivers_on = today + timedelta(days=1 if parcel.express else 3)
            return {"fee_cents": fee_cents, "delivers_on": delivers_on}
    expected_output:
      outcome: invalid
