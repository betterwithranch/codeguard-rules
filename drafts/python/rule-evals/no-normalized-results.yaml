cases:
  - name: blanks fields with dataclasses.replace before comparing
    inputs:
      file: tests/test_orders.py
      after: |
        import dataclasses
        from decimal import Decimal

        from shop.orders import Order, OrderStatus, place_order


        def test_place_order_creates_a_pending_order(customer):
            order = place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            actual = dataclasses.replace(order, id=None, created_at=None)
            assert actual == Order(
                id=None,
                customer_id=customer.id,
                sku="BOOK-1",
                quantity=2,
                total=Decimal("25.00"),
                status=OrderStatus.PENDING,
                created_at=None,
            )
    expected_output:
      outcome: invalid
  - name: compares a dump that excludes fields
    inputs:
      file: tests/test_invoices.py
      before: |
        from decimal import Decimal

        from billing.invoices import issue_invoice


        def test_issue_invoice_sets_amount_and_currency(account):
            invoice = issue_invoice(account_id=account.id, amount=Decimal("120.00"))

            assert invoice.amount == Decimal("120.00")
            assert invoice.currency == "USD"
      after: |
        from decimal import Decimal

        from billing.invoices import issue_invoice


        def test_issue_invoice_sets_amount_and_currency(account):
            invoice = issue_invoice(account_id=account.id, amount=Decimal("120.00"))

            actual = invoice.model_dump(exclude={"id", "issued_at"})
            assert actual == {
                "account_id": account.id,
                "amount": Decimal("120.00"),
                "currency": "USD",
            }
    expected_output:
      outcome: invalid
  - name: asserts each field against a frozen clock
    inputs:
      file: tests/test_orders.py
      after: |
        from datetime import datetime
        from decimal import Decimal

        from shop.orders import OrderStatus, place_order


        def test_place_order_creates_a_pending_order(customer, frozen_clock):
            frozen_clock.set(datetime(2026, 3, 1, 9, 30))

            order = place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert order.customer_id == customer.id
            assert order.sku == "BOOK-1"
            assert order.quantity == 2
            assert order.total == Decimal("25.00")
            assert order.status == OrderStatus.PENDING
            assert order.created_at == datetime(2026, 3, 1, 9, 30)
    expected_output:
      outcome: valid
  - name: changes the issued invoice amount
    inputs:
      file: tests/test_invoices.py
      before: |
        from decimal import Decimal

        from billing.invoices import issue_invoice


        def test_issue_invoice_sets_amount_and_currency(account):
            invoice = issue_invoice(account_id=account.id, amount=Decimal("120.00"))

            assert invoice.amount == Decimal("120.00")
            assert invoice.currency == "USD"
      after: |
        from decimal import Decimal

        from billing.invoices import issue_invoice


        def test_issue_invoice_sets_amount_and_currency(account):
            invoice = issue_invoice(account_id=account.id, amount=Decimal("95.50"))

            assert invoice.amount == Decimal("95.50")
            assert invoice.currency == "USD"
    expected_output:
      outcome: skipped
