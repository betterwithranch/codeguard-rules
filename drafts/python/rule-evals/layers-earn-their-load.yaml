- name: declares a protocol with a method two token sources implement
  inputs:
    file: carriers/client.py
    unchanged:
      config/settings.py: |
        from pydantic_settings import BaseSettings


        class Settings(BaseSettings):
            database_url: str
            carrier_base_url: str
            carrier_timeout_seconds: int
            carrier_retries: int
            smtp_host: str
            debug: bool = False
      carriers/tokens.py: |
        import httpx


        class StaticTokens:
            def __init__(self, carrier_base_url: str, token: str) -> None:
                self.carrier_base_url = carrier_base_url
                self._token = token

            def access_token(self) -> str:
                return self._token


        class OAuthTokens:
            def __init__(self, carrier_base_url: str, client_id: str, secret: str) -> None:
                self.carrier_base_url = carrier_base_url
                self._client_id = client_id
                self._secret = secret

            def access_token(self) -> str:
                response = httpx.post(
                    f"{self.carrier_base_url}/oauth/token",
                    data={"client_id": self._client_id, "client_secret": self._secret},
                )
                return response.json()["access_token"]
    after: |
      from typing import Protocol

      import httpx


      class TokenSource(Protocol):
          carrier_base_url: str

          def access_token(self) -> str: ...


      def carrier_client(tokens: TokenSource) -> httpx.Client:
          return httpx.Client(
              base_url=tokens.carrier_base_url,
              headers={"Authorization": f"Bearer {tokens.access_token()}"},
          )
  expected_output:
    outcome: valid
