- name: declares a generic reader protocol with a method two sources implement
  inputs:
    file: imports/readers.py
    after: |
      from typing import Iterator, Protocol, TypeVar

      T_co = TypeVar("T_co", covariant=True)


      class RowSource(Protocol[T_co]):
          source_name: str

          def rows(self) -> Iterator[T_co]: ...


      def count_rows(source: RowSource[object]) -> int:
          return sum(1 for _ in source.rows())
    unchanged:
      imports/sources.py: |
        import csv
        from collections.abc import Iterator

        import httpx


        class CsvRowSource:
            def __init__(self, path: str) -> None:
                self.source_name = path
                self._path = path

            def rows(self) -> Iterator[dict[str, str]]:
                with open(self._path, newline="") as handle:
                    yield from csv.DictReader(handle)


        class ApiRowSource:
            def __init__(self, url: str) -> None:
                self.source_name = url
                self._url = url

            def rows(self) -> Iterator[dict[str, str]]:
                yield from httpx.get(self._url).json()["rows"]
  expected_output:
    outcome: valid
