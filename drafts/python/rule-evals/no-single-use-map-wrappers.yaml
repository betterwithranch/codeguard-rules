        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str


        def label(shipment: Shipment) -> str:
            return f"{shipment.carrier}:{shipment.tracking_number}"


        def labels_for(shipments: list[Shipment]) -> list[str]:
            return [label(shipment) for shipment in shipments]
    expected_output:
      outcome: invalid
  - name: adds a public map wrapper that two other modules call
    inputs:
      file: shipments/labels.py
      unchanged:
        shipments/dispatch.py: |
          from shipments.labels import Shipment, labels_for


          def dispatch(shipments: list[Shipment]) -> str:
              return "\n".join(labels_for(shipments))
        shipments/manifest.py: |
          from shipments.labels import Shipment, labels_for


          def manifest(shipments: list[Shipment]) -> str:
              return ", ".join(sorted(labels_for(shipments)))
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str


        def label(shipment: Shipment) -> str:
            return f"{shipment.carrier}:{shipment.tracking_number}"


        def labels_for(shipments: list[Shipment]) -> list[str]:
            return [label(shipment) for shipment in shipments]
    expected_output:
      outcome: valid
  - name: wraps a dict comprehension of totals used once
    inputs:
      file: billing/statements.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            number: str
            amount_cents: int
            tax_cents: int


        def invoice_total(invoice: Invoice) -> int:
            return invoice.amount_cents + invoice.tax_cents


        def _totals_by_number(invoices: list[Invoice]) -> dict[str, int]:
            return {invoice.number: invoice_total(invoice) for invoice in invoices}


        def statement(invoices: list[Invoice]) -> str:
            totals = _totals_by_number(invoices)
            return "\n".join(f"{number}: {total}" for number, total in totals.items())
    expected_output:
      outcome: invalid
  - name: maps a method over shipments in a method used once
    inputs:
      file: shipments/printer.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str


        class LabelPrinter:
            def label(self, shipment: Shipment) -> str:
                return f"{shipment.carrier}:{shipment.tracking_number}"

            def _labels(self, shipments: list[Shipment]) -> list[str]:
                return [self.label(shipment) for shipment in shipments]

            def print_batch(self, shipments: list[Shipment]) -> str:
                return "\n".join(self._labels(shipments))
    expected_output:
      outcome: invalid
  - name: wraps list of map used once
    inputs:
      file: shipments/dispatch.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str


        def label(shipment: Shipment) -> str:
            return f"{shipment.carrier}:{shipment.tracking_number}"


        def _labels(shipments: list[Shipment]) -> list[str]:
            return list(map(label, shipments))


        def dispatch(shipments: list[Shipment]) -> str:
            return "\n".join(_labels(shipments))
    expected_output:
      outcome: invalid
  - name: implements a protocol method by mapping
    inputs:
      file: shipments/printer.py
      unchanged:
        shipments/ports.py: |
          from typing import Protocol

          from shipments.models import Shipment


          class Labeler(Protocol):
              def labels(self, shipments: list[Shipment]) -> list[str]: ...
        shipments/models.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Shipment:
              carrier: str
              tracking_number: str
      after: |
        from shipments.models import Shipment
        from shipments.ports import Labeler


        class PlainLabeler(Labeler):
            def label(self, shipment: Shipment) -> str:
                return f"{shipment.carrier}:{shipment.tracking_number}"

            def labels(self, shipments: list[Shipment]) -> list[str]:
                return [self.label(shipment) for shipment in shipments]
    expected_output:
      outcome: valid
  - name: builds labels inside a longer function
    inputs:
      file: shipments/dispatch.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str


        def label(shipment: Shipment) -> str:
            return f"{shipment.carrier}:{shipment.tracking_number}"


        def dispatch(shipments: list[Shipment]) -> str:
            labels = [label(shipment) for shipment in shipments]
            return "\n".join(labels)
    expected_output:
      outcome: skipped
  - name: changes the label separator
    inputs:
      file: shipments/dispatch.py
      before: |
        def label(carrier: str, tracking_number: str) -> str:
            return f"{carrier}:{tracking_number}"
      after: |
        def label(carrier: str, tracking_number: str) -> str:
            return f"{carrier}/{tracking_number}"
    expected_output:
      outcome: skipped
