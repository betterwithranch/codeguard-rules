cases:
  - name: wraps a label comprehension used once
    inputs:
      file: shipments/dispatch.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str


        def label(shipment: Shipment) -> str:
            return f"{shipment.carrier}:{shipment.tracking_number}"


        def _labels(shipments: list[Shipment]) -> list[str]:
            return [label(shipment) for shipment in shipments]


        def dispatch(shipments: list[Shipment]) -> str:
            return "\n".join(_labels(shipments))
    expected_output:
      outcome: invalid
  - name: wraps a label comprehension used twice
    inputs:
      file: shipments/dispatch.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str


        def label(shipment: Shipment) -> str:
            return f"{shipment.carrier}:{shipment.tracking_number}"


        def _labels(shipments: list[Shipment]) -> list[str]:
            return [label(shipment) for shipment in shipments]


        def dispatch(shipments: list[Shipment]) -> str:
            return "\n".join(_labels(shipments))


        def manifest(shipments: list[Shipment]) -> str:
            return ", ".join(sorted(_labels(shipments)))
    expected_output:
      outcome: valid
  - name: wraps a filtering comprehension used once
    inputs:
      file: shipments/dispatch.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str
            cancelled: bool


        def label(shipment: Shipment) -> str:
            return f"{shipment.carrier}:{shipment.tracking_number}"


        def _live_labels(shipments: list[Shipment]) -> list[str]:
            return [label(shipment) for shipment in shipments if not shipment.cancelled]


        def dispatch(shipments: list[Shipment]) -> str:
            return "\n".join(_live_labels(shipments))
    expected_output:
      outcome: valid
  - name: wraps a comprehension that formats inline and is used once
    inputs:
      file: shipments/dispatch.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            carrier: str
            tracking_number: str


        def _labels(shipments: list[Shipment]) -> list[str]:
            return [f"{shipment.carrier.upper()}:{shipment.tracking_number}" for shipment in shipments]


        def dispatch(shipments: list[Shipment]) -> str:
            return "\n".join(_labels(shipments))
    expected_output:
      outcome: valid
  - name: adds a public map wrapper that one other module calls
