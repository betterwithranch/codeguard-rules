        from orders.checkout import Checkout
        from tests.fakes import FakePaymentGateway


        class FlaggingPaymentGateway(FakePaymentGateway):
            was_charged = False

            def charge(self, order_id, amount):
                self.was_charged = True
                return super().charge(order_id, amount)


        def test_checkout_charges_the_order():
            gateway = FlaggingPaymentGateway()

            Checkout(gateway).pay(order_id="ord-1", amount=120)

            assert gateway.was_charged
