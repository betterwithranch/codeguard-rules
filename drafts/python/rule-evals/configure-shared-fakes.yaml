        from orders.checkout import Checkout
        from tests.fakes import FakePaymentGateway


        class DecliningPaymentGateway(FakePaymentGateway):
            def __init__(self):
                super().__init__(responses={"charge": "declined"})


        def test_checkout_marks_order_unpaid_when_charge_declined():
            gateway = DecliningPaymentGateway()

            result = Checkout(gateway).pay(order_id="ord-1", amount=120)

            assert result == "unpaid"
            assert gateway.charges == [("ord-1", 120)]
