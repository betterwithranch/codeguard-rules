# yaml-language-server: $schema=rule-eval-schema.json
cases:
  - name: overrides enqueue to assert database state
    inputs:
      file: tests/test_order_submitter.py
      after: |
        from orders.models import Order
        from orders.submitter import OrderSubmitter
        from tests.fakes import FakeQueue


        class CheckingFakeQueue(FakeQueue):
            def __init__(self, db):
                super().__init__()
                self._db = db

            def enqueue(self, queue_name, message):
                assert self._db.count_orders(message["order_id"]) == 1
                return super().enqueue(queue_name, message)


        def test_submit_saves_order_before_enqueue(order_db):
            queue = CheckingFakeQueue(order_db)

            OrderSubmitter(queue, order_db).submit(Order(id="ord-1", total=120))

            assert [message.body for message in queue.drain("orders")] == [{"order_id": "ord-1"}]
    expected_output:
      outcome: invalid
  - name: overrides send to record calls
    inputs:
      file: tests/test_invoice_notifier.py
      before: |
        from billing.notifier import InvoiceNotifier
        from tests.fakes import FakeMailer


        def test_notify_mails_customer():
            mailer = FakeMailer()

            InvoiceNotifier(mailer).notify(invoice_id="inv-42", email="ada@example.com")

            assert mailer.outbox == [("ada@example.com", "Invoice inv-42")]
      after: |
        from billing.notifier import InvoiceNotifier
        from tests.fakes import FakeMailer


        class RecordingFakeMailer(FakeMailer):
            def __init__(self):
                super().__init__()
                self.send_calls = []

            def send(self, to, subject):
                self.send_calls.append(to)
                return super().send(to, subject)


        def test_notify_mails_customer():
            mailer = FakeMailer()

            InvoiceNotifier(mailer).notify(invoice_id="inv-42", email="ada@example.com")

            assert mailer.outbox == [("ada@example.com", "Invoice inv-42")]


        def test_notify_sends_once():
            mailer = RecordingFakeMailer()

            InvoiceNotifier(mailer).notify(invoice_id="inv-43", email="ada@example.com")

            assert mailer.send_calls == ["ada@example.com"]
    expected_output:
      outcome: invalid
  - name: subclasses a fake to configure responses
    inputs:
      file: tests/test_checkout.py
      after: |
        from orders.checkout import Checkout
        from tests.fakes import FakePaymentGateway


        class DecliningPaymentGateway(FakePaymentGateway):
            def __init__(self):
                super().__init__(responses={"charge": "declined"})


        def test_checkout_marks_order_unpaid_when_charge_declined():
            gateway = DecliningPaymentGateway()

            result = Checkout(gateway).pay(order_id="ord-1", amount=120)

            assert result == "unpaid"
            assert gateway.charges == [("ord-1", 120)]
    expected_output:
      outcome: valid
  - name: changes the invoice id
    inputs:
      file: tests/test_invoice_notifier.py
      before: |
        from billing.notifier import InvoiceNotifier
        from tests.fakes import FakeMailer


        def test_notify_mails_customer():
            mailer = FakeMailer()

            InvoiceNotifier(mailer).notify(invoice_id="inv-42", email="ada@example.com")

            assert mailer.outbox == [("ada@example.com", "Invoice inv-42")]
      after: |
        from billing.notifier import InvoiceNotifier
        from tests.fakes import FakeMailer


        def test_notify_mails_customer():
            mailer = FakeMailer()

            InvoiceNotifier(mailer).notify(invoice_id="inv-7", email="ada@example.com")

            assert mailer.outbox == [("ada@example.com", "Invoice inv-7")]
    expected_output:
      outcome: skipped
