        from orders.models import Order
        from orders.submitter import OrderSubmitter
        from tests.fakes import FakeQueue


        class StatusCheckingQueue(FakeQueue):
            def enqueue(self, queue_name, message):
                self.status_at_enqueue = Order.objects.get(id=message["order_id"]).status
                return super().enqueue(queue_name, message)


        def test_submit_marks_order_submitted_before_enqueue(db):
            order = Order.objects.create(id="ord-1", total=120)
            queue = StatusCheckingQueue()

            OrderSubmitter(queue).submit(order)

            assert queue.status_at_enqueue == "submitted"
