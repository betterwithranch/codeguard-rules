cases:
  - name: overrides enqueue to assert database state
    inputs:
      file: tests/test_order_submitter.py
      unchanged:
        tests/fakes.py: |
          from decimal import Decimal


          class FakeQueue:
              def __init__(self):
                  self.messages = {}

              def enqueue(self, queue_name, message):
                  self.messages.setdefault(queue_name, []).append(message)

              def drain(self, queue_name):
                  return self.messages.pop(queue_name, [])


          class FakeMailer:
              def __init__(self):
                  self.outbox = []

              def send(self, to, subject):
                  self.outbox.append((to, subject))


          class FakeRates:
              def __init__(self, rates=None):
                  self.rates = rates or {}

              def fetch_rate(self, currency):
                  return self.rates[currency]


          class FakePaymentGateway:
              def __init__(self, responses=None):
                  self.responses = responses or {}
                  self.charges = []

              def charge(self, order_id, amount):
                  self.charges.append((order_id, amount))
                  return self.responses.get("charge", "approved")

              async def refund(self, order_id):
                  return "refunded"
      after: |
        from orders.models import Order
        from orders.submitter import OrderSubmitter
        from tests.fakes import FakeQueue


        class CheckingFakeQueue(FakeQueue):
            def __init__(self, db):
                super().__init__()
                self._db = db

            def enqueue(self, queue_name, message):
                assert self._db.count_orders(message["order_id"]) == 1
                return super().enqueue(queue_name, message)


        def test_submit_saves_order_before_enqueue(order_db):
            queue = CheckingFakeQueue(order_db)

            OrderSubmitter(queue, order_db).submit(Order(id="ord-1", total=120))

            assert queue.drain("orders") == [{"order_id": "ord-1"}]
    expected_output:
      outcome: invalid
