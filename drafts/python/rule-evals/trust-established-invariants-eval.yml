id: trust-established-invariants
invalid:
- file: shipping/pickup.py
  after: |
    from dataclasses import dataclass

    from .carrier import Carrier, PickupWindow


    class MissingCarrierError(Exception):
        pass


    @dataclass(frozen=True)
    class Shipment:
        id: str
        carrier: Carrier | None


    def schedule_pickup(shipment: Shipment) -> PickupWindow:
        if shipment.carrier is None:
            raise MissingCarrierError(shipment.id)
        assert shipment.carrier is not None
        return shipment.carrier.next_pickup_window()
- file: payments/refunds.py
  before: |
    from .payment import PaymentKind, PaymentRequest, PaymentResult, RefundPayload


    class RefundHandler:
        def handle(self, request: PaymentRequest[RefundPayload]) -> PaymentResult:
            return PaymentResult(refunded_cents=request.payload.amount_cents)


    HANDLERS = {PaymentKind.REFUND: RefundHandler()}


    def dispatch(request: PaymentRequest) -> PaymentResult:
        return HANDLERS[request.kind].handle(request)
  after: |
    from .payment import PaymentKind, PaymentRequest, PaymentResult, RefundPayload


    class RefundHandler:
        def handle(self, request: PaymentRequest[RefundPayload]) -> PaymentResult:
            if not isinstance(request.payload, RefundPayload):
                raise TypeError("RefundHandler requires a refund payload")
            return PaymentResult(refunded_cents=request.payload.amount_cents)


    HANDLERS = {PaymentKind.REFUND: RefundHandler()}


    def dispatch(request: PaymentRequest) -> PaymentResult:
        return HANDLERS[request.kind].handle(request)
valid:
- file: payments/refunds.py
  after: |
    from .payment import PaymentKind, PaymentRequest, PaymentResult, RefundPayload


    class UnknownPaymentKindError(Exception):
        pass


    class RefundHandler:
        def handle(self, request: PaymentRequest[RefundPayload]) -> PaymentResult:
            return PaymentResult(refunded_cents=request.payload.amount_cents)


    HANDLERS = {PaymentKind.REFUND: RefundHandler()}


    def dispatch(request: PaymentRequest) -> PaymentResult:
        handler = HANDLERS.get(request.kind)
        if handler is None:
            raise UnknownPaymentKindError(request.kind)
        return handler.handle(request)
