cases:
  - name: names an argument group a request
    inputs:
      file: pricing/price_calculator.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class PriceCalculationRequest:
            base_cents: int
            quantity: int
            discount_percent: int


        class PriceCalculator:
            def calculate(self, request: PriceCalculationRequest) -> int:
                subtotal = request.base_cents * request.quantity
                return subtotal * (100 - request.discount_percent) // 100
    expected_output:
      outcome: invalid
  - name: takes an order create model as a FastAPI request body
    inputs:
      file: orders/routes.py
      after: |
        from fastapi import APIRouter
        from pydantic import BaseModel

        from .service import OrderService

        router = APIRouter()


        class OrderCreate(BaseModel):
            customer_id: int
            sku: str
            quantity: int


        @router.post("/orders")
        def create_order(body: OrderCreate, service: OrderService) -> dict[str, int]:
            order = service.place(body.customer_id, body.sku, body.quantity)
            return {"id": order.id}
    expected_output:
      outcome: valid
  - name: passes an order create dataclass between services
    inputs:
      file: orders/service.py
      after: |
        from dataclasses import dataclass

        from .models import Order
        from .repository import OrderRepository


        @dataclass(frozen=True)
        class OrderCreate:
            customer_id: int
            sku: str
            quantity: int


        class OrderService:
            def __init__(self, orders: OrderRepository) -> None:
                self._orders = orders

            def place(self, data: OrderCreate) -> Order:
                order = Order(customer_id=data.customer_id, sku=data.sku, quantity=data.quantity)
                return self._orders.save(order)

            def reorder(self, previous: Order) -> Order:
                return self.place(
                    OrderCreate(previous.customer_id, previous.sku, previous.quantity)
                )
    expected_output:
      outcome: invalid
  - name: sends a quote request payload to the carrier API
    inputs:
      file: carriers/quotes.py
      after: |
        import httpx
        from pydantic import BaseModel


        class ShipmentQuoteRequest(BaseModel):
            origin_postcode: str
            destination_postcode: str
            weight_grams: int


        class CarrierQuotes:
            def __init__(self, http: httpx.Client) -> None:
                self._http = http

            def quote_cents(self, request: ShipmentQuoteRequest) -> int:
                response = self._http.post("/v2/quotes", json=request.model_dump())
                response.raise_for_status()
                return int(response.json()["price_cents"])
    expected_output:
      outcome: valid
  - name: adds a create invoice command handled in process
    inputs:
      file: invoices/commands.py
      before: |
        from .invoice import Invoice


        def issue_invoice(order_id: int, total_cents: int) -> Invoice:
            return Invoice(order_id=order_id, total_cents=total_cents)
      after: |
        from dataclasses import dataclass

        from .invoice import Invoice


        @dataclass(frozen=True)
        class CreateInvoice:
            order_id: int
            total_cents: int


        def issue_invoice(command: CreateInvoice) -> Invoice:
            return Invoice(order_id=command.order_id, total_cents=command.total_cents)
    expected_output:
      outcome: invalid
  - name: validates an address update with a DRF serializer
    inputs:
      file: accounts/serializers.py
      after: |
        from rest_framework import serializers


        class AddressUpdate(serializers.Serializer):
            street = serializers.CharField(max_length=200)
            city = serializers.CharField(max_length=100)
            postcode = serializers.CharField(max_length=10)
    expected_output:
      outcome: valid
  - name: builds a report request typed dict for a local renderer
    inputs:
      file: reports/render.py
      unchanged:
        reports/renderer.py: |
          from reports.render import ReportRequest


          def render(request: ReportRequest) -> str:
              return f"{request['title']} ({request['month']})"
      after: |
        from typing import TypedDict


        class ReportRequest(TypedDict):
            title: str
            month: str
    expected_output:
      outcome: invalid
  - name: publishes a stock update message to the broker
    inputs:
      file: inventory/events.py
      after: |
        from dataclasses import asdict, dataclass

        from .broker import Broker


        @dataclass(frozen=True)
        class StockUpdate:
            sku: str
            on_hand: int


        def announce(broker: Broker, sku: str, on_hand: int) -> None:
            broker.publish("inventory.stock", asdict(StockUpdate(sku=sku, on_hand=on_hand)))
    expected_output:
      outcome: valid
  - name: builds a refund request with namedtuple for a local function
    inputs:
      file: payments/refunds.py
      after: |
        from collections import namedtuple

        RefundRequest = namedtuple("RefundRequest", ["charge_id", "amount_cents"])


        def refund_total(requests: list[RefundRequest]) -> int:
            return sum(request.amount_cents for request in requests)


        def refund_all(charges: dict[str, int]) -> int:
            return refund_total([RefundRequest(charge_id, cents) for charge_id, cents in charges.items()])
    expected_output:
      outcome: invalid
