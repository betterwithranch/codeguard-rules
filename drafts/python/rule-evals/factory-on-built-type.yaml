  - name: validates a quote response with the model's own validator in a service
    inputs:
      file: quoting/services.py
      after: |
        import requests

        from quoting.models import Quote


        class QuoteService:
            def __init__(self, base_url: str) -> None:
                self._base_url = base_url

            def quote(self, cart_id: str) -> Quote:
                response = requests.get(f"{self._base_url}/quotes/{cart_id}", timeout=5)
                return Quote.model_validate(response.json())
    expected_output:
      outcome: valid
  - name: adds two money values on the money type
    inputs:
      file: billing/money.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Money:
            cents: int
            currency: str

            def __add__(self, other: "Money") -> "Money":
                return Money(cents=self.cents + other.cents, currency=self.currency)
    expected_output:
      outcome: valid
  - name: copies an order with a new status
    inputs:
      file: orders/transitions.py
      after: |
        from dataclasses import replace

        from orders.models import Order, OrderStatus


        def mark_shipped(order: Order) -> Order:
            return replace(order, status=OrderStatus.SHIPPED)
