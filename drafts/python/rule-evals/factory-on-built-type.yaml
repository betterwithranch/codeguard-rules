  - name: maps orders to shipments in a dedicated mapper class
    inputs:
      file: orders/shipping_mapping.py
      after: |
        from orders.models import Order
        from shipping.models import Parcel, Shipment


        class OrderShipmentMapper:
            def shipment(self, order: Order) -> Shipment:
                return Shipment(
                    order_id=order.id,
                    address=order.address,
                    parcels=self.parcels(order),
                )

            def parcels(self, order: Order) -> list[Parcel]:
                return [Parcel(sku=line.sku, weight_grams=line.weight_grams) for line in order.lines]
      unchanged:
        shipping/models.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Parcel:
              sku: str
              weight_grams: int


          @dataclass(frozen=True)
          class Shipment:
              order_id: str
              address: str
              parcels: list[Parcel]
    expected_output:
      outcome: valid
  - name: builds a tracking event from a webhook body inline in a view
    inputs:
      file: tracking/views.py
      after: |
        import json
        from datetime import datetime

        from django.http import HttpRequest, HttpResponse

        from tracking.models import TrackingEvent
        from tracking.repository import events


        def acme_webhook(request: HttpRequest) -> HttpResponse:
            body = json.loads(request.body)
            raw = body["events"][-1]
            event = TrackingEvent(location=raw["loc"], occurred_at=datetime.fromisoformat(raw["ts"]))
            events.add(event)
            return HttpResponse(status=204)
      unchanged:
        tracking/models.py: |
          from dataclasses import dataclass
          from datetime import datetime


          @dataclass(frozen=True)
          class TrackingEvent:
              location: str
              occurred_at: datetime
    expected_output:
      outcome: invalid
  - name: translates carrier payloads in the carrier's client module
    inputs:
      file: carriers/acme.py
      after: |
        from datetime import datetime
        from typing import Any

        import requests

        from tracking.models import TrackingEvent


        class AcmeClient:
            def __init__(self, base_url: str) -> None:
                self._base_url = base_url

            def latest_event(self, tracking_number: str) -> TrackingEvent:
                response = requests.get(f"{self._base_url}/track/{tracking_number}", timeout=5)
                return event_from_payload(response.json())


        def event_from_payload(payload: dict[str, Any]) -> TrackingEvent:
            raw = payload["events"][-1]
            return TrackingEvent(location=raw["loc"], occurred_at=datetime.fromisoformat(raw["ts"]))
      unchanged:
        tracking/models.py: |
          from dataclasses import dataclass
          from datetime import datetime


          @dataclass(frozen=True)
          class TrackingEvent:
              location: str
              occurred_at: datetime
    expected_output:
      outcome: valid
  - name: hands a webhook body to the carrier mapper from a view
    inputs:
      file: tracking/views.py
      after: |
        import json

        from django.http import HttpRequest, HttpResponse

        from carriers import acme
        from tracking.repository import events


        def acme_webhook(request: HttpRequest) -> HttpResponse:
            event = acme.event_from_payload(json.loads(request.body))
            events.add(event)
            return HttpResponse(status=204)
    expected_output:
      outcome: valid
  - name: builds report lines in a nested function of a report task
    inputs:
      file: reports/tasks.py
      after: |
        from reports.models import ReportLine
        from reports.store import ReportStore


        def nightly_report(store: ReportStore, rows: list[dict[str, str]]) -> None:
            def to_line(row: dict[str, str]) -> ReportLine:
                return ReportLine(sku=row["sku"], units=int(row["units"]))

            store.save([to_line(row) for row in rows])
      unchanged:
        reports/models.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class ReportLine:
              sku: str
              units: int
    expected_output:
      outcome: invalid
