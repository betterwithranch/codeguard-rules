  - name: caches handlers built by the handler's own constructor
    inputs:
      file: app/logging_setup.py
      after: |
        from app.handlers import Handler

        _handlers: dict[str, Handler] = {}


        def handler_for(name: str) -> Handler:
            if name not in _handlers:
                _handlers[name] = Handler.for_name(name.lower())
            return _handlers[name]
      unchanged:
        app/handlers.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Handler:
              name: str
              level: str

              @classmethod
              def for_name(cls, name: str) -> "Handler":
                  return cls(name=name, level="debug" if name.startswith("dev") else "info")
    expected_output:
      outcome: valid
