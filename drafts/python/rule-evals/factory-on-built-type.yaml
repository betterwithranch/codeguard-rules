cases:
  - name: builds a shipment from an imported order in a module function
    inputs:
      file: shipments/shipment.py
      unchanged:
        orders/order.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Order:
              number: str
              shipping_address: str
              total_weight_kg: float
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            order_number: str
            destination: str
            weight_kg: float
      after: |
        from dataclasses import dataclass

        from orders.order import Order


        @dataclass(frozen=True)
        class Shipment:
            order_number: str
            destination: str
            weight_kg: float


        def make_shipment(order: Order) -> Shipment:
            return Shipment(
                order_number=order.number,
                destination=order.shipping_address,
                weight_kg=order.total_weight_kg,
            )
    expected_output:
      outcome: invalid
  - name: builds a shipment from an order in a staticmethod on the shipment
    inputs:
      file: shipments/shipment.py
      unchanged:
        orders/order.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Order:
              number: str
              shipping_address: str
              total_weight_kg: float
      after: |
        from dataclasses import dataclass

        from orders.order import Order


        @dataclass(frozen=True)
        class Shipment:
            order_number: str
            destination: str
            weight_kg: float

            @staticmethod
            def from_order(order: Order) -> "Shipment":
                return Shipment(
                    order_number=order.number,
                    destination=order.shipping_address,
                    weight_kg=order.total_weight_kg,
                )
    expected_output:
      outcome: valid
  - name: builds a shipment in a staticmethod of a planner
    inputs:
      file: shipments/planning.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            shipping_address: str


        @dataclass(frozen=True)
        class Shipment:
            order_number: str
            destination: str


        class ShipmentPlanner:
            def __init__(self, orders: list[Order]) -> None:
                self._orders = orders

            def plan(self) -> list[Shipment]:
                return [self.shipment_for(order) for order in self._orders]

            @staticmethod
            def shipment_for(order: Order) -> Shipment:
                return Shipment(order_number=order.number, destination=order.shipping_address)
    expected_output:
      outcome: invalid
  - name: builds a list of shipments from orders in a module function
    inputs:
      file: shipments/planning.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            shipping_address: str


        @dataclass(frozen=True)
        class Shipment:
            order_number: str
            destination: str


        def shipments_for(orders: list[Order]) -> list[Shipment]:
            return [
                Shipment(order_number=order.number, destination=order.shipping_address)
                for order in orders
            ]
    expected_output:
      outcome: valid
  - name: validates a pydantic quote in a module function
    inputs:
      file: carriers/quotes.py
      after: |
        import json

        from pydantic import BaseModel


        class Quote(BaseModel):
            carrier: str
            amount_cents: int


        def parse_quote(body: str) -> Quote:
            return Quote.model_validate(json.loads(body))
    expected_output:
      outcome: invalid
  - name: builds a third-party rate request in a module function
    inputs:
      file: carriers/quotes.py
      after: |
        from dataclasses import dataclass

        from shipping_sdk import RateRequest


        @dataclass(frozen=True)
        class Parcel:
            destination_zip: str
            weight_kg: float


        def rate_request(parcel: Parcel) -> RateRequest:
            return RateRequest(to_zip=parcel.destination_zip, weight_grams=round(parcel.weight_kg * 1000))
    expected_output:
      outcome: valid
  - name: builds default settings in a function without parameters
    inputs:
      file: app/settings.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Settings:
            debug: bool
            page_size: int
            region: str


        def default_settings() -> Settings:
            return Settings(debug=False, page_size=50, region="eu-west-1")
    expected_output:
      outcome: invalid
  - name: builds an archive path in a module function
    inputs:
      file: app/archive.py
      after: |
        from pathlib import Path


        def archive_path(root: Path, order_number: str) -> Path:
            return Path(root, "archive", f"{order_number}.zip")
    expected_output:
      outcome: valid
  - name: builds scan events in a nested function
    inputs:
      file: tracking/imports.py
      after: |
        import csv
        from collections.abc import Iterable

        import attrs


        @attrs.frozen
        class ScanEvent:
            tracking_number: str
            location: str


        def scan_events(lines: Iterable[str]) -> list[ScanEvent]:
            def to_event(row: dict[str, str]) -> ScanEvent:
                return ScanEvent(tracking_number=row["tracking"], location=row["location"])

            return [to_event(row) for row in csv.DictReader(lines)]
    expected_output:
      outcome: invalid
  - name: looks up a carrier by name and raises when it is unknown
    inputs:
      file: carriers/registry.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Carrier:
            name: str
            max_weight_kg: float


        class UnknownCarrierError(Exception):
            pass


        CARRIERS = {"dhl": Carrier("dhl", 31.5), "ups": Carrier("ups", 30.0)}


        def carrier_named(name: str) -> Carrier:
            try:
                return CARRIERS[name]
            except KeyError:
                raise UnknownCarrierError(name) from None
    expected_output:
      outcome: valid
  - name: drafts a Django order in a method that ignores self
    inputs:
      file: orders/checkout.py
      after: |
        from django.db import models


        class Order(models.Model):
            customer_email = models.EmailField()
            total_cents = models.IntegerField()


        class CheckoutFlow:
            def draft_order(self, customer_email: str, total_cents: int) -> Order:
                return Order(customer_email=customer_email, total_cents=total_cents)
    expected_output:
      outcome: invalid
  - name: places a Django order and returns its id
    inputs:
      file: orders/checkout.py
      after: |
        from django.db import models


        class Order(models.Model):
            customer_email = models.EmailField()
            total_cents = models.IntegerField()


        def place_order(customer_email: str, total_cents: int) -> int:
            order = Order(customer_email=customer_email, total_cents=total_cents)
            order.save()
            return order.pk
    expected_output:
      outcome: valid
  - name: copies an order with a new status in a module function
    inputs:
      file: orders/status.py
      after: |
        from dataclasses import dataclass, replace
        from enum import StrEnum


        class OrderStatus(StrEnum):
            OPEN = "open"
            SHIPPED = "shipped"


        @dataclass(frozen=True)
        class Order:
            number: str
            status: OrderStatus


        def with_status(order: Order, status: str) -> Order:
            return replace(order, status=OrderStatus(status))
    expected_output:
      outcome: valid
  - name: builds an invoice into a local and returns it
    inputs:
      file: invoices/issue.py
      unchanged:
        invoices/models.py: |
          from dataclasses import dataclass
          from datetime import date


          @dataclass(frozen=True)
          class Invoice:
              number: str
              total_cents: int
              issued_on: date
      after: |
        from datetime import date

        from invoices.models import Invoice


        def issue_invoice(number: str, total_cents: int, today: date) -> Invoice:
            invoice = Invoice(number=number, total_cents=total_cents, issued_on=today)
            return invoice
    expected_output:
      outcome: invalid
  - name: changes a builder method that reads its own state
    inputs:
      file: invoices/builder.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total_cents: int


        class InvoiceBuilder:
            def __init__(self, number: str) -> None:
                self._number = number
                self._amounts: list[int] = []

            def build(self) -> Invoice:
                return Invoice(number=self._number, total_cents=sum(self._amounts))
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total_cents: int


        class InvoiceBuilder:
            def __init__(self, number: str) -> None:
                self._number = number
                self._amounts: list[int] = []

            def build(self) -> Invoice:
                return Invoice(number=self._number.upper(), total_cents=sum(self._amounts))
    expected_output:
      outcome: skipped
  - name: totals invoice amounts in a module function
    inputs:
      file: invoices/totals.py
      before: |
        def total_cents(amounts: list[int]) -> int:
            return sum(amounts)
      after: |
        def total_cents(amounts: list[int]) -> int:
            return sum(amount for amount in amounts if amount > 0)
    expected_output:
      outcome: skipped
