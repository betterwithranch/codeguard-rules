cases:
  - name: builds a shipment on the order type
    inputs:
      file: orders/models.py
      after: |
        from dataclasses import dataclass

        from shipping.models import Parcel, Shipment


        @dataclass(frozen=True)
        class OrderLine:
            sku: str
            weight_grams: int


        @dataclass(frozen=True)
        class Order:
            id: str
            address: str
            lines: list[OrderLine]

            def to_shipment(self) -> Shipment:
                return Shipment(
                    order_id=self.id,
                    address=self.address,
                    parcels=[Parcel(sku=line.sku, weight_grams=line.weight_grams) for line in self.lines],
                )
      unchanged:
        shipping/models.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Parcel:
              sku: str
              weight_grams: int


          @dataclass(frozen=True)
          class Shipment:
              order_id: str
              address: str
              parcels: list[Parcel]
    expected_output:
      outcome: invalid
  - name: builds a shipment in a classmethod on the shipment type
    inputs:
      file: shipping/models.py
      after: |
        from dataclasses import dataclass

        from orders.models import Order


        @dataclass(frozen=True)
        class Parcel:
            sku: str
            weight_grams: int


        @dataclass(frozen=True)
        class Shipment:
            order_id: str
            address: str
            parcels: list[Parcel]

            @classmethod
            def from_order(cls, order: Order) -> "Shipment":
                return cls(
                    order_id=order.id,
                    address=order.address,
                    parcels=[Parcel(sku=line.sku, weight_grams=line.weight_grams) for line in order.lines],
                )
    expected_output:
      outcome: valid
  - name: builds a shipment inline in a service method
    inputs:
      file: shipping/services.py
      after: |
        from orders.repository import OrderRepository
        from shipping.models import Parcel, Shipment
        from shipping.repository import ShipmentRepository


        class ShippingService:
            def __init__(self, orders: OrderRepository, shipments: ShipmentRepository) -> None:
                self._orders = orders
                self._shipments = shipments

            def ship(self, order_id: str) -> str:
                order = self._orders.get(order_id)
                shipment = Shipment(
                    order_id=order.id,
                    address=order.address,
                    parcels=[Parcel(sku=line.sku, weight_grams=line.weight_grams) for line in order.lines],
                )
                self._shipments.add(shipment)
                return shipment.order_id
      unchanged:
        shipping/models.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Parcel:
              sku: str
              weight_grams: int


          @dataclass(frozen=True)
          class Shipment:
              order_id: str
              address: str
              parcels: list[Parcel]
    expected_output:
      outcome: invalid
  - name: ships an order through the shipment's alternative constructor
    inputs:
      file: shipping/services.py
      after: |
        from orders.repository import OrderRepository
        from shipping.models import Shipment
        from shipping.repository import ShipmentRepository


        class ShippingService:
            def __init__(self, orders: OrderRepository, shipments: ShipmentRepository) -> None:
                self._orders = orders
                self._shipments = shipments

            def ship(self, order_id: str) -> str:
                shipment = Shipment.from_order(self._orders.get(order_id))
                self._shipments.add(shipment)
                return shipment.order_id
      unchanged:
        shipping/models.py: |
          from dataclasses import dataclass

          from orders.models import Order


          @dataclass(frozen=True)
          class Shipment:
              order_id: str
              address: str

              @classmethod
              def from_order(cls, order: Order) -> "Shipment":
                  return cls(order_id=order.id, address=order.address)
    expected_output:
      outcome: valid
  - name: builds a shipment in a planning module among other planning functions
    inputs:
      file: shipping/planning.py
      after: |
        from orders.models import Order
        from shipping.carriers import Carrier
        from shipping.models import Shipment


        def make_shipment(order: Order) -> Shipment:
            return Shipment(order_id=order.id, address=order.address)


        def choose_carrier(shipment: Shipment, carriers: list[Carrier]) -> Carrier:
            return min(carriers, key=lambda carrier: carrier.price_for(shipment.address))
      unchanged:
        shipping/models.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Shipment:
              order_id: str
              address: str
    expected_output:
      outcome: invalid
