cases:
  - name: branches on a Literal status alias
    inputs:
      file: orders/fulfillment.py
      after: |
        from dataclasses import dataclass
        from typing import Literal

        type OrderStatus = Literal["pending", "shipped", "cancelled"]


        @dataclass(frozen=True)
        class Order:
            number: str
            status: OrderStatus


        def next_step(order: Order) -> str:
            if order.status == "pending":
                return "pick and pack"
            if order.status == "shipped":
                return "await delivery"
            return "refund payment"
    expected_output:
      outcome: invalid
  - name: matches on a Literal status field
    inputs:
      file: orders/fulfillment.py
      before: |
        from dataclasses import dataclass
        from typing import Literal


        @dataclass(frozen=True)
        class Order:
            number: str
            status: Literal["pending", "shipped", "cancelled"]
      after: |
        from dataclasses import dataclass
        from typing import Literal


        @dataclass(frozen=True)
        class Order:
            number: str
            status: Literal["pending", "shipped", "cancelled"]


        def next_step(order: Order) -> str:
            match order.status:
                case "pending":
                    return "pick and pack"
                case "shipped":
                    return "await delivery"
                case "cancelled":
                    return "refund payment"
    expected_output:
      outcome: invalid
  - name: matches on StrEnum status members
    inputs:
      file: orders/fulfillment.py
      after: |
        from dataclasses import dataclass
        from enum import StrEnum


        class OrderStatus(StrEnum):
            PENDING = "pending"
            SHIPPED = "shipped"
            CANCELLED = "cancelled"


        @dataclass(frozen=True)
        class Order:
            number: str
            status: OrderStatus


        def next_step(order: Order) -> str:
            match order.status:
                case OrderStatus.PENDING:
                    return "pick and pack"
                case OrderStatus.SHIPPED:
                    return "await delivery"
                case OrderStatus.CANCELLED:
                    return "refund payment"
    expected_output:
      outcome: valid
  - name: tags union variants with Literals
    inputs:
      file: payments/payment_method.py
      after: |
        from dataclasses import dataclass
        from typing import Literal


        @dataclass(frozen=True)
        class CardPayment:
            kind: Literal["card"] = "card"
            last_four: str = ""


        @dataclass(frozen=True)
        class BankTransfer:
            kind: Literal["bank_transfer"] = "bank_transfer"
            iban: str = ""


        type PaymentMethod = CardPayment | BankTransfer
    expected_output:
      outcome: valid
  - name: changes the large box threshold
    inputs:
      file: orders/fulfillment.py
      before: |
        from dataclasses import dataclass
        from enum import StrEnum


        class OrderStatus(StrEnum):
            PENDING = "pending"
            SHIPPED = "shipped"


        @dataclass(frozen=True)
        class Order:
            number: str
            status: OrderStatus
            item_count: int


        def needs_large_box(order: Order) -> bool:
            return order.item_count > 5
      after: |
        from dataclasses import dataclass
        from enum import StrEnum


        class OrderStatus(StrEnum):
            PENDING = "pending"
            SHIPPED = "shipped"


        @dataclass(frozen=True)
        class Order:
            number: str
            status: OrderStatus
            item_count: int


        def needs_large_box(order: Order) -> bool:
            return order.item_count > 8
    expected_output:
      outcome: skipped
