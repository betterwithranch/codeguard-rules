  - name: tests an imported Literal mode against a tuple
    inputs:
      file: sync/runner.py
      before: |
        from sync.settings import SyncMode


        def run(mode: SyncMode) -> None:
            start(mode)
      after: |
        from sync.settings import SyncMode


        def run(mode: SyncMode) -> None:
            if mode in ("fast", "safe"):
                start(mode)
      unchanged:
        sync/settings.py: |
          from typing import Literal

          type SyncMode = Literal["fast", "safe", "off"]
    expected_output:
      outcome: invalid
  - name: dispatches pydantic events through a table keyed by Literal values
    inputs:
      file: webhooks/dispatch.py
      after: |
        from collections.abc import Callable
        from typing import Literal

        from pydantic import BaseModel


        class WebhookEvent(BaseModel):
            kind: Literal["created", "updated", "deleted"]
            object_id: str


        def on_created(event: WebhookEvent) -> None:
            print("created", event.object_id)


        def on_deleted(event: WebhookEvent) -> None:
            print("deleted", event.object_id)


        HANDLERS: dict[str, Callable[[WebhookEvent], None]] = {
            "created": on_created,
            "deleted": on_deleted,
        }


        def dispatch(event: WebhookEvent) -> None:
            HANDLERS[event.kind](event)
    expected_output:
      outcome: invalid
  - name: skips cancelled attrs orders by a Literal field
    inputs:
      file: orders/batching.py
      after: |
        from typing import Literal

        import attrs


        @attrs.frozen
        class BatchOrder:
            number: str
            status: Literal["open", "held", "cancelled"]


        def billable(orders: list[BatchOrder]) -> list[BatchOrder]:
            return [order for order in orders if order.status != "cancelled"]
    expected_output:
      outcome: invalid
  - name: tests a SQLAlchemy Literal column in a property
    inputs:
      file: accounts/models.py
      after: |
        from typing import Literal

        from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column


        class Base(DeclarativeBase):
            pass


        class Account(Base):
            __tablename__ = "accounts"

            id: Mapped[int] = mapped_column(primary_key=True)
            tier: Mapped[Literal["free", "pro", "enterprise"]] = mapped_column()

            @property
            def has_support(self) -> bool:
                return self.tier in {"pro", "enterprise"}
    expected_output:
      outcome: invalid
  - name: compares a union variant's Literal tag
    inputs:
      file: payments/payment_method.py
      after: |
        from dataclasses import dataclass
        from typing import Literal


        @dataclass(frozen=True)
        class CardPayment:
            last_four: str
            kind: Literal["card"] = "card"


        @dataclass(frozen=True)
        class BankTransfer:
            iban: str
            kind: Literal["bank_transfer"] = "bank_transfer"


        type PaymentMethod = CardPayment | BankTransfer


        def is_card(payment: PaymentMethod) -> bool:
            return payment.kind == "card"
    expected_output:
      outcome: valid
  - name: passes a Literal export format on and compares a str suffix
    inputs:
      file: exports/writer.py
      after: |
        from dataclasses import dataclass
        from pathlib import Path
        from typing import Literal

        import tablib


        @dataclass(frozen=True)
        class Export:
            path: Path
            format: Literal["csv", "json", "xlsx"]


        def write(export: Export, rows: tablib.Dataset) -> None:
            export.path.write_bytes(rows.export(export.format))


        def is_spreadsheet(path: Path) -> bool:
            return path.suffix == ".xlsx"
    expected_output:
      outcome: valid
  - name: serializes a Literal format into a payload dict
    inputs:
      file: exports/payload.py
      after: |
        from dataclasses import dataclass
        from typing import Literal


        @dataclass(frozen=True)
        class ExportRequest:
            report_id: str
            format: Literal["csv", "json"]


        def payload(request: ExportRequest) -> dict[str, str]:
            return {"report": request.report_id, "format": request.format}
    expected_output:
      outcome: valid
  - name: matches a str command name
    inputs:
      file: cli/commands.py
      after: |
        import sys


        def run(command: str) -> int:
            match command:
                case "sync":
                    return sync()
                case "report":
                    return report()
                case _:
                    print(f"unknown command {command}", file=sys.stderr)
                    return 2
    expected_output:
      outcome: valid
