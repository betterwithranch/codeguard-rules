  - name: changes the large box threshold
    inputs:
      file: orders/fulfillment.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            item_count: int


        def needs_large_box(order: Order) -> bool:
            return order.item_count > 5
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Order:
            number: str
            item_count: int


        def needs_large_box(order: Order) -> bool:
            return order.item_count > 8
    expected_output:
      outcome: skipped
  - name: tests a mode against a tuple of enum members
    inputs:
      file: sync/runner.py
      before: |
        from sync.settings import SyncMode


        def run(mode: SyncMode) -> None:
            start(mode)
      after: |
        from sync.settings import SyncMode


        def run(mode: SyncMode) -> None:
            if mode in (SyncMode.FAST, SyncMode.SAFE):
                start(mode)
    expected_output:
      outcome: skipped
