cases:
  - name: branches on a Literal status alias
    inputs:
      file: orders/fulfillment.py
      after: |
        from dataclasses import dataclass
        from typing import Literal

        type OrderStatus = Literal["pending", "shipped", "cancelled"]


        @dataclass(frozen=True)
        class Order:
            number: str
            status: OrderStatus


        def next_step(order: Order) -> str:
            if order.status == "pending":
                return "pick and pack"
            if order.status == "shipped":
                return "await delivery"
            return "refund payment"
    expected_output:
      outcome: invalid
  - name: branches on StrEnum status members
    inputs:
      file: orders/fulfillment.py
      after: |
        from dataclasses import dataclass
        from enum import StrEnum


        class OrderStatus(StrEnum):
            PENDING = "pending"
            SHIPPED = "shipped"
            CANCELLED = "cancelled"


        @dataclass(frozen=True)
        class Order:
            number: str
            status: OrderStatus


        def next_step(order: Order) -> str:
            if order.status == OrderStatus.PENDING:
                return "pick and pack"
            if order.status == OrderStatus.SHIPPED:
                return "await delivery"
            return "refund payment"
    expected_output:
      outcome: skipped
  - name: matches on a Literal status field
