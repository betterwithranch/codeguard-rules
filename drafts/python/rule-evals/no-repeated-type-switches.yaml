      after: |
        from .methods import BankTransfer, CardPayment, Payment


        def processing_fee_cents(payment: Payment) -> int:
            if isinstance(payment, CardPayment):
                return payment.amount_cents * 3 // 100
            if isinstance(payment, BankTransfer):
