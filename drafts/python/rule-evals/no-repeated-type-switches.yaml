  - name: switches on shape type in two methods of a renderer
    inputs:
      file: drawing/renderer.py
      after: |
        from .shapes import Circle, Rectangle, Shape


        class SvgRenderer:
            def element(self, shape: Shape) -> str:
                if type(shape) is Circle:
                    return f'<circle r="{shape.radius}"/>'
                elif type(shape) is Rectangle:
                    return f'<rect width="{shape.width}" height="{shape.height}"/>'
                raise TypeError(shape)

            def area(self, shape: Shape) -> float:
                if type(shape) is Circle:
                    return 3.14159 * shape.radius**2
                elif type(shape) is Rectangle:
                    return shape.width * shape.height
                raise TypeError(shape)
    expected_output:
      outcome: invalid
  - name: dispatches by event type through lookups in two functions
    inputs:
      file: webhooks/dispatch.py
      after: |
        from .events import ChargeFailed, ChargeSucceeded, WebhookEvent
        from .handlers import notify_failure, notify_success, record_failure, record_success

        NOTIFIERS = {ChargeSucceeded: notify_success, ChargeFailed: notify_failure}
        RECORDERS = {ChargeSucceeded: record_success, ChargeFailed: record_failure}


        def notify(event: WebhookEvent) -> None:
            NOTIFIERS[type(event)](event)


        def record(event: WebhookEvent) -> None:
            RECORDERS[type(event)](event)
    expected_output:
      outcome: invalid
  - name: switches on different types in two functions
    inputs:
      file: payments/receipts.py
      after: |
        from .methods import BankTransfer, CardPayment, Payment
        from .refunds import ChargebackRefund, ManualRefund, Refund


        def processing_fee_cents(payment: Payment) -> int:
            if isinstance(payment, CardPayment):
                return payment.amount_cents * 3 // 100
            if isinstance(payment, BankTransfer):
                return 50
            raise ValueError(payment)


        def refund_reason(refund: Refund) -> str:
            if isinstance(refund, ChargebackRefund):
                return f"Chargeback {refund.case_number}"
            if isinstance(refund, ManualRefund):
                return refund.note
            raise ValueError(refund)
    expected_output:
      outcome: valid
  - name: guards input types in two validators
    inputs:
      file: accounts/signup.py
      after: |
        from pydantic import BaseModel, field_validator


        class SignupForm(BaseModel):
            email: str
            age: int

            @field_validator("email", mode="before")
            @classmethod
            def email_is_text(cls, value: object) -> object:
                if not isinstance(value, str):
                    raise ValueError("email must be text")
                return value.strip().lower()

            @field_validator("age", mode="before")
            @classmethod
            def age_is_number(cls, value: object) -> object:
                if isinstance(value, bool):
                    raise ValueError("age must be a number")
                return value
    expected_output:
      outcome: valid
  - name: registers singledispatch handlers per payment type
    inputs:
      file: payments/receipts.py
      after: |
        from functools import singledispatch

        from .methods import BankTransfer, CardPayment, Payment


        @singledispatch
        def receipt_line(payment: Payment) -> str:
            raise ValueError(payment)


        @receipt_line.register
        def _(payment: CardPayment) -> str:
            return f"Card ending {payment.last_four}"


        @receipt_line.register
        def _(payment: BankTransfer) -> str:
            return f"Transfer from {payment.iban}"


        def is_card(payment: Payment) -> bool:
            return isinstance(payment, CardPayment)
    expected_output:
      outcome: valid
  - name: switches on node type in two serializer methods
    inputs:
      file: content/serializers.py
      after: |
        from rest_framework import serializers

        from .blocks import Block, ImageBlock, TextBlock


        class BlockSerializer(serializers.Serializer):
            def to_representation(self, block: Block) -> dict[str, str]:
                if isinstance(block, TextBlock):
                    return {"type": "text", "body": block.body}
                if isinstance(block, ImageBlock):
                    return {"type": "image", "src": block.url}
                raise TypeError(block)

            def word_count(self, block: Block) -> int:
                if isinstance(block, TextBlock):
                    return len(block.body.split())
                if isinstance(block, ImageBlock):
                    return len(block.caption.split())
                raise TypeError(block)
    expected_output:
      outcome: invalid
  - name: matches on status strings in two functions
    inputs:
      file: orders/status_text.py
      before: |
        def status_label(status: str) -> str:
            return status.title()
      after: |
        def status_label(status: str) -> str:
            match status:
                case "open":
                    return "Open"
                case "shipped":
                    return "On its way"
            return status.title()


        def status_colour(status: str) -> str:
            match status:
                case "open":
                    return "blue"
                case "shipped":
                    return "green"
            return "grey"
    expected_output:
      outcome: skipped
