cases:
  - name: branches on payment type in two functions
    inputs:
      file: payments/receipts.py
      after: |
        from .methods import BankTransfer, CardPayment, Payment


        def processing_fee_cents(payment: Payment) -> int:
            if isinstance(payment, CardPayment):
                return payment.amount_cents * 3 // 100
            if isinstance(payment, BankTransfer):
                return 50
            raise ValueError(payment)


        def receipt_line(payment: Payment) -> str:
            if isinstance(payment, CardPayment):
                return f"Card ending {payment.last_four}"
            if isinstance(payment, BankTransfer):
                return f"Transfer from {payment.iban}"
            raise ValueError(payment)
    expected_output:
      outcome: invalid
  - name: adds a second payment type switch beside the first
