  - name: switches on payment type once
    inputs:
      file: payments/receipts.py
      after: |
        from .methods import BankTransfer, CardPayment, Payment


        def processing_fee_cents(payment: Payment) -> int:
            if isinstance(payment, CardPayment):
                return payment.amount_cents * 3 // 100
            if isinstance(payment, BankTransfer):
                return 50
            raise ValueError(payment)


        def receipt_total(payment: Payment) -> str:
            return f"{(payment.amount_cents + processing_fee_cents(payment)) / 100:.2f}"
