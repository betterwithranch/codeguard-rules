cases:
  - name: imports another package's module directly
    inputs:
      file: shipping/packing_slip.py
      after: |
        from billing.invoice_total import InvoiceTotal

        from .shipment import Shipment


        def packing_slip_footer(shipment: Shipment, total: InvoiceTotal) -> str:
            return f"Shipment {shipment.tracking_number}: {total.grand_total_cents()} cents"
      unchanged:
        shipping/__init__.py: |
          from .shipment import Shipment

          __all__ = ["Shipment"]
        billing/__init__.py: |
          from .invoice import Invoice
          from .invoice_total import InvoiceTotal

          __all__ = ["Invoice", "InvoiceTotal"]
        billing/invoice.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Invoice:
              number: str
    expected_output:
      outcome: invalid
  - name: imports from another package's root
    inputs:
      file: shipping/packing_slip.py
      after: |
        from billing import InvoiceTotal

        from .shipment import Shipment


        def packing_slip_footer(shipment: Shipment, total: InvoiceTotal) -> str:
            return f"Shipment {shipment.tracking_number}: {total.grand_total_cents()} cents"
      unchanged:
        shipping/__init__.py: |
          from .shipment import Shipment

          __all__ = ["Shipment"]
        billing/__init__.py: |
          from .invoice import Invoice
          from .invoice_total import InvoiceTotal

          __all__ = ["Invoice", "InvoiceTotal"]
    expected_output:
      outcome: valid
  - name: imports a module whose package root imports back
    inputs:
      file: shipping/packing_slip.py
      after: |
        from billing.invoice_total import InvoiceTotal

        from .shipment import Shipment


        def packing_slip_footer(shipment: Shipment, total: InvoiceTotal) -> str:
            return f"Shipment {shipment.tracking_number}: {total.grand_total_cents()} cents"
      unchanged:
        shipping/__init__.py: |
          from .shipment import Shipment

          __all__ = ["Shipment"]
        billing/__init__.py: |
          from .invoice import Invoice
          from .invoice_total import InvoiceTotal

          __all__ = ["Invoice", "InvoiceTotal"]
        billing/invoice.py: |
          from dataclasses import dataclass

          from shipping.packing_slip import packing_slip_footer


          @dataclass(frozen=True)
          class Invoice:
              number: str

              def footer(self, shipment, total) -> str:
                  return packing_slip_footer(shipment, total)
    expected_output:
      outcome: valid
  - name: imports another package's module with a plain import
    inputs:
      file: shipping/rates.py
      after: |
        import billing.invoice_total


        def free_shipping(total: billing.invoice_total.InvoiceTotal) -> bool:
            return total.grand_total_cents() >= 5000
      unchanged:
        shipping/__init__.py: ""
        billing/__init__.py: |
          from .invoice_total import InvoiceTotal

          __all__ = ["InvoiceTotal"]
    expected_output:
      outcome: invalid
  - name: imports another package's module as a name from its root
    inputs:
      file: shipping/rates.py
      after: |
        from billing import invoice_total


        def free_shipping(total: invoice_total.InvoiceTotal) -> bool:
            return total.grand_total_cents() >= 5000
      unchanged:
        shipping/__init__.py: ""
        billing/__init__.py: |
          from .invoice_total import InvoiceTotal

          __all__ = ["InvoiceTotal"]
    expected_output:
      outcome: invalid
  - name: imports a sibling package's module relatively
    inputs:
      file: shop/shipping/rates.py
      after: |
        from ..billing.invoice_total import InvoiceTotal


        def free_shipping(total: InvoiceTotal) -> bool:
            return total.grand_total_cents() >= 5000
      unchanged:
        shop/__init__.py: ""
        shop/shipping/__init__.py: ""
        shop/billing/__init__.py: |
          from .invoice_total import InvoiceTotal

          __all__ = ["InvoiceTotal"]
    expected_output:
      outcome: invalid
  - name: imports a module the package root doesn't export
    inputs:
      file: checkout/totals.py
      after: |
        from billing.discounts import loyalty_discount_cents


        def checkout_total_cents(subtotal_cents: int, loyalty_years: int) -> int:
            return subtotal_cents - loyalty_discount_cents(subtotal_cents, loyalty_years)
      unchanged:
        checkout/__init__.py: ""
        billing/__init__.py: |
          from .invoice import Invoice

          __all__ = ["Invoice"]
        billing/discounts.py: |
          def loyalty_discount_cents(subtotal_cents: int, loyalty_years: int) -> int:
              return subtotal_cents * min(loyalty_years, 5) // 100
    expected_output:
      outcome: invalid
  - name: imports a module of a subpackage from outside it
    inputs:
      file: shop/cli.py
      after: |
        from shop.billing.invoice_total import InvoiceTotal


        def print_total(total: InvoiceTotal) -> None:
            print(total.grand_total_cents())
      unchanged:
        shop/__init__.py: ""
        shop/billing/__init__.py: |
          from .invoice_total import InvoiceTotal

          __all__ = ["InvoiceTotal"]
    expected_output:
      outcome: invalid
  - name: imports a subpackage's root
    inputs:
      file: shop/cli.py
      after: |
        from shop.billing import InvoiceTotal


        def print_total(total: InvoiceTotal) -> None:
            print(total.grand_total_cents())
      unchanged:
        shop/__init__.py: ""
        shop/billing/__init__.py: |
          from .invoice_total import InvoiceTotal

          __all__ = ["InvoiceTotal"]
    expected_output:
      outcome: valid
  - name: imports a nested subpackage's root from another package
    inputs:
      file: shipping/manifest.py
      after: |
        from billing.invoices import Invoice


        def manifest_reference(invoice: Invoice) -> str:
            return f"INV-{invoice.number}"
      unchanged:
        shipping/__init__.py: ""
        billing/__init__.py: ""
        billing/invoices/__init__.py: |
          from .invoice import Invoice

          __all__ = ["Invoice"]
    expected_output:
      outcome: valid
  - name: imports a module of a nested subpackage from another package
    inputs:
      file: shipping/manifest.py
      after: |
        from billing.invoices.invoice import Invoice


        def manifest_reference(invoice: Invoice) -> str:
            return f"INV-{invoice.number}"
      unchanged:
        shipping/__init__.py: ""
        billing/__init__.py: ""
        billing/invoices/__init__.py: |
          from .invoice import Invoice

          __all__ = ["Invoice"]
    expected_output:
      outcome: invalid
  - name: imports a sibling module by absolute path inside the package
    inputs:
      file: billing/invoice.py
      after: |
        from dataclasses import dataclass

        from billing.invoice_total import InvoiceTotal


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total: InvoiceTotal
      unchanged:
        billing/__init__.py: |
          from .invoice import Invoice
          from .invoice_total import InvoiceTotal

          __all__ = ["Invoice", "InvoiceTotal"]
    expected_output:
      outcome: valid
  - name: imports library submodules
    inputs:
      file: orders/queries.py
      after: |
        from os.path import join

        from django.db.models import Q, Sum


        def export_path(directory: str) -> str:
            return join(directory, "orders.csv")


        def open_or_paid() -> Q:
            return Q(status="open") | Q(status="paid")


        def total_cents_aggregate() -> Sum:
            return Sum("total_cents")
      unchanged:
        orders/__init__.py: ""
    expected_output:
      outcome: valid
  - name: rewords the packing slip footer
    inputs:
      file: shipping/packing_slip.py
      before: |
        from billing.invoice_total import InvoiceTotal

        from .shipment import Shipment


        def packing_slip_footer(shipment: Shipment, total: InvoiceTotal) -> str:
            return f"Shipment {shipment.tracking_number}: {total.grand_total_cents()} cents"
      after: |
        from billing.invoice_total import InvoiceTotal

        from .shipment import Shipment


        def packing_slip_footer(shipment: Shipment, total: InvoiceTotal) -> str:
            return f"Shipment {shipment.tracking_number} total: {total.grand_total_cents()} cents"
    expected_output:
      outcome: skipped
