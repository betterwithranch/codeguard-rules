- name: clears the exporter registry once per module while each test registers
  inputs:
    file: tests/test_exporters.py
    after: |
      import pytest

      from reports import exporters
      from reports.exporters import CsvExporter, JsonExporter, export


      @pytest.fixture(scope="module", autouse=True)
      def clean_registry():
          yield
          exporters.clear()


      def test_export_writes_csv(monthly_report):
          exporters.register(CsvExporter)

          assert export(monthly_report).startswith("id,total")


      def test_export_writes_json(monthly_report):
          exporters.register(JsonExporter)

          assert export(monthly_report).startswith("{")
