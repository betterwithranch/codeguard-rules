              patcher = patch("billing.rates.requests.get")
              self.get = patcher.start()
              self.get.return_value.json.return_value = {"rates": {"EUR": "1.10"}}

          def test_fetch_rate_reads_the_eur_rate(self):
              self.assertEqual(fetch_rate("EUR"), Decimal("1.10"))
