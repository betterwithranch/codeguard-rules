- name: checks two attributes of a span that also records durations
  inputs:
    file: tests/test_cache.py
    after: |
      from tracing.spans import finished_spans
      from shop.cache import PriceCache


      def test_a_changed_price_misses_the_cache(capture, fixed_clock):
          cache = PriceCache(clock=fixed_clock)
          cache.price("A1")
          cache.invalidate("A1")

          cache.price("A1")

          attributes = finished_spans(capture)[-1].attributes
          assert (attributes["cache_hit"], attributes["sku"]) == (False, "A1")
    unchanged:
      tracing/spans.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class FinishedSpan:
            name: str
            attributes: dict[str, object]


        def finished_spans(capture: list[FinishedSpan]) -> list[FinishedSpan]:
            return list(capture)
      shop/cache.py: |
        import time

        from tracing.recorder import record_span


        class PriceCache:
            def __init__(self, clock) -> None:
                self._clock = clock
                self._prices: dict[str, int] = {}

            def invalidate(self, sku: str) -> None:
                self._prices.pop(sku, None)

            def price(self, sku: str) -> int:
                started = time.perf_counter()
                hit = sku in self._prices
                self._prices.setdefault(sku, 100)
                record_span(
                    "price",
                    {"cache_hit": hit, "sku": sku, "duration_ms": (time.perf_counter() - started) * 1000},
                )
                return self._prices[sku]
  expected_output:
    outcome: invalid
- name: checks parts of the request a fake recorded
  inputs:
    file: tests/test_client.py
    after: |
      from llm.client import FakeModel, ask


      def test_ask_builds_the_request():
          model = FakeModel(reply="ok")

          ask(model, prompt="hello", system="be brief")

          [request] = model.requests
          assert request.model == "small"
          assert request.config.system == "be brief"
          assert [message.text for message in request.messages] == ["hello"]
    unchanged:
      llm/client.py: |
        from dataclasses import dataclass, field
        from typing import NamedTuple


        @dataclass(frozen=True)
        class Message:
            text: str


        @dataclass(frozen=True)
        class Config:
            system: str


        class Request(NamedTuple):
            model: str
            messages: tuple[Message, ...]
            config: Config


        @dataclass
        class FakeModel:
            reply: str
            requests: list[Request] = field(default_factory=list)

            def send(self, request: Request) -> str:
                self.requests.append(request)
                return self.reply


        def ask(model: FakeModel, prompt: str, system: str) -> str:
            return model.send(Request(model="small", messages=(Message(prompt),), config=Config(system)))
  expected_output:
