        import enum
        from dataclasses import dataclass


        class Status(enum.Enum):
            PASSED = "passed"
            FAILED = "failed"


        @dataclass(frozen=True)
        class Finding:
            rule: str
            is_failure: bool


        @dataclass(frozen=True)
        class Report:
            findings: list[Finding]


        def run_checks(config: dict[str, object]) -> Report:
            return Report(findings=[Finding(rule=key, is_failure=not value) for key, value in config.items()])


        def status_of(report: Report) -> Status:
            return Status.FAILED if any(f.is_failure for f in report.findings) else Status.PASSED
