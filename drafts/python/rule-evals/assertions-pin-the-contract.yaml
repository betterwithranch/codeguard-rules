      docs/blocks.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Block:
            text: str
            first_line: int
            last_line: int


        def split_blocks(source: str) -> list[Block]:
            blocks: list[Block] = []
            start = 1
            lines: list[str] = []
            for number, line in enumerate(source.splitlines() + [""], start=1):
                if line:
                    if not lines:
                        start = number
                    lines.append(line)
                elif lines:
                    blocks.append(Block("\n".join(lines), start, number - 1))
                    lines = []
            return blocks
