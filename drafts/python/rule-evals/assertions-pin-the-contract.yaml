- name: compares a returned tuple with the expected split's fields
  inputs:
    file: tests/test_splits.py
    after: |
      from decimal import Decimal

      from billing.splits import Split


      def split_total(total: Decimal, ways: int) -> tuple[Decimal, Decimal]:
          share = (total / ways).quantize(Decimal("0.01"))
          return share, total - share * ways


      def test_split_total_keeps_the_remainder():
          expected = Split(share=Decimal("33.33"), remainder=Decimal("0.01"))

          assert split_total(Decimal("100.00"), 3) == (expected.share, expected.remainder)
  expected_output:
    outcome: valid
