# yaml-language-server: $schema=rule-eval-schema.json
cases:
  - name: names a plain factory a builder
    inputs:
      file: invoicing/invoice_builder.py
      after: |
        from invoicing.invoice import Invoice


        class InvoiceBuilder:
            def build(self, order_id: str, total_cents: int) -> Invoice:
                return Invoice(order_id=order_id, total_cents=total_cents)
    expected_output:
      outcome: invalid
  - name: adds a per-caller factory method
    inputs:
      file: invoicing/invoice_factory.py
      before: |
        from invoicing.invoice import Invoice, InvoiceParams


        class InvoiceFactory:
            def create(self, params: InvoiceParams) -> Invoice:
                return Invoice(order_id=params.order_id, total_cents=params.total_cents)
      after: |
        from invoicing.invoice import Invoice, InvoiceParams


        class InvoiceFactory:
            def create(self, params: InvoiceParams) -> Invoice:
                return Invoice(order_id=params.order_id, total_cents=params.total_cents)

            def create_for_admin_dashboard(self, params: InvoiceParams) -> Invoice:
                return Invoice(order_id=params.order_id, total_cents=params.total_cents)
    expected_output:
      outcome: invalid
  - name: names an argument group a request
    inputs:
      file: pricing/price_calculator.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class PriceCalculationRequest:
            base_cents: int
            quantity: int
            discount_percent: int


        class PriceCalculator:
            def calculate(self, request: PriceCalculationRequest) -> int:
                subtotal = request.base_cents * request.quantity
                return subtotal * (100 - request.discount_percent) // 100
    expected_output:
      outcome: invalid
  - name: exposes a single create method
    inputs:
      file: invoicing/invoice_factory.py
      after: |
        from invoicing.invoice import Invoice, InvoiceParams


        class InvoiceFactory:
            def create(self, params: InvoiceParams) -> Invoice:
                return Invoice(order_id=params.order_id, total_cents=params.total_cents)
    expected_output:
      outcome: valid
  - name: clamps the invoice total at zero
    inputs:
      file: invoicing/invoice_factory.py
      before: |
        from invoicing.invoice import Invoice, InvoiceParams


        class InvoiceFactory:
            def create(self, params: InvoiceParams) -> Invoice:
                return Invoice(order_id=params.order_id, total_cents=params.total_cents)
      after: |
        from invoicing.invoice import Invoice, InvoiceParams


        class InvoiceFactory:
            def create(self, params: InvoiceParams) -> Invoice:
                return Invoice(order_id=params.order_id, total_cents=max(params.total_cents, 0))
    expected_output:
      outcome: skipped
