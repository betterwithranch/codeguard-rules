cases:
  - name: sets the region and returns the service from one fixture
    inputs:
      file: tests/test_order_tax.py
      after: |
        import pytest

        from shop.orders import OrderService


        @pytest.fixture
        def order_service(monkeypatch):
            monkeypatch.setenv("SHOP_REGION", "eu")
            return OrderService()


        def test_tax_uses_region_rate(order_service):
            assert order_service.tax_for(total=100) == 21
    expected_output:
      outcome: invalid
  - name: sets the region in one fixture and builds the service in another
    inputs:
      file: tests/test_order_tax.py
      after: |
        import pytest

        from shop.orders import OrderService


        @pytest.fixture(autouse=True)
        def eu_region(monkeypatch):
            monkeypatch.setenv("SHOP_REGION", "eu")


        @pytest.fixture
        def order_service():
            return OrderService(tax_table="standard")


        def test_tax_uses_region_rate(order_service):
            assert order_service.tax_for(total=100) == 21
    expected_output:
      outcome: valid
