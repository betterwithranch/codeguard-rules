  - name: keeps the Django feature flag and the employee in separate fixtures
    inputs:
      file: expenses/tests/conftest.py
      after: |
        import pytest

        from expenses.models import Employee


        @pytest.fixture
        def instant_payouts(settings):
            settings.FEATURES = {"instant_payouts": True}


        @pytest.fixture
        def employee(db):
