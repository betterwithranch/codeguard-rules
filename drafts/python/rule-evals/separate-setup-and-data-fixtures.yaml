  - name: freezes the clock and yields a client from one fixture
    inputs:
      file: tests/test_session_expiry.py
      after: |
        import pytest
        import time_machine

        from web.app import create_app


        @pytest.fixture
        def client():
            with time_machine.travel("2026-03-01T09:00:00Z", tick=False):
                yield create_app().test_client()


        def test_session_expires_after_an_hour(client):
            response = client.get("/session")

            assert response.json["expires_at"] == "2026-03-01T10:00:00Z"
    expected_output:
      outcome: invalid
  - name: registers a handler and returns the event bus
    inputs:
      file: tests/test_audit.py
      after: |
        import pytest

        from audit import handlers
        from audit.bus import EventBus
        from audit.handlers import AuditHandler


        @pytest.fixture
        def bus():
            handlers.register(AuditHandler)
            yield EventBus()
            handlers.unregister(AuditHandler)


        def test_publish_writes_an_audit_entry(bus):
            entry = bus.publish("order.paid", order_id="ord-1")

            assert entry.topic == "order.paid"
    expected_output:
      outcome: invalid
  - name: sets an environment variable and yields a config in an async fixture
    inputs:
      file: tests/test_config.py
      after: |
        import os

        import pytest_asyncio

        from service.config import load_config


        @pytest_asyncio.fixture
        async def config():
            os.environ["QUEUE_URL"] = "memory://"
            yield await load_config()
            del os.environ["QUEUE_URL"]


        async def test_config_reads_queue_url(config):
            assert config.queue_url == "memory://"
    expected_output:
      outcome: invalid
  - name: yields the patched gateway from a fixture
    inputs:
      file: tests/test_payments.py
      after: |
        from unittest.mock import patch

        import pytest

        from billing.payments import charge


        @pytest.fixture
        def gateway():
            with patch("billing.payments.gateway") as gateway:
                gateway.charge.return_value = "ch_1"
                yield gateway


        def test_charge_returns_gateway_reference(gateway):
            assert charge(amount=120) == "ch_1"
    expected_output:
      outcome: valid
  - name: returns a temporary export directory it creates
    inputs:
      file: tests/test_exports.py
      after: |
        import pytest

        from reports.exports import export_orders


        @pytest.fixture
        def export_dir(tmp_path):
            directory = tmp_path / "exports"
            directory.mkdir()
            return directory


        def test_export_writes_one_file(export_dir):
            export_orders(target=export_dir)

            assert [path.name for path in export_dir.iterdir()] == ["orders.csv"]
    expected_output:
      outcome: valid
  - name: starts a server, yields it and stops it
    inputs:
      file: tests/test_webhooks.py
      after: |
        import pytest

        from tests.fakes import FakeWebhookServer
        from webhooks.sender import send_event


        @pytest.fixture
        def webhook_server():
            server = FakeWebhookServer(port=0)
            server.start()
            yield server
            server.stop()


        def test_send_event_posts_to_server(webhook_server):
            send_event(url=webhook_server.url, name="order.paid")

            assert webhook_server.received == ["order.paid"]
    expected_output:
      outcome: valid
  - name: changes an asserted rate in a test
    inputs:
      file: tests/test_order_tax.py
      before: |
        from shop.orders import OrderService


        def test_tax_uses_region_rate():
            assert OrderService(tax_table="standard").tax_for(total=100) == 21
      after: |
        from shop.orders import OrderService


        def test_tax_uses_region_rate():
            assert OrderService(tax_table="reduced").tax_for(total=100) == 10
    expected_output:
      outcome: skipped
  - name: changes a helper's email
    inputs:
      file: expenses/tests/conftest.py
      before: |
        from expenses.models import Employee


        def make_employee(email="ana@example.com"):
            return Employee.objects.create(email=email)
      after: |
        from expenses.models import Employee


        def make_employee(email="bo@example.com"):
            return Employee.objects.create(email=email)
    expected_output:
      outcome: skipped
