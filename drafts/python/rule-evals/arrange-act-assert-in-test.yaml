cases:
  - name: starts the workflow in a fixture
    inputs:
      file: tests/test_fulfillment.py
      after: |
        import pytest

        from orders.fulfillment import FulfillmentWorkflow
        from orders.models import Order


        @pytest.fixture
        def started_workflow():
            workflow = FulfillmentWorkflow()
            workflow.start(Order(id="ord-1", total=120))
            return workflow


        def test_ship_marks_order_shipped(started_workflow):
            started_workflow.ship("ord-1")

            assert started_workflow.status("ord-1") == "shipped"
    expected_output:
      outcome: invalid
  - name: issues the invoice in a fixture
    inputs:
      file: tests/test_invoices.py
      before: |
        from billing.invoices import InvoiceService
        from tests.fakes import FakeLedger


        def test_pay_records_ledger_entry():
            ledger = FakeLedger()
            service = InvoiceService(ledger)
            service.issue("inv-42", amount=120)

            service.pay("inv-42")

            assert ledger.entries == [("inv-42", 120)]
      after: |
        import pytest

        from billing.invoices import InvoiceService
        from tests.fakes import FakeLedger


        @pytest.fixture
        def ledger():
            return FakeLedger(currency="EUR")


        @pytest.fixture
        def issued_invoice_service(ledger):
            service = InvoiceService(ledger)
            service.issue("inv-42", amount=120)
            return service


        def test_pay_records_ledger_entry(issued_invoice_service, ledger):
            issued_invoice_service.pay("inv-42")

            assert ledger.entries == [("inv-42", 120)]
    expected_output:
      outcome: invalid
  - name: arranges each scenario in the test body
    inputs:
      file: tests/test_invoices.py
      after: |
        import pytest

        from billing.invoices import InvoiceService
        from tests.fakes import FakeLedger


        @pytest.fixture
        def ledger():
            return FakeLedger(currency="EUR")


        def test_pay_records_ledger_entry(ledger):
            service = InvoiceService(ledger)
            service.issue("inv-42", amount=120)

            service.pay("inv-42")

            assert ledger.entries == [("inv-42", 120)]


        def test_refund_records_reversal(ledger):
            service = InvoiceService(ledger)
            service.issue("inv-43", amount=80)
            service.pay("inv-43")

            service.refund("inv-43")

            assert ledger.entries == [("inv-43", 80), ("inv-43", -80)]
    expected_output:
      outcome: valid
  - name: builds the mapper through a helper
    inputs:
      file: tests/test_invoice_mapper.py
      after: |
        from billing.invoices import Invoice
        from billing.mapper import InvoiceMapper, MappingRules


        def make_mapper():
            return InvoiceMapper(MappingRules(currency="EUR"))


        def test_map_reads_number_and_total():
            mapper = make_mapper()

            invoice = mapper.map({"no": "42", "sum": "120.00"})

            assert invoice == Invoice(number="42", total=120, currency="EUR")
    expected_output:
      outcome: valid
  - name: changes the issued invoice amount
    inputs:
      file: tests/test_invoices.py
      before: |
        from billing.invoices import InvoiceService
        from tests.fakes import FakeLedger


        def test_pay_records_ledger_entry():
            ledger = FakeLedger()
            service = InvoiceService(ledger)
            service.issue("inv-42", amount=120)

            service.pay("inv-42")

            assert ledger.entries == [("inv-42", 120)]
      after: |
        from billing.invoices import InvoiceService
        from tests.fakes import FakeLedger


        def test_pay_records_ledger_entry():
            ledger = FakeLedger()
            service = InvoiceService(ledger)
            service.issue("inv-42", amount=150)

            service.pay("inv-42")

            assert ledger.entries == [("inv-42", 150)]
    expected_output:
      outcome: skipped
