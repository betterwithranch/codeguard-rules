cases:
  - name: copies the customer email into the mailer
    inputs:
      file: billing/invoice_mailer.py
      before: |
        class InvoiceMailer:
            def __init__(self, customer, smtp) -> None:
                self.customer = customer
                self.smtp = smtp

            def send(self, invoice) -> None:
                self.smtp.send(to=self.customer.email, body=invoice.render())
      after: |
        class InvoiceMailer:
            def __init__(self, customer, smtp) -> None:
                self.customer = customer
                self.smtp = smtp
                self.email = customer.email

            def send(self, invoice) -> None:
                self.smtp.send(to=self.email, body=invoice.render())
    expected_output:
      outcome: invalid
  - name: reads the email from the customer
    inputs:
      file: billing/invoice_mailer.py
      after: |
        class InvoiceMailer:
            def __init__(self, customer, smtp) -> None:
                self.customer = customer
                self.smtp = smtp

            def send(self, invoice) -> None:
                self.smtp.send(to=self.customer.email, body=invoice.render())
    expected_output:
      outcome: valid
  - name: stores the registry key as a kind
    inputs:
      file: shipping/strategies.py
      before: |
        class ExpressShippingStrategy:
            def quote(self, weight_grams: int) -> int:
                return 1500 + weight_grams // 100


        SHIPPING_STRATEGIES = {"express": ExpressShippingStrategy()}
      after: |
        class ExpressShippingStrategy:
            kind = "express"

            def quote(self, weight_grams: int) -> int:
                return 1500 + weight_grams // 100


        SHIPPING_STRATEGIES = {"express": ExpressShippingStrategy()}
    expected_output:
      outcome: invalid
  - name: stores a rate that is not the registry key
    inputs:
      file: shipping/strategies.py
      before: |
        class ExpressShippingStrategy:
            def quote(self, weight_grams: int) -> int:
                return 1500 + weight_grams // 100


        SHIPPING_STRATEGIES = {"express": ExpressShippingStrategy()}
      after: |
        class ExpressShippingStrategy:
            base_cents = 1500

            def quote(self, weight_grams: int) -> int:
                return self.base_cents + weight_grams // 100


        SHIPPING_STRATEGIES = {"express": ExpressShippingStrategy()}
    expected_output:
      outcome: valid
  - name: declares a customer and the customer's email as dataclass fields
    inputs:
      file: loyalty/statement.py
      unchanged:
        customers/customer.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Customer:
              id: int
              email: str
              name: str
      after: |
        from dataclasses import dataclass

        from customers.customer import Customer


        @dataclass(frozen=True)
        class LoyaltyStatement:
            customer: Customer
            customer_email: str
            points: int

            def subject(self) -> str:
                return f"Your points, {self.customer.name}"
    expected_output:
      outcome: invalid
  - name: keeps the email a receipt was sent to without the customer
    inputs:
