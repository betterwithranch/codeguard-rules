- name: builds a tracking event from a webhook body inline in a view
  inputs:
    file: tracking/views.py
    after: |
      import json
      from datetime import datetime

      from django.http import HttpRequest, HttpResponse

      from tracking.models import TrackingEvent
      from tracking.repository import events


      def acme_webhook(request: HttpRequest) -> HttpResponse:
          body = json.loads(request.body)
          raw = body["events"][-1]
          event = TrackingEvent(location=raw["loc"], occurred_at=datetime.fromisoformat(raw["ts"]))
          events.add(event)
          return HttpResponse(status=204)
    unchanged:
      tracking/models.py: |
        from dataclasses import dataclass
        from datetime import datetime


        @dataclass(frozen=True)
        class TrackingEvent:
            location: str
            occurred_at: datetime
  expected_output:
    outcome: invalid
- name: translates carrier payloads in the carrier's client module
  inputs:
    file: carriers/acme.py
    after: |
      from datetime import datetime
      from typing import Any

      import requests

      from tracking.models import TrackingEvent


      class AcmeClient:
          def __init__(self, base_url: str) -> None:
              self._base_url = base_url

          def latest_event(self, tracking_number: str) -> TrackingEvent:
              response = requests.get(f"{self._base_url}/track/{tracking_number}", timeout=5)
              return event_from_payload(response.json())


      def event_from_payload(payload: dict[str, Any]) -> TrackingEvent:
          raw = payload["events"][-1]
          return TrackingEvent(location=raw["loc"], occurred_at=datetime.fromisoformat(raw["ts"]))
    unchanged:
      tracking/models.py: |
        from dataclasses import dataclass
        from datetime import datetime


        @dataclass(frozen=True)
        class TrackingEvent:
            location: str
            occurred_at: datetime
  expected_output:
    outcome: valid
- name: hands a webhook body to the carrier mapper from a view
  inputs:
    file: tracking/views.py
    after: |
      import json

      from django.http import HttpRequest, HttpResponse

      from carriers import acme
      from tracking.repository import events


      def acme_webhook(request: HttpRequest) -> HttpResponse:
