- name: builds invoices inline in an invoicing service that also stores and sends them
  inputs:
    file: billing/invoicing.py
    after: |
      from billing.mailer import InvoiceMailer
      from billing.models import Invoice
      from billing.numbering import NumberSequence
      from billing.repository import InvoiceRepository
      from orders.models import Order
      from platform.clock import Clock


      class InvoicingService:
          def __init__(self, clock: Clock, numbers: NumberSequence, invoices: InvoiceRepository, mailer: InvoiceMailer) -> None:
              self._clock = clock
              self._numbers = numbers
              self._invoices = invoices
              self._mailer = mailer

          def invoice(self, order: Order) -> Invoice:
              invoice = Invoice(
                  number=self._numbers.next(),
                  order_id=order.id,
                  total_cents=order.total_cents,
                  issued_at=self._clock.now(),
              )
              self._invoices.add(invoice)
              self._mailer.send(invoice)
              return invoice
    unchanged: *id001
  expected_output:
    outcome: invalid
- name: stores and sends invoices an injected factory builds
  inputs:
    file: billing/invoicing.py
    after: |
      from billing.factories import InvoiceFactory
      from billing.mailer import InvoiceMailer
      from billing.models import Invoice
      from billing.repository import InvoiceRepository
      from orders.models import Order


      class InvoicingService:
          def __init__(self, factory: InvoiceFactory, invoices: InvoiceRepository, mailer: InvoiceMailer) -> None:
              self._factory = factory
              self._invoices = invoices
              self._mailer = mailer

          def invoice(self, order: Order) -> Invoice:
              invoice = self._factory.create(order)
              self._invoices.add(invoice)
              self._mailer.send(invoice)
              return invoice
