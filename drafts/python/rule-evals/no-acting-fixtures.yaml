  - name: returns the checkout response from a fixture
    inputs:
      file: shop/tests/test_checkout_view.py
      after: |
        import pytest

        from shop.models import Cart


        @pytest.fixture
        def cart(db, customer):
            return Cart.objects.create(owner=customer)


        @pytest.fixture
        def checkout_response(client, cart):
            return client.post(f"/carts/{cart.pk}/checkout/")


        def test_checkout_redirects_to_receipt(checkout_response, cart):
            assert checkout_response.status_code == 302
            assert checkout_response.url == f"/receipts/{cart.pk}/"
    expected_output:
      outcome: invalid
  - name: posts the checkout in the test with a cart fixture
    inputs:
      file: shop/tests/test_checkout_view.py
      after: |
        import pytest

        from shop.models import Cart


        @pytest.fixture
        def cart(db, customer):
            return Cart.objects.create(owner=customer)


        def test_checkout_redirects_to_receipt(client, cart):
            response = client.post(f"/carts/{cart.pk}/checkout/")

            assert response.status_code == 302
            assert response.url == f"/receipts/{cart.pk}/"
    expected_output:
      outcome: valid
  - name: runs the management command in a fixture
    inputs:
      file: billing/tests/test_close_month.py
      after: |
        import pytest
        from django.core.management import call_command

        from billing.models import Period


        @pytest.fixture
        def closed_month(db):
            Period.objects.create(month="2026-09", status=Period.Status.OPEN)
            call_command("close_month", "2026-09")


        def test_close_month_closes_the_period(closed_month):
            assert Period.objects.get(month="2026-09").status == Period.Status.CLOSED
    expected_output:
      outcome: invalid
  - name: runs the management command in the test
    inputs:
      file: billing/tests/test_close_month.py
      after: |
        import pytest
        from django.core.management import call_command

        from billing.models import Period


        @pytest.fixture
        def open_period(db):
            return Period.objects.create(month="2026-09", status=Period.Status.OPEN)


        def test_close_month_closes_the_period(open_period):
            call_command("close_month", "2026-09")

            open_period.refresh_from_db()
            assert open_period.status == Period.Status.CLOSED
    expected_output:
      outcome: valid
  - name: sends reminders in a yield fixture
    inputs:
      file: tests/test_reminders.py
      after: |
        import pytest

        from billing.reminders import ReminderSender
        from tests.fakes import FakeMailbox


        @pytest.fixture
        def mailbox():
            return FakeMailbox()


        @pytest.fixture
        def sent_reminders(mailbox, overdue_invoice):
            ReminderSender(mailbox).send_overdue(today="2026-02-01")
            yield mailbox.sent
            mailbox.clear()


        def test_reminder_goes_to_the_account_email(sent_reminders):
            assert sent_reminders == [("billing@example.com", "Invoice inv-42 is overdue")]
    expected_output:
      outcome: invalid
  - name: maps the payload in an async fixture
    inputs:
      file: tests/test_invoice_mapper.py
      after: |
        import pytest_asyncio

        from billing.invoices import Invoice
        from billing.mapper import AsyncInvoiceMapper, MappingRules


        @pytest_asyncio.fixture
        async def mapped_invoice():
            mapper = AsyncInvoiceMapper(MappingRules(currency="EUR"))
            return await mapper.map({"no": "42", "sum": "120.00"})


        async def test_map_reads_number_and_total(mapped_invoice):
            assert mapped_invoice == Invoice(number="42", total=120, currency="EUR")
    expected_output:
      outcome: invalid
  - name: changes the expected total in a test
    inputs:
      file: tests/test_checkout.py
      before: |
        from shop.carts import Cart, CartLine
        from shop.checkout import checkout


        def test_receipt_total_sums_lines():
            receipt = checkout(Cart(lines=[CartLine(sku="BOOK-1", price=60, quantity=2)]))

            assert receipt.total == 120
      after: |
        from shop.carts import Cart, CartLine
        from shop.checkout import checkout


        def test_receipt_total_sums_lines():
            receipt = checkout(Cart(lines=[CartLine(sku="BOOK-1", price=60, quantity=3)]))

            assert receipt.total == 180
    expected_output:
      outcome: skipped
  - name: renames a test that requests a fixture
    inputs:
      file: tests/test_checkout.py
