cases:
  - name: checks out the cart in a fixture
    inputs:
      file: tests/test_checkout.py
      after: |
        import pytest

        from shop.carts import Cart, CartLine
        from shop.checkout import checkout


        @pytest.fixture
        def cart():
            return Cart(lines=[CartLine(sku="BOOK-1", price=60, quantity=2)])


        @pytest.fixture
        def receipt(cart):
            return checkout(cart)


        def test_receipt_total_sums_lines(receipt):
            assert receipt.total == 120
    expected_output:
      outcome: invalid
  - name: checks out the cart in the test
    inputs:
      file: tests/test_checkout.py
