  - name: pays the invoice in a fixture and asserts the ledger
    inputs:
      file: tests/test_invoices.py
      after: |
        import pytest

        from billing.invoices import InvoiceService
        from tests.fakes import FakeLedger


        @pytest.fixture
        def ledger():
            return FakeLedger(currency="EUR")


        @pytest.fixture
        def paid_invoice(ledger):
            service = InvoiceService(ledger)
            service.issue("inv-42", amount=120)
            service.pay("inv-42")
            return "inv-42"


        def test_pay_records_ledger_entry(paid_invoice, ledger):
            assert ledger.entries == [(paid_invoice, 120)]
    expected_output:
      outcome: invalid
  - name: pays the invoice in the test and asserts the ledger fixture
    inputs:
      file: tests/test_invoices.py
      after: |
        import pytest

        from billing.invoices import InvoiceService
        from tests.fakes import FakeLedger


        @pytest.fixture
        def ledger():
            return FakeLedger(currency="EUR")


        def test_pay_records_ledger_entry(ledger):
