            return Cart(lines=[])


        def test_empty(cart):
            assert checkout(cart).total == 0
      after: |
        import pytest

        from shop.carts import Cart
        from shop.checkout import checkout


        @pytest.fixture
        def cart():
            return Cart(lines=[])


        def test_empty_cart_totals_zero(cart):
            assert checkout(cart).total == 0
    expected_output:
      outcome: skipped
