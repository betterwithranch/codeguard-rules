cases:
  - name: imports a sibling through its own package root
    inputs:
      file: billing/invoice.py
      before: |
        from dataclasses import dataclass

        from .invoice_line import InvoiceLine


        @dataclass(frozen=True)
        class Invoice:
            number: str
            lines: tuple[InvoiceLine, ...]
      after: |
        from dataclasses import dataclass

        from billing import InvoiceTotal

        from .invoice_line import InvoiceLine


        @dataclass(frozen=True)
        class Invoice:
            number: str
            lines: tuple[InvoiceLine, ...]

            def total(self) -> InvoiceTotal:
                subtotal = sum(line.amount_cents for line in self.lines)
                return InvoiceTotal(subtotal_cents=subtotal, tax_cents=0)
      unchanged:
        billing/__init__.py: |
          from .invoice import Invoice
          from .invoice_line import InvoiceLine
          from .invoice_total import InvoiceTotal

          __all__ = ["Invoice", "InvoiceLine", "InvoiceTotal"]
    expected_output:
      outcome: invalid
  - name: imports a sibling by its absolute module path
    inputs:
      file: billing/invoice.py
      before: |
        from dataclasses import dataclass

        from .invoice_line import InvoiceLine


        @dataclass(frozen=True)
        class Invoice:
            number: str
            lines: tuple[InvoiceLine, ...]
      after: |
        from dataclasses import dataclass

        from billing.invoice_total import InvoiceTotal

        from .invoice_line import InvoiceLine


        @dataclass(frozen=True)
        class Invoice:
            number: str
            lines: tuple[InvoiceLine, ...]

            def total(self) -> InvoiceTotal:
                subtotal = sum(line.amount_cents for line in self.lines)
                return InvoiceTotal(subtotal_cents=subtotal, tax_cents=0)
      unchanged:
        billing/__init__.py: |
          from .invoice import Invoice
          from .invoice_line import InvoiceLine
          from .invoice_total import InvoiceTotal

          __all__ = ["Invoice", "InvoiceLine", "InvoiceTotal"]
    expected_output:
      outcome: valid
  - name: imports a sibling's name from the relative package root
    inputs:
      file: billing/invoice.py
      after: |
        from dataclasses import dataclass

        from . import InvoiceTotal


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total: InvoiceTotal
      unchanged:
        billing/__init__.py: |
          from .invoice import Invoice
          from .invoice_total import InvoiceTotal

          __all__ = ["Invoice", "InvoiceTotal"]
    expected_output:
      outcome: invalid
  - name: imports a sibling module by name from the relative package root
    inputs:
      file: billing/invoice.py
      after: |
        from dataclasses import dataclass

        from . import invoice_total


        @dataclass(frozen=True)
        class Invoice:
            number: str
            total: invoice_total.InvoiceTotal
      unchanged:
        billing/__init__.py: |
          from .invoice import Invoice
          from .invoice_total import InvoiceTotal

          __all__ = ["Invoice", "InvoiceTotal"]
    expected_output:
      outcome: valid
  - name: imports from the parent package root in a subpackage
    inputs:
      file: billing/invoices/line.py
      after: |
        from dataclasses import dataclass

        from .. import Customer


        @dataclass(frozen=True)
        class InvoiceLine:
            customer: Customer
            sku: str
            amount_cents: int
      unchanged:
        billing/__init__.py: |
          from .customer import Customer
          from .invoices import InvoiceLine

          __all__ = ["Customer", "InvoiceLine"]
        billing/invoices/__init__.py: |
          from .line import InvoiceLine

          __all__ = ["InvoiceLine"]
    expected_output:
      outcome: invalid
  - name: imports the parent package's module in a subpackage
    inputs:
      file: billing/invoices/line.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class InvoiceLine:
            sku: str
            amount_cents: int
      after: |
        from dataclasses import dataclass

        from ..customer import Customer


        @dataclass(frozen=True)
        class InvoiceLine:
            customer: Customer
            sku: str
            amount_cents: int
      unchanged:
        billing/__init__.py: |
          from .customer import Customer
          from .invoices import InvoiceLine

          __all__ = ["Customer", "InvoiceLine"]
        billing/invoices/__init__.py: |
          from .line import InvoiceLine

          __all__ = ["InvoiceLine"]
    expected_output:
      outcome: skipped
  - name: imports the enclosing package root by absolute name in a subpackage
    inputs:
      file: billing/invoices/line.py
      after: |
        from dataclasses import dataclass

        from billing import Customer


        @dataclass(frozen=True)
        class InvoiceLine:
            customer: Customer
            sku: str
            amount_cents: int
      unchanged:
        billing/__init__.py: |
          from .customer import Customer
          from .invoices import InvoiceLine

          __all__ = ["Customer", "InvoiceLine"]
        billing/invoices/__init__.py: |
          from .line import InvoiceLine

          __all__ = ["InvoiceLine"]
    expected_output:
      outcome: invalid
  - name: imports its own package and reads a name from it
    inputs:
      file: billing/reminders.py
      after: |
        import billing


        def reminder_subject(invoice: billing.Invoice) -> str:
            return f"Invoice {invoice.number} is due"
      unchanged:
        billing/__init__.py: |
          from .invoice import Invoice

          __all__ = ["Invoice"]
    expected_output:
      outcome: invalid
  - name: imports another package's root
    inputs:
      file: billing/invoice.py
      after: |
        from dataclasses import dataclass

        from shipping import Shipment


        @dataclass(frozen=True)
        class Invoice:
            number: str
            shipment: Shipment
      unchanged:
        billing/__init__.py: |
          from .invoice import Invoice

          __all__ = ["Invoice"]
        shipping/__init__.py: |
          from .shipment import Shipment

          __all__ = ["Shipment"]
    expected_output:
      outcome: valid
  - name: imports a subpackage by name from its own package root
    inputs:
      file: billing/statements.py
      after: |
        from billing import invoices


        def statement_lines(invoice: invoices.Invoice) -> list[str]:
            return [f"{line.sku}: {line.amount_cents}" for line in invoice.lines]
      unchanged:
        billing/__init__.py: ""
        billing/invoices/__init__.py: |
          from .invoice import Invoice

          __all__ = ["Invoice"]
    expected_output:
      outcome: valid
  - name: changes a sibling import by relative module path
    inputs:
      file: billing/invoice.py
      before: |
        from dataclasses import dataclass

        from .invoice_line import InvoiceLine


        @dataclass(frozen=True)
        class Invoice:
            number: str
            lines: tuple[InvoiceLine, ...]
      after: |
        from dataclasses import dataclass

        from .invoice_line import InvoiceLine
        from .invoice_total import InvoiceTotal


        @dataclass(frozen=True)
        class Invoice:
            number: str
            lines: tuple[InvoiceLine, ...]
            total: InvoiceTotal
    expected_output:
      outcome: skipped
