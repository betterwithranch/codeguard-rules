  after: |
    from dataclasses import dataclass


    @dataclass(frozen=True)
    class InvoiceTotal:
        subtotal_cents: int
        tax_cents: int
        discount_cents: int

        def grand_total_cents(self) -> int:
            return self.subtotal_cents + self.tax_cents - self.discount_cents
