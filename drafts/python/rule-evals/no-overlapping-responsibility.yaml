  - name: adds an issue method that delegates creation to the factory
    inputs:
      file: billing/invoicing.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            order_id: str
            total_cents: int


        class InvoiceFactory:
            def create_invoice(self, order_id: str, total_cents: int) -> Invoice:
                return Invoice(order_id=order_id, total_cents=total_cents)


        class InvoiceService:
            def __init__(self, factory: InvoiceFactory, mailer) -> None:
                self._factory = factory
                self._mailer = mailer
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            order_id: str
            total_cents: int


        class InvoiceFactory:
            def create_invoice(self, order_id: str, total_cents: int) -> Invoice:
                return Invoice(order_id=order_id, total_cents=total_cents)


        class InvoiceService:
            def __init__(self, factory: InvoiceFactory, mailer) -> None:
                self._factory = factory
                self._mailer = mailer

            def issue(self, order_id: str, total_cents: int) -> Invoice:
                invoice = self._factory.create_invoice(order_id, total_cents)
                self._mailer.deliver(invoice)
                return invoice
    expected_output:
      outcome: valid
  - name: adds an invoice sender beside the invoice factory
    inputs:
      file: billing/invoicing.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            order_id: str
            total_cents: int


        class InvoiceFactory:
            def create_invoice(self, order_id: str, total_cents: int) -> Invoice:
                return Invoice(order_id=order_id, total_cents=total_cents)
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Invoice:
            order_id: str
            total_cents: int


        class InvoiceFactory:
            def create_invoice(self, order_id: str, total_cents: int) -> Invoice:
                return Invoice(order_id=order_id, total_cents=total_cents)


        class InvoiceSender:
            def __init__(self, mailer) -> None:
                self._mailer = mailer

            def send(self, invoice: Invoice) -> None:
                self._mailer.deliver(invoice)
    expected_output:
