  - name: adds a refund factory beside the invoice factory
    inputs:
      file: billing/factories.py
      before: |
        from billing.documents import Invoice


        class InvoiceFactory:
            def create_invoice(self, order_id: str, total_cents: int) -> Invoice:
                return Invoice(order_id=order_id, total_cents=total_cents)
      after: |
        from billing.documents import Invoice, Refund


        class InvoiceFactory:
            def create_invoice(self, order_id: str, total_cents: int) -> Invoice:
                return Invoice(order_id=order_id, total_cents=total_cents)


        class RefundFactory:
            def create_refund(self, invoice: Invoice, cents: int) -> Refund:
                return Refund(order_id=invoice.order_id, cents=min(cents, invoice.total_cents))
    expected_output:
      outcome: valid
  - name: adds a second monthly revenue report in another module
    inputs:
      file: reports/finance_dashboard.py
      after: |
        from collections import defaultdict


        class FinanceDashboard:
            def __init__(self, orders) -> None:
                self._orders = orders

            def revenue_by_month(self) -> dict[str, int]:
                totals: defaultdict[str, int] = defaultdict(int)
                for order in self._orders.paid():
                    totals[order.paid_at.strftime("%Y-%m")] += order.total_cents
                return dict(totals)
      unchanged:
        reports/monthly_revenue.py: |
          from collections import Counter


          class MonthlyRevenueReport:
              def __init__(self, orders) -> None:
                  self._orders = orders

              def by_month(self) -> dict[str, int]:
                  totals: Counter[str] = Counter()
                  for order in self._orders.paid():
                      totals[order.paid_at.strftime("%Y-%m")] += order.total_cents
                  return dict(totals)
    expected_output:
      outcome: invalid
  - name: adds a dashboard that reads the monthly revenue report
    inputs:
      file: reports/finance_dashboard.py
      after: |
        from reports.monthly_revenue import MonthlyRevenueReport


        class FinanceDashboard:
            def __init__(self, revenue: MonthlyRevenueReport) -> None:
                self._revenue = revenue

            def best_month(self) -> str:
                by_month = self._revenue.by_month()
                return max(by_month, key=by_month.__getitem__)
      unchanged:
        reports/monthly_revenue.py: |
          from collections import Counter


          class MonthlyRevenueReport:
              def __init__(self, orders) -> None:
                  self._orders = orders

              def by_month(self) -> dict[str, int]:
                  totals: Counter[str] = Counter()
                  for order in self._orders.paid():
                      totals[order.paid_at.strftime("%Y-%m")] += order.total_cents
                  return dict(totals)
    expected_output:
      outcome: valid
  - name: adds a second pydantic model of the same carrier rate response
    inputs:
      file: carriers/rate_response.py
      after: |
        from pydantic import BaseModel


        class CarrierRateResponse(BaseModel):
            service_code: str
            total_cents: int
            transit_days: int
      unchanged:
        carriers/rate_api.py: |
          from pydantic import BaseModel


          class RateApiResponse(BaseModel):
              service_code: str
              total_cents: int
              transit_days: int


          def fetch_rate(http, shipment_id: str) -> RateApiResponse:
              return RateApiResponse.model_validate(http.get(f"/rates/{shipment_id}").json())
        carriers/quotes.py: |
          from carriers.rate_response import CarrierRateResponse


          def fetch_quote(http, shipment_id: str) -> CarrierRateResponse:
              return CarrierRateResponse.model_validate(http.get(f"/rates/{shipment_id}").json())
    expected_output:
      outcome: invalid
  - name: maps a row to a payload
    inputs:
      file: billing/invoice_sync.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class InvoiceRow:
            invoice_id: str
            total_cents: int


        @dataclass(frozen=True)
        class InvoicePayload:
            invoice_id: str
            total_cents: int


        def to_payload(row: InvoiceRow) -> InvoicePayload:
            return InvoicePayload(invoice_id=row.invoice_id, total_cents=row.total_cents)
    expected_output:
      outcome: valid
  - name: overrides the pricing method in a subclass
    inputs:
      file: pricing/wholesale.py
      after: |
        from pricing.price_list import PriceList


        class WholesalePriceList(PriceList):
            def price(self, sku: str, quantity: int) -> int:
                return super().price(sku, quantity) * 80 // 100
      unchanged:
        pricing/price_list.py: |
          class PriceList:
              def __init__(self, cents_by_sku: dict[str, int]) -> None:
                  self._cents_by_sku = cents_by_sku

              def price(self, sku: str, quantity: int) -> int:
                  return self._cents_by_sku[sku] * quantity
    expected_output:
      outcome: valid
  - name: adds retries to invoice delivery
    inputs:
      file: billing/invoicing.py
      before: |
        class InvoiceService:
            def __init__(self, mailer) -> None:
                self._mailer = mailer

            def send(self, invoice) -> None:
                self._mailer.deliver(invoice)
      after: |
        class InvoiceService:
            def __init__(self, mailer) -> None:
                self._mailer = mailer

            def send(self, invoice) -> None:
                self._mailer.deliver(invoice, retries=3)
    expected_output:
      outcome: skipped
  - name: bumps the service retry count
    inputs:
      file: billing/invoicing.py
      before: |
        class InvoiceService:
            retries = 1
      after: |
        class InvoiceService:
            retries = 2
    expected_output:
      outcome: skipped
