  - name: validates extracted documents with imported functions an ingest function already chains
    inputs:
      file: documents/bulk.py
      unchanged:
        documents/ingest.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Extracted:
              fields: dict[str, str]


          @dataclass(frozen=True)
          class Validated:
              fields: dict[str, str]


          def extract(document: bytes) -> Extracted:
              return Extracted(fields={"size": str(len(document))})


          def validate(extracted: Extracted) -> Validated:
              return Validated(fields=dict(extracted.fields))


          def ingest(document: bytes) -> Validated:
              return validate(extract(document))
      after: |
        from documents.ingest import Validated, extract, validate


        def ingest_all(documents: list[bytes]) -> list[Validated]:
            return [validate(extract(document)) for document in documents]
    expected_output:
      outcome: invalid
  - name: indexes extracted documents where the ingest function validates them
    inputs:
      file: documents/bulk.py
      unchanged:
        documents/ingest.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Extracted:
              fields: dict[str, str]


          @dataclass(frozen=True)
          class Validated:
              fields: dict[str, str]


          def extract(document: bytes) -> Extracted:
              return Extracted(fields={"size": str(len(document))})


          def validate(extracted: Extracted) -> Validated:
              return Validated(fields=dict(extracted.fields))


          def ingest(document: bytes) -> Validated:
              return validate(extract(document))
        documents/search.py: |
          from documents.ingest import Extracted


          def index(extracted: Extracted) -> str:
              return ",".join(sorted(extracted.fields))
      after: |
        from documents.ingest import extract
        from documents.search import index


        def index_all(documents: list[bytes]) -> list[str]:
            return [index(extract(document)) for document in documents]
    expected_output:
      outcome: valid
  - name: awaits an async pipeline's stages from a retry worker
    inputs:
      file: payments/settlement.py
      after: |
        from typing import Protocol


        class Authorization(Protocol):
            id: str


        class Receipt(Protocol):
            number: str


        class Authorizer(Protocol):
            async def authorize(self, payment_id: str) -> Authorization: ...


        class Capturer(Protocol):
            async def capture(self, authorization: Authorization) -> Receipt: ...


        class SettlementPipeline:
            def __init__(self, authorizer: Authorizer, capturer: Capturer) -> None:
                self._authorizer = authorizer
                self._capturer = capturer

            async def settle(self, payment_id: str) -> Receipt:
                authorization = await self._authorizer.authorize(payment_id)
                return await self._capturer.capture(authorization)


        class RetryWorker:
            def __init__(self, authorizer: Authorizer, capturer: Capturer) -> None:
                self._authorizer = authorizer
                self._capturer = capturer

            async def retry(self, payment_id: str) -> Receipt:
                authorization = await self._authorizer.authorize(payment_id)
                return await self._capturer.capture(authorization)
    expected_output:
      outcome: invalid
  - name: awaits an async pipeline's settle from a retry worker
    inputs:
      file: payments/settlement.py
      after: |
        from typing import Protocol


        class Authorization(Protocol):
            id: str


        class Receipt(Protocol):
            number: str


        class Authorizer(Protocol):
            async def authorize(self, payment_id: str) -> Authorization: ...


        class Capturer(Protocol):
            async def capture(self, authorization: Authorization) -> Receipt: ...


        class SettlementPipeline:
            def __init__(self, authorizer: Authorizer, capturer: Capturer) -> None:
                self._authorizer = authorizer
                self._capturer = capturer

            async def settle(self, payment_id: str) -> Receipt:
                authorization = await self._authorizer.authorize(payment_id)
                return await self._capturer.capture(authorization)


        class RetryWorker:
            def __init__(self, pipeline: SettlementPipeline) -> None:
                self._pipeline = pipeline

            async def retry(self, payment_id: str) -> Receipt:
                receipt = await self._pipeline.settle(payment_id)
                return receipt
    expected_output:
      outcome: valid
