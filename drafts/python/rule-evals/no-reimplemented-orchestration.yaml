cases:
  - name: chains the pipeline's stages from outside
    inputs:
      file: shipments/fulfillment.py
      after: |
        from typing import Protocol


        class PickPlan(Protocol):
            order_id: str


        class Shipment(Protocol):
            tracking_number: str


        class PickPlanner(Protocol):
            def plan(self, order_id: str) -> PickPlan: ...


        class Packer(Protocol):
            def pack(self, plan: PickPlan) -> Shipment: ...


        class FulfillmentPipeline:
            def __init__(self, planner: PickPlanner, packer: Packer) -> None:
                self.planner = planner
                self.packer = packer

            def run(self, order_id: str) -> Shipment:
                plan = self.planner.plan(order_id)
                return self.packer.pack(plan)


        class ReturnsDesk:
            def __init__(self, pipeline: FulfillmentPipeline) -> None:
                self._pipeline = pipeline

            def reship(self, order_id: str) -> Shipment:
                plan = self._pipeline.planner.plan(order_id)
                return self._pipeline.packer.pack(plan)
    expected_output:
      outcome: invalid
