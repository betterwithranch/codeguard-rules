  - name: returns the orders API's parsed response from a helper
    inputs:
      file: tests/test_orders_api.py
      after: |
        def list_orders(client, customer_id):
            return client.get(f"/customers/{customer_id}/orders/").json()


        def test_lists_customer_orders(client, customer):
            orders = list_orders(client, customer.id)

            assert [order["number"] for order in orders] == ["A-1"]
    expected_output:
      outcome: invalid
  - name: yields the result of running a job from a fixture
    inputs:
      file: tests/test_exports.py
      after: |
        import pytest

        from reports.exports import ExportJob


        @pytest.fixture
        def export_result(tmp_path):
            job = ExportJob(target=tmp_path / "out.csv")
            yield job.run()
            job.cleanup()


        def test_export_writes_every_row(export_result):
            assert export_result.rows_written == 3
    expected_output:
      outcome: invalid
  - name: returns several built lines from a helper
    inputs:
      file: tests/test_orders.py
      after: |
        from shop.orders import Order, OrderLine


        def make_lines(*skus):
            return [OrderLine(sku=sku, price=10, quantity=1) for sku in skus]


        def test_total_sums_lines():
            assert Order(lines=make_lines("A1", "B2")).total == 20
    expected_output:
      outcome: valid
  - name: changes the expected total in a test
    inputs:
      file: tests/test_orders.py
      before: |
        from shop.orders import Order, OrderLine


        def test_total_sums_lines():
            assert Order(lines=[OrderLine(sku="A1", price=10, quantity=1)]).total == 10
      after: |
        from shop.orders import Order, OrderLine


        def test_total_sums_lines():
            assert Order(lines=[OrderLine(sku="A1", price=10, quantity=2)]).total == 20
    expected_output:
      outcome: skipped
  - name: changes a seeding helper that returns nothing
    inputs:
      file: tests/test_orders.py
      before: |
        from shop.orders import Order


        def seed_orders(session):
            session.add(Order(number="A-1"))
      after: |
        from shop.orders import Order


        def seed_orders(session):
            session.add(Order(number="A-2"))
    expected_output:
      outcome: skipped
