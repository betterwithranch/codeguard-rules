  - name: returns overdue invoices from a ledger fixture
    inputs:
      file: tests/test_reminders.py
      after: |
        from datetime import date
        from decimal import Decimal

        import pytest

        from billing.ledger import Ledger
        from billing.reminders import reminder_lines


        @pytest.fixture
        def overdue_invoices(account):
            ledger = Ledger(account)
            ledger.issue(amount=Decimal("100.00"), due=date(2026, 1, 15))
            ledger.issue(amount=Decimal("40.00"), due=date(2026, 3, 15))
            return ledger.overdue_invoices(today=date(2026, 2, 1))


        def test_reminder_lists_each_overdue_amount(overdue_invoices):
            assert reminder_lines(overdue_invoices) == ["100.00 due 2026-01-15"]
    expected_output:
      outcome: invalid
  - name: returns the ledger from a fixture
    inputs:
      file: tests/test_reminders.py
      after: |
        from datetime import date
        from decimal import Decimal

        import pytest

        from billing.ledger import Ledger
        from billing.reminders import reminder_lines


        @pytest.fixture
        def ledger(account):
            ledger = Ledger(account)
            ledger.issue(amount=Decimal("100.00"), due=date(2026, 1, 15))
            ledger.issue(amount=Decimal("40.00"), due=date(2026, 3, 15))
            return ledger


        def test_reminder_lists_each_overdue_amount(ledger):
            overdue = ledger.overdue_invoices(today=date(2026, 2, 1))

            assert reminder_lines(overdue) == ["100.00 due 2026-01-15"]
    expected_output:
      outcome: valid
  - name: filters the ledger's invoices in a comprehension in a fixture
    inputs:
      file: tests/test_reminders.py
      after: |
        from datetime import date
        from decimal import Decimal

        import pytest

        from billing.ledger import Ledger
        from billing.reminders import reminder_lines


        @pytest.fixture
        def overdue_invoices(account):
            ledger = Ledger(account)
            ledger.issue(amount=Decimal("100.00"), due=date(2026, 1, 15))
            ledger.issue(amount=Decimal("40.00"), due=date(2026, 3, 15))
            return [invoice for invoice in ledger.invoices if invoice.due < date(2026, 2, 1)]


        def test_reminder_lists_each_overdue_amount(overdue_invoices):
            assert reminder_lines(overdue_invoices) == ["100.00 due 2026-01-15"]
    expected_output:
      outcome: invalid
  - name: returns a runtime's context from a helper
    inputs:
      file: tests/test_plugins.py
      after: |
        from plugins.runtime import RuntimeConfig, build_runtime


        def plugin_context(name):
            return build_runtime(RuntimeConfig(plugins=[name])).context


        def test_loaded_plugin_is_registered():
            context = plugin_context("audit")

            assert context.plugin_names() == ["audit"]
    expected_output:
      outcome: invalid
  - name: returns a runtime built by its factory from a helper
    inputs:
      file: tests/test_plugins.py
      after: |
        from plugins.runtime import RuntimeConfig, build_runtime


        def make_runtime(name):
            return build_runtime(RuntimeConfig(plugins=[name]))


        def test_loaded_plugin_is_registered():
            runtime = make_runtime("audit")

            assert runtime.context.plugin_names() == ["audit"]
    expected_output:
      outcome: valid
  - name: returns an order built with a builder chain
    inputs:
      file: tests/test_orders.py
      after: |
        from shop.orders import OrderBuilder, ship


        def make_paid_order(total):
            return OrderBuilder().with_total(total).paid().build()


        def test_ship_paid_order_sets_shipped():
            order = make_paid_order(120)

            assert ship(order).status == "shipped"
    expected_output:
      outcome: valid
