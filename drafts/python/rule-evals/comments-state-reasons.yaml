cases:
  - name: narrates a loop with inline comments
    inputs:
      file: invoices/totals.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class InvoiceLine:
            quantity: int
            unit_price_cents: int


        @dataclass(frozen=True)
        class Invoice:
            lines: list[InvoiceLine]

            def total_cents(self) -> int:
                total = 0
                # loop over every line and add quantity times unit price to the total
                for line in self.lines:
                    total += line.quantity * line.unit_price_cents
                # return the total
                return total
    expected_output:
      outcome: invalid
  - name: explains an external API limit
    inputs:
      file: payments/metadata.py
      after: |
        from dataclasses import dataclass

        # Stripe rejects metadata values longer than 500 characters.
        STRIPE_METADATA_VALUE_LIMIT = 500


        @dataclass(frozen=True)
        class PaymentNote:
            text: str

            def stripe_metadata_value(self) -> str:
                return self.text[:STRIPE_METADATA_VALUE_LIMIT]
    expected_output:
      outcome: valid
  - name: notes what the rate used to do
    inputs:
      file: shipments/rates.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            weight_kg: float

            def rate_cents(self) -> int:
                return round(self.weight_kg * 450)
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            weight_kg: float

            def rate_cents(self) -> int:
                # This used to look up the rate in the legacy carrier table.
                return round(self.weight_kg * 450)
    expected_output:
      outcome: invalid
  - name: explains why the rate is rounded up
    inputs:
      file: shipments/rates.py
      before: |
        import math
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            weight_kg: float

            def rate_cents(self) -> int:
                return math.ceil(self.weight_kg * 450)
      after: |
        import math
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            weight_kg: float

            def rate_cents(self) -> int:
                # The carrier bills every started cent, so rounding down under-charges.
                return math.ceil(self.weight_kg * 450)
    expected_output:
      outcome: valid
  - name: notes what the parser does not handle
    inputs:
      file: imports/rows.py
      after: |
        def parse_quantity(text: str) -> int:
            # Doesn't handle negative quantities.
            return int(text.strip())
    expected_output:
      outcome: invalid
  - name: leaves commented-out code in a function
    inputs:
      file: orders/cancel.py
      before: |
        from dataclasses import dataclass


        @dataclass
        class Order:
            status: str

            def cancel(self) -> None:
                self.status = "cancelled"
      after: |
        from dataclasses import dataclass


        @dataclass
        class Order:
            status: str

            def cancel(self) -> None:
                self.status = "cancelled"
                # self.notify_customer()
    expected_output:
      outcome: invalid
  - name: adds a TODO with a tracker link and outside reason
    inputs:
      file: carriers/client.py
      after: |
        CARRIER_API_VERSION = "v1"
        # TODO(#412): move to v2 once the carrier retires v1 in March.
        CARRIER_BASE_URL = f"https://api.carrier.example/{CARRIER_API_VERSION}"
    expected_output:
      outcome: valid
  - name: adds a bare TODO
    inputs:
      file: carriers/client.py
      after: |
        CARRIER_API_VERSION = "v1"
        # TODO: clean this up
        CARRIER_BASE_URL = f"https://api.carrier.example/{CARRIER_API_VERSION}"
    expected_output:
      outcome: invalid
  - name: labels a timeout with the unit its name already says
    inputs:
      file: carriers/settings.py
      after: |
        CARRIER_TIMEOUT_SECONDS = 30  # seconds
    expected_output:
      outcome: invalid
  - name: notes the gateway idle limit behind a timeout
    inputs:
      file: carriers/settings.py
      after: |
        CARRIER_TIMEOUT_SECONDS = 30  # the carrier gateway drops idle sockets after 35 seconds
    expected_output:
      outcome: valid
  - name: heads each step of a Django view with a comment
    inputs:
      file: shop/views.py
      after: |
        from django.http import HttpRequest, HttpResponse
        from django.shortcuts import get_object_or_404, render

        from shop.models import Order


        def order_detail(request: HttpRequest, number: str) -> HttpResponse:
            # get the order
            order = get_object_or_404(Order, number=number, customer=request.user)
            # render the template
            return render(request, "shop/order.html", {"order": order})
    expected_output:
      outcome: invalid
  - name: adds a noqa directive
    inputs:
      file: shipments/rates.py
      before: |
        RATES_URL = "https://rates.example.com/v1/rates/parcels/domestic/standard/by-weight"
      after: |
        RATES_URL = "https://rates.example.com/v1/rates/parcels/domestic/standard/by-weight"  # noqa: E501
    expected_output:
      outcome: skipped
  - name: changes the shipping rate multiplier
    inputs:
      file: shipments/rates.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            weight_kg: float

            def rate_cents(self) -> int:
                return round(self.weight_kg * 450)
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Shipment:
            weight_kg: float

            def rate_cents(self) -> int:
                return round(self.weight_kg * 475)
    expected_output:
      outcome: skipped
