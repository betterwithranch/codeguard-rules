  - name: approves a Django expense report in a fixture
    inputs:
      file: expenses/tests/test_reimbursement.py
      after: |
        import pytest

        from expenses.models import ExpenseReport


        @pytest.fixture
        def approved_report(db, employee):
            report = ExpenseReport.objects.create(owner=employee, total_cents=4200)
            report.approve(by="manager@example.com")
            return report


        def test_reimburse_marks_report_paid(approved_report):
            approved_report.reimburse()

            approved_report.refresh_from_db()
            assert approved_report.status == ExpenseReport.Status.PAID
    expected_output:
      outcome: invalid
  - name: enables a feature flag and starts a worker in fixtures
    inputs:
      file: expenses/tests/test_reimbursement.py
      after: |
        import pytest

        from expenses.models import ExpenseReport
        from expenses.worker import ReimbursementWorker


        @pytest.fixture(autouse=True)
        def instant_payouts(settings):
            settings.FEATURES = {"instant_payouts": True}


        @pytest.fixture
        def worker():
            worker = ReimbursementWorker(queue="test")
            worker.start()
            yield worker
            worker.stop()


        def test_reimburse_marks_report_paid(db, employee, worker):
            report = ExpenseReport.objects.create(owner=employee, total_cents=4200)
            report.approve(by="manager@example.com")

            report.reimburse()

            worker.drain()
            report.refresh_from_db()
            assert report.status == ExpenseReport.Status.PAID
    expected_output:
      outcome: valid
  - name: adds an item through the test client in a fixture
    inputs:
      file: shop/tests/test_checkout_view.py
      after: |
        import pytest

        from shop.models import Cart


        @pytest.fixture
        def cart_with_book(client, customer):
            cart = Cart.objects.create(owner=customer)
            client.post(f"/carts/{cart.pk}/items/", {"sku": "BOOK-1", "quantity": 1})
            return cart


        def test_checkout_empties_the_cart(client, cart_with_book):
            client.post(f"/carts/{cart_with_book.pk}/checkout/")

            assert cart_with_book.items.count() == 0
    expected_output:
      outcome: invalid
  - name: logs the test client in within a fixture
    inputs:
      file: shop/tests/test_checkout_view.py
      after: |
        import pytest

        from shop.models import Cart


        @pytest.fixture
        def signed_in_client(client, customer):
            client.force_login(customer.user)
            return client


        def test_checkout_empties_the_cart(signed_in_client, customer):
            cart = Cart.objects.create(owner=customer)
            signed_in_client.post(f"/carts/{cart.pk}/items/", {"sku": "BOOK-1", "quantity": 1})

            signed_in_client.post(f"/carts/{cart.pk}/checkout/")

            assert cart.items.count() == 0
    expected_output:
      outcome: valid
  - name: runs an export job in an async fixture
    inputs:
      file: tests/test_exports.py
      after: |
        import pytest_asyncio

        from reports.exports import ExportJob


        @pytest_asyncio.fixture
        async def running_export(tmp_path):
            job = ExportJob(target=tmp_path / "out.csv")
            await job.begin()
            return job


        async def test_cancel_removes_partial_file(running_export, tmp_path):
            await running_export.cancel()

            assert not (tmp_path / "out.csv").exists()
    expected_output:
      outcome: invalid
  - name: changes an asserted status in a test
    inputs:
      file: tests/test_fulfillment.py
      before: |
        from orders.fulfillment import FulfillmentWorkflow
        from orders.models import Order


        def test_ship_marks_order_shipped():
            workflow = FulfillmentWorkflow()
            workflow.start(Order(id="ord-1", total=120))

            workflow.ship("ord-1")

            assert workflow.status("ord-1") == "shipped"
      after: |
        from orders.fulfillment import FulfillmentWorkflow
        from orders.models import Order


        def test_ship_marks_order_shipped():
            workflow = FulfillmentWorkflow()
            workflow.start(Order(id="ord-1", total=120))

            workflow.ship("ord-1")

            assert workflow.status("ord-1") == "in_transit"
    expected_output:
      outcome: skipped
