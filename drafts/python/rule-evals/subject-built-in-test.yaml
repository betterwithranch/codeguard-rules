  - name: saves through a repository a fixture builds
    inputs:
      file: tests/test_order_repository.py
      after: |
        import pytest
        from sqlalchemy.orm import Session

        from shop.orders import Order, OrderRepository


        @pytest.fixture
        def order_repository(db_session: Session) -> OrderRepository:
            return OrderRepository(db_session)


        def test_get_returns_saved_order(order_repository):
            order_repository.save(Order(id="ord-1", total=120))

            found = order_repository.get("ord-1")

            assert found == Order(id="ord-1", total=120)
    expected_output:
      outcome: invalid
