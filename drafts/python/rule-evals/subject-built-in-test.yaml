  - name: cancels a Django order a fixture creates
    inputs:
      file: shop/tests/test_order_cancel.py
      after: |
        import pytest

        from shop.models import Order


        @pytest.fixture
        def order(db):
            return Order.objects.create(number="A-1", status=Order.Status.PLACED)


        def test_cancel_marks_order_cancelled(order):
            order.cancel(reason="customer request")

            order.refresh_from_db()
            assert order.status == Order.Status.CANCELLED
    expected_output:
      outcome: invalid
  - name: posts a cancel request through the Django test client
    inputs:
      file: shop/tests/test_order_cancel.py
      after: |
        import pytest

        from shop.models import Order


        @pytest.mark.django_db
        def test_cancel_view_marks_order_cancelled(client):
            order = Order.objects.create(number="A-1", status=Order.Status.PLACED)

            client.post(f"/orders/{order.pk}/cancel/", {"reason": "customer request"})

            order.refresh_from_db()
            assert order.status == Order.Status.CANCELLED
    expected_output:
      outcome: valid
  - name: parses with each parser from the parametrize list
    inputs:
      file: tests/test_parsers.py
      after: |
        import pytest

        from imports.parsers import CsvParser, JsonParser


        @pytest.mark.parametrize(
            ("parser", "text"),
            [(CsvParser(), "sku,qty\nA1,2\n"), (JsonParser(), '[{"sku": "A1", "qty": 2}]')],
        )
        def test_parse_reads_quantity(parser, text):
            rows = parser.parse(text)

            assert rows[0].quantity == 2
    expected_output:
      outcome: valid
