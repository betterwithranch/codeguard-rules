  - name: acts on a service that setUp builds
    inputs:
      file: tests/test_invoices.py
      after: |
        import unittest

        from billing.invoices import InvoiceService
        from tests.fakes import FakeLedger


        class InvoicePaymentTest(unittest.TestCase):
            def setUp(self):
                self.ledger = FakeLedger(currency="EUR")
                self.service = InvoiceService(self.ledger)

            def test_pay_records_ledger_entry(self):
                self.service.issue("inv-42", amount=120)

                self.service.pay("inv-42")

                self.assertEqual(self.ledger.entries_for("inv-42"), [120])
    expected_output:
      outcome: invalid
