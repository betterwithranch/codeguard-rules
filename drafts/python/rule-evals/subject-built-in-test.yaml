  - name: maps with a mapper fixture in a test class
    inputs:
      file: tests/test_invoice_mapper.py
      after: |
        import pytest

        from billing.invoices import Invoice
        from billing.mapper import InvoiceMapper, MappingRules


        @pytest.fixture
        def mapper():
            return InvoiceMapper(MappingRules(currency="EUR"))


        class TestInvoiceMapper:
            def test_map_reads_number_and_total(self, mapper):
                invoice = mapper.map({"no": "42", "sum": "120.00"})

                assert invoice == Invoice(number="42", total=120, currency="EUR")
    expected_output:
      outcome: invalid
  - name: builds the mapper through a helper in a test class
    inputs:
      file: tests/test_invoice_mapper.py
      after: |
        import pytest

        from billing.invoices import Invoice
        from billing.mapper import InvoiceMapper, MappingRules


        @pytest.fixture
        def rules():
            return MappingRules(currency="EUR")


        def make_mapper(rules):
            return InvoiceMapper(rules)


        class TestInvoiceMapper:
            def test_map_reads_number_and_total(self, rules):
                mapper = make_mapper(rules)

                invoice = mapper.map({"no": "42", "sum": "120.00"})

                assert invoice == Invoice(number="42", total=120, currency="EUR")
    expected_output:
      outcome: valid
  - name: submits through a workflow fixture in an async test
    inputs:
      file: tests/test_checkout.py
      after: |
        import pytest

        from orders.checkout import CheckoutWorkflow, Status
        from tests.fakes import FakePaymentGateway


        @pytest.fixture
        def workflow():
            return CheckoutWorkflow(FakePaymentGateway())


        async def test_submit_waits_for_payment(workflow):
            result = await workflow.submit(order_id="ord-1")

            assert result.status == Status.WAITING
    expected_output:
      outcome: invalid
