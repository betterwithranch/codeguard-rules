cases:
  - name: unit tests a pure function under integration
    inputs:
      file: tests/integration/test_pricing.py
      after: |
        from decimal import Decimal

        from shop.pricing import apply_discount


        def test_apply_discount_takes_ten_percent_off():
            assert apply_discount(Decimal("100.00"), Decimal("0.10")) == Decimal("90.00")


        def test_apply_discount_of_zero_keeps_the_price():
            assert apply_discount(Decimal("100.00"), Decimal("0")) == Decimal("100.00")
    expected_output:
      outcome: invalid
  - name: adds a single-function test to integration
    inputs:
      file: tests/integration/test_checkout.py
      before: |
        from shop.app import build_app
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]
      after: |
        from decimal import Decimal

        from shop.app import build_app
        from shop.pricing import line_total
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]


        def test_line_total_multiplies_price_by_quantity():
            assert line_total(Decimal("12.50"), 3) == Decimal("37.50")
    expected_output:
      outcome: invalid
  - name: checks an order reaches the shipping queue
    inputs:
      file: tests/integration/test_checkout.py
      after: |
        from shop.app import build_app
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]
    expected_output:
      outcome: valid
  - name: validates one DRF serializer in the integration suite
    inputs:
      file: tests/integration/test_order_serializer.py
      after: |
        from shop.serializers import OrderSerializer


        def test_order_serializer_rejects_a_zero_quantity():
            serializer = OrderSerializer(data={"sku": "BOOK-1", "quantity": 0})

            assert not serializer.is_valid()
            assert serializer.errors == {"quantity": ["Ensure this value is greater than or equal to 1."]}
    expected_output:
      outcome: invalid
  - name: posts an order through the API and reads the stored row
    inputs:
      file: tests/integration/test_order_api.py
      after: |
        import pytest

        from shop.models import Order


        @pytest.mark.django_db
        def test_posting_an_order_stores_it(client):
            response = client.post("/api/orders/", {"sku": "BOOK-1", "quantity": 2}, content_type="application/json")

            assert response.status_code == 201
            assert list(Order.objects.values_list("sku", "quantity")) == [("BOOK-1", 2)]
    expected_output:
      outcome: valid
  - name: calls one model method in a Django integration test case
    inputs:
      file: tests/integration/test_order_model.py
      after: |
        from decimal import Decimal

        from django.test import TestCase

        from shop.models import Order


        class OrderModelTests(TestCase):
            def test_total_with_tax_adds_twenty_percent(self):
                order = Order(subtotal=Decimal("10.00"))

                self.assertEqual(order.total_with_tax(), Decimal("12.00"))
    expected_output:
      outcome: invalid
  - name: saves through a service and reads the row from the database
    inputs:
      file: tests/integration/test_invoice_service.py
      after: |
        from decimal import Decimal

        from billing.invoices import InvoiceService
        from billing.repositories import InvoiceRepository


        def test_create_stores_the_invoice_with_tax(db_session):
            service = InvoiceService(InvoiceRepository(db_session))

            invoice = service.create(amount=Decimal("100.00"), region="CA")

            assert InvoiceRepository(db_session).get(invoice.id).total == Decimal("108.00")
    expected_output:
      outcome: valid
  - name: validates one pydantic model in the end-to-end suite
    inputs:
      file: tests/e2e/test_webhook_payload.py
      after: |
        import pytest
        from pydantic import ValidationError

        from payments.webhooks import ChargeEvent


        def test_charge_event_requires_an_amount():
            with pytest.raises(ValidationError):
                ChargeEvent.model_validate({"id": "evt_1", "type": "charge.succeeded"})
    expected_output:
      outcome: invalid
  - name: publishes an event and checks the consumer's side effect
    inputs:
      file: tests/e2e/test_shipping_events.py
      after: |
        from shipping.app import build_app


        def test_paid_order_event_creates_a_shipment():
            app = build_app()

            app.events.publish("order.paid", {"order_id": "ord-1", "sku": "BOOK-1"})
            app.workers.drain()

            assert [shipment.order_id for shipment in app.shipments.pending()] == ["ord-1"]
    expected_output:
      outcome: valid
  - name: tests one parser's arithmetic in a file named for integration
    inputs:
      file: tests/test_payments_integration.py
      after: |
        from decimal import Decimal

        from payments.amounts import parse_amount


        class TestParseAmount:
            def test_parse_amount_reads_thousands_separators(self):
                assert parse_amount("1,000.50") == Decimal("1000.50")
    expected_output:
      outcome: invalid
  - name: runs the import pipeline end to end
    inputs:
      file: tests/test_orders_e2e.py
      after: |
        from orders.pipeline import build_pipeline


        def test_pipeline_imports_validates_and_stores_orders(tmp_path, order_store):
            source = tmp_path / "orders.csv"
            source.write_text("id,sku,quantity\nord-1,BOOK-1,2\n")

            build_pipeline(store=order_store).run(source)

            assert [(order.id, order.quantity) for order in order_store.all()] == [("ord-1", 2)]
    expected_output:
      outcome: valid
  - name: changes the app factory import path
    inputs:
      file: tests/integration/test_checkout.py
      before: |
        from shop.app import build_app
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]
      after: |
        from shop.bootstrap import build_app
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]
    expected_output:
      outcome: skipped
  - name: adds a fixture to the integration suite
    inputs:
      file: tests/integration/test_checkout.py
      before: |
        from shop.app import build_app
      after: |
        import pytest

        from shop.app import build_app


        @pytest.fixture
        def app():
            return build_app()
    expected_output:
      outcome: skipped
