# yaml-language-server: $schema=rule-eval-schema.json
cases:
  - name: unit tests a pure function under integration
    inputs:
      file: tests/integration/test_pricing.py
      after: |
        from decimal import Decimal

        from shop.pricing import apply_discount


        def test_apply_discount_takes_ten_percent_off():
            assert apply_discount(Decimal("100.00"), Decimal("0.10")) == Decimal("90.00")


        def test_apply_discount_of_zero_keeps_the_price():
            assert apply_discount(Decimal("100.00"), Decimal("0")) == Decimal("100.00")
    expected_output:
      outcome: invalid
  - name: adds a single-function test to integration
    inputs:
      file: tests/integration/test_checkout.py
      before: |
        from shop.app import build_app
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]
      after: |
        from decimal import Decimal

        from shop.app import build_app
        from shop.pricing import line_total
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]


        def test_line_total_multiplies_price_by_quantity():
            assert line_total(Decimal("12.50"), 3) == Decimal("37.50")
    expected_output:
      outcome: invalid
  - name: checks an order reaches the shipping queue
    inputs:
      file: tests/integration/test_checkout.py
      after: |
        from shop.app import build_app
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]
    expected_output:
      outcome: valid
  - name: changes the app factory import path
    inputs:
      file: tests/integration/test_checkout.py
      before: |
        from shop.app import build_app
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]
      after: |
        from shop.bootstrap import build_app
        from shop.shipping import Shipment


        def test_placed_order_reaches_the_shipping_queue():
            app = build_app()
            customer = app.customers.register(email="ana@example.com")
            order = app.checkout.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)

            assert app.shipping.pending_shipments() == [
                Shipment(order_id=order.id, sku="BOOK-1", quantity=2)
            ]
    expected_output:
      outcome: skipped
