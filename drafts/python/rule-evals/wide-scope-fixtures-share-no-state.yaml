  - name: changes a test that uses a session fixture
    inputs:
      file: tests/test_order_lookup.py
      before: |
        import pytest

        from orders.lookup import find_order


        @pytest.fixture(scope="session")
        def order_ids():
            return ("ord-1", "ord-2")


        def test_find_order_finds_the_first_order(order_ids, seeded_db):
            assert find_order(seeded_db, order_ids[0]).id == "ord-1"
      after: |
        import pytest

        from orders.lookup import find_order


        @pytest.fixture(scope="session")
        def order_ids():
            return ("ord-1", "ord-2")


        def test_find_order_finds_the_second_order(order_ids, seeded_db):
            assert find_order(seeded_db, order_ids[1]).id == "ord-2"
    expected_output:
      outcome: skipped
