cases:
  - name: defines a notifier ABC beside its implementer for checkout to use
    inputs:
      file: notifications/base.py
      unchanged:
        notifications/sms.py: |
          from notifications.base import Notifier
          from notifications.twilio import TwilioClient


          class SmsNotifier(Notifier):
              def __init__(self, client: TwilioClient) -> None:
                  self._client = client

              def notify(self, recipient: str, text: str) -> None:
                  self._client.send_sms(recipient, text)
        orders/checkout.py: |
          from notifications.base import Notifier


          class Checkout:
              def __init__(self, notifier: Notifier) -> None:
                  self._notifier = notifier

              def complete(self, phone: str, order_number: str) -> None:
                  self._notifier.notify(phone, f"Order {order_number} confirmed")
      after: |
        from abc import ABC, abstractmethod


        class Notifier(ABC):
            @abstractmethod
            def notify(self, recipient: str, text: str) -> None: ...
    expected_output:
      outcome: invalid
