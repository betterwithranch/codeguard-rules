  - name: changes a function in a module without interfaces
    inputs:
      file: billing/invoicing.py
      before: |
        def settle_note(total_cents: int) -> str:
            return f"Settled {total_cents / 100:.2f}"
      after: |
        def settle_note(total_cents: int) -> str:
            return f"Settled {total_cents / 100:.2f} EUR"
    expected_output:
      outcome: skipped
