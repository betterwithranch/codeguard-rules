  - name: edits a backoff policy kept beside the dispatcher
    inputs:
      file: notifications/dispatcher.py
      before: |
        class NotificationDispatcher:
            def __init__(self, transport) -> None:
                self._transport = transport

            def send(self, message: str) -> None:
                self._transport.deliver(message)


        class RetryBackoffPolicy:
            def delay(self, attempt: int) -> float:
                return 0.5 * 2**attempt
      after: |
        class NotificationDispatcher:
            def __init__(self, transport) -> None:
                self._transport = transport

            def send(self, message: str) -> None:
                self._transport.deliver(message)


        class RetryBackoffPolicy:
            def delay(self, attempt: int) -> float:
                return min(0.5 * 2**attempt, 30.0)
    expected_output:
      outcome: invalid
  - name: keeps a service's request and result dataclasses with it
    inputs:
      file: shipping/rate_quoter.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class QuoteRequest:
            origin_zip: str
            destination_zip: str
            weight_grams: int


        @dataclass(frozen=True)
        class Quote:
            carrier: str
            cents: int


        class RateQuoter:
            def __init__(self, carriers) -> None:
                self._carriers = carriers

            def cheapest(self, request: QuoteRequest) -> Quote:
                quotes = [carrier.quote(request) for carrier in self._carriers]
                return min(quotes, key=lambda quote: quote.cents)
    expected_output:
      outcome: valid
