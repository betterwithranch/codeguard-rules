  - name: adds an audit logger beside a pydantic request model
    inputs:
      file: refunds/refund_request.py
      before: |
        from pydantic import BaseModel


        class RefundRequest(BaseModel):
            order_id: str
            cents: int
      after: |
        import logging

        from pydantic import BaseModel


        class RefundRequest(BaseModel):
            order_id: str
            cents: int


        class AuditLogger:
            def __init__(self, logger: logging.Logger) -> None:
                self._logger = logger

            def record(self, actor: str, action: str) -> None:
                self._logger.info("%s %s", actor, action)
    expected_output:
