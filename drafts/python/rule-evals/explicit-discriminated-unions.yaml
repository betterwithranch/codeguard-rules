cases:
  - name: parses an untagged union of payment models
    inputs:
      file: payments/methods.py
      after: |
        from pydantic import BaseModel


        class CardPayment(BaseModel):
            card_token: str
            amount_cents: int


        class BankTransfer(BaseModel):
            iban: str
            amount_cents: int


        type PaymentMethod = CardPayment | BankTransfer


        class CheckoutRequest(BaseModel):
            order_id: str
            payment: PaymentMethod
    expected_output:
      outcome: invalid
  - name: drops the payment union's discriminator
    inputs:
      file: payments/methods.py
      before: |
        from typing import Annotated, Literal

        from pydantic import BaseModel, Field


        class CardPayment(BaseModel):
            kind: Literal["card"] = "card"
            card_token: str
            amount_cents: int


        class BankTransfer(BaseModel):
            kind: Literal["bank_transfer"] = "bank_transfer"
            iban: str
            amount_cents: int


        PaymentMethod = Annotated[CardPayment | BankTransfer, Field(discriminator="kind")]


        class CheckoutRequest(BaseModel):
            order_id: str
            payment: PaymentMethod
      after: |
        from typing import Literal

        from pydantic import BaseModel


        class CardPayment(BaseModel):
            kind: Literal["card"] = "card"
            card_token: str
            amount_cents: int


        class BankTransfer(BaseModel):
            kind: Literal["bank_transfer"] = "bank_transfer"
            iban: str
            amount_cents: int


        PaymentMethod = CardPayment | BankTransfer


        class CheckoutRequest(BaseModel):
            order_id: str
            payment: PaymentMethod
    expected_output:
      outcome: invalid
