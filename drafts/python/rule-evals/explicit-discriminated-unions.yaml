  - name: parses webhook TypedDicts through an untagged TypeAdapter
    inputs:
      file: webhooks/events.py
      after: |
        from typing import TypedDict

        from pydantic import TypeAdapter


        class ItemCreated(TypedDict):
            item_id: str
            name: str


        class ItemDeleted(TypedDict):
            item_id: str


        EVENTS = TypeAdapter(list[ItemCreated | ItemDeleted])


        def parse_events(body: bytes) -> list[ItemCreated | ItemDeleted]:
            return EVENTS.validate_json(body)
    expected_output:
      outcome: invalid
  - name: parses webhook TypedDicts through a discriminated TypeAdapter
    inputs:
      file: webhooks/events.py
      after: |
        from typing import Annotated, Literal, TypedDict

        from pydantic import Field, TypeAdapter


        class ItemCreated(TypedDict):
            type: Literal["item.created"]
            item_id: str
            name: str


        class ItemDeleted(TypedDict):
            type: Literal["item.deleted"]
            item_id: str


        type ItemEvent = Annotated[ItemCreated | ItemDeleted, Field(discriminator="type")]

        EVENTS = TypeAdapter(list[ItemEvent])


        def parse_events(body: bytes) -> list[ItemEvent]:
            return EVENTS.validate_json(body)
    expected_output:
      outcome: valid
