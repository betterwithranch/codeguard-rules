  - name: decodes untagged msgspec structs
    inputs:
      file: telemetry/decode.py
      after: |
        import msgspec


        class CpuSample(msgspec.Struct):
            host: str
            percent: float


        class MemorySample(msgspec.Struct):
            host: str
            used_bytes: int


        def decode(raw: bytes) -> CpuSample | MemorySample:
            return msgspec.json.decode(raw, type=CpuSample | MemorySample)
    expected_output:
      outcome: invalid
  - name: decodes tagged msgspec structs
    inputs:
      file: telemetry/decode.py
      after: |
        import msgspec


        class CpuSample(msgspec.Struct, tag_field="metric", tag="cpu"):
            host: str
            percent: float


        class MemorySample(msgspec.Struct, tag_field="metric", tag="memory"):
            host: str
            used_bytes: int


        def decode(raw: bytes) -> CpuSample | MemorySample:
            return msgspec.json.decode(raw, type=CpuSample | MemorySample)
    expected_output:
      outcome: valid
  - name: matches a union of dataclasses the code builds
    inputs:
      file: pricing/adjustments.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class PercentOff:
            percent: int


        @dataclass(frozen=True)
        class FixedOff:
            cents: int


        type Adjustment = PercentOff | FixedOff


        def loyalty_adjustment(years: int) -> Adjustment:
            return PercentOff(percent=5) if years > 3 else FixedOff(cents=200)


        def apply(adjustment: Adjustment, total_cents: int) -> int:
            match adjustment:
                case PercentOff(percent=percent):
                    return total_cents * (100 - percent) // 100
                case FixedOff(cents=cents):
                    return max(total_cents - cents, 0)
    expected_output:
      outcome: valid
  - name: adds an amount field to tagged variants
