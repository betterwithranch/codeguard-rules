cases:
  - name: returns a dataclass bundle of customer and cart
    inputs:
      file: tests/test_checkout.py
      after: |
        from dataclasses import dataclass

        from sqlalchemy.orm import Session

        from shop.carts import Cart, CartService
        from shop.checkout import checkout
        from shop.customers import Customer, CustomerService


        @dataclass
        class CheckoutSetup:
            customer: Customer
            cart: Cart


        def make_checkout_setup(db_session: Session, sku: str) -> CheckoutSetup:
            customer = CustomerService(db_session).register(email="ana@example.com")
            cart = CartService(db_session).create(customer_id=customer.id)
            cart.add(sku=sku, quantity=1)
            return CheckoutSetup(customer=customer, cart=cart)


        def test_checkout_charges_the_customer(db_session):
            setup = make_checkout_setup(db_session, sku="BOOK-1")

            receipt = checkout(setup.cart)

            assert receipt.customer_id == setup.customer.id
    expected_output:
      outcome: invalid
  - name: defines a fake ledger with behavior
    inputs:
      file: tests/fakes.py
      after: |
        from dataclasses import dataclass, field


        @dataclass
        class FakeLedger:
            currency: str = "EUR"
            entries: list[tuple[str, int]] = field(default_factory=list)

            def record(self, invoice_number: str, amount: int) -> None:
                self.entries.append((invoice_number, amount))

            def balance(self) -> int:
                return sum(amount for _, amount in self.entries)
    expected_output:
      outcome: valid
  - name: bundles an order and its service in a NamedTuple
    inputs:
      file: tests/conftest.py
      after: |
        from typing import NamedTuple

        import pytest

        from shop.orders import Order, OrderService


        class OrderResources(NamedTuple):
            order: Order
            service: OrderService


        @pytest.fixture
        def order_resources(db_session, customer) -> OrderResources:
            service = OrderService(db_session)
            order = service.place_order(customer_id=customer.id, sku="BOOK-1", quantity=2)
            return OrderResources(order=order, service=service)
    expected_output:
      outcome: invalid
  - name: defines a parametrize case type of literal inputs
    inputs:
      file: tests/test_tax.py
      after: |
        from dataclasses import dataclass

        import pytest

        from shop.tax import tax_for


        @dataclass(frozen=True)
        class TaxCase:
            region: str
            total: int
            expected_tax: int


        @pytest.mark.parametrize(
            "case",
            [TaxCase(region="eu", total=100, expected_tax=21), TaxCase(region="us", total=100, expected_tax=8)],
        )
        def test_tax_for_region(case):
            assert tax_for(region=case.region, total=case.total) == case.expected_tax
    expected_output:
      outcome: valid
