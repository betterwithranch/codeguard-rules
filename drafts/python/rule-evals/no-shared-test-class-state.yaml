cases:
  - name: appends to a list class attribute from each test
    inputs:
      file: tests/test_carts.py
      after: |
        from shop.carts import Cart


        class TestCart:
            added_skus = []

            def test_add_records_the_sku(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=1)
                self.added_skus.append("BOOK-1")

                assert cart.skus() == self.added_skus

            def test_add_second_sku_keeps_both(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=1)
                cart.add(sku="PEN-2", quantity=1)
                self.added_skus.append("PEN-2")

                assert cart.skus() == self.added_skus
    expected_output:
      outcome: invalid
  - name: appends to a list set up per test
    inputs:
      file: tests/test_carts.py
      after: |
        from shop.carts import Cart


        class TestCart:
            def setup_method(self):
                self.added_skus = []

            def test_add_records_the_sku(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=1)
                self.added_skus.append("BOOK-1")

                assert cart.skus() == self.added_skus

            def test_add_second_sku_keeps_both(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=1)
                cart.add(sku="PEN-2", quantity=1)
                self.added_skus.extend(["BOOK-1", "PEN-2"])

                assert cart.skus() == self.added_skus
    expected_output:
      outcome: valid
  - name: stores totals in a dict class attribute
    inputs:
      file: tests/test_invoices.py
      after: |
        from decimal import Decimal

        from billing.invoices import Invoice


        class TestInvoiceTotals:
            totals = {}

            def test_single_line_total(self):
                invoice = Invoice(lines=[Decimal("10.00")])
                self.totals["single"] = invoice.total()

                assert self.totals["single"] == Decimal("10.00")

            def test_two_line_total(self):
                invoice = Invoice(lines=[Decimal("10.00"), Decimal("5.00")])
                self.totals["double"] = invoice.total()

                assert self.totals == {"single": Decimal("10.00"), "double": Decimal("15.00")}
    expected_output:
      outcome: invalid
  - name: stores totals in a dict built in setUp
    inputs:
      file: tests/test_invoices.py
      after: |
        import unittest
        from decimal import Decimal

        from billing.invoices import Invoice


        class InvoiceTotalTests(unittest.TestCase):
            def setUp(self):
                self.totals = {}

            def test_single_line_total(self):
                invoice = Invoice(lines=[Decimal("10.00")])
                self.totals["single"] = invoice.total()

                self.assertEqual(self.totals, {"single": Decimal("10.00")})
    expected_output:
      outcome: valid
  - name: hands a cart from one test to the next through the class
    inputs:
      file: tests/test_checkout_flow.py
      after: |
        from shop.carts import Cart
        from shop.checkout import checkout


        class TestCheckoutFlow:
            def test_add_items(self):
                cart = Cart()
                cart.add(sku="BOOK-1", quantity=2)
                TestCheckoutFlow.cart = cart

                assert cart.quantity("BOOK-1") == 2

            def test_checkout_the_cart(self):
                order = checkout(TestCheckoutFlow.cart)

                assert order.status == "placed"
    expected_output:
      outcome: invalid
  - name: adds to a set made in setUpClass
    inputs:
      file: tests/test_ids.py
      after: |
        import unittest

        from orders.ids import next_order_id


        class OrderIdTests(unittest.TestCase):
            @classmethod
            def setUpClass(cls):
                cls.seen = set()

            def test_first_id_is_new(self):
                order_id = next_order_id()
                self.assertNotIn(order_id, self.seen)
                self.seen.add(order_id)

            def test_second_id_is_new(self):
                order_id = next_order_id()
                self.assertNotIn(order_id, self.seen)
                self.seen.add(order_id)
    expected_output:
      outcome: invalid
  - name: records created ids through type(self)
    inputs:
      file: tests/test_orders.py
      after: |
        from shop.orders import create_order


        class TestCreateOrder:
            created = []

            def test_create_returns_a_pending_order(self):
                order = create_order(sku="BOOK-1")
                type(self).created.append(order.id)

                assert order.status == "pending"
    expected_output:
      outcome: invalid
  - name: reads a tuple of skus from the class
    inputs:
      file: tests/test_catalog.py
      after: |
        from shop.catalog import Catalog


        class TestCatalog:
            skus = ("BOOK-1", "PEN-2")

            def test_lookup_finds_each_sku(self):
                catalog = Catalog.default()

                assert [catalog.lookup(sku).sku for sku in self.skus] == ["BOOK-1", "PEN-2"]
    expected_output:
      outcome: valid
  - name: reads a list class attribute no test changes
    inputs:
      file: tests/test_catalog.py
      after: |
        from shop.catalog import Catalog


        class TestCatalog:
            skus = ["BOOK-1", "PEN-2"]

            def test_lookup_finds_each_sku(self):
                catalog = Catalog.default()

                assert [catalog.lookup(sku).sku for sku in self.skus] == self.skus

            def test_all_lists_every_sku(self):
                assert Catalog.default().all_skus() == self.skus
    expected_output:
      outcome: valid
  - name: loads a catalog in setUpClass that tests only read
    inputs:
      file: tests/test_catalog.py
      after: |
        import unittest

        from shop.catalog import load_catalog


        class CatalogTests(unittest.TestCase):
            @classmethod
            def setUpClass(cls):
                cls.catalog = load_catalog("fixtures/catalog.json")

            def test_lookup_finds_the_book(self):
                self.assertEqual(self.catalog.lookup("BOOK-1").name, "Atlas")

            def test_lookup_finds_the_pen(self):
                self.assertEqual(self.catalog.lookup("PEN-2").name, "Fountain pen")
    expected_output:
      outcome: valid
