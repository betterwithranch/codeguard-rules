cases:
- name: patches an internal tax function
  inputs:
    file: tests/test_invoices.py
    after: |
      from decimal import Decimal
      from unittest.mock import patch

      from billing.invoices import InvoiceService


      def test_invoice_total_includes_tax(invoice_repository):
          service = InvoiceService(invoice_repository)
          with patch("billing.invoices.calculate_tax", return_value=Decimal("8.00")):
              invoice = service.create(amount=Decimal("100.00"), region="CA")

          assert invoice.total == Decimal("108.00")
  expected_output:
    outcome: invalid
- name: mocks the invoice repository
  inputs:
    file: tests/test_invoices.py
    before: |
      from decimal import Decimal

      from billing.invoices import InvoiceService
      from billing.repositories import InvoiceRepository


      def test_mark_paid_sets_paid_status(db_session):
          repository = InvoiceRepository(db_session)
          invoice = repository.create(amount=Decimal("100.00"), region="CA")
          service = InvoiceService(repository)

          paid = service.mark_paid(invoice.id)

          assert paid.status == "paid"
    after: |
      from decimal import Decimal
      from unittest.mock import Mock

      from billing.invoices import Invoice, InvoiceService


      def test_mark_paid_sets_paid_status():
          invoice = Invoice(amount=Decimal("100.00"), region="CA")
          repository = Mock()
          repository.get.return_value = invoice
          service = InvoiceService(repository)

          paid = service.mark_paid(invoice.id)

          assert paid.status == "paid"
  expected_output:
    outcome: invalid
