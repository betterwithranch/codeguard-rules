  inputs:
    file: tests/test_session_expiry.py
    unchanged:
      tests/fakes.py: |
        from datetime import datetime


        class FakeClock:
            def __init__(self, current: datetime) -> None:
                self.current = current

            def now(self) -> datetime:
                return self.current
    after: |
      from datetime import datetime, timedelta

      from accounts.sessions import SessionKeeper


      class TickingClock:
          def __init__(self, start, step):
              self.current = start
              self.step = step

          def now(self):
              self.current += self.step
              return self.current


      def test_keeper_expires_a_session_after_two_checks():
          clock = TickingClock(datetime(2026, 3, 1, 9, 0), step=timedelta(minutes=20))
          keeper = SessionKeeper(clock, ttl=timedelta(minutes=30))
          keeper.open("tok-1")

          keeper.check()
          keeper.check()

          assert keeper.open_tokens() == []
