  - name: adds marketing campaigns to the order service
    inputs:
      file: orders/order_service.py
      after: |
        from marketing import Campaign, Mailer

        from .order import Order
        from .repository import OrderRepository


        class OrderService:
            def __init__(self, orders: OrderRepository, mailer: Mailer) -> None:
                self._orders = orders
                self._mailer = mailer

            def place(self, order: Order) -> Order:
                return self._orders.save(order)

            def send_campaign(self, campaign: Campaign) -> None:
