cases:
  - name: takes a whole checkout context for two fields
    inputs:
      file: checkout/tax.py
      after: |
        from dataclasses import dataclass

        from checkout.cart import Cart
        from customers.customer import Customer
        from payments.method import PaymentMethod


        @dataclass(frozen=True)
        class CheckoutContext:
            cart: Cart
            customer: Customer
            payment_method: PaymentMethod
            coupon_code: str | None
            shipping_region: str
            subtotal_cents: int


        class TaxCalculator:
            def __init__(self, rates_by_region: dict[str, float]) -> None:
                self._rates_by_region = rates_by_region

            def tax_cents(self, context: CheckoutContext) -> int:
                return round(context.subtotal_cents * self._rates_by_region[context.shipping_region])
    expected_output:
      outcome: invalid
  - name: widens tax arguments to an imported checkout context
    inputs:
      file: checkout/tax.py
      unchanged:
        checkout/context.py: |
          from dataclasses import dataclass

          from checkout.cart import Cart
          from customers.customer import Customer
          from payments.method import PaymentMethod


          @dataclass(frozen=True)
          class CheckoutContext:
              cart: Cart
              customer: Customer
              payment_method: PaymentMethod
              coupon_code: str | None
              shipping_region: str
              subtotal_cents: int
      before: |
        class TaxCalculator:
            def __init__(self, rates_by_region: dict[str, float]) -> None:
                self._rates_by_region = rates_by_region

            def tax_cents(self, shipping_region: str, subtotal_cents: int) -> int:
                return round(subtotal_cents * self._rates_by_region[shipping_region])
      after: |
        from checkout.context import CheckoutContext


        class TaxCalculator:
            def __init__(self, rates_by_region: dict[str, float]) -> None:
                self._rates_by_region = rates_by_region

            def tax_cents(self, context: CheckoutContext) -> int:
                return round(context.subtotal_cents * self._rates_by_region[context.shipping_region])
    expected_output:
      outcome: invalid
  - name: passes the imported context on and calls its method
    inputs:
      file: checkout/receipt.py
      unchanged:
        checkout/context.py: |
          from dataclasses import dataclass

          from checkout.cart import Cart
          from customers.customer import Customer


          @dataclass(frozen=True)
          class CheckoutContext:
              cart: Cart
              customer: Customer
              coupon_code: str | None
              shipping_region: str
              subtotal_cents: int

              def receipt_lines(self) -> list[str]:
                  return [f"{line.sku} {line.amount_cents}" for line in self.cart.lines]
      after: |
        from checkout.context import CheckoutContext
        from checkout.printer import ReceiptPrinter


        class ReceiptWriter:
            def __init__(self, printer: ReceiptPrinter) -> None:
                self._printer = printer

            def write(self, context: CheckoutContext) -> None:
                self._printer.print_header(context.customer.name)
                self._printer.print_lines(context.receipt_lines())
                self._printer.archive(context)
    expected_output:
      outcome: valid
  - name: reads two fields of an order to build its label
    inputs:
      file: shipments/labels.py
      after: |
        from dataclasses import dataclass
        from datetime import date


        @dataclass(frozen=True)
        class Order:
            number: str
            customer_name: str
            shipping_address: str
            placed_on: date
            total_cents: int
            notes: str


        class LabelPrinter:
            def __init__(self, carrier_code: str) -> None:
                self._carrier_code = carrier_code

            def label(self, order: Order) -> str:
                return f"{self._carrier_code}\n{order.customer_name}\n{order.shipping_address}"
    expected_output:
      outcome: valid
  - name: takes the request context to log a user id
    inputs:
      file: audit/log.py
      after: |
        from dataclasses import dataclass

        from sqlalchemy.orm import Session


        @dataclass(frozen=True)
        class RequestContext:
            user_id: str
            tenant_id: str
            locale: str
            trace_id: str
            feature_flags: frozenset[str]
