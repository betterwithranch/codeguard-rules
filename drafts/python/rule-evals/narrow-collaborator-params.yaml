  - name: builds a carrier client from two of many pydantic settings
    inputs:
      file: carriers/client.py
      after: |
        import httpx
        from pydantic_settings import BaseSettings


        class AppSettings(BaseSettings):
            database_url: str
            redis_url: str
            carrier_api_url: str
            http_timeout_seconds: float
            sentry_dsn: str
            page_size: int
            admin_email: str
            debug: bool


        def carrier_client(settings: AppSettings) -> httpx.Client:
            return httpx.Client(base_url=settings.carrier_api_url, timeout=settings.http_timeout_seconds)
    expected_output:
      outcome: invalid
  - name: builds a carrier client from most of its pydantic settings
    inputs:
      file: carriers/client.py
      after: |
        import httpx
        from pydantic_settings import BaseSettings


        class CarrierSettings(BaseSettings):
            carrier_api_url: str
            carrier_api_key: str
            http_timeout_seconds: float
            debug: bool


        def carrier_client(settings: CarrierSettings) -> httpx.Client:
            return httpx.Client(
                base_url=settings.carrier_api_url,
                headers={"Authorization": f"Bearer {settings.carrier_api_key}"},
                timeout=settings.http_timeout_seconds,
            )
    expected_output:
      outcome: valid
  - name: reads one field of an attrs app state in a method
    inputs:
      file: catalog/listing.py
      after: |
        import attrs

        from catalog.cache import ProductCache
        from catalog.search import SearchIndex


        @attrs.frozen
        class AppState:
            product_cache: ProductCache
            search_index: SearchIndex
            page_size: int
            currency: str
            maintenance_mode: bool


        class ProductListing:
            def __init__(self, products: list[str]) -> None:
                self._products = products

            def first_page(self, state: AppState) -> list[str]:
                return self._products[: state.page_size]
    expected_output:
      outcome: invalid
  - name: reads the user of a Django request in a view method
    inputs:
      file: orders/views.py
      after: |
        from django.http import HttpRequest, JsonResponse
        from django.views import View

        from orders.models import Order


        class OpenOrdersView(View):
            def get(self, request: HttpRequest) -> JsonResponse:
                numbers = Order.objects.filter(customer=request.user).values_list("number", flat=True)
                return JsonResponse({"open": list(numbers)})
    expected_output:
      outcome: valid
  - name: returns the context unchanged when it already has a coupon
    inputs:
      file: checkout/coupons.py
      after: |
        from dataclasses import dataclass, replace

        from checkout.cart import Cart
        from customers.customer import Customer


        @dataclass(frozen=True)
        class CheckoutContext:
            cart: Cart
            customer: Customer
            coupon_code: str | None
            shipping_region: str
            subtotal_cents: int


        def with_coupon(context: CheckoutContext, coupon_code: str) -> CheckoutContext:
            if context.coupon_code is not None:
                return context
            return replace(context, coupon_code=coupon_code)
    expected_output:
      outcome: valid
  - name: changes a tax function that takes plain values
    inputs:
      file: checkout/tax.py
      before: |
        def tax_cents(subtotal_cents: int, rate: float) -> int:
            return round(subtotal_cents * rate)
      after: |
        def tax_cents(subtotal_cents: int, rate: float) -> int:
            return int(subtotal_cents * rate + 0.5)
    expected_output:
      outcome: skipped
  - name: changes the default tax region
    inputs:
      file: checkout/tax.py
      before: |
        from dataclasses import dataclass

        DEFAULT_TAX_REGION = "US-CA"


        @dataclass(frozen=True)
        class TaxParams:
            shipping_region: str
            subtotal_cents: int
      after: |
        from dataclasses import dataclass

        DEFAULT_TAX_REGION = "US-NY"


        @dataclass(frozen=True)
        class TaxParams:
            shipping_region: str
            subtotal_cents: int
    expected_output:
      outcome: skipped
  - name: takes only the region and subtotal
    inputs:
      file: checkout/tax.py
      after: |
        class TaxCalculator:
            def __init__(self, rates_by_region: dict[str, float]) -> None:
                self._rates_by_region = rates_by_region

            def tax_cents(self, shipping_region: str, subtotal_cents: int) -> int:
                return round(subtotal_cents * self._rates_by_region[shipping_region])

            def tax_for_lines(self, shipping_region: str, line_cents: list[int]) -> int:
                return self.tax_cents(shipping_region, sum(line_cents))
    expected_output:
      outcome: skipped
