        shipping/labels.py: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Address:
              street: str
              postcode: str
              country: str


          def zone_for(address: Address) -> str:
              return f"{address.country}-{address.postcode[:2]}"


          def print_label(zone: str, address: Address) -> str:
              return f"[{zone}] {address.street}, {address.postcode}"
