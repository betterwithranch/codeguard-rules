  - name: looks up a cached price with a computed default
    inputs:
      file: catalog/pricing.py
      after: |
        BASE_PRICES = {"sku-1": 1200, "sku-2": 800}


        def list_price_cents(sku: str) -> int:
            return BASE_PRICES.get(sku, 1000)


        class PriceCache:
            def __init__(self) -> None:
                self._prices: dict[str, int] = {}

            def price_cents(self, sku: str) -> int:
                return self._prices.get(sku, list_price_cents(sku))
    expected_output:
      outcome: valid
  - name: builds a summary with a total derived from its lines
    inputs:
      file: invoices/summary.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class InvoiceLine:
            sku: str
            amount_cents: int


        @dataclass(frozen=True)
        class InvoiceSummary:
            total_cents: int
            lines: list[InvoiceLine]


        def total_of(lines: list[InvoiceLine]) -> int:
            return sum(line.amount_cents for line in lines)


        def summarize(lines: list[InvoiceLine]) -> InvoiceSummary:
            return InvoiceSummary(total_cents=total_of(lines), lines=lines)
    expected_output:
      outcome: invalid
  - name: builds a service with a repository on the same session
    inputs:
      file: shipments/wiring.py
      after: |
        from sqlalchemy.orm import Session


        class ShipmentRepository:
            def __init__(self, session: Session) -> None:
                self._session = session


        class ShipmentService:
            def __init__(self, repo: ShipmentRepository, session: Session) -> None:
                self._repo = repo
                self._session = session

            def commit(self) -> None:
                self._session.commit()


        def shipment_service(session: Session) -> ShipmentService:
            return ShipmentService(repo=ShipmentRepository(session), session=session)
    expected_output:
      outcome: valid
  - name: passes an imported zone lookup with its address
