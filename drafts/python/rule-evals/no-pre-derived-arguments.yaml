cases:
  - name: passes selected lines with their region
    inputs:
      file: orders/quote.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class CartLine:
            sku: str
            price: int
            region: str


        def select_lines(cart: list[CartLine], region: str) -> list[CartLine]:
            return [line for line in cart if line.region == region]


        def quote(lines: list[CartLine], region: str) -> str:
            total = sum(line.price for line in lines)
            return f"{region}: {total}"


        def quote_cart(cart: list[CartLine], region: str) -> str:
            return quote(lines=select_lines(cart, region), region=region)
    expected_output:
      outcome: invalid
  - name: passes a tax rate with its customer
    inputs:
      file: invoices/issue.py
      before: |
        from dataclasses import dataclass

        TAX_RATES = {"DE": 0.19, "FR": 0.2}


        @dataclass(frozen=True)
        class Customer:
            country: str
            loyalty_credit: int


        def tax_rate(customer: Customer) -> float:
            return TAX_RATES[customer.country]


        def invoice_total(subtotal: int, customer: Customer) -> int:
            total = round(subtotal * (1 + tax_rate(customer)))
            return total - customer.loyalty_credit


        def issue_invoice(subtotal: int, customer: Customer) -> int:
            return invoice_total(subtotal, customer)
      after: |
        from dataclasses import dataclass

        TAX_RATES = {"DE": 0.19, "FR": 0.2}


        @dataclass(frozen=True)
        class Customer:
            country: str
            loyalty_credit: int


        def tax_rate(customer: Customer) -> float:
            return TAX_RATES[customer.country]


        def invoice_total(subtotal: int, rate: float, customer: Customer) -> int:
            total = round(subtotal * (1 + rate))
            return total - customer.loyalty_credit


        def issue_invoice(subtotal: int, customer: Customer) -> int:
            return invoice_total(subtotal, tax_rate(customer), customer)
    expected_output:
      outcome: invalid
  - name: passes a tax rate computed into a local with its customer
    inputs:
      file: invoices/issue.py
      after: |
        from dataclasses import dataclass

        TAX_RATES = {"DE": 0.19, "FR": 0.2}


        @dataclass(frozen=True)
        class Customer:
            country: str
            loyalty_credit: int


        def tax_rate(customer: Customer) -> float:
            return TAX_RATES[customer.country]


        def invoice_total(subtotal: int, rate: float, customer: Customer) -> int:
            total = round(subtotal * (1 + rate))
            return total - customer.loyalty_credit


        def issue_invoice(subtotal: int, customer: Customer) -> int:
            rate = tax_rate(customer)
            return invoice_total(subtotal, rate, customer)
    expected_output:
      outcome: invalid
  - name: logs a quote total with the lines it came from
    inputs:
      file: orders/quote.py
      after: |
        import logging
        from dataclasses import dataclass

        logger = logging.getLogger(__name__)


        @dataclass(frozen=True)
        class CartLine:
            sku: str
            price: int


        def quote_total(lines: list[CartLine]) -> int:
            return sum(line.price for line in lines)


        def log_quote(lines: list[CartLine]) -> None:
