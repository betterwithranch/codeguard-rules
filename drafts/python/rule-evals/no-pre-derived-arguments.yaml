  - name: renders an invoice's visible lines with the invoice in a method
    inputs:
      file: invoices/rendering.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class InvoiceLine:
            sku: str
            amount_cents: int
            hidden: bool


        @dataclass(frozen=True)
        class Invoice:
            number: str
            lines: list[InvoiceLine]


        class InvoiceRenderer:
            def __init__(self, currency: str) -> None:
                self._currency = currency

            def render(self, invoice: Invoice) -> str:
                return self._render_lines(self._visible(invoice), invoice)

            def _visible(self, invoice: Invoice) -> list[InvoiceLine]:
                return [line for line in invoice.lines if not line.hidden]

            def _render_lines(self, lines: list[InvoiceLine], invoice: Invoice) -> str:
                body = "\n".join(f"{line.sku} {line.amount_cents} {self._currency}" for line in lines)
                return f"Invoice {invoice.number}\n{body}"
    expected_output:
      outcome: invalid
  - name: joins an archive path relative to its root
    inputs:
      file: app/archive.py
      after: |
        import os.path


        def archive_name(root: str, order_number: str) -> str:
            return f"{root}/archive/{order_number}.zip"


        def archive_path(root: str, order_number: str) -> str:
            return os.path.relpath(archive_name(root, order_number), root)
    expected_output:
      outcome: valid
