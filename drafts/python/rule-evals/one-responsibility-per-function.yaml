  - name: queries and totals orders inline in a Django view
    inputs:
      file: shop/views.py
      after: |
        from django.http import HttpRequest, HttpResponse
        from django.shortcuts import render

        from shop.models import Order


        def monthly_sales(request: HttpRequest, year: int, month: int) -> HttpResponse:
            orders = Order.objects.filter(
                placed_at__year=year, placed_at__month=month, status="paid"
            ).select_related("customer")
            total_cents = 0
            for order in orders:
                total_cents += order.subtotal_cents - order.discount_cents
            return render(request, "shop/sales.html", {"orders": orders, "total_cents": total_cents})
    expected_output:
      outcome: invalid
  - name: renders sales from a query function in a Django view
    inputs:
      file: shop/views.py
      unchanged:
        shop/sales.py: |
          from dataclasses import dataclass

          from shop.models import Order


          @dataclass(frozen=True)
          class MonthlySales:
              orders: list[Order]
              total_cents: int


          def monthly_sales_for(year: int, month: int) -> MonthlySales:
              orders = list(Order.objects.filter(placed_at__year=year, placed_at__month=month, status="paid"))
              return MonthlySales(orders=orders, total_cents=sum(order.net_cents for order in orders))
      after: |
        from django.http import HttpRequest, HttpResponse
        from django.shortcuts import render

        from shop.sales import monthly_sales_for


        def monthly_sales(request: HttpRequest, year: int, month: int) -> HttpResponse:
            sales = monthly_sales_for(year, month)
            return render(request, "shop/sales.html", {"sales": sales})
    expected_output:
      outcome: valid
  - name: totals an invoice and formats and sends the reminder text in one method
    inputs:
      file: billing/reminders.py
      after: |
        from dataclasses import dataclass
        from typing import Protocol


        @dataclass(frozen=True)
        class Line:
            quantity: int
            unit_price_cents: int


        @dataclass(frozen=True)
        class Invoice:
            number: str
            customer_email: str
            lines: list[Line]


        class Mailer(Protocol):
            def send(self, to: str, subject: str, body: str) -> None: ...


        class ReminderSender:
            def __init__(self, mailer: Mailer) -> None:
                self.mailer = mailer

            def remind(self, invoice: Invoice) -> None:
                total_cents = sum(line.quantity * line.unit_price_cents for line in invoice.lines)
                body = f"Invoice {invoice.number} for {total_cents / 100:.2f} EUR is overdue."
                self.mailer.send(invoice.customer_email, "Payment reminder", body)
    expected_output:
      outcome: invalid
  - name: totals invoice lines and rounds the tax
    inputs:
      file: billing/totals.py
      after: |
        from dataclasses import dataclass

        TAX_RATE = 0.2


        class EmptyInvoice(ValueError):
            pass


        @dataclass(frozen=True)
        class Line:
            quantity: int
            unit_price_cents: int


        def total_with_tax_cents(lines: list[Line]) -> int:
            if not lines:
                raise EmptyInvoice()
            subtotal = sum(line.quantity * line.unit_price_cents for line in lines)
            return subtotal + round(subtotal * TAX_RATE)
    expected_output:
      outcome: valid
