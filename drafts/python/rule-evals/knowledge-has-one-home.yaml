- name: defines a pipeline that plans, reserves stock and packs
  inputs:
    file: shipments/fulfillment.py
    after: |
      from typing import Protocol


      class PickPlan(Protocol):
          order_id: str


      class Shipment(Protocol):
          tracking_number: str


      class PickPlanner(Protocol):
          def plan(self, order_id: str) -> PickPlan: ...


      class Packer(Protocol):
          def pack(self, plan: PickPlan) -> Shipment: ...


      class StockLedger(Protocol):
          def reserve(self, plan: PickPlan) -> None: ...


      class FulfillmentPipeline:
          def __init__(self, planner: PickPlanner, ledger: StockLedger, packer: Packer) -> None:
              self._planner = planner
              self._ledger = ledger
              self._packer = packer

          def run(self, order_id: str) -> Shipment:
              plan = self._planner.plan(order_id)
              self._ledger.reserve(plan)
              return self._packer.pack(plan)
  expected_output:
    outcome: valid
