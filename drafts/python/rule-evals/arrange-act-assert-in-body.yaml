- name: builds the workflow in an async test from a gateway fixture
  inputs:
    file: tests/test_checkout.py
    after: |
      import pytest

      from orders.checkout import CheckoutWorkflow, Status
      from tests.fakes import FakePaymentGateway


      @pytest.fixture
      def gateway():
          return FakePaymentGateway()


      async def test_submit_waits_for_payment(gateway):
          workflow = CheckoutWorkflow(gateway)

          result = await workflow.submit(order_id="ord-1")

          assert result.status == Status.WAITING


      async def test_submit_requests_one_charge(gateway):
          workflow = CheckoutWorkflow(gateway)

          await workflow.submit(order_id="ord-1")

          assert gateway.charges == ["ord-1"]
  expected_output:
    outcome: valid
