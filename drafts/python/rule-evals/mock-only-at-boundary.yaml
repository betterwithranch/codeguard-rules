cases:
  - name: patches an internal tax function
    inputs:
      file: tests/test_invoices.py
      after: |
        from decimal import Decimal
        from unittest.mock import patch

        from billing.invoices import InvoiceService


        def test_invoice_total_includes_tax(invoice_repository):
            service = InvoiceService(invoice_repository)
            with patch("billing.invoices.calculate_tax", return_value=Decimal("8.00")):
                invoice = service.create(amount=Decimal("100.00"), region="CA")

            assert invoice.total == Decimal("108.00")
    expected_output:
      outcome: invalid
  - name: mocks the invoice repository
    inputs:
      file: tests/test_invoices.py
      before: |
        from decimal import Decimal

        from billing.invoices import InvoiceService
        from billing.repositories import InvoiceRepository


        def test_mark_paid_sets_paid_status(db_session):
            repository = InvoiceRepository(db_session)
            invoice = repository.create(amount=Decimal("100.00"), region="CA")
            service = InvoiceService(repository)

            paid = service.mark_paid(invoice.id)

            assert paid.status == "paid"
      after: |
        from decimal import Decimal
        from unittest.mock import Mock

        from billing.invoices import Invoice, InvoiceService


        def test_mark_paid_sets_paid_status():
            invoice = Invoice(amount=Decimal("100.00"), region="CA")
            repository = Mock()
            repository.get.return_value = invoice
            service = InvoiceService(repository)

            paid = service.mark_paid(invoice.id)

            assert paid.status == "paid"
    expected_output:
      outcome: invalid
  - name: monkeypatches the report module's catalog loader
    inputs:
      file: tests/test_reports.py
      after: |
        from reports import monthly
        from reports.monthly import build_report


        def test_report_lists_each_product(monkeypatch):
            monkeypatch.setattr(monthly, "load_catalog", lambda: {"BOOK-1": "Atlas"})

            report = build_report(month="2026-03")

            assert report.product_names == ["Atlas"]
    expected_output:
      outcome: invalid
  - name: monkeypatches the clock's time function
    inputs:
      file: tests/test_sessions.py
      after: |
        import time

        from accounts.sessions import Session


        def test_session_expires_after_an_hour(monkeypatch):
            session = Session(started_at=1000.0, ttl_seconds=3600)
            monkeypatch.setattr(time, "time", lambda: 4601.0)

            assert session.expired()
    expected_output:
      outcome: valid
  - name: patches a private validation method with a decorator
    inputs:
      file: tests/test_orders.py
      after: |
        from unittest.mock import patch

        from shop.orders import OrderService


        @patch.object(OrderService, "_validate_stock", return_value=True)
        def test_place_order_confirms_it(_validate_stock, cart):
            order = OrderService().place(cart)

            assert order.status == "confirmed"
    expected_output:
      outcome: invalid
  - name: patches the Django order queryset
    inputs:
      file: tests/test_dashboard.py
      after: |
        from unittest.mock import patch

        from shop.dashboard import open_order_count
        from shop.models import Order


        def test_open_order_count_counts_open_orders():
            with patch.object(Order.objects, "filter") as filter_orders:
                filter_orders.return_value.count.return_value = 3

                assert open_order_count() == 3
    expected_output:
      outcome: invalid
  - name: patches the Stripe API to decline
    inputs:
      file: tests/test_payments.py
      after: |
        from decimal import Decimal
        from unittest.mock import patch

        import pytest
        import stripe

        from billing.payments import PaymentFailedError, charge_invoice


        def test_charge_invoice_raises_when_card_is_declined(open_invoice):
            declined = stripe.error.CardError("Your card was declined.", param="card", code="card_declined")
            with patch("billing.payments.stripe.PaymentIntent.create", side_effect=declined):
                with pytest.raises(PaymentFailedError):
                    charge_invoice(open_invoice, amount=Decimal("100.00"))
    expected_output:
      outcome: valid
  - name: mocks the program's own payment gateway class
    inputs:
      file: tests/test_checkout.py
      unchanged:
        billing/gateway.py: |
          from decimal import Decimal

          import stripe


          class PaymentGateway:
              def charge(self, customer_id: str, amount: Decimal) -> str:
                  intent = stripe.PaymentIntent.create(customer=customer_id, amount=int(amount * 100))
                  return intent.id
      after: |
        from decimal import Decimal
        from unittest.mock import Mock

        from billing.gateway import PaymentGateway
        from shop.checkout import Checkout


        def test_checkout_stores_the_payment_id(cart):
            gateway = Mock(spec=PaymentGateway)
            gateway.charge.return_value = "pi_123"

            order = Checkout(gateway).complete(cart, amount=Decimal("20.00"))

            assert order.payment_id == "pi_123"
    expected_output:
      outcome: invalid
  - name: patches requests.get in the rates module
    inputs:
      file: tests/test_rates.py
      after: |
        from decimal import Decimal
        from unittest.mock import Mock, patch

        from billing.rates import fetch_rate


        def test_fetch_rate_reads_the_eur_rate():
            response = Mock(status_code=200)
            response.json.return_value = {"rates": {"EUR": "1.10"}}
            with patch("billing.rates.requests.get", return_value=response):
                rate = fetch_rate("EUR")

            assert rate == Decimal("1.10")
    expected_output:
      outcome: valid
  - name: mocker-patches an internal discount function
    inputs:
      file: tests/test_cart_totals.py
      after: |
        from decimal import Decimal

        from shop.carts import Cart


        def test_total_subtracts_the_discount(mocker):
            mocker.patch("shop.carts.discount_for", return_value=Decimal("5.00"))
            cart = Cart(items=[("BOOK-1", Decimal("20.00"))])

            assert cart.total() == Decimal("15.00")
    expected_output:
      outcome: invalid
  - name: mocker-patches the S3 upload to fail
    inputs:
      file: tests/test_exports.py
      after: |
        import pytest
        from botocore.exceptions import ClientError

        from reports.exports import ExportFailed, upload_export


        def test_upload_export_raises_when_s3_refuses(mocker):
            error = ClientError({"Error": {"Code": "AccessDenied"}}, "PutObject")
            mocker.patch("reports.exports.s3_client.put_object", side_effect=error)

            with pytest.raises(ExportFailed):
                upload_export("2026-03.csv", b"id,total\n")
    expected_output:
      outcome: valid
  - name: assigns a lambda over an internal shipping function
    inputs:
      file: tests/test_shipping.py
      after: |
        from decimal import Decimal

        from shipping import rates
        from shipping.quotes import quote


        def test_quote_adds_handling_fee():
            rates.base_rate = lambda weight: Decimal("4.00")

            assert quote(weight=2).total == Decimal("5.50")
    expected_output:
      outcome: invalid
  - name: autospecs the program's inventory class
    inputs:
      file: tests/test_reservations.py
      after: |
        from unittest.mock import create_autospec

        from shop.inventory import Inventory
        from shop.reservations import reserve


        def test_reserve_marks_the_line_reserved(order_line):
            inventory = create_autospec(Inventory)
            inventory.available.return_value = 5

            line = reserve(order_line, inventory)

            assert line.reserved
    expected_output:
      outcome: invalid
  - name: patches the environment to switch payment mode
    inputs:
      file: tests/test_payment_mode.py
      after: |
        import os
        from unittest.mock import patch

        from billing.payments import payment_mode


        def test_payment_mode_reads_live_from_the_environment():
            with patch.dict(os.environ, {"PAYMENTS_MODE": "live"}):
                assert payment_mode() == "live"
    expected_output:
      outcome: valid
  - name: forces a full disk when writing an export
    inputs:
      file: tests/test_export_files.py
      after: |
        import errno
        from unittest.mock import patch

        import pytest

        from reports.exports import ExportFailed, write_export


        def test_write_export_raises_when_disk_is_full(tmp_path):
            full = OSError(errno.ENOSPC, "No space left on device")
            with patch("builtins.open", side_effect=full):
                with pytest.raises(ExportFailed):
                    write_export(tmp_path / "2026-03.csv", rows=[])
    expected_output:
      outcome: valid
