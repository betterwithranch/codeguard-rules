  - name: adds a test that uses a hand-written fake
    inputs:
      file: tests/test_dispatch.py
      before: |
        from shipping.dispatch import Dispatcher
        from tests.fakes import FakeQueue
      after: |
        from shipping.dispatch import Dispatcher
        from tests.fakes import FakeQueue


        def test_dispatch_queues_the_shipment():
            queue = FakeQueue()

            Dispatcher(queue).dispatch("shp-1")

            assert queue.messages == ["shp-1"]
    expected_output:
      outcome: skipped
