        def test_address_keeps_the_city():
            assert Address(street="1 Main St", city="Lisbon").city == "Lisbon"
    expected_output:
      outcome: invalid
  - name: rejects a percent above 100
    inputs:
      file: tests/test_discounts.py
      unchanged:
        shop/discounts.py: |
          from pydantic import BaseModel, Field


          class Discount(BaseModel):
              code: str
              percent: int = Field(ge=0, le=100)
      after: |
        import pytest
        from pydantic import ValidationError

        from shop.discounts import Discount


        def test_discount_rejects_a_percent_above_100():
            with pytest.raises(ValidationError):
                Discount(code="SPRING", percent=150)
    expected_output:
      outcome: valid
  - name: tests both branches of the shipping fee
    inputs:
      file: tests/test_shipping_fee.py
      after: |
        from decimal import Decimal

        from shipping.fees import shipping_fee


        def test_orders_over_fifty_ship_free():
            assert shipping_fee(order_total=Decimal("60.00")) == Decimal("0.00")


        def test_orders_under_fifty_pay_the_flat_fee():
            assert shipping_fee(order_total=Decimal("20.00")) == Decimal("4.95")
    expected_output:
      outcome: valid
  - name: changes the service import path
    inputs:
      file: tests/test_orders.py
      before: |
        from decimal import Decimal

        from shop.orders import OrderService
      after: |
        from decimal import Decimal

        from shop.services.orders import OrderService
    expected_output:
      outcome: skipped
