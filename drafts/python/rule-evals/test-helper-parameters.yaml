# yaml-language-server: $schema=rule-eval-schema.json
cases:
  - name: returns a test-only setup bundle
    inputs:
      file: tests/test_checkout.py
      after: |
        from dataclasses import dataclass

        from sqlalchemy.orm import Session

        from shop.carts import Cart, CartService
        from shop.checkout import checkout
        from shop.customers import Customer, CustomerService


        @dataclass
        class CheckoutSetup:
            customer: Customer
            cart: Cart


        def make_checkout_setup(db_session: Session, sku: str) -> CheckoutSetup:
            customer = CustomerService(db_session).register(email="ana@example.com")
            cart = CartService(db_session).create(customer_id=customer.id)
            cart.add(sku=sku, quantity=1)
            return CheckoutSetup(customer=customer, cart=cart)


        def test_checkout_charges_the_customer(db_session):
            setup = make_checkout_setup(db_session, sku="BOOK-1")

            receipt = checkout(setup.cart)

            assert receipt.customer_id == setup.customer.id
    expected_output:
      outcome: invalid
  - name: accepts an account or an account id
    inputs:
      file: tests/test_invoices.py
      before: |
        from decimal import Decimal

        from sqlalchemy.orm import Session

        from billing.accounts import Account
        from billing.invoices import Invoice, InvoiceService


        def make_invoice(db_session: Session, account: Account, amount: Decimal) -> Invoice:
            return InvoiceService(db_session).create(account_id=account.id, amount=amount)


        def test_invoice_is_open_after_issue(db_session, account):
            invoice = make_invoice(db_session, account, Decimal("120.00"))

            assert invoice.status == "open"
      after: |
        from decimal import Decimal
        from uuid import UUID

        from sqlalchemy.orm import Session

        from billing.accounts import Account
        from billing.invoices import Invoice, InvoiceService


        def make_invoice(
            db_session: Session,
            amount: Decimal,
            account: Account | None = None,
            account_id: UUID | None = None,
        ) -> Invoice:
            resolved_account_id = account.id if account is not None else account_id
            return InvoiceService(db_session).create(account_id=resolved_account_id, amount=amount)


        def test_invoice_is_open_after_issue(db_session, account):
            invoice = make_invoice(db_session, Decimal("120.00"), account=account)

            assert invoice.status == "open"
    expected_output:
      outcome: invalid
  - name: takes typed parameters for an invoice
    inputs:
      file: tests/test_invoices.py
      after: |
        from decimal import Decimal

        from sqlalchemy.orm import Session

        from billing.accounts import Account
        from billing.invoices import Invoice, InvoiceService


        def make_invoice(db_session: Session, account: Account, amount: Decimal) -> Invoice:
            return InvoiceService(db_session).create(account_id=account.id, amount=amount)


        def test_invoice_is_open_after_issue(db_session, account):
            invoice = make_invoice(db_session, account, Decimal("120.00"))

            assert invoice.status == "open"
    expected_output:
      outcome: valid
  - name: changes an invoice amount literal
    inputs:
      file: tests/test_invoices.py
      before: |
        from decimal import Decimal

        from sqlalchemy.orm import Session

        from billing.accounts import Account
        from billing.invoices import Invoice, InvoiceService


        def make_invoice(db_session: Session, account: Account, amount: Decimal) -> Invoice:
            return InvoiceService(db_session).create(account_id=account.id, amount=amount)


        def test_invoice_is_open_after_issue(db_session, account):
            invoice = make_invoice(db_session, account, Decimal("120.00"))

            assert invoice.status == "open"
      after: |
        from decimal import Decimal

        from sqlalchemy.orm import Session

        from billing.accounts import Account
        from billing.invoices import Invoice, InvoiceService


        def make_invoice(db_session: Session, account: Account, amount: Decimal) -> Invoice:
            return InvoiceService(db_session).create(account_id=account.id, amount=amount)


        def test_invoice_is_open_after_issue(db_session, account):
            invoice = make_invoice(db_session, account, Decimal("75.00"))

            assert invoice.status == "open"
    expected_output:
      outcome: skipped
