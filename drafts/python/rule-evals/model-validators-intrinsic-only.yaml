cases:
  - name: checks a warehouse registry in a model validator
    inputs:
      file: shipping/shipment.py
      after: |
        from pydantic import BaseModel, model_validator

        from shipping.warehouse_registry import warehouse_registry


        class Shipment(BaseModel):
            sku: str
            warehouse_code: str

            @model_validator(mode="after")
            def check_warehouse_stocks_sku(self) -> "Shipment":
                warehouse = warehouse_registry.get(self.warehouse_code)
                if not warehouse.stocks(self.sku):
                    raise ValueError(f"{self.warehouse_code} does not stock {self.sku}")
                return self
    expected_output:
      outcome: invalid
  - name: checks the product catalog in a field validator
    inputs:
      file: shipping/shipment.py
      before: |
        from pydantic import BaseModel, field_validator


        class Shipment(BaseModel):
            sku: str

            @field_validator("sku")
            @classmethod
            def normalize_sku(cls, value: str) -> str:
                return value.strip().upper()
      after: |
        from pydantic import BaseModel, field_validator

        from shipping.catalog import product_catalog


        class Shipment(BaseModel):
            sku: str

            @field_validator("sku")
            @classmethod
            def normalize_sku(cls, value: str) -> str:
                sku = value.strip().upper()
                if not product_catalog.contains(sku):
                    raise ValueError(f"unknown sku {sku}")
                return sku
    expected_output:
      outcome: invalid
  - name: validates intrinsic field invariants
    inputs:
      file: shipping/shipment.py
      after: |
        from pydantic import BaseModel, field_validator


        class Shipment(BaseModel):
            sku: str
            quantity: int

            @field_validator("sku")
            @classmethod
            def normalize_sku(cls, value: str) -> str:
                return value.strip().upper()

            @field_validator("quantity")
            @classmethod
            def check_quantity_positive(cls, value: int) -> int:
                if value < 1:
                    raise ValueError("quantity must be at least 1")
                return value
    expected_output:
      outcome: valid
  - name: checks a catalog passed through the validation context
    inputs:
      file: orders/order_line.py
      after: |
        from pydantic import BaseModel, ValidationInfo, field_validator


        class OrderLine(BaseModel):
            sku: str
            quantity: int

            @field_validator("sku")
            @classmethod
            def check_sku_listed(cls, value: str, info: ValidationInfo) -> str:
                catalog = info.context["catalog"]
                if value not in catalog:
                    raise ValueError(f"{value} is not listed")
                return value
    expected_output:
      outcome: invalid
  - name: orders a booking's start and end in a model validator
    inputs:
      file: bookings/booking.py
      after: |
        from datetime import datetime

        from pydantic import BaseModel, model_validator


        class Booking(BaseModel):
            room: str
            starts_at: datetime
            ends_at: datetime

            @model_validator(mode="after")
            def check_ends_after_start(self) -> "Booking":
                if self.ends_at <= self.starts_at:
                    raise ValueError("a booking ends after it starts")
                return self
    expected_output:
      outcome: valid
  - name: reads a refund limit from the environment in post_init
    inputs:
      file: refunds/refund.py
      after: |
        import os
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Refund:
            order_id: str
            cents: int

            def __post_init__(self) -> None:
                if self.cents > int(os.environ["MAX_REFUND_CENTS"]):
                    raise ValueError("refund exceeds the limit")
    expected_output:
      outcome: invalid
  - name: normalizes a currency code from a constant table in post_init
    inputs:
      file: refunds/refund.py
      after: |
        from dataclasses import dataclass

        CURRENCY_ALIASES = {"us$": "USD", "€": "EUR"}


        @dataclass
        class Refund:
            order_id: str
            cents: int
            currency: str

            def __post_init__(self) -> None:
                self.currency = CURRENCY_ALIASES.get(self.currency.lower(), self.currency.upper())
                if self.cents <= 0:
                    raise ValueError("a refund is positive")
    expected_output:
      outcome: valid
  - name: queries other rows in a Django model clean
    inputs:
      file: rooms/models.py
      after: |
        from django.core.exceptions import ValidationError
        from django.db import models


        class Reservation(models.Model):
            room = models.CharField(max_length=16)
            starts_at = models.DateTimeField()
            ends_at = models.DateTimeField()

            def clean(self) -> None:
                overlapping = Reservation.objects.filter(
                    room=self.room, starts_at__lt=self.ends_at, ends_at__gt=self.starts_at
                ).exclude(pk=self.pk)
                if overlapping.exists():
                    raise ValidationError("the room is already booked")
    expected_output:
      outcome: invalid
  - name: compares a reservation's own dates in a Django model clean
    inputs:
      file: rooms/models.py
      after: |
        from django.core.exceptions import ValidationError
        from django.db import models


        class Reservation(models.Model):
            room = models.CharField(max_length=16)
            starts_at = models.DateTimeField()
            ends_at = models.DateTimeField()

            def clean(self) -> None:
                if self.ends_at <= self.starts_at:
                    raise ValidationError("a reservation ends after it starts")
    expected_output:
      outcome: valid
  - name: checks a coupon repository in an attrs validator
    inputs:
      file: promotions/coupon.py
      after: |
        import attrs

        from promotions.repository import coupon_repository


        @attrs.frozen
        class Coupon:
            code: str = attrs.field()
            percent_off: int = 10

            @code.validator
            def _check_unused(self, attribute, value: str) -> None:
                if coupon_repository.exists(value):
                    raise ValueError(f"{value} is already issued")
    expected_output:
      outcome: invalid
  - name: checks a coupon code's format in an attrs validator
    inputs:
      file: promotions/coupon.py
      after: |
        import re

        import attrs

        CODE_FORMAT = re.compile(r"^[A-Z0-9]{8}$")


        @attrs.frozen
        class Coupon:
            code: str = attrs.field()
            percent_off: int = 10

            @code.validator
            def _check_format(self, attribute, value: str) -> None:
                if not CODE_FORMAT.match(value):
                    raise ValueError(f"{value} is not an 8-character code")
    expected_output:
      outcome: valid
  - name: uppercases the shipment label
    inputs:
      file: shipping/shipment.py
      before: |
        class Shipment:
            def __init__(self, sku: str) -> None:
                self.sku = sku

            def label(self) -> str:
                return self.sku
      after: |
        class Shipment:
            def __init__(self, sku: str) -> None:
                self.sku = sku

            def label(self) -> str:
                return self.sku.upper()
    expected_output:
      outcome: skipped
  - name: checks stock in a DRF serializer's field validation
    inputs:
      file: orders/serializers.py
      before: |
        from rest_framework import serializers


        class OrderLineSerializer(serializers.Serializer):
            sku = serializers.CharField()
            quantity = serializers.IntegerField(min_value=1)
      after: |
        from rest_framework import serializers

        from inventory.models import StockItem


        class OrderLineSerializer(serializers.Serializer):
            sku = serializers.CharField()
            quantity = serializers.IntegerField(min_value=1)

            def validate_sku(self, value: str) -> str:
                if not StockItem.objects.filter(sku=value, on_hand__gt=0).exists():
                    raise serializers.ValidationError("out of stock")
                return value
    expected_output:
      outcome: skipped
