id: no-clock-moves-in-fixtures
language: python
severity: error
message: Don't sleep or move the clock inside a fixture.
note: |
  Waiting or moving time is an arrange step of one scenario. In a fixture it is
  hidden from the tests that depend on it.
metadata:
  why: Time moved in a fixture changes every test that uses it while staying out of sight in the test bodies.
rule:
  any:
  - pattern: time.sleep($$$)
  - pattern: asyncio.sleep($$$)
  - pattern: sleep($$$)
  - pattern: $CLOCK.tick($$$)
  - pattern: $CLOCK.shift($$$)
  inside:
    kind: function_definition
    stopBy:
      kind: function_definition
    inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: ^@(pytest\.|pytest_asyncio\.)?fixture\b
