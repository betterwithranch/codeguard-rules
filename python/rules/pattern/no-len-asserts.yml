id: no-len-asserts
language: python
severity: error
message: Don't assert only a collection's length.
note: |
  A length check passes when the items are wrong. Assert the whole collection
  (`assert lines == [ExampleLine(sku="A1"), ExampleLine(sku="B2")]`).
utils:
  length:
    kind: call
    has: {field: function, regex: "^len$"}
  stated-value:
    any:
      - kind: integer
      - kind: float
      - kind: string
      - kind: concatenated_string
      - kind: "true"
      - kind: "false"
      - kind: none
      - kind: unary_operator
      - kind: identifier
      - kind: attribute
      - kind: call
      - kind: list
      - kind: tuple
      - kind: set
      - kind: dictionary
      - kind: parenthesized_expression
    not:
      any:
        - kind: identifier
          regex: ^[a-z_]
        - has:
            stopBy: end
            kind: identifier
            regex: ^[a-z_]
            not:
              inside: {kind: keyword_argument, field: name}
  condition-part:
    any:
      - kind: not_operator
      - kind: boolean_operator
      - kind: parenthesized_expression
  in-condition:
    any:
      - nthChild: 1
        inside: {kind: assert_statement}
      - inside:
          stopBy:
            not: {matches: condition-part}
          matches: condition-part
          nthChild: 1
          inside: {kind: assert_statement}
  assert-comparison:
    kind: comparison_operator
    matches: in-condition
rule:
  kind: assert_statement
  has:
    stopBy: end
    any:
      - matches: length
        all:
          - matches: in-condition
      - matches: assert-comparison
        not:
          any:
            - pattern: len(set($ITEMS)) == len($ITEMS)
            - pattern: len($ITEMS) == len(set($ITEMS))
        has:
          matches: length
          any:
            - precedes: {stopBy: end, any: [{matches: length}, {matches: stated-value}]}
            - follows: {stopBy: end, matches: stated-value}
