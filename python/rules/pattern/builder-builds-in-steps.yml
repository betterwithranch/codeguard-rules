id: builder-builds-in-steps
language: python
severity: warning
message: This Builder class has no method that stores a part of its product.
note: |
  A class named ...Builder assembles its product step by step: methods that store parts
  on the instance, or return a new builder holding them, then a separate call such as
  build() that returns the product. This class makes its product in one call. Give it
  methods that store the parts, or name it for what it makes (a factory, or a function
  such as make_invoice). A part method is any method other than __init__, build, create,
  make or __call__ that sets, adds to or updates an attribute of self, or returns a new
  builder (replace(self, ...), type(self)(...) or a ...Builder(...) call).
metadata:
  why: |
    A builder that makes its product in one call is a constructor with a misleading name.
    The rule matches a class by its name because here the name is the convention: only a
    class named ...Builder promises step-by-step assembly, so only such a class can break
    that promise.
utils:
  stores-part:
    any:
    - kind: assignment
      has:
        field: left
        any:
        - pattern: self.$_
        - kind: subscript
          has: {field: value, pattern: self.$_}
    - kind: augmented_assignment
      has: {field: left, pattern: self.$_}
    - kind: call
      all:
      - pattern: self.$_.$M($$$)
      - has:
          field: function
          has: {field: attribute, regex: ^(append|extend|add|update|insert|setdefault)$}
  returns-new-builder:
    kind: return_statement
    has:
      any:
      - pattern: replace(self, $$$)
      - pattern: $MODULE.replace(self, $$$)
      - pattern: type(self)($$$)
      - kind: call
        has: {field: function, regex: Builder$}
  part-method:
    kind: function_definition
    not:
      has: {field: name, regex: ^(__init__|__call__|build|create|make)$}
    has:
      stopBy: end
      any:
      - matches: stores-part
      - matches: returns-new-builder
rule:
  kind: class_definition
  has: {field: name, regex: Builder$}
  not:
    has: {field: body, matches: part-method, stopBy: end}
