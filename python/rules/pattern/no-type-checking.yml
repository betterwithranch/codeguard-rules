id: no-type-checking
language: python
severity: error
message: Don't import under TYPE_CHECKING.
note: |
  A TYPE_CHECKING block hides a circular dependency. Fix the cycle instead: move the
  shared types to their own module, pass the dependency in, or merge the modules.
rule:
  kind: if_statement
  has:
    field: condition
    regex: ^(typing\.)?TYPE_CHECKING$
