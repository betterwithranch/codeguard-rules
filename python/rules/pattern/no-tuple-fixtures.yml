id: no-tuple-fixtures
language: python
severity: error
message: A fixture returns one object, never a tuple.
note: |
  A tuple hides what each element is. Split it into one fixture per object, and have a
  test request each fixture it needs.
rule:
  any:
    - kind: return_statement
      has:
        any:
          - kind: tuple
          - kind: expression_list
    - kind: yield
      has:
        any:
          - kind: tuple
          - kind: expression_list
    - kind: type
      inside:
        kind: function_definition
        field: return_type
      regex: ^((typing\.|collections\.abc\.)?(Async)?(Iterator|Generator|Iterable)\[\s*)?(typing\.)?[Tt]uple\b
  inside:
    kind: function_definition
    stopBy:
      kind: function_definition
    inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: ^@(pytest\.|pytest_asyncio\.)?fixture\b
