id: no-middle-man
language: python
severity: warning
message: Every method of this class only forwards to the same collaborator.
note: |
  The class adds nothing: every method passes its call to the same collaborator. Have
  callers use the collaborator directly, or give the class work of its own. A class
  with a base class is not matched, since forwarding there adapts the collaborator to
  the base's interface.
metadata:
  why: A layer that only forwards is one more place to read and change, and hides which object does the work.
utils:
  forwarding-call:
    any:
    - pattern: self.$C.$_M($$$)
    - pattern: await self.$C.$_M($$$)
  forwarding-method:
    kind: function_definition
    not:
      has: {field: name, regex: ^__init__$}
    has:
      field: body
      kind: block
      all:
      - not:
          has: {nthChild: 3}
      - has:
          nthChild: {position: 1, reverse: true}
          any:
          - kind: return_statement
            has: {matches: forwarding-call}
          - kind: expression_statement
            has: {matches: forwarding-call}
      - not:
          has:
            nthChild: 1
            not:
              any:
              - nthChild: {position: 1, reverse: true}
              - kind: expression_statement
                has: {kind: string}
  method:
    any:
    - kind: function_definition
    - kind: decorated_definition
rule:
  kind: class_definition
  not:
    has: {field: superclasses, kind: argument_list}
  has:
    field: body
    kind: block
    all:
    - has:
        matches: forwarding-method
        follows:
          stopBy: end
          matches: forwarding-method
    - not:
        has:
          any:
          - kind: function_definition
            not:
              any:
              - matches: forwarding-method
              - has: {field: name, regex: ^__init__$}
          - kind: decorated_definition
