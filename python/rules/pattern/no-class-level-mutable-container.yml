id: no-class-level-mutable-container
language: python
severity: warning
message: This method mutates a container bound in the class body, which every instance shares.
note: |
  A list, dict or set bound in the class body is one object shared by every instance, so
  mutating it through `self` changes it for all of them. Give each instance its own in
  `__init__` (or a dataclass `field(default_factory=list)`), or, when sharing is the
  point, mutate it through the class (`type(self).registry[...]`) and annotate it
  `ClassVar`.
metadata:
  why: Every instance shares the one container, so one instance's change shows up in all of them.
utils:
  container:
    any:
    - kind: list
    - kind: dictionary
    - kind: set
    - kind: list_comprehension
    - kind: dictionary_comprehension
    - kind: set_comprehension
    - kind: call
      has:
        field: function
        regex: ^(collections\.)?(list|dict|set|defaultdict|deque|OrderedDict|Counter)$
rule:
  any:
  - kind: call
    pattern: self.$N.$_M($$$)
    has:
      field: function
      has:
        field: attribute
        regex: ^(append|extend|insert|add|update|setdefault|pop|popitem|remove|discard|clear|appendleft|extendleft)$
  - kind: assignment
    has:
      field: left
      kind: subscript
      has: {field: value, pattern: self.$N}
  - kind: augmented_assignment
    has: {field: left, pattern: self.$N}
  - kind: delete_statement
    has:
      stopBy: end
      kind: subscript
      has: {field: value, pattern: self.$N}
  inside:
    stopBy: end
    kind: class_definition
    has:
      field: body
      has:
        kind: expression_statement
        has:
          kind: assignment
          all:
          - has: {field: left, pattern: $N}
          - has: {field: right, matches: container}
    not:
      has:
        stopBy: end
        kind: assignment
        has: {field: left, pattern: self.$N}
