id: no-normalized-asserts
language: python
severity: error
message: Don't strip fields from the result inside an assert.
note: |
  Each field the copy drops or replaces goes unchecked. Assert the noisy field's
  meaningful part directly and compare the rest of the object normally. A field that
  changes each run (a generated id, a timestamp) is fixed by controlling its source in
  the test, not by masking it.
utils:
  field-dropping-copy:
    any:
      - kind: call
        has: {field: function, regex: "^(dataclasses\\.)?replace$|\\.model_copy$"}
      - kind: call
        all:
          - has: {field: function, regex: "\\.(model_dump|model_dump_json|dict|json)$"}
          - has:
              field: arguments
              has: {kind: keyword_argument, has: {field: name, regex: "^exclude$"}}
  copied:
    any:
      - matches: field-dropping-copy
      - has: {stopBy: end, matches: field-dropping-copy}
  stated-value:
    not:
      any:
        - kind: identifier
          regex: ^[a-z_]
        - has:
            stopBy: end
            kind: identifier
            regex: ^[a-z_]
            not:
              inside: {kind: keyword_argument, field: name}
  condition-part:
    any:
      - kind: not_operator
      - kind: boolean_operator
      - kind: parenthesized_expression
  assert-comparison:
    kind: comparison_operator
    inside:
      stopBy:
        not: {matches: condition-part}
      kind: assert_statement
rule:
  kind: assert_statement
  has:
    stopBy: end
    matches: assert-comparison
    any:
      - all:
          - has: {nthChild: 1, matches: copied}
          - has: {nthChild: 2, any: [{matches: copied}, {matches: stated-value}]}
      - all:
          - has: {nthChild: 2, matches: copied}
          - has: {nthChild: 1, matches: stated-value}
