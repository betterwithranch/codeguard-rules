id: no-normalized-asserts
language: python
severity: error
message: Don't strip fields from the result inside an assert.
note: |
  Each field the copy drops or replaces goes unchecked. Assert the noisy field's
  meaningful part directly and compare the rest of the object normally.
rule:
  kind: assert_statement
  has:
    stopBy: end
    any:
      - kind: call
        has: {field: function, regex: "(^|\\.)(replace|model_copy)$"}
      - kind: keyword_argument
        has: {field: name, regex: "^exclude$"}
