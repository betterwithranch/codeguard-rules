id: no-getattr-literal
language: python
severity: error
message: Use attribute access, not getattr with a fixed name.
note: |
  `getattr(order, "total")` hides the attribute from type checkers and from search.
  Write `order.total`. getattr is for names known only at runtime.
rule:
  pattern: getattr($OBJECT, $NAME)
constraints:
  NAME:
    kind: string
    not:
      has:
        kind: interpolation
        stopBy: end
