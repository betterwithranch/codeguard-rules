id: mock-use
language: python
rule:
  any:
  - kind: call
    has:
      field: function
      regex: (^|\.)(Mock|MagicMock|AsyncMock|NonCallableMock|NonCallableMagicMock|PropertyMock|create_autospec)$|(^|\.)patch(\.object|\.dict|\.multiple)?$|(^|\.)monkeypatch\.(setattr|setitem|delattr|delitem)$|^mocker\.|^setattr$
  - kind: decorator
    regex: ^@(\w+\.)*patch\b
  - kind: assignment
    all:
    - has:
        field: left
        kind: attribute
    - has:
        field: right
        kind: lambda
