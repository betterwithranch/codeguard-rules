id: partial-assert
language: python
rule:
  any:
  - kind: assert_statement
    has:
      nthChild: 1
      any:
      - kind: attribute
      - kind: subscript
      - kind: not_operator
        has: {field: argument, any: [{kind: attribute}, {kind: subscript}]}
      - kind: comparison_operator
        has:
          any:
          - kind: attribute
          - kind: subscript
  - kind: call
    all:
    - has:
        field: function
        kind: attribute
        has: {field: attribute, regex: "^assert[A-Z]\\w*$"}
    - has:
        field: arguments
        has:
          any:
          - kind: attribute
          - kind: subscript
