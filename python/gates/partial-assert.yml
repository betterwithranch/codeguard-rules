id: partial-assert
language: python
rule:
  any:
    - inside: {stopBy: end, kind: assert_statement}
      any:
        - kind: comparison_operator
          has:
            any: [{kind: attribute}, {kind: subscript}]
            has:
              stopBy: end
              kind: identifier
              regex: ^[a-z_]
        - kind: call
          has: {field: function, regex: "^len$"}
        - kind: tuple
          any:
            - pattern: ($A.$F, $A.$G)
            - pattern: ($A.$F, $A.$G, $$$REST)
            - pattern: ($A[$F], $A[$G])
            - pattern: ($A[$F], $A[$G], $$$REST)
        - kind: list
          any:
            - pattern: '[$A.$F, $A.$G]'
            - pattern: '[$A.$F, $A.$G, $$$REST]'
        - kind: comparison_operator
          any:
            - pattern: $MEMBER in $VALUES
            - pattern: $MEMBER not in $VALUES
        - kind: identifier
          regex: ^ANY$
        - kind: attribute
          regex: \.ANY$
    - kind: assert_statement
      has:
        nthChild: 1
        any:
          - kind: identifier
          - kind: attribute
          - kind: subscript
          - kind: not_operator
            has:
              any: [{kind: identifier}, {kind: attribute}, {kind: subscript}]
          - kind: call
            has:
              field: function
              kind: attribute
              has:
                field: object
                any: [{kind: attribute}, {kind: subscript}]
    - kind: call
      all:
        - has: {field: function, regex: ^self\.assert}
        - has:
            field: arguments
            has:
              any:
                - kind: attribute
                - kind: subscript
                - kind: call
                  has: {field: function, regex: "^len$"}
