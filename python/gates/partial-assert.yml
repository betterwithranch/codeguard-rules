id: partial-assert
language: python
rule:
  inside: {stopBy: end, kind: assert_statement}
  any:
    - kind: comparison_operator
      has:
        any: [{kind: attribute}, {kind: subscript}]
        has:
          stopBy: end
          kind: identifier
          regex: ^[a-z_]
    - kind: call
      has: {field: function, regex: "^len$"}
    - kind: tuple
      any:
        - pattern: ($A.$F, $A.$G)
        - pattern: ($A.$F, $A.$G, $$$REST)
      has: {nthChild: 1, kind: attribute, has: {field: object, regex: "^[a-z_]"}}
