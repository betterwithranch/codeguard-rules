id: isolation-risk
language: python
rule:
  any:
  - kind: decorator
    regex: scope=|autouse=
  - kind: global_statement
  - kind: attribute
    regex: ^os\.environ
  - kind: call
    has:
      field: function
      regex: (^|\.)(setattr|setenv|putenv)$
  - kind: decorated_definition
    all:
    - has:
        kind: decorator
        regex: fixture
    - has:
        kind: function_definition
        has:
          field: body
          regex: ^(pass|\.\.\.)$
