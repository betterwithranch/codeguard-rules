id: enum-value-access
language: python
rule:
  any:
  - kind: attribute
    has:
      field: attribute
      regex: ^value$
  - kind: call
    all:
    - has:
        field: function
        regex: (^|\.)attrgetter$
    - has:
        field: arguments
        has:
          kind: string
          regex: ^["']value["']$
