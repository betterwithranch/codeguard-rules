id: tag-value
language: python
rule:
  any:
  - kind: comparison_operator
    has:
      any:
      - kind: string
      - kind: tuple
        has: {kind: string}
      - kind: list
        has: {kind: string}
      - kind: set
        has: {kind: string}
  - kind: match_statement
    has:
      kind: case_pattern
      stopBy: end
      has:
        kind: string
        stopBy: end
  - kind: dictionary
    has:
      kind: pair
      has:
        field: key
        kind: string
