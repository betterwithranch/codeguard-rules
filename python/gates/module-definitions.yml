id: module-definitions
language: python
rule:
  any:
  - kind: class_definition
    any:
    - inside:
        kind: module
    - inside:
        kind: decorated_definition
        inside:
          kind: module
  - kind: function_definition
    inside:
      kind: module
    follows:
      stopBy: end
      any:
      - kind: function_definition
      - kind: decorated_definition
