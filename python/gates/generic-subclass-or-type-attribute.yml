id: generic-subclass-or-type-attribute
language: python
rule:
  any:
  - kind: class_definition
    has:
      field: superclasses
      has:
        kind: subscript
  - kind: generic_type
    regex: ^type\[
  - kind: subscript
    has:
      field: value
      regex: ^type$
  - kind: function_definition
    has:
      field: name
      regex: ^__init_subclass__$
