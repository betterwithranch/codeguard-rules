id: call-assertion
language: python
rule:
  any:
  - kind: call
    has:
      field: function
      kind: attribute
      has:
        field: attribute
        regex: ^assert_(not_)?(called|any_call|has_calls|awaited|any_await|has_awaits)
  - kind: attribute
    has:
      field: attribute
      regex: ^(call_args|call_args_list|mock_calls|method_calls|await_args|await_args_list|call_count|await_count|called|awaited)$
