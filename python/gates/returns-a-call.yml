id: returns-a-call
language: python
rule:
  any:
  - kind: function_definition
    not:
      has:
        field: name
        regex: ^test
    has:
      field: body
      has:
        kind: return_statement
        has:
          any:
          - kind: call
          - kind: attribute
  - kind: decorated_definition
    has:
      field: definition
      kind: function_definition
      not:
        has:
          field: name
          regex: ^test
      has:
        field: body
        has:
          kind: return_statement
          has:
            any:
            - kind: call
            - kind: attribute
