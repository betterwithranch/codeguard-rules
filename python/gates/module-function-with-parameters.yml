id: module-function-with-parameters
language: python
rule:
  kind: function_definition
  any:
  - inside:
      kind: module
  - inside:
      kind: decorated_definition
      inside:
        kind: module
  has:
    field: parameters
    has:
      any:
      - kind: identifier
      - kind: typed_parameter
      - kind: default_parameter
      - kind: typed_default_parameter
