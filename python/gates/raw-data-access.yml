id: raw-data-access
language: python
rule:
  any:
  - kind: subscript
    has:
      field: subscript
      any:
      - kind: integer
      - kind: slice
      - kind: unary_operator
  - kind: call
    has:
      field: function
      regex: ^(isinstance|json\.loads?)$
  - kind: type
    regex: \bAny\b|^dict\[
  - kind: subscript
    all:
    - has:
        field: value
        kind: identifier
        pattern: $RAW
    - has:
        field: subscript
        kind: string
    - inside:
        kind: function_definition
        stopBy: end
        has:
          field: parameters
          has:
            stopBy: end
            kind: identifier
            pattern: $RAW
