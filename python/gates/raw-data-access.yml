id: raw-data-access
language: python
rule:
  any:
  - kind: subscript
    has:
      field: subscript
      any:
      - kind: integer
      - kind: slice
      - kind: unary_operator
  - kind: call
    has:
      field: function
      regex: ^(isinstance|json\.loads?)$
  - kind: type
    regex: \bAny\b|^dict\[
  - kind: subscript
    has:
      field: subscript
      kind: string
  - kind: call
    all:
    - has:
        field: function
        kind: attribute
        has:
          field: attribute
          regex: ^get$
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: string
  - kind: comparison_operator
    all:
    - has:
        nthChild: 1
        kind: string
    - regex: '^\S.*\s(not\s+)?in\s'
