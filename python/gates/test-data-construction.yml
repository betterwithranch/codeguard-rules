id: test-data-construction
language: python
rule:
  any:
  - kind: call
    has:
      field: function
      regex: (^|\.)(uuid4|UUID)$
  - kind: argument_list
    has:
      any:
      - kind: list
        regex: ^\[\]$
      - kind: dictionary
        regex: ^\{\}$
      - kind: keyword_argument
        has:
          field: value
          regex: ^(\[\]|\{\}|""|'')$
