id: test-with-parameters
valid:
  # Test function without parameters
  - |
    def test_total():
        assert total() == 1

  # Test method with only self
  - |
    class TestOrder:
        def test_total(self):
            assert total() == 1

  # Helper function with parameters
  - |
    def make_example_model(name):
        return ExampleModel(name=name)
invalid:
  # Test function with a fixture parameter
  - |
    def test_total(order):
        assert order.total == 1

  # Test method with a fixture parameter after self
  - |
    class TestOrder:
        def test_total(self, order):
            assert order.total == 1

  # Test function with a typed fixture parameter
  - |
    def test_total(order: Order):
        assert order.total == 1

  # Async test function with a fixture parameter
  - |
    async def test_total(order):
        assert order.total == 1
