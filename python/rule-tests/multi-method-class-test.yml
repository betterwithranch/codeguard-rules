id: multi-method-class
valid:
# One method and a field
- |
  class ExampleOrder:
      total: int

      def tax(self):
          return 1
# Two module functions, no class
- |
  def place(order):
      return order

  def cancel(order):
      return order
invalid:
# Two plain methods
- |
  class ExampleService:
      def place(self):
          return 1

      def cancel(self):
          return 2
# A decorated method beside a plain one
- |
  class ExampleService:
      def place(self):
          return 1

      @property
      def name(self):
          return "x"
# Two async methods
- |
  class ExampleService:
      async def place(self):
          return 1

      async def cancel(self):
          return 2
