id: global-state-change
valid:
# A local object's field
- |
  order.status = "paid"
# A field of an object held by the test instance
- |
  self.order.status = "paid"
# A call that changes nothing global
- |
  total = cart.total()
# An instance attribute set in setup
- |
  self.cart = Cart()
invalid:
