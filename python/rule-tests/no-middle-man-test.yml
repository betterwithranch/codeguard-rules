  # Returned and bare forwarding calls
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

        def save(self, example):
            self._repository.save(example)

  # Docstrings and awaited calls
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        async def get(self, example_id):
            """Get one example."""
            return await self._repository.get(example_id)

        async def save(self, example):
            await self._repository.save(example)
