id: no-middle-man
valid:
  # A method that does work of its own
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

        def total(self, example_id):
            example = self._repository.get(example_id)
            return sum(item.price for item in example.items)

  # Methods forward to different collaborators
  - |
    class ExampleFacade:
        def __init__(self, reader, writer):
            self._reader = reader
            self._writer = writer

        def get(self, example_id):
            return self._reader.get(example_id)

        def save(self, example):
            self._writer.save(example)

  # One forwarding method
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

  # A decorated method
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

        def save(self, example):
            self._repository.save(example)

        @property
        def size(self):
            return self._repository.count()

  # A base class the forwarding adapts to
  - |
    class ExampleStore(Store):
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

        def save(self, example):
            self._repository.save(example)

  # A forwarding call wrapped in other work
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return ExampleView(self._repository.get(example_id))

        def save(self, example):
            self._repository.save(example)

