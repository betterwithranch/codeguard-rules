id: package-root-import
valid:
# Relative import of a sibling module
- |
  from .invoice_total import InvoiceTotal
# Relative import of a module in the parent package
- |
  from ..customer import Customer
# Future import
- |
  from __future__ import annotations
invalid:
# Absolute import from a package root
- |
  from billing import InvoiceTotal
# Absolute import from a submodule
- |
  from billing.invoice_total import InvoiceTotal
# Plain import of a package
- |
  import billing
# Relative import from the current package root
- |
  from . import InvoiceTotal
# Relative import from the parent package root
- |
  from .. import Customer
