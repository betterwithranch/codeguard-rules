id: no-normalized-asserts
valid:
  # Whole result compared
  - |
    def test_order():
        assert result == ExampleOrder(id=order_id, total=1)

  # Copy made outside an assert
  - |
    def test_order():
        expected = replace(template, total=1)
        assert result == expected

  # Constructor argument named exclude
  - |
    def test_config():
        assert config.rulesets == {"python": RulesetConfig(exclude=("no-print",))}

  # String replace on the expected text
  - |
    def test_stripped():
        assert stripped == SOURCE.replace("# note", "")

  # Pydantic copy builds the expected value
  - |
    def test_order():
        assert result == baseline.model_copy(update={"total": 2})

  # dataclasses.replace builds the expected value
  - |
    def test_order():
        assert result == replace(baseline, total=2)

  # Dump that excludes a field builds the expected value
  - |
    def test_payload():
        assert payload == template.model_dump(exclude={"id"})

  # Copies nested in the expected value
  - |
    def test_orders():
        assert results == [replace(baseline, id=order_id) for order_id in order_ids]

  # Copy compared with a value built elsewhere, on the left
  - |
    def test_order():
        assert baseline.model_copy(update={"total": 2}) == result

  # Copy in a comparison nested inside the expected value
  - |
    def test_orders():
        assert results == [order for order in orders if replace(order, id=None) == baseline]

  # Copy builds an input to the call under test
  - |
    def test_lookup():
        assert repo.get(replace(key, version=2)) == ExampleOrder(id=1, total=1)

  # Copy builds an input, compared with a literal on the left
  - |
    def test_handler():
        assert {"ok": True} == handler(dataclasses.replace(event, ts=0))

  # One field of a dump
  - |
    def test_total():
        assert result.model_dump(exclude={"id"})["total"] == 1

  # One field of a copy
  - |
    def test_lines():
        assert replace(result, id=None).lines == [ExampleLine(sku="A1")]

invalid:
  # Copy compared with a literal, on the right
  - |
    def test_order():
        assert {"total": 1} == result.model_dump(exclude={"id"})

  # Copy compared with a constructor, on the right
  - |
    def test_order():
        assert ExampleOrder(id=None, total=1) == replace(result, id=None)

  # dataclasses.replace on the result
  - |
    def test_order():
        assert replace(result, id=None) == ExampleOrder(id=None, total=1)

  # Dump that excludes a field
  - |
    def test_order():
        assert result.model_dump(exclude={"id"}) == {"total": 1}

  # Copies on both sides
  - |
    def test_order():
        assert replace(result, id=None) == replace(expected, id=None)

  # Qualified dataclasses.replace compared with a constructor
  - |
    def test_order():
        assert dataclasses.replace(result, id=None) == ExampleOrder(id=None, total=1)

  # Pydantic copy compared with a literal
  - |
    def test_order():
        assert result.model_copy(update={"id": None}) == {"total": 1}

  # Copy of each item compared with copies
  - |
    def test_orders():
        assert [replace(order, id=None) for order in results] == [replace(order, id=None) for order in expected]

  # Copy chained into another call
  - |
    def test_order():
        assert result.model_copy(update={"id": None}).model_dump() == {"total": 1}

  # Membership check on a copy
  - |
    def test_order():
        assert replace(result, id=None) in {ExampleOrder(id=None, total=1)}

  # Negated comparison on a copy
  - |
    def test_order():
        assert not result.model_dump(exclude={"id"}) != {"total": 1}

  # Copy checked alongside another condition
  - |
    def test_order():
        assert ready and replace(result, id=None) == ExampleOrder(id=None, total=1)

  # Parenthesized comparison on a copy
  - |
    def test_order():
        assert (replace(result, id=None) == ExampleOrder(id=None, total=1)), "order"

  # Dump that includes only some fields
  - |
    def test_order():
        assert result.model_dump(include={"total"}) == {"total": 1}

  # Dump that drops unset fields
  - |
    def test_order():
        assert result.model_dump(exclude_unset=True) == {"total": 1}

  # copy.replace on the result
  - |
    def test_order():
        assert copy.replace(result, id=None) == ExampleOrder(id=None, total=1)

  # Copy of each item in a dict comprehension
  - |
    def test_orders():
        assert {order.sku: replace(order, id=None) for order in results} == {"A1": ExampleOrder(id=None, total=1)}
