id: no-normalized-asserts
valid:
  # Whole result compared
  - |
    def test_order():
        assert result == ExampleOrder(id=order_id, total=1)

  # Copy made outside an assert
  - |
    def test_order():
        expected = replace(template, total=1)
        assert result == expected

  # Constructor argument named exclude
  - |
    def test_config():
        assert config.rulesets == {"python": RulesetConfig(exclude=("no-print",))}

  # String replace on the expected text
  - |
    def test_stripped():
        assert stripped == SOURCE.replace("# note", "")

  # Pydantic copy builds the expected value
  - |
    def test_order():
        assert result == baseline.model_copy(update={"total": 2})

  # dataclasses.replace builds the expected value
  - |
    def test_order():
        assert result == replace(baseline, total=2)

  # Dump that excludes a field builds the expected value
  - |
    def test_payload():
        assert payload == template.model_dump(exclude={"id"})

  # Copies nested in the expected value
  - |
    def test_orders():
        assert results == [replace(baseline, id=order_id) for order_id in order_ids]

  # Copy in a comparison nested inside the expected value
  - |
    def test_orders():
        assert results == [order for order in orders if replace(order, id=None) == baseline]

invalid:
  # dataclasses.replace on the result
  - |
    def test_order():
        assert replace(result, id=None) == ExampleOrder(id=None, total=1)

  # Qualified dataclasses.replace on the result
  - |
    def test_order():
        assert dataclasses.replace(result, id=None) == expected

  # Pydantic copy with an update
  - |
    def test_order():
        assert result.model_copy(update={"id": None}) == expected

  # Dump that excludes a field
  - |
    def test_order():
        assert result.model_dump(exclude={"id"}) == {"total": 1}

  # Copy of each item of the result
  - |
    def test_orders():
        assert [replace(order, id=None) for order in results] == expected_orders

  # Copy chained into another call
  - |
    def test_order():
        assert result.model_copy(update={"id": None}).model_dump() == payload

  # Copies on both sides
  - |
    def test_order():
        assert replace(result, id=None) == replace(expected, id=None)

  # Membership check on a copy
  - |
    def test_order():
        assert replace(result, id=None) in expected_orders

  # Negated comparison on a copy
  - |
    def test_order():
        assert not result.model_dump(exclude={"id"}) != payload
