id: no-normalized-asserts
valid:
  # Whole result compared
  - |
    def test_order():
        assert result == ExampleOrder(id=order_id, total=1)

  # Copy made outside an assert
  - |
    def test_order():
        expected = replace(template, total=1)
        assert result == expected

  # Constructor argument named exclude
  - |
    def test_config():
        assert config.rulesets == {"python": RulesetConfig(exclude=("no-print",))}

  # String replace on the expected text
  - |
    def test_stripped():
        assert stripped == SOURCE.replace("# note", "")

invalid:
  # dataclasses.replace on the result
  - |
    def test_order():
        assert replace(result, id=None) == ExampleOrder(id=None, total=1)

  # Pydantic copy with an update
  - |
    def test_order():
        assert result.model_copy(update={"id": None}) == expected

  # Dump that excludes a field
  - |
    def test_order():
        assert result.model_dump(exclude={"id"}) == {"total": 1}
