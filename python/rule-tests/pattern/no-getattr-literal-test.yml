id: no-getattr-literal
valid:
  # Attribute access
  - |
    total = order.total

  # Name known only at runtime
  - |
    value = getattr(order, field_name)

  # f-string name
  - |
    handler = getattr(self, f"handle_{event}")

  # Default for a missing attribute
  - |
    total = getattr(order, "total", 0)

invalid:
  # Fixed name
  - |
    total = getattr(order, "total")

  # Fixed name with single quotes
  - |
    total = getattr(order, 'total')
