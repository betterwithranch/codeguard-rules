id: no-len-asserts
valid:
  # Whole collection compared
  - |
    def test_lines():
        assert [line.sku for line in lines] == ["A1", "B2"]

  # len used outside an assert
  - |
    def test_lines():
        count = len(lines)

  # len inside a slice of the compared value
  - |
    def test_prefix():
        assert items[: len(prefix)] == prefix

  # len inside an index of the compared value
  - |
    def test_last():
        assert items[len(items) - 1] == ExampleItem(sku="B2")

  # len inside the expected value
  - |
    def test_summary():
        assert summary == ExampleSummary(count=len(lines), total=3)

  # len inside a comprehension filter of the compared value
  - |
    def test_long_names():
        assert [name for name in names if len(name) > 3] == ["alpha"]

  # len builds the expected value for a count
  - |
    def test_count():
        assert count == len(lines)

  # len builds the expected value, on the left
  - |
    def test_count():
        assert len(lines) == count

invalid:
  # Length compared to a number
  - |
    def test_lines():
        assert len(lines) == 2

  # Bare length check
  - |
    def test_lines():
        assert len(lines)

  # Number on the left of the comparison
  - |
    def test_lines():
        assert 2 == len(lines)

  # Length compared to another length
  - |
    def test_queries():
        assert len(many_queries) == len(single_queries)

  # Length compared to a constant
  - |
    def test_lines():
        assert len(lines) == EXPECTED_LINE_COUNT

  # Length in a chained comparison
  - |
    def test_lines():
        assert 0 < len(lines) < 3

  # Negated length check
  - |
    def test_lines():
        assert not len(lines)

  # Length check joined with another check
  - |
    def test_lines():
        assert lines and len(lines) > 1

  # Parenthesized length comparison
  - |
    def test_lines():
        assert (len(lines) == 2), "two lines"
