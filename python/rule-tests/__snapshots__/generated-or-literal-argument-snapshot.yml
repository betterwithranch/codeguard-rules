id: generated-or-literal-argument
snapshots:
  ? |
    create(order_id=uuid4())
  : labels:
    - source: uuid4()
      style: primary
      start: 16
      end: 23
    - source: uuid4
      style: secondary
      start: 16
      end: 21
  ? |
    ship(order, status='shipped')
  : labels:
