id: nondeterminism
snapshots:
  ? |
    key = uuid4()
  : labels:
    - source: uuid4()
      style: primary
      start: 6
      end: 13
    - source: uuid4
      style: secondary
      start: 6
      end: 11
  ? |
    stamp = datetime.now()
  : labels:
    - source: datetime.now()
      style: primary
      start: 8
      end: 22
    - source: datetime.now
      style: secondary
      start: 8
      end: 20
