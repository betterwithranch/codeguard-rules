id: self-free-construction
valid:
# Method that builds from self
- |
  class ExampleBuilder:
      def build(self):
          return ExampleModel(name=self.name)
# Function that calls only lowercase functions
- |
  def example_total(example_lines):
      return sum(line.amount for line in example_lines)
# Function that calls a method of a lowercase object
- |
  def example_label(example_model):
      return example_model.name.upper()
# Lambda that builds an instance
- |
  example_factory = lambda name: ExampleModel(name=name)
# Nested function that builds from self of the enclosing method
- |
  class ExampleBuilder:
      def build_all(self, names):
          def build(name):
              return ExampleModel(name=name, owner=self.owner)
          return [build(name) for name in names]
invalid:
# Module-level function calling a class
- |
  def make_example(example_order):
      return ExampleModel(number=example_order.number)
# Function without parameters calling a class
- |
  def default_example():
      return ExampleSettings(debug=False)
# Alternative constructor on a class
- |
  def parse_example(payload):
      return ExampleModel.model_validate(payload)
# Class built into a local, then returned
- |
  def make_example(example_order):
      example = ExampleModel(number=example_order.number)
      return example
# Static method on another class
- |
  class ExamplePlanner:
      @staticmethod
      def example_for(example_order):
          return ExampleModel(number=example_order.number)
# Method that ignores self
- |
  class ExamplePlanner:
      def example_for(self, example_order):
          return ExampleModel(number=example_order.number)
# Nested function
- |
  def example_events(rows):
      def to_event(row):
          return ExampleEvent(code=row.code)
      return [to_event(row) for row in rows]
# Private class name
- |
  def make_example(example_order):
      return _ExampleModel(number=example_order.number)
# Async function
- |
  async def make_example(example_order):
      return ExampleModel(number=example_order.number)
