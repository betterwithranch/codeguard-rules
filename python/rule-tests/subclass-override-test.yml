id: subclass-override
valid:
# A class with no base class
- |
  class FakeQueue:
      def enqueue(self, name, message):
          self.messages.append(message)
# A subclass with only class attributes
- |
  class SlowFakeQueue(FakeQueue):
      delay = 5
# A test class's methods
- |
  class TestOrders(BaseOrderTest):
      def test_total(self):
          assert total([1]) == 1
# A unittest class named with a Tests suffix
- |
  class OrderTests(TestCase):
      def test_total(self):
          assert total([1]) == 1
invalid:
