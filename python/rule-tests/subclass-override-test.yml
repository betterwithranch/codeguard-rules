      def currency(self):
          return "EUR"
# An async method of a subclass
- |
  class FailingClient(FakeClient):
      async def fetch(self, path):
          raise TimeoutError
# A subclass of a dotted base
- |
  class RecordingMailer(fakes.FakeMailer):
      def send(self, message):
          self.sent_count += 1
