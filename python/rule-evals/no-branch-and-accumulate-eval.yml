id: no-branch-and-accumulate
invalid:
- file: shipments/labels.py
  after: |
    from dataclasses import dataclass


    @dataclass(frozen=True)
    class Shipment:
        tracking_number: str
        is_international: bool
        is_express: bool


    def shipping_labels(shipments: list[Shipment]) -> list[str]:
        labels = []
        for shipment in shipments:
            if shipment.is_international:
                labels.append(f"INTL {shipment.tracking_number}")
            elif shipment.is_express:
                labels.append(f"EXPRESS {shipment.tracking_number}")
            else:
                labels.append(shipment.tracking_number)
        return labels
