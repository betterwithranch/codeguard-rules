- file: tests/test_shipment_worker.py
  after: |
    import time

    from shipping.worker import ShipmentWorker
    from tests.fakes import FakeQueue


    def test_worker_marks_shipment_dispatched():
        queue = FakeQueue()
        queue.enqueue("shipments", {"shipment_id": "shp-1"})
        worker = ShipmentWorker(queue)
        worker.start()

        time.sleep(0.5)

        assert worker.dispatched == ["shp-1"]
- file: tests/test_shipments.py
  before: |
    from datetime import datetime

    from shipping.shipments import Shipment, create_shipment
    from tests.fakes import FakeClock


    def test_create_shipment_uses_clock():
        clock = FakeClock(datetime(2026, 3, 1, 9, 0))

        shipment = create_shipment(order_id="ord-1", clock=clock)

        assert shipment == Shipment(order_id="ord-1", created_at=datetime(2026, 3, 1, 9, 0))
  after: |
    from datetime import datetime

    from shipping.shipments import Shipment, create_shipment
    from tests.fakes import FakeClock


    def test_create_shipment_uses_clock():
        clock = FakeClock(datetime(2026, 3, 1, 9, 0))

        shipment = create_shipment(order_id="ord-1", clock=clock)

        assert shipment == Shipment(order_id="ord-1", created_at=datetime(2026, 3, 1, 9, 0))


    def test_create_shipment_defaults_to_system_clock():
        before = datetime.now()

        shipment = create_shipment(order_id="ord-2")

        assert before <= shipment.created_at <= datetime.now()
