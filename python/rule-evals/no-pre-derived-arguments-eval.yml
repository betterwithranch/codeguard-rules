id: no-pre-derived-arguments
invalid:
- file: orders/quote.py
  after: |
    from dataclasses import dataclass


    @dataclass(frozen=True)
    class CartLine:
        sku: str
        price: int
        region: str


    def select_lines(cart: list[CartLine], region: str) -> list[CartLine]:
        return [line for line in cart if line.region == region]


    def quote(lines: list[CartLine], region: str) -> str:
        total = sum(line.price for line in lines)
        return f"{region}: {total}"


    def quote_cart(cart: list[CartLine], region: str) -> str:
        return quote(lines=select_lines(cart, region), region=region)
- file: invoices/issue.py
  before: |
    from dataclasses import dataclass

    TAX_RATES = {"DE": 0.19, "FR": 0.2}


    @dataclass(frozen=True)
    class Customer:
        country: str
        loyalty_credit: int


    def tax_rate(customer: Customer) -> float:
        return TAX_RATES[customer.country]


    def invoice_total(subtotal: int, customer: Customer) -> int:
        total = round(subtotal * (1 + tax_rate(customer)))
        return total - customer.loyalty_credit


    def issue_invoice(subtotal: int, customer: Customer) -> int:
        return invoice_total(subtotal, customer)
  after: |
    from dataclasses import dataclass

    TAX_RATES = {"DE": 0.19, "FR": 0.2}


    @dataclass(frozen=True)
    class Customer:
        country: str
        loyalty_credit: int


    def tax_rate(customer: Customer) -> float:
        return TAX_RATES[customer.country]


    def invoice_total(subtotal: int, rate: float, customer: Customer) -> int:
        total = round(subtotal * (1 + rate))
        return total - customer.loyalty_credit


    def issue_invoice(subtotal: int, customer: Customer) -> int:
        return invoice_total(subtotal, tax_rate(customer), customer)
valid:
- file: invoices/issue.py
  after: |
    from dataclasses import dataclass
    from datetime import date


    @dataclass(frozen=True)
    class Customer:
        email: str


    @dataclass(frozen=True)
    class Invoice:
        customer: Customer
        issued_on: date


    def issue_invoice(customer: Customer) -> Invoice:
        return Invoice(customer=customer, issued_on=date.today())
