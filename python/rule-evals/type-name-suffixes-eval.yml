    class InvoiceFactory:
        def create(self, params: InvoiceParams) -> Invoice:
            return Invoice(order_id=params.order_id, total_cents=params.total_cents)
  after: |
    from invoicing.invoice import Invoice, InvoiceParams


    class InvoiceFactory:
        def create(self, params: InvoiceParams) -> Invoice:
            return Invoice(order_id=params.order_id, total_cents=params.total_cents)

        def create_for_admin_dashboard(self, params: InvoiceParams) -> Invoice:
            return Invoice(order_id=params.order_id, total_cents=params.total_cents)
- file: pricing/price_calculator.py
  after: |
    from dataclasses import dataclass


    @dataclass(frozen=True)
    class PriceCalculationRequest:
        base_cents: int
        quantity: int
        discount_percent: int


    class PriceCalculator:
        def calculate(self, request: PriceCalculationRequest) -> int:
            subtotal = request.base_cents * request.quantity
            return subtotal * (100 - request.discount_percent) // 100
