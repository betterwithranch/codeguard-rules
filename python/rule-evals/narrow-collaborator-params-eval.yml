id: narrow-collaborator-params
invalid:
- file: checkout/tax.py
  after: |
    from dataclasses import dataclass

    from checkout.cart import Cart
    from customers.customer import Customer
    from payments.method import PaymentMethod


    @dataclass(frozen=True)
    class CheckoutContext:
        cart: Cart
        customer: Customer
        payment_method: PaymentMethod
        coupon_code: str | None
        shipping_region: str
        subtotal_cents: int


    class TaxCalculator:
        def __init__(self, rates_by_region: dict[str, float]) -> None:
            self._rates_by_region = rates_by_region

        def tax_cents(self, context: CheckoutContext) -> int:
            return round(context.subtotal_cents * self._rates_by_region[context.shipping_region])
