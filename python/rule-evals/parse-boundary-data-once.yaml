        from collections.abc import Iterable
        from dataclasses import dataclass

        from pages.blocks import Block


        @dataclass(frozen=True)
        class PageText:
            content: str

            def with_edits(self, edits: Iterable[tuple[Block, str]]) -> str:
                content = self.content
                for block, text in sorted(edits, key=lambda edit: edit[0].start, reverse=True):
