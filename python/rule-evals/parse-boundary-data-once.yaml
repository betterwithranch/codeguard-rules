        def error_messages(error: ValidationError) -> dict[str, list[str]]:
            messages: dict[str, list[str]] = {}
            for issue in error.errors():
                path = ".".join(str(part) for part in issue["loc"])
                messages.setdefault(path, []).append(issue["msg"])
