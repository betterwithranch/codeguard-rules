  - name: walks its own model's dump
    inputs:
      file: forms/form_values.py
      after: |
        from collections.abc import Iterator

        from pydantic import BaseModel


        class Address(BaseModel):
            street: str
            city: str


        class Form(BaseModel):
            name: str
            address: Address


        def leaf_values(values: dict, parent: tuple[str, ...] = ()) -> Iterator[tuple[str, str]]:
            for name, value in values.items():
                if isinstance(value, dict):
                    yield from leaf_values(value, (*parent, name))
                else:
                    yield ".".join((*parent, name)), value


        def form_values(form: Form) -> dict[str, str]:
            return dict(leaf_values(form.model_dump(mode="json")))
    expected_output:
      outcome: valid
