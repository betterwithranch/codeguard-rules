  - name: imports contacts through a column spec
    inputs:
      file: contacts/contact_import.py
      after: |
        import csv
        from dataclasses import dataclass
        from typing import IO


        @dataclass(frozen=True)
        class Column:
            name: str
            headers: tuple[str, ...]


        CONTACT_COLUMNS = (
            Column("first_name", ("first_name", "First Name")),
            Column("email", ("email", "Email")),
        )


        def contact_fields(row: dict[str, str]) -> dict[str, str]:
            return {
                column.name: next((row[header] for header in column.headers if header in row), "")
                for column in CONTACT_COLUMNS
            }


        def greeting(fields: dict[str, str]) -> str:
            return f"Hello {fields['first_name']} <{fields['email']}>"


        def greetings(file: IO[str]) -> list[str]:
            return [greeting(contact_fields(row)) for row in csv.DictReader(file)]
    expected_output:
      outcome: valid
