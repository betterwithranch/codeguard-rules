  - name: reads a serializer's validated data in a view
    inputs:
      file: routes/route_view.py
      after: |
        from rest_framework import serializers
        from rest_framework.response import Response
        from rest_framework.views import APIView


        class PointSerializer(serializers.Serializer):
            latitude = serializers.FloatField()
            longitude = serializers.FloatField()


        class RouteRequestSerializer(serializers.Serializer):
            start = PointSerializer()
            stops = PointSerializer(many=True)


        class RouteView(APIView):
            def post(self, request):
                serializer = RouteRequestSerializer(data=request.data)
                serializer.is_valid(raise_exception=True)
                data = serializer.validated_data
                stops = [(stop["latitude"], stop["longitude"]) for stop in data["stops"]]
                start = (data["start"]["latitude"], data["start"]["longitude"])
                return Response({"start": start, "stop_count": len(stops)})
    expected_output:
      outcome: valid
