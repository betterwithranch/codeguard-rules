  - name: lists the files a search's output shows
    inputs:
      file: search/search_files.py
      after: |
        from collections.abc import Iterator
        from dataclasses import dataclass
        from pathlib import Path

        from pydantic import BaseModel


        class SearchResult(BaseModel):
            content: str | None = None


        @dataclass(frozen=True)
        class SearchCall:
            root: Path

            def files_shown(self, result: SearchResult) -> list[Path]:
                return list(_files_in_lines(self.root, result.content))


        def _files_in_lines(root: Path, content: str | None) -> Iterator[Path]:
            if content is None:
                return
            for line in content.splitlines():
                prefixes = (line[:end] for end, char in enumerate(line) if char == ":")
                file = next((prefix for prefix in prefixes if (root / prefix).is_file()), None)
                if file is not None:
                    yield root / file
    expected_output:
      outcome: valid
  - name: parses git refs into release branches
    inputs:
      file: releases/remote_versions.py
      after: |
        import re
        import subprocess
        from dataclasses import dataclass
        from typing import Self

        _RELEASE = re.compile(r"^refs/heads/release-(\d+)$")


        @dataclass(frozen=True, order=True)
        class ReleaseBranch:
            number: int
            name: str

            @classmethod
            def from_ref(cls, ref: str) -> Self | None:
                match = _RELEASE.match(ref)
                return cls(int(match[1]), ref) if match else None


        class RemoteReleases:
            def newest(self, url: str) -> ReleaseBranch | None:
                branches = self._branches(url)
                return max(branches) if branches else None

            def _branches(self, url: str) -> list[ReleaseBranch]:
                listing = subprocess.run(
                    ["git", "ls-remote", "--heads", url], capture_output=True, text=True, check=True
                ).stdout
                found = (ReleaseBranch.from_ref(line.split("\t")[-1]) for line in listing.splitlines())
                return [branch for branch in found if branch is not None]
    expected_output:
      outcome: valid
  - name: classifies YAML documents into typed steps
    inputs:
      file: plans/plan_loader.py
      after: |
        from dataclasses import dataclass
        from pathlib import Path

        import yaml


        @dataclass(frozen=True)
        class TaskStep:
            command: str


        @dataclass(frozen=True)
        class WaitStep:
            seconds: int


        class PlanLoader:
            def load(self, path: Path) -> list[TaskStep | WaitStep]:
                return [self._step(document) for document in yaml.safe_load_all(path.read_text())]

            def _step(self, document: object) -> TaskStep | WaitStep:
                if not isinstance(document, dict):
                    raise ValueError(f"a plan step is a mapping, got {document!r}")
                if "wait" in document:
                    return WaitStep(seconds=int(document["wait"]))
                return TaskStep(command=str(document["run"]))
    expected_output:
      outcome: valid
  - name: checks its own enum-or-string union
    inputs:
      file: layout/cells.py
      after: |
        from dataclasses import dataclass
        from enum import StrEnum


        class CellKind(StrEnum):
            HEADER = "header"
            BODY = "body"


        @dataclass(frozen=True)
        class Cell:
            kind: CellKind | str
            text: str

            @property
            def is_known(self) -> bool:
                return isinstance(self.kind, CellKind)
    expected_output:
      outcome: valid
  - name: parses SDK errors into a value object
    inputs:
      file: shipping/quote_errors.py
      after: |
        from dataclasses import dataclass
        from typing import Self

        from shipping_sdk import QuoteFailed, RateError


        def explain(failure: QuoteFailed) -> str:
            return "; ".join(str(RateProblem.from_error(error)) for error in failure.errors())


        @dataclass(frozen=True)
        class RateProblem:
            carrier: str
            reason: str

            @classmethod
            def from_error(cls, error: RateError) -> Self:
                return cls(carrier=error["carrier"], reason=error["reason"])

            def __str__(self) -> str:
                return f"{self.carrier}: {self.reason}"
    expected_output:
      outcome: valid
  - name: sorts its own block and text tuples
    inputs:
      file: pages/page_text.py
      after: |
        from collections.abc import Iterable
        from dataclasses import dataclass

        from pages.blocks import Block


        @dataclass(frozen=True)
        class PageText:
            content: str

            def with_edits(self, edits: Iterable[tuple[Block, str]]) -> str:
                content = self.content
                for block, text in sorted(edits, key=lambda edit: edit[0].start, reverse=True):
                    content = content[: block.start] + text + content[block.end :]
                return content
    expected_output:
      outcome: valid
  - name: binds tool arguments to a typed function
    inputs:
      file: chat/tool_calls.py
      after: |
        from collections.abc import Callable, Mapping

        from chat_sdk import ToolCall


        class Toolbox:
            def __init__(self, tools: Mapping[str, Callable[..., str]]) -> None:
                self.tools = tools

            def answer(self, call: ToolCall) -> str:
                tool = self.tools.get(call.name)
                if tool is None:
                    return f"Error: there is no tool {call.name}."
                try:
                    return tool(**(call.arguments or {}))
                except TypeError as error:
                    return f"Error: {error}"
    expected_output:
      outcome: skipped
