  - name: formats a report from raw grep lines
    inputs:
      file: search/match_report.py
      after: |
        def match_report(output: str) -> str:
            lines = output.splitlines()
            files = {line.split(":")[0] for line in lines}
            first_file, first_line = lines[0].split(":")[:2]
