  - name: routes raw documents to the model that validates them
    inputs:
      file: config/loader.py
      after: |
        from pathlib import Path

        import yaml

        from config.models import JobsConfig, PipelinesConfig


        def load_config(directory: Path) -> tuple[JobsConfig, PipelinesConfig]:
            documents = {path.name: yaml.safe_load(path.read_text()) for path in directory.glob("*.yaml")}
            pipelines = {name: doc for name, doc in documents.items() if isinstance(doc, dict) and "steps" in doc}
            jobs = {name: doc for name, doc in documents.items() if name not in pipelines}
            return JobsConfig.model_validate(jobs), PipelinesConfig.model_validate(pipelines)
    expected_output:
      outcome: valid
