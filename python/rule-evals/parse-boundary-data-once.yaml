  - name: shows a numbered window of a file's lines
    inputs:
      file: tools/files.py
      after: |
        from pathlib import Path

        MAX_LINES = 200


        def read_window(file: Path, offset: int = 1) -> str:
            lines = file.read_text(errors="replace").splitlines()
            start = max(offset, 1)
            return "".join(
                f"{number:>6}\t{line}\n"
                for number, line in enumerate(lines[start - 1 : start - 1 + MAX_LINES], start=start)
            )
    expected_output:
