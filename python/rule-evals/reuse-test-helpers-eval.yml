- file: tests/test_shipment_dispatch.py
  before: |
    from datetime import date, datetime

    from shipping.dispatch import Dispatcher, Shipment
    from tests.fakes import FakeClock


    def test_dispatch_before_cutoff_ships_same_day():
        clock = FakeClock(datetime(2026, 3, 1, 9, 0))

        shipment = Dispatcher(clock).dispatch("shp-1")

        assert shipment == Shipment(id="shp-1", ships_on=date(2026, 3, 1))
  after: |
    from datetime import date, datetime

    from shipping.dispatch import Dispatcher, Shipment
    from tests.fakes import FakeClock


    class StubClock:
        def __init__(self, current):
            self.current = current

        def now(self):
            return self.current


    def test_dispatch_before_cutoff_ships_same_day():
        clock = FakeClock(datetime(2026, 3, 1, 9, 0))

        shipment = Dispatcher(clock).dispatch("shp-1")

        assert shipment == Shipment(id="shp-1", ships_on=date(2026, 3, 1))


    def test_dispatch_after_cutoff_moves_to_next_day():
        clock = StubClock(datetime(2026, 3, 1, 18, 0))

        shipment = Dispatcher(clock).dispatch("shp-2")

        assert shipment == Shipment(id="shp-2", ships_on=date(2026, 3, 2))
