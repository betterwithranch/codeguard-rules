  after: |
    def carrier_for(country: str) -> str:
        if country == "DE":
            return "DHL"
        elif country == "FR":
            return "Colissimo"
        elif country == "US":
            return "UPS"
        elif country == "GB":
            return "Royal Mail"
        return "FedEx"
- file: orders/refunds.py
  before: |
    from dataclasses import dataclass

    REFUND_WINDOW_DAYS = 30


    @dataclass(frozen=True)
    class Order:
        order_id: str
        is_delivered: bool
        days_since_delivery: int


    def is_refundable(order: Order) -> bool:
        return order.is_delivered and order.days_since_delivery <= REFUND_WINDOW_DAYS
  after: |
    from dataclasses import dataclass
    from typing import Protocol

    REFUND_WINDOW_DAYS = 30


    @dataclass(frozen=True)
    class Order:
        order_id: str
        is_delivered: bool
        days_since_delivery: int


    class OrderRepository(Protocol):
        def get(self, order_id: str) -> Order: ...


    class Mailer(Protocol):
        def send(self, order_id: str, message: str) -> None: ...


    def process_refund_request(orders: OrderRepository, mailer: Mailer, order_id: str) -> bool:
        order = orders.get(order_id)
        approved = order.is_delivered and order.days_since_delivery <= REFUND_WINDOW_DAYS
        mailer.send(order_id, "Refund approved" if approved else "Refund declined")
        return approved
valid:
- file: shipments/carriers.py
  after: |
    CARRIERS_BY_COUNTRY = {
        "DE": "DHL",
        "FR": "Colissimo",
        "US": "UPS",
        "GB": "Royal Mail",
    }
    FALLBACK_CARRIER = "FedEx"


    def carrier_for(country: str) -> str:
        return CARRIERS_BY_COUNTRY.get(country, FALLBACK_CARRIER)
