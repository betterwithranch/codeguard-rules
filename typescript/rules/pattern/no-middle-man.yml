id: no-middle-man
language: typescript
severity: warning
message: Every method of this class only forwards to the same collaborator.
note: |
  The class adds nothing: every method passes its call to the same collaborator. Have
  callers use the collaborator directly, or give the class work of its own. A class
  that extends or implements another is not matched, since forwarding there adapts the
  collaborator to that type. A decorated method, an accessor, and a function held in a
  field count as work of the class's own: the rule matches only plain methods.
metadata:
  why: A layer that only forwards is one more place to read and change, and hides which object does the work.
  severity: A warning, not an error, because a class that forwards on purpose (a seam kept for a planned second implementation, or one a framework requires) looks the same to the pattern.
utils:
  forwarding-call:
    any:
    - pattern: this.$C.$_M($$$)
    - pattern: await this.$C.$_M($$$)
  forwarding-method:
    kind: method_definition
    not:
      has: {field: name, regex: ^constructor$}
    has:
      field: body
      kind: statement_block
      all:
      - not:
          has:
            nthChild: {position: 2, ofRule: {not: {kind: comment}}}
      - has:
          nthChild: {position: 1, ofRule: {not: {kind: comment}}}
          any:
          - kind: return_statement
            has: {matches: forwarding-call}
          - kind: expression_statement
            has: {matches: forwarding-call}
rule:
  kind: class_declaration
  not:
    has: {kind: class_heritage}
  has:
    field: body
    kind: class_body
    all:
    - has:
        matches: forwarding-method
        follows:
          stopBy: end
          matches: forwarding-method
    - not:
        has:
          kind: method_definition
          not:
            any:
            - matches: forwarding-method
            - has: {field: name, regex: ^constructor$}
